function renderAufgaben(){
  // Vergangenheit: eigene Ansicht, eigene Quelle.
  if(tzRueck){
    const ts=new Date(tzRueck).getTime();
    // Drei Quellen für einen vergangenen Tag: die Kennzahlen (Zahlen), die
    // Tagesdatei (Liste) und das Protokoll des Monats (Status, Notizen). Jede
    // meldet sich mit einem Neuzeichnen, sobald sie da ist.
    trEntfLaden(trMonate(ts,Date.now()))
      .then(neu=>{if(neu&&curView==='tagesziel'&&tzRueck)renderAufgaben();});
    if(!(tzRueck in tzlCache))tzlLaden(tzRueck)
      .then(()=>{if(curView==='tagesziel'&&tzRueck)renderAufgaben();});
    try{aufLadeMonate([aufMonatVon(ts)]).then(()=>{
      if(curView==='tagesziel'&&tzRueck)renderAufgaben();});}catch(e){}
    return renderRueckblick(tzRueck);
  }
  const tage=tzTage(tzLoc);
  // Startwert: der heutige Tag, sonst der naechste kuenftige. Die Terminplan-
  // Dateien koennen einen Tag alt sein — dann faengt die Liste sonst gestern an.
  if(tzDay===null){
    const heuteDs=isoDay(0);
    let i=tage.findIndex(t=>t.ds===heuteDs);
    if(i<0)i=tage.findIndex(t=>t.ds>heuteDs);
    tzDay=i<0?0:i;
  }
  if(tzDay>tage.length-1)tzDay=Math.max(0,tage.length-1);
  const tag=tage[tzDay]||null;
  const T=tzBuildTasks(tag);
  const me=getMe();
  // Der Bereichsfilter greift VOR allen Zahlen. Sonst nennt der Kopf eine
  // Summe, die in der Liste darunter nicht wiederzufinden ist.
  let liste=T.alle.filter(t=>tzArea==='alle'||effectiveArea(t.id,t.cat)===tzArea);
  if(tzOnlyMine&&me)liste=liste.filter(t=>istMeine(t.id,t.cat,me));
  // Dieselbe Auswahl noch einmal nach Patient gebündelt: Zeitblöcke und
  // Tagesplan dürfen keine Aufgabe zeigen, die die Liste gerade ausblendet.
  const sicht={alle:liste,byPid:{}};
  liste.forEach(t=>{if(t.pid)(sicht.byPid[t.pid]=sicht.byPid[t.pid]||[]).push(t);});
  // Nur im Tagesgeschäft gibt es den Tagesplan — das Backoffice arbeitet an
  // einer Liste, nicht an der Uhr des Empfangs.
  const modus=tzArea==='tg'?tzMode:'liste';
  const offen=liste.filter(t=>!taskDone(t.id));
  const erledigt=liste.filter(t=>taskDone(t.id));
  const abgehakt=erledigt.length;

  // ── Was heute wegging, weil die Ursache erledigt wurde ──────────────────
  // Der wunde Punkt des Reiters bis hierher: Eine Lücke wird geschlossen, ein
  // Rezept fertig verplant — beim nächsten Export ist die Aufgabe weg, und
  // oben ändert sich keine einzige Zahl. Wer gut arbeitet, sieht nichts davon.
  //
  // Gezählt wird gegen das Tagespensum: alles, was heute überhaupt einmal
  // dastand. Was daraus fehlt, ist erledigt. Getrennt ausgewiesen von dem, was
  // jemand abgehakt hat — eine Aufgabe kann auch verschwinden, weil der
  // Patient abgesagt hat. Beides zusammenzuwerfen hieße, Erfolg zu behaupten,
  // wo nur etwas weggefallen ist.
  //
  // Nur am Tag des Exports: Für gestern liegt kein Pensum vor, und für morgen
  // gibt es keins. Dort bleibt die Zahl, was sie war.
  const istPensumTag=!!(tag&&aufPensumTag&&tag.ds===aufPensumTag)&&aufQuellenDa();
  // Verglichen wird gegen die VOLLSTÄNDIGE Liste, nicht gegen die gefilterte.
  //
  // Das Pensum entsteht in kennAufgaben mit beiden Schaltern an — es soll ja
  // festhalten, was an dem Tag überhaupt anlag. Die Anzeige blendet dagegen
  // Dauerpatienten und Hausbesuche aus, wenn die Schalter aus sind. Gegen die
  // gefilterte Liste gerechnet galt jede ausgeblendete Aufgabe als erledigt:
  // Am 08.10.2026 waren das 68 Zeilen, die als „durch Erledigen der Ursache"
  // dastanden, obwohl nur ein Schalter aus war. Ein Häkchen umzulegen ist keine
  // Arbeit am Patienten.
  const drin=new Set(aufAlleKurz(tag));
  const ent=istPensumTag?aufEntfallen(drin,tzArea,tzLoc):{n:0,jeKat:{}};
  const fertig=abgehakt+ent.n;
  const gesamt=liste.length+ent.n;
  const pct=gesamt>0?Math.round(fertig/gesamt*100):100;
  const allesFertig=gesamt>0&&fertig===gesamt;
  const barFarbe=allesFertig?'var(--teal)':'var(--primary)';

  // Patienten mit Termin an dem Tag, bei denen etwas offen ist
  const termine=tzPatientenAmTag(tag);
  const mitTodo=termine.filter(p=>(sicht.byPid[p.key]||[]).some(t=>!taskDone(t.id)));

  let h='<div class="summary"><h2>🎯 Tagesziel · '+esc(tzLocLabel())+'</h2>'
    +'<div class="tz-lead">Alle offenen Handlungen an einem Ort. '
    +'<b>Tagesgeschäft</b> ist, was am Schalter mit einem Satz erledigt ist, '
    +'<b>Backoffice</b>, was Telefon, Arzt oder Abrechnung braucht — <b>Allgemein</b> zeigt beides.</div></div>';

  h+='<div class="tabs" id="tzLocTabs"></div>';
  h+=tzDateNav(tage,tzDay);

  // Die Kennzahlen gelten immer für den gewählten Bereich. Das muss dastehen,
  // sonst liest man „12 offen" als Tagessumme, obwohl es nur das Backoffice ist.
  const bLabel=tzArea==='alle'?'auf diesen Tagesbestand':'nur '+TZ_AREAS[tzArea];
  const kpis=[
    {ico:'📋',v:offen.length,           l:'Offene Aufgaben',   s:bLabel},
    {ico:'✅',v:fertig,                 l:'Erledigt',
     s:gesamt?(ent.n?abgehakt+' abgehakt · '+ent.n+' durch Erledigen der Ursache'
                    :pct+' % des Tagespensums')
             :'nichts angefallen'},
    {ico:'🧍',v:new Set(offen.filter(t=>t.pid).map(t=>t.pid)).size,l:'Patienten betroffen',s:'mindestens eine Handlung'},
    {ico:'📅',v:mitTodo.length,         l:'davon heute da',    s:tag?tag.tp.length+' Terminzeilen':'kein Terminplan'}
  ];
  h+='<div class="tz-kpis">';
  kpis.forEach(k=>{h+='<div class="tz-kpi"><div class="tz-kpi-ico">'+k.ico+'</div><div class="tz-kpi-v">'+k.v
    +'</div><div class="tz-kpi-l">'+esc(k.l)+'</div><div class="tz-kpi-s">'+esc(k.s)+'</div></div>';});
  h+='</div>';

  // Bereichsschalter links, die beiden Filter rechts daneben in derselben
  // Zeile. Sie gehören zur Ansicht, nicht zur Liste — und nehmen so keine
  // eigene Zeile mehr weg.
  const me_=meKonto();
  const filter=(T.dauerAus||zeigeDauer?dauerSchalter(T.dauerAus):'')
    +(T.hbAus||zeigeHb?hbSchalter(T.hbAus):'')
    +(getTeam().length&&me_
      ? '<button class="fsw'+(tzOnlyMine?' a':'')+'" onclick="toggleOnlyMine('+(tzOnlyMine?'false':'true')+')"'
        +' title="Nur Aufgaben zeigen, bei denen ich als zuständig stehe">🙋 nur meine</button>'
      :'')
    +'<button class="fsw'+(tzTeamOffen?' a':'')+'" onclick="tzTeamToggle()"'
      +' title="Praxismanager verwalten — Kollegen hinzufügen oder entfernen">👥 Team</button>';
  h+='<div class="tz-kopfzeile">'+tzAreaBar()
    +'<div class="fsw-row">'+filter+'</div></div>';
  h+=aufZustandZeile();
  // Die Besetzung steht direkt unter dem Bereichsschalter: Sie gehört zur
  // Bereichswahl, nicht zur Liste darunter.
  h+=tzAreaCrew();
  // Der Tagesplan hängt am Empfangstag, deshalb steht der Umschalter nur im
  // Tagesgeschäft. Allgemein und Backoffice sind reine Listen.
  if(tzArea==='tg')h+=tzModeToggle();
  if(tzZeigeTeamBar())h+=renderTeamBar();
  h+='<div id="tzBody"></div>';
  h+='<div class="ft">KIMOJO · <b>Tagesziel</b> Werneck</div>';
  document.getElementById('mc').innerHTML=h;
  renderTzLocTabs();

  let body='';
  if(modus==='kalender'){
    body=buildTagesplan(tage,tzDay,sicht);
  }else{
    // Tagesabschluss nach Dienstschluss
    const jetzt=new Date();
    if(jetzt.getHours()*60+jetzt.getMinutes()>=20*60+30&&gesamt){
      body+='<div class="tz-abschluss"><div class="tz-ab-ttl">🌙 Tagesabschluss</div>'
        +'<div class="tz-ab-body">Heute <b>'+fertig+' von '+gesamt+'</b> Aufgaben erledigt'
        +(ent.n?' (davon <b>'+ent.n+'</b> durch Erledigen der Ursache)':'')
        +(gesamt-fertig>0?' · <b>'+(gesamt-fertig)+'</b> bleibt für morgen liegen':' · <b>alles geschafft ✓</b>')+'.</div></div>';
    }
    body+=tzGeschafft(erledigt,ent,istPensumTag);
    body+=tzListe(liste,tag?tag.ds:null);
  }
  document.getElementById('tzBody').innerHTML=body;
}

// ── „Was ist heute weggegangen?" ───────────────────────────────────────────
// Eine Zahl allein beantwortet die Frage der Führungskraft nicht. Sie will
// wissen, WAS getan wurde — und der Praxismanager will seine Arbeit sehen.
//
// Zwei Wege, auf denen eine Aufgabe verschwindet, und sie stehen getrennt:
//   abgehakt — jemand hat entschieden und den Haken gesetzt.
//   entfallen — die Ursache ist weg. Die Lücke ist besetzt, das Rezept
//               verplant. Niemand hat etwas angeklickt, trotzdem ist es getan.
//
// Aufgeschlüsselt nach Kategorie, nicht nach Patient: Das Pensum speichert
// einen Kurzschlüssel, keinen Namen — sechshundert Namen in einer Datei, die
// beide Dashboards bei jedem Laden lesen, wären der falsche Preis. „Sieben
// Lücken geschlossen, drei Rezepte verplant" beantwortet die Frage auch.
function tzGeschafft(erledigt,ent,istPensumTag){
  const ab={};
  (erledigt||[]).forEach(t=>{ab[t.cat]=(ab[t.cat]||0)+1;});
  const kats=[...new Set([...Object.keys(ab),...Object.keys(ent.jeKat||{})])]
    .sort((a,b)=>TZ_REIHE.indexOf(a)-TZ_REIHE.indexOf(b));
  if(!kats.length)return'';
  let h='<div class="tz-wrap"><div style="display:flex;justify-content:space-between;'
    +'align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">'
    +'<div style="font-family:Inter,sans-serif;font-weight:600;font-size:15px;color:var(--dark)">'
    +'🏁 Heute weggearbeitet</div>'
    +'<div style="font-size:12.5px;color:var(--muted)">'
    +(istPensumTag?'abgehakt und durch Erledigen der Ursache':'nur Abgehaktes — Pensum gilt für den Tag des Exports')
    +'</div></div><div class="tz-geschafft">';
  kats.forEach(k=>{
    const K=TZ_KAT[k]||{l:k,ico:'•',farbe:'var(--muted)'};
    const a=ab[k]||0,e=(ent.jeKat||{})[k]||0,ges=(ent.jeKatGes||{})[k]||0;
    h+='<div class="tz-gz"><span class="tz-gz-n" style="color:'+K.farbe+'">'+(a+e)
      +(ges?'<span class="tz-gz-v"> von '+ges+'</span>':'')+'</span>'
      +'<span class="tz-gz-l">'+K.ico+' '+esc(K.l)+'</span>'
      +'<span class="tz-gz-s">'+(a?a+' abgehakt':'')+(a&&e?' · ':'')
      +(e?e+' durch Erledigen der Ursache':'')+'</span></div>';
  });
  h+='</div>';
  // Die Zuordnung je Person (ent.jePerson) wird weiter gerechnet und ist
  // getestet, aber derzeit NICHT angezeigt — auf Wunsch erst einmal raus.
  // Der Standort-Hinweis. Solange Einträge ohne Standortangabe im Pensum
  // stehen, addieren sich die Reiter nicht — das muss dastehen, sonst hält man
  // die Zahlen für kaputt.
  if(ent.ohneLoc)h+='<div style="font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px">'
    +'<b style="color:var(--dark)">'+ent.ohneLoc+'</b> dieser Aufgaben '
    +(tzLoc===TZ_ALLE
      ? 'lassen sich noch keinem Standort zuordnen — unter „Werneck Physio" und '
        +'„Werneck Ergo" fehlen sie deshalb. '
      : 'stehen nur unter „Alle": Ihnen fehlt die Standortangabe. ')
    +'Sie stammen aus Läufen von heute früh, bevor der Standort mitgeschrieben wurde; '
    +'ab morgen trägt ihn jeder Eintrag.</div>';
  // Warum die beiden Wege getrennt stehen. Ohne diesen Satz liest sich die
  // größere Zahl als reine Leistung — meistens ist sie das auch, aber nicht
  // immer, und das muss dastehen.
  const ent_=kats.reduce((n,k)=>n+((ent.jeKat||{})[k]||0),0);
  if(ent_)h+='<div style="font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;'
    +'padding-top:10px;border-top:1px solid var(--hairline)">'
    +'<b style="color:var(--dark)">Durch Erledigen der Ursache</b> heißt: Die Aufgabe stand heute '
    +'früh da und ist jetzt weg, ohne dass jemand einen Haken gesetzt hat. An einem einzelnen Tag '
    +'ist das fast immer wirklich getane Arbeit — der Termin ist gelegt, das Rezept abgerechnet. '
    +'Ein Rezeptabbruch dauert in der Praxis mindestens eine Woche und kann deshalb gar nicht am '
    +'selben Tag aus der Liste fallen. Der eine Fall, der es kann: eine kurzfristige Krankmeldung. '
    +'Mit der Schicht verschwinden auch die Lücken dieser Therapeutin, ohne dass jemand etwas getan '
    +'hätte. Nur deshalb steht die Zahl getrennt von dem, was jemand ausdrücklich abgehakt hat.</div>';
  return h+'</div>';
}

// Termine des Tages zu Patienten gebündelt — mehrere Zeilen desselben Patienten
// am selben Tag sind Behandlungseinheiten eines Besuchs, nicht mehrere Besuche.
function tzPatientenAmTag(tag){
  if(!tag)return[];
  const patAppt={};
  tag.tp.forEach(t=>{
    if(!t||t.PatientId==null)return;
    const start=new Date(t.Beginn);if(isNaN(start))return;
    const k=String(t.PatientId);
    const p=patAppt[k]||(patAppt[k]={key:k,
      name:((t.PatientNachname||'')+(t.PatientVorname?', '+t.PatientVorname:'')).trim()||'(ohne Namen)',
      start,
      therapist:(t.Mitarbeiter&&t.Mitarbeiter[0])?(((t.Mitarbeiter[0].Vorname||'')+' '+(t.Mitarbeiter[0].Nachname||'')).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim()):'',
      leist:new Set()});
    if(start<p.start)p.start=start;
    if(t.Bezeichnung)p.leist.add(t.Bezeichnung);
  });
  return Object.values(patAppt).sort((x,y)=>(x.start-y.start)||x.name.localeCompare(y.name));
}


// Stehende Besetzung der Bereiche. Steht unter dem Bereichsschalter, weil die
// Reihenfolge stimmen muss: erst wer im Bereich sitzt, dann was dort zu tun ist.
// Unter „Allgemein" stehen beide, damit man die Aufteilung im Ganzen sieht.
// Die Praxismanager-Leiste gehört unter „Allgemein". In Tagesgeschäft und
// Backoffice stehen dieselben Namen schon in der stehenden Besetzung darüber —
// zweimal ist einmal zu viel.
// Zwei Gründe halten sie trotzdem stehen: „nur meine" filtert gerade (ein
// Filter, den man nicht sieht, lässt sich nicht abschalten), oder das Protokoll
// hat etwas zu melden — eine Fehlermeldung darf nirgends verschwinden.
// Die Teamleiste ist Einrichtung, keine Tagesarbeit: Wer die Praxismanager
// pflegt, tut das selten. Sie liegt deshalb hinter einem Knopf — außer das Team
// ist noch leer, dann muss sie aufgehen, sonst findet sie niemand.
let tzTeamOffen=false;
function tzTeamToggle(){tzTeamOffen=!tzTeamOffen;renderAufgaben();}

}

    +taskMeta(t.id,t.cat,titel)+'</div>';

const TZ_ZIEL={luecke:"switchView('luecken')",lueckeM:"switchView('luecken')",abr:"switchView('offene')",fvo:"switchView('folgevo')",verplan:"switchView('verplanung')",vplOhne:"switchView('verplanung')",ft:"switchView('offene')",dauer:"switchView('potential')",rezende:"switchView('rezende')"};

function tzListe(liste,tagDs){
  const team=getTeam();
  const offen=liste.filter(t=>!taskDone(t.id));
  let h='';
  if(!liste.length){
    return'<div class="empty" style="background:var(--teal-bg);border:1px solid var(--teal);color:var(--teal)">'
      +'<b>🎉 Alles erledigt!</b><br><span style="font-size:11px">'
      +(tzArea==='alle'
        ? 'Für diesen Tagesbestand ist nichts offen — abgerechnet, Folgetermine stehen, Rezepte angefordert.'
        : 'Im Bereich '+TZ_AREAS[tzArea]+' ist für diesen Tag nichts offen. Unter „Allgemein" steht, was in den anderen Bereichen liegt.')
      +'</span></div>';
  }
  // Der Folgetag bekommt seine Ueberschrift auch dann, wenn nichts drinsteht:
  // "keine Luecke" und "kein Terminplan exportiert" sind zwei verschiedene
  // Nachrichten, und die zweite muss man sehen. Nur im Bereich, in dem die
  // Kategorie gerade haengt — sonst stuende der leere Kopf ueberall.
  const folgeDs=tzFolgetag(tzLoc,tagDs);
  TZ_REIHE.forEach(k=>{
    // Gefiltert wurde schon in renderAufgaben, und zwar je Aufgabe: Eine
    // Abrechnung, die jemand ausdrücklich an den Empfang gehängt hat, steht
    // hier unter „Abrechnung" im Tagesgeschäft. Der Bereich der KATEGORIE
    // entscheidet nur noch darüber, ob ein LEERER Kopf erscheinen darf.
    const rows=liste.filter(t=>t.cat===k);
    const kopfHier=tzArea==='alle'||getCatArea(k)===tzArea;
    if(!rows.length&&!(k==='lueckeM'&&tagDs&&kopfHier))return;
    const K=TZ_KAT[k];
    let titel=K.l;
    if(k==='lueckeM')titel+=folgeDs?' · '+tzKurzTag(folgeDs):'';
    const done=rows.filter(t=>taskDone(t.id)).length;
    const auf=secOpen(k);
    h+='<div class="task-sec">'
      +'<div class="task-sec-head'+(auf?' open':'')+'" style="border-left:4px solid '+(K.farbe||'var(--primary)')+'" onclick="toggleSec(\''+k+'\')">'
      +'<div class="task-sec-ttl"><span class="task-caret">▸</span> '+K.ico+' '+esc(titel)+' <span class="task-sec-cnt">'+done+'/'+rows.length+'</span></div>'
      +'<div style="display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap">'
      +tzCatArea(k)
      +(team.length?'<span class="cat-asg" title="Gilt für jede Aufgabe dieser Kategorie, die niemanden eigenen hat. Blasse Chips kommen aus der Bereichsbesetzung.">Zuständig: '+tzCatAssign(k)+'</span>':'')
      +'<button class="task-open" onclick="event.stopPropagation();'+(TZ_ZIEL[k]||'')+'">Tab öffnen →</button></div></div>'
      +'<div class="task-list"'+(auf?'':' style="display:none"')+'>';
    if(K.hinweis)h+='<div class="task-sec-hint">'+esc(K.hinweis)+'</div>';
    if(k==='lueckeM'&&!rows.length){
      // Drei verschiedene Nachrichten, die sich leicht verwechseln lassen:
      // gar kein Folgetag, Folgetag ohne Arbeitszeiten-Export, und ein
      // Folgetag der wirklich voll ist. Nur die dritte ist eine gute Nachricht.
      const I=folgeDs?tzLueckeInfo(tzLoc,folgeDs):null;
      h+='<div class="task-sec-hint">'
        +(!folgeDs
          ? 'Für den Folgetag liegt kein Terminplan vor — der Export reicht nur bis heute.'
          : !I
            ? 'Für '+esc(tzKurzTag(folgeDs))+' fehlen die Arbeitszeiten im Export, deshalb lassen sich keine Lücken berechnen. '
             +'Sobald der Flow den Tag mitliefert, stehen sie hier.'
            : 'Für '+esc(tzKurzTag(folgeDs))+' ist keine Lücke ≥'+MG+' min offen — der Tag ist dicht ('+I.ausl+' % ausgelastet).')
        +'</div>';
    }
    rows.filter(t=>!taskDone(t.id)).forEach(t=>{h+=tzZeile(t);});
    rows.filter(t=>taskDone(t.id)).forEach(t=>{h+=tzZeile(t);});
    h+='</div></div>';
  });
  if(!offen.length)h+='<div class="empty" style="background:var(--teal-bg);border:1px solid var(--teal);color:var(--teal)">'
    +'<b>🎉 Nichts mehr offen</b><br><span style="font-size:11px">Alle '+liste.length+' Aufgaben dieses Tages sind abgehakt.</span></div>';
  return h;
}

// Kalenderansicht: wer kommt an dem Tag, und was ist bei dem zu tun.
// Bewusst nur Patienten mit mindestens einer offenen Handlung — wer nur zur
// Behandlung kommt, braucht am Empfang keine Zeile.
function buildTagesplan(tage,idx,T){
  if(!tage.length)return'<div class="tp-hint">Für diesen Standort liegen keine Terminplan-Dateien vor. Sobald der Flow <code>terminplan_heute…</code> schreibt, füllt sich diese Ansicht von selbst.</div>';
  const tag=tage[idx]||tage[0];
  let h='<div class="tp-nav">'
    +'<button class="dn-btn" onclick="tzNav(-1)"'+(idx<=0?' disabled':'')+'>‹</button>'
    +'<div class="tp-nav-c"><div class="tp-nav-day">'+esc(tzLabel(tag.ds))+'</div>'
    +'<div class="tp-nav-sub">'+tag.tp.length+' Terminzeilen · Tag '+(idx+1)+' von '+tage.length+'</div></div>'
    +'<button class="dn-btn" onclick="tzNav(1)"'+(idx>=tage.length-1?' disabled':'')+'>›</button></div>';

  // Mehrere Zeilen desselben Patienten am selben Tag sind Behandlungseinheiten
  // eines Besuchs, nicht mehrere Besuche — deshalb wird gebündelt.
  const patAppt={};
  tag.tp.forEach(t=>{
    if(!t||t.PatientId==null)return;
    const start=new Date(t.Beginn);if(isNaN(start))return;
    const k=String(t.PatientId);
    const p=patAppt[k]||(patAppt[k]={key:k,
      name:((t.PatientNachname||'')+(t.PatientVorname?', '+t.PatientVorname:'')).trim()||'(ohne Namen)',
      start,
      therapist:(t.Mitarbeiter&&t.Mitarbeiter[0])?(((t.Mitarbeiter[0].Vorname||'')+' '+(t.Mitarbeiter[0].Nachname||'')).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim()):'',
      leist:new Set()});
    if(start<p.start)p.start=start;
    if(t.Bezeichnung)p.leist.add(t.Bezeichnung);
  });
  const me=getMe();
  let liste=Object.values(patAppt)
    .map(p=>Object.assign(p,{tasks:(T.byPid[p.key]||[]).slice()}))
    .filter(p=>p.tasks.length>0)
    .sort((x,y)=>(x.start-y.start)||x.name.localeCompare(y.name));
  if(tzOnlyMine&&me)liste=liste.filter(p=>p.tasks.some(t=>istMeine(t.id,t.cat,me)));

  const mitTermin=new Set(liste.map(p=>p.key));
  const ohneTermin=T.alle.filter(t=>!taskDone(t.id)&&(!t.pid||!mitTermin.has(t.pid))).length;

  if(!liste.length){
    h+='<div class="tp-hint">An diesem Tag kommt niemand, bei dem etwas offen ist.'
      +(ohneTermin?' '+ohneTermin+' Aufgaben betreffen Patienten ohne Termin an diesem Tag — die stehen in der Aufgabenliste.':'')+'</div>';
    return h;
  }
  liste.forEach(p=>{
    const alleFertig=p.tasks.every(t=>taskDone(t.id));
    const leist=[...p.leist].slice(0,2).join(' · ');
    const tel=phoneFor(p.key);
    h+='<div class="tp-card'+(alleFertig?' tp-erledigt':'')+'"><div class="tp-time">'+hhmm(p.start)+'</div>'
      +'<div class="tp-main"><div class="tp-pat">'+esc(p.name)+(p.therapist?' <span class="tp-th">· '+esc(p.therapist)+'</span>':'')+'</div>'
      +(leist?'<div class="tp-leist">'+esc(leist)+'</div>':'')
      +'<div class="tp-tasks">';
    p.tasks.forEach(t=>{
      const d=taskDone(t.id),s=taskStatus(t.id);
      h+='<div class="tp-task'+(d?' done':'')+' '+AUF_STATUS[s].k+'">'
        +'<div class="tp-task-cb" onclick="toggleTask(\''+jsq(t.id)+'\')">'+AUF_STATUS[s].ico+'</div>'
        +'<div class="tp-task-body" onclick="toggleTask(\''+jsq(t.id)+'\')">'
        +'<span class="tp-task-txt">'+t.ico+' '+esc(t.txt)+'</span>'
        +'<span class="tp-task-sub">'+esc(t.sub||'')+'</span>'+notizZeile(t.id)+'</div>'
        +taskMeta(t.id,t.cat,p.name+' · '+t.txt)+'</div>';
    });
    h+='</div></div>'+(tel?'<a class="tp-tel" href="tel:'+escA(normPhone(tel)||tel)+'">📞 '+esc(tel)+'</a>':'')+'</div>';
  });
  if(ohneTermin)h+='<div class="tp-hint" style="margin-top:12px">'+ohneTermin+' weitere offene Aufgaben betreffen Patienten, die an diesem Tag nicht kommen — die stehen in der Aufgabenliste.</div>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB: FOLGE-VO
// ═══════════════════════════════════════════════════════════════════════════
function fvSetLoc(id){fvLoc=id;renderFolgeVO();}
function fvSuchen(v){fvSuche=String(v||'').toLowerCase().trim();fvListe();}
function fvArzt(pid,v){setArztNotiz(pid,v);}

function renderFolgeVO(){
  const loc=LOCS.find(l=>l.id===fvLoc)||LOCS[0];
  const alleRows=buildFolgeVO(fvLoc);
  // Dauerpatienten fliegen vor jeder Zaehlung heraus, nicht erst in der Liste —
  // sonst zeigten die vier Kacheln oben andere Zahlen als die Zeilen darunter.
  const dauerRows=alleRows.filter(r=>r.dauer);
  const rows=zeigeDauer?alleRows:alleRows.filter(r=>!r.dauer);
  const offen=rows.filter(r=>!taskDone(r.id));
  const dringend=offen.filter(r=>r.dringend).length;
  const pot=offen.filter(r=>r.weg==='potential').length;
  const voll=offen.filter(r=>r.weg==='ausgeschoepft').length;
  const nochRez=offen.filter(r=>r.weg==='potential').reduce((s,r)=>s+(r.nochRez||0),0);

  let h='<div class="summary"><h2>🔄 Folge-VO · '+esc(loc.label)+'</h2>'
    +'<div class="tz-lead">Rezepte, deren verordnete Menge erbracht ist und für die kein Anschlussrezept vorliegt — weder ein späteres '
    +'noch eines mit offener Menge oder Termin. Sortiert nicht nach Alter, sondern danach, was der Verordnungsfall laut Katalog noch hergibt.</div>'
    +'<div class="sg">'
    +'<div class="si"><div class="si-l">⚠️ Termin ohne Rezept</div><div class="si-v" style="color:var(--fire)">'+dringend+'</div><div class="si-s">Patient kommt, Rezept trägt nicht</div></div>'
    +'<div class="si"><div class="si-l">🎫 Potential offen</div><div class="si-v" style="color:var(--amber)">'+pot+'</div><div class="si-s">orientierende Menge nicht erreicht</div></div>'
    +'<div class="si"><div class="si-l">Mögliche Folge-VO</div><div class="si-v">'+nochRez+'</div><div class="si-s">Rest-Behandlungen ÷ Höchstmenge</div></div>'
    +'<div class="si"><div class="si-l">✅ Ausgeschöpft</div><div class="si-v" style="color:var(--teal)">'+voll+'</div><div class="si-s">nichts mehr zu tun</div></div>'
    +'</div></div>';
  // Die Rechenregel gehoert sichtbar an den Reiter, nicht in eine Dokumentation,
  // die am Empfang niemand aufschlaegt. Wortlaut wie im Physio-CKI, ergaenzt um
  // das, was bei thevea anders ist.
  h+='<div class="fvo-regel"><b>ℹ️ So wird gerechnet:</b> '
    +'Ausschöpfung = <b>verplante Termine (erbrachte + bereits gebuchte zukünftige)</b> gemessen an der '
    +'<b>orientierenden Behandlungsmenge</b> des Katalogs. Entscheidend ist, wie viele der möglichen Behandlungen '
    +'schon verplant sind — egal ob der Termin in Vergangenheit oder Zukunft liegt. Bewusst auf Basis echter '
    +'Kalendertermine, weil das Mengenfeld nur sagt, was auf <i>diesem</i> Blatt offen ist, nicht was im Fall noch möglich wäre. '
    +'Sind alle möglichen Behandlungen verplant, ist nichts mehr zu tun. „Noch X Rezepte" = Rest-Behandlungen ÷ Höchstmenge je VO. '
    +'Ein <b>Verordnungsfall</b> = Patient + ICD-3-Steller + Diagnosegruppe; die Kette beginnt beim <b>ersten Rezept</b> '
    +'(Fall seit …) und startet nach 6 Monaten ohne Rezept neu.'
    +'<br><span style="display:block;margin-top:6px;color:var(--muted)"><b>Quelle der Mengen:</b> '
    +'Heilmittelkatalog des G-BA — Zweiter Teil der Heilmittel-Richtlinie nach § 92 Abs. 6 Satz 1 Nr. 2 SGB V, '
    +'Fassung vom 16.05.2024. Die Höchstmenge je Verordnung liefert thevea zusätzlich pro Rezept mit und geht vor. '
    +'Gerechnet wird mit dem Grundwert der Diagnosegruppe; der Katalog erlaubt mehr für Kinder und Jugendliche bis zur '
    +'Vollendung des 18. Lebensjahres (EX und ZN je 50, EN1 60) und bei Mukoviszidose unter AT (50). '
    +'Diese Fälle stehen hier zu niedrig, nie zu hoch.</span></div>';
  // Fehlende Detailsaetze sind kein Schoenheitsfehler: ohne sie hat ein GKV-Rezept
  // keine Diagnosegruppe, und ohne die faellt es aus der ganzen Rechnung heraus.
  // Das gehoert oben hin, wo die Zahlen stehen, nicht in eine Fussnote.
  const luecke=rows.filter(r=>r.detFehlt).length;
  if(luecke)h+='<div class="fvo-regel" style="border-color:var(--amber)">'
    +'<b style="color:var(--amber)">⚠️ Verordnungsdetails unvollständig.</b> Für <b>'+luecke+'</b> '
    +(luecke===1?'Zeile':'Zeilen')+' hat der Flow keinen Detailsatz geliefert — ohne Diagnosegruppe lässt sich '
    +'kein Potential rechnen, diese Fälle stehen ungewertet unter „Ohne Diagnosegruppe". '
    +'Ursache ist der Filter <code>Aktive VOs</code> in Power Automate: er lässt nur <b>Status = InBehandlung</b> durch. '
    +'Abgeschlossene und abgerechnete Rezepte holen deshalb nie einen Detailsatz — also genau die, bei denen eine '
    +'Folge-VO ansteht. Der Filter muss auf <b>Status ist nicht gleich Entwurf</b> lauten; die Bündelschleife '
    +'wächst über <code>chunk(…, 80)</code> von selbst mit.</div>';
  h+='<div class="tabs" id="fvLocTabs"></div>';
  h+='<div class="focus-banner">🔄 <b>Fokus: Rezept anfordern, bevor der nächste Termin kommt.</b> '
    +'Rot markiert sind Patienten, die bereits einen Termin haben, obwohl das Rezept ausgeschöpft ist — diese Behandlung wäre ohne Folge-VO nicht abrechenbar.'
    +'<span class="fb-dauer"> · thevea führt an der Verordnung keinen Arzt; das Namensfeld pflegt die Praxis selbst.</span></div>';
  // Der Schalter steht ueber der Liste, nicht in einer Einstellung: wer wissen
  // will, warum ein Name fehlt, findet die Antwort dort, wo er ihn sucht.
  const dringHidden=zeigeDauer?0:dauerRows.filter(r=>r.dringend&&!taskDone(r.id)).length;
  if(dauerRows.length||zeigeDauer){
    h+='<div class="flt">'+dauerSchalter(zeigeDauer?0:dauerRows.length)
      +'<span class="fl" style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0">'
      +'Erkannt am Namenszusatz <code>DAU</code> und am Bemerkungsfeld des Patienten.</span></div>';
    if(dringHidden)h+='<div class="fvo-regel" style="border-color:var(--fire)">'
      +'<b style="color:var(--fire)">⚠️ '+dringHidden+' ausgeblendete'+(dringHidden===1?'r Dauerpatient hat':' Dauerpatienten haben')+' einen Termin ohne gültiges Rezept.</b> '
      +'Diese Behandlung wäre ohne Folge-VO nicht abrechenbar — einmal einblenden und nachsehen lohnt sich.</div>';
  }
  h+=renderTeamBar();
  h+='<div class="search-wrap"><span class="sw-ico">🔍</span><input type="text" id="fvSearch" placeholder="Patient, Heilmittel oder ICD suchen..." value="'+escA(fvSuche)+'" oninput="fvSuchen(this.value)"></div>';
  h+='<div id="fvListe"></div>';
  h+='<div class="ft">KIMOJO · Folge-VO · thevea führt an der Verordnung keinen Arzt — das Namensfeld pflegt die Praxis selbst, es bleibt am Gerät.</div>';
  document.getElementById('mc').innerHTML=h;
  const el=document.getElementById('fvLocTabs');
  let t='';LOCS.forEach(l=>{t+='<button class="tab'+(fvLoc===l.id?' a':'')+'" onclick="fvSetLoc(\''+l.id+'\')">'+esc(l.label)+'</button>';});
  el.innerHTML=t;
  fvListe();
}

function fvListe(){
  const el=document.getElementById('fvListe');if(!el)return;
  let rows=buildFolgeVO(fvLoc);
  if(!zeigeDauer)rows=rows.filter(r=>!r.dauer);
  const me=getMe();
  if(tzOnlyMine&&me)rows=rows.filter(r=>istMeine(r.id,'fvo',me));
  if(fvSuche)rows=rows.filter(r=>(r.name+' '+r.heilmittel+' '+r.icd+' '+r.icdT+' '+r.dg+' '+(r.gruppeName||'')).toLowerCase().includes(fvSuche));
  const offen=rows.filter(r=>!taskDone(r.id)),erledigt=rows.filter(r=>taskDone(r.id));
  if(!rows.length){el.innerHTML='<div class="empty">Keine Treffer.</div>';return;}
  const karte=r=>{
    const d=taskDone(r.id),s=taskStatus(r.id);const tel=r.pid?phoneFor(r.pid):'';
    const arzt=r.pid?getArztNotiz(r.pid):'';
    const farbe=d?'var(--teal)'
      :(r.dringend?'var(--fire)'
      :(r.weg==='budgetfrei'?'var(--teal)'
      :(r.weg==='ausgeschoepft'?'var(--muted)'
      :(r.weg==='ohne'?'var(--blue)':'var(--amber)'))));
    // Der Balken zeigt jetzt die Ausschoepfung des FALLS, nicht die des
    // einzelnen Blattes. Ohne Katalogzuordnung bleibt er leer statt zu luegen.
    const pct=r.ausschoepf!=null?r.ausschoepf:(r.kann?Math.min(100,Math.round(r.gel/r.kann*100)):100);
    let aktion;
    if(d)aktion='<b style="color:var(--teal)">✓ erledigt</b>';
    else if(r.dringend)aktion='<b style="color:var(--fire)">⚠️ Termin ohne Rezept!</b> Rezept anfordern, bevor der Patient kommt.';
    else if(r.weg==='budgetfrei')aktion='<b style="color:var(--teal)">♾️ '+esc(r.bvbName||r.bvb)+' — budgetfrei.</b> '
      +'Ausserhalb des Budgets verordnungsfähig, keine orientierende Menge. Behandlung nicht abreissen lassen.';
    else if(r.weg==='ohne')aktion=r.detFehlt
      ? '<b style="color:var(--blue)">❔ Verordnungsdetails fehlen im Export.</b> '
        +'Zu diesem Rezept hat der Flow keinen Detailsatz geliefert — deshalb keine Diagnosegruppe und kein '
        +'berechenbares Potential. Der Anruf lohnt trotzdem, die Serie ist durch.'
      : '<b style="color:var(--blue)">❔ Formular ohne Diagnosegruppe.</b> '
        +esc(r.formular||'Privat/BG')+'-Rezepte tragen keine Diagnose — Potential lässt sich hier nicht rechnen, '
        +'der Anruf lohnt trotzdem.';
    else if(r.weg==='ausgeschoepft')aktion=(r.genutzt>r.orient)
      // Ueber der orientierenden Menge ist nicht verboten, sondern begruendungs-
      // pflichtig. Das Dashboard soll es zeigen, nicht wegrunden.
      ? '<b style="color:var(--muted)">✅ Katalogmenge überschritten.</b> '
        +r.genutzt+' verplant bei einer orientierenden Menge von '+r.orient
        +' — über den Katalog hinaus, das braucht am Rezept eine ärztliche Begründung. Für die Folge-VO nichts zu tun.'
      : '<b style="color:var(--muted)">✅ Katalogmenge verplant.</b> '
        +'Alle '+r.orient+' möglichen Behandlungen sind erbracht oder gebucht — vermutlich abgeschlossen, nichts zu tun.';
    else aktion='<b style="color:var(--amber)">📄 Folge-VO anfordern.</b> Erst <b>'+r.genutzt+' von '+r.orient+'</b> verplant · '
      +'noch <b>'+r.restBeh+'</b> Behandlungen möglich · ca. <b>'+r.nochRez+'</b> Folge-VO'+(r.nochRez>1?'s':'')+' drin.';
    const grpChip=r.gruppe?' <span style="font-size:9px;color:var(--muted);font-weight:700;margin-left:6px" title="'
      +escA((r.gruppeName||r.gruppe)+(r.orient?' — orientierende Menge '+r.orient+', Höchstmenge '+r.hoechst+' je VO':''))+'">'
      +esc(r.dg||r.gruppe)+'</span>':'';
    return'<div class="pr '+AUF_STATUS[s].k+'" style="border-left:3px solid '+farbe+(d?';opacity:.55':'')+'">'
      +'<div class="task-cb" onclick="toggleTask(\''+jsq(r.id)+'\')" style="flex-shrink:0">'+AUF_STATUS[s].ico+'</div>'
      +'<div class="pr-i">'
      +'<div class="pr-n"'+(d?' style="text-decoration:line-through"':'')+'>'+esc(r.name)
      +' <span style="font-size:9px;color:var(--muted);font-weight:600;margin-left:6px">'+esc(r.status)+'</span>'
      +(r.icd?' <span style="font-size:9px;color:'+farbe+';font-weight:700;margin-left:6px">'+esc(r.icd)+'</span>':'')
      +grpChip
      +(r.dauer?' <span style="font-size:9px;color:var(--purple);font-weight:700;margin-left:6px" title="Als Dauerpatient erkannt — normalerweise ausgeblendet">📌 Dauer</span>':'')+'</div>'
      +'<div class="pr-d">'+esc(r.sub)+(r.icdT?' · '+esc(r.icdT):'')
      +(r.erstesRez?' · Fall seit '+esc(dmy(r.erstesRez)):'')
      +'<br>'+aktion+'</div>'
      +'<div class="progress-mini"><div class="progress-mini-f" style="width:'+pct+'%;background:'+farbe+'"></div></div>'
      +(r.pid?'<div style="margin-top:6px"><input class="tm-input" style="width:180px" placeholder="Arzt (eigene Notiz)" value="'+escA(arzt)+'" onchange="fvArzt(\''+jsq(r.pid)+'\',this.value)"></div>':'')
      +notizZeile(r.id)
      +'</div>'
      +(tel?'<a class="pr-tel" href="tel:'+escA(normPhone(tel)||tel)+'" title="'+escA(tel)+'">📞 '+esc(tel)+'</a>':'')
      +taskMeta(r.id,'fvo',r.name)+'</div>';
  };
  const gruppe=(titel,klasse,text,liste)=>liste.length
    ?'<div class="subgroup"><div class="subgroup-h"><span class="'+klasse+'">'+titel+'</span> <span class="cnt">— '+text+' ('+liste.length+')</span></div>'
      +liste.map(karte).join('')+'</div>':'';
  let h='';
  const rest=offen.filter(r=>!r.dringend);
  h+=gruppe('⚠️ TERMIN OHNE GÜLTIGES REZEPT','crit','Patient hat einen Termin, das Rezept ist aber ausgeschöpft — hier zuerst anrufen',offen.filter(r=>r.dringend));
  h+=gruppe('📄 POTENTIAL OFFEN','miss','Serie durch, und der Verordnungsfall gibt laut Katalog noch Behandlungen her',rest.filter(r=>r.weg==='potential'));
  h+=gruppe('♾️ BVB / LVB — BUDGETFREI','norm','ausserhalb des Budgets verordnungsfähig, hier zählt keine orientierende Menge',rest.filter(r=>r.weg==='budgetfrei'));
  h+=gruppe('❔ OHNE DIAGNOSEGRUPPE','norm','Formular trägt keine Diagnose oder der Detailsatz fehlt im Export — Potential nicht berechenbar',rest.filter(r=>r.weg==='ohne'));
  h+=gruppe('✅ KATALOGMENGE VERPLANT','norm','alle möglichen Behandlungen erbracht oder gebucht — vermutlich abgeschlossen',rest.filter(r=>r.weg==='ausgeschoepft'));
  if(!offen.length)h+='<div class="empty" style="background:var(--teal-bg);border:1px solid var(--teal);color:var(--teal)">'
    +'<b>🎉 Keine offene Folge-VO</b><br><span style="font-size:11px">Für jede fertige Serie liegt ein Anschlussrezept vor oder sie ist abgehakt.</span></div>';
  h+=gruppe('✓ ERLEDIGT','norm','abgehakt, bleibt zur Kontrolle stehen',erledigt);
  el.innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB: VERPLANUNG — steckengeblieben und unvollständig in einer Liste
// ---------------------------------------------------------------------------
// Bis jetzt lag der Fall auseinander: „Steckengeblieben" stand unter Offene
// Rezepte, aber nur, wenn gar kein Zukunftstermin mehr existierte. Ein Rezept

// TAB: POTENTIAL-DAUER
// ---------------------------------------------------------------------------
// Die Definition stammt aus dem Physio-CKI und lautet dort:
//
//   „Angezeigt werden Patienten mit einer für einen Dauerplan geeigneten
//    Behandlungsart oder Diagnose (LHB, BVB, Blanko, Privat, MLD 45/60,
//    KG-ZNS, Hausbesuch), die noch keine Maske D besitzen. Sobald ein Patient
//    die Maske D erhält, verschwindet er automatisch aus dieser Liste."
//
// Zwei Hälften also: eine Eignung und ein Ausschluss. Die Eignung ist eine
// Frage der Behandlungsart und lässt sich in thevea vollständig rechnen. Der
// Ausschluss hing an der Medifox-Maske D, die es in thevea nicht gibt — was
// aber nicht heißt, dass jeder Patient hier hineingehört. Die Maske D war nie
// das Kriterium, sondern nur das Häkchen „ist schon eingetaktet".
//
// Dieses Häkchen wird hier durch die Wirklichkeit ersetzt: wer seit Wochen am
// selben Wochentag zur selben Uhrzeit kommt (siehe SERIE_MIN in histMap), hat
// faktisch einen Dauerplan und fällt heraus — ganz gleich, ob das jemand
// irgendwo eingetragen hat. Das ist sogar ehrlicher als die Maske D, weil es
// den tatsächlichen Takt misst statt eine gesetzte Markierung.
//
// Übrig bleibt die Liste, die der Reiter verspricht: Patienten, bei denen sich
// ein fester Platz lohnt und die noch keinen haben.
//
// Das frühere Blanko-Potenzial ist nicht verschwunden, sondern dorthin
// gezogen, wo es hingehört — in den Rezepte-Reiter, Kachel „💎 Blanko-
// Potenzial". Es ist eine Frage des Formulars, nicht des Terminkalenders.
// ═══════════════════════════════════════════════════════════════════════════
function pdSetLoc(id){pdLoc=id;renderPotential();}
function pdSetFilter(f){pdFilter=f;renderPotential();}

// Prüft eine einzelne Verordnung gegen die sieben Eignungen der CKI-Definition
// und gibt die zutreffenden zurück. Mehrfachtreffer sind normal und erwünscht:
// ein Hausbesuch auf Privatrezept mit LHB-Diagnose ist der klarste Dauerfall,
// den es gibt.
function dauerGruende(v,d){
  const g=[];
  const hm=String((v&&v.heilmittel)||'');
  const form=String((v&&v.formular)||'');
  const txt=hm+' '+form;
  // LHB/BVB kommen aus der Diagnose. HMMAP unterscheidet L (langfristiger
  // Heilmittelbedarf, dauerhaft verordnungsfähig) von B (besonderer
  // Verordnungsbedarf, 12 Wochen). Beides zählt, LHB wiegt schwerer.
  const b=d&&d.icd?fBVB(d.icd):null;
  if(b&&b.t==='LVB')g.push({k:'LHB',t:'Langfristiger Heilmittelbedarf',s:b.n});
  else if(b)g.push({k:'BVB',t:'Besonderer Verordnungsbedarf',s:b.n});
  else if(d&&d.bvb)g.push({k:'BVB',t:'Besonderer Verordnungsbedarf',s:'von thevea gekennzeichnet'});
  if((d&&d.bl)||/blanko/i.test(txt))g.push({k:'Blanko',t:'Blankoverordnung',s:'Menge und Frequenz bestimmt die Praxis'});
  if(/privat|beihilfe|selbstzahler/i.test(txt))g.push({k:'Privat',t:'Privatrezept',s:'kein Budget, keine Höchstmenge'});
  // Nur 45 und 60 Minuten. MLD-30 ist die Regelbehandlung und begründet für
  // sich genommen keinen Dauerplan — genau so steht es in der CKI-Definition.
  if(/MLD[\s\-]?(45|60)/i.test(hm))g.push({k:'MLD 45/60',t:'Manuelle Lymphdrainage 45/60 Min.',s:'lange Einheit, fester Platz nötig'});
  if(/KG[\s\-]?ZNS|neurophysiolog/i.test(hm))g.push({k:'KG-ZNS',t:'KG auf neurophysiologischer Grundlage',s:'Bobath, PNF, Vojta'});
  if((d&&d.hb)||/hausbesuch/i.test(hm)||/hausbesuch/i.test(String((v&&v.lokalisation)||'')))
    g.push({k:'Hausbesuch',t:'Hausbesuch',s:'Fahrtweg lohnt nur im festen Takt'});
  return g;
}

// Fasst die Verordnungen eines Standorts zu Patienten zusammen und hängt an
// jeden Patienten seine Eignungen und seinen tatsächlichen Terminrhythmus.
function buildDauerplan(locId){
  const D=VOD[locId];if(!D||!D.vo)return[];
  const nodes=voNodes(D.vo)||[];
  const det=D.det||{};
  const H=D.hist||null;
  const serien=(H&&H.serien)||{};
  const heuteDs=D.heuteDs||isoDay(0);
  const P={};
  nodes.forEach(v=>{
    if(!v)return;
    // Entwürfe sind noch keine Behandlung, abgeschlossene Serien brauchen
    // keinen Platz mehr. Gefragt ist, wer gerade läuft.
    if(v.status!=='InBehandlung')return;
    const d=det[String(v.id)]||null;
    const g=dauerGruende(v,d);
    if(!g.length)return;
    const pid=v.verknuepfterPatientId!=null?String(v.verknuepfterPatientId):('n:'+(v.nachname||'')+(v.vorname||''));
    const e=P[pid]||(P[pid]={pid,name:((v.nachname||'')+(v.vorname?', '+v.vorname:'')).trim()||'(ohne Namen)',
      gruende:{},vos:[],icd:'',icdT:'',offen:0,naechster:null,letzter:null});
    g.forEach(x=>{if(!e.gruende[x.k])e.gruende[x.k]=x;});
    const erb=voErb(v),kann=voKann(v);
    const hv=H&&H.vo?H.vo[String(v.id)]:null;
    const gel=hv&&hv.n!=null?Math.max(erb,hv.n):erb;
    e.offen+=Math.max(0,kann-gel);
    e.vos.push({id:v.id,hm:v.heilmittel||'',form:v.formular||'',offen:Math.max(0,kann-gel),kann});
    if(d&&d.icd&&!e.icd){e.icd=d.icd;e.icdT=d.icdT||'';}
    if(hv&&hv.naechster&&(!e.naechster||hv.naechster<e.naechster))e.naechster=hv.naechster;
    if(hv&&hv.letzter&&(!e.letzter||hv.letzter>e.letzter))e.letzter=hv.letzter;
  });
  const out=Object.values(P);
  out.forEach(e=>{
    e.serie=serien[e.pid]||null;
    e.dauer=istDauer(e.pid,e.name);
    e.gr=Object.values(e.gruende);
    // Rangfolge für die Sortierung: je mehr Gründe und je mehr offene
    // Einheiten, desto mehr bringt ein fester Platz.
    e.score=e.gr.length*10+Math.min(20,e.offen)
      +(e.gruende['LHB']?15:0)+(e.gruende['Hausbesuch']?8:0)+(e.gruende['KG-ZNS']?5:0);
  });
  out.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  return out;
}

function renderPotential(){
  const loc=LOCS.find(l=>l.id===pdLoc)||LOCS[0];
  const alleRoh=buildDauerplan(pdLoc);
  // Vor allem anderen: wer ohnehin Dauerpatient ist, braucht kein Angebot mehr.
  // Der Schnitt liegt hier ganz oben, damit Kacheln, Grundfilter, Arbeitsliste
  // und Gegenprobe alle dieselbe Grundmenge zaehlen.
  const dauerN=alleRoh.filter(p=>p.dauer).length;
  const alle=zeigeDauer?alleRoh:alleRoh.filter(p=>!p.dauer);
  const hatHist=!!(VOD[pdLoc]&&VOD[pdLoc].hist&&VOD[pdLoc].hist.serien);
  let kand=alle.filter(p=>!p.serie);          // eignet sich, hat aber keinen festen Takt
  // Die Gegenprobe unten trägt denselben Grund-Filter wie die Arbeitsliste.
  // Sonst stünde bei „LHB (0)" trotzdem ein Stapel fremder Karten darunter.
  let laeuft=alle.filter(p=>p.serie);          // hat faktisch schon einen Dauerplan
  const me=getMe();
  if(tzOnlyMine&&me)kand=kand.filter(p=>istMeine('dplan|'+p.pid,'dauer',me));
  if(pdFilter!=='all'){
    kand=kand.filter(p=>!!p.gruende[pdFilter]);
    laeuft=laeuft.filter(p=>!!p.gruende[pdFilter]);
  }
  const laeuftGesamt=alle.filter(p=>p.serie).length;
  const offen=kand.filter(p=>!taskDone('dplan|'+p.pid));
  const erledigt=kand.filter(p=>taskDone('dplan|'+p.pid));
  const mitTermin=offen.filter(p=>p.naechster).length;

  let h='<div class="summary"><h2>💎 Potential-Dauer · '+esc(loc.label)+'</h2>'
    +'<div class="tz-lead">Patienten, deren Behandlungsart oder Diagnose einen festen Platz rechtfertigt '
    +'(LHB, BVB, Blanko, Privat, MLD 45/60, KG-ZNS, Hausbesuch) — und die noch in keinem festen Takt laufen. '
    +(hatHist
      ? 'Statt der Medifox-Maske D zählt hier, was tatsächlich passiert: wer mindestens '+SERIE_MIN+'× am selben Wochentag '
        +'zur selben Uhrzeit kommt, gilt als eingetaktet und fällt aus der Liste.'
      : '<b>Ohne <code>termine_historie'+esc(loc.suf)+'.json</code></b> lässt sich nicht erkennen, wer schon fest eingetaktet ist — '
        +'die Liste zeigt deshalb alle geeigneten Patienten.')
    +'</div>'
    +'<div class="sg">'
    +'<div class="si"><div class="si-l">Ohne festen Takt</div><div class="si-v" style="color:var(--purple)">'+offen.length+'</div><div class="si-s">hier liegt die Arbeit</div></div>'
    +'<div class="si"><div class="si-l">Kommt demnächst</div><div class="si-v">'+mitTermin+'</div><div class="si-s">beim Termin ansprechen</div></div>'
    +'<div class="si"><div class="si-l">Läuft schon fest</div><div class="si-v" style="color:var(--teal)">'+laeuftGesamt+'</div><div class="si-s">Serienplatz erkannt</div></div>'
    +'<div class="si"><div class="si-l">Geeignet gesamt</div><div class="si-v">'+alle.length+'</div><div class="si-s">laufende Rezepte</div></div>'
    +'</div></div>';
  h+='<div class="tabs" id="pdLocTabs"></div>';

  // Filter nach Grund — sieben Knöpfe, jeder mit seiner echten Zahl. Wer nur
  // die Hausbesuche takten will, klickt einmal statt zu scrollen.
  const ohne=alle.filter(p=>!p.serie);
  const zaehl=k=>ohne.filter(p=>!!p.gruende[k]).length;
  let f='<span class="fl">Grund</span>'
    +'<button class="fb'+(pdFilter==='all'?' a':'')+'" onclick="pdSetFilter(\'all\')">Alle ('+ohne.length+')</button>';
  ['LHB','BVB','Blanko','Privat','MLD 45/60','KG-ZNS','Hausbesuch'].forEach(k=>{
    f+='<button class="fb'+(pdFilter===k?' a':'')+'" onclick="pdSetFilter(\''+jsq(k)+'\')">'+esc(k)+' ('+zaehl(k)+')</button>';});

  const dt=ds=>ds?String(ds).slice(0,10).split('-').reverse().join('.'):'';

    const id='dplan|'+r.pid;const d=taskDone(id),s=taskStatus(id);const tel=phoneFor(r.pid);

      +r.gr.map(g=>'<span class="pr-b c-purple" title="'+escA(g.t+(g.s?' — '+g.s:''))+'">'+esc(g.k)+'</span>').join('');
    const hm=r.vos.map(v=>v.hm).filter(Boolean).join(' · ')||'—';
    return'<div class="pr '+AUF_STATUS[s].k+'" style="border-left:3px solid '+farbe+(d?';opacity:.55':'')+'">'
      +'<div class="task-cb" onclick="toggleTask(\''+jsq(id)+'\')" style="flex-shrink:0">'+AUF_STATUS[s].ico+'</div>'
      +'<div class="pr-i">'
      +'<div class="pr-n"'+(d?' style="text-decoration:line-through"':'')+'>'+esc(r.name)
      +(r.icd?' <span style="font-size:9px;color:var(--muted);font-weight:700;margin-left:6px" title="'+escA(r.icdT)+'">'+esc(r.icd)+'</span>':'')+'</div>'
      +'<div class="pr-d"><b>'+esc(hm)+'</b>'
      +(r.offen>0?' · noch <b>'+r.offen+'</b> Einheiten verordnet':' · Rezept ausgeschöpft')
      +'<br><b style="color:'+farbe+'">📌 Festen Termin anbieten.</b> '
      +(r.naechster?'Kommt am <b>'+esc(dt(r.naechster))+'</b> — dort direkt ansprechen.'
        :(r.letzter?'Kein Folgetermin gebucht, zuletzt am '+esc(dt(r.letzter))+'.':'Kein Termin im Fenster.'))
      +'</div>'+notizZeile(id)+'</div>'

      +(tel?'<a class="pr-tel" href="tel:'+escA(normPhone(tel)||tel)+'" title="'+escA(tel)+'">📞 '+esc(tel)+'</a>':'')
      +taskMeta(id,'dauer',r.name)+'</div>';
  };
  const gruppe=(titel,klasse,text,liste)=>liste.length
    ?'<div class="subgroup"><div class="subgroup-h"><span class="'+klasse+'">'+titel+'</span> <span class="cnt">— '+text+' ('+liste.length+')</span></div>'

  let b='';

  b+=gruppe('📞 KEIN TERMIN GEBUCHT','miss','geeignet, aber nichts im Kalender — anrufen und gleich takten',offen.filter(r=>!r.naechster));
  if(!offen.length)b+='<div class="empty" style="background:var(--teal-bg);border:1px solid var(--teal);color:var(--teal)">'
    +'<b>🎉 Alle geeigneten Patienten laufen im festen Takt</b><br><span style="font-size:11px">'
    +'Kein laufendes Rezept mit dauerplanfähiger Behandlungsart wartet noch auf einen festen Platz.</span></div>';
  b+=gruppe('✓ ANGESPROCHEN','norm','abgehakt, bleibt zur Kontrolle stehen',erledigt);

  // Die Gegenprobe: wer bereits fest läuft. Nicht zum Abarbeiten, sondern zum
  // Nachsehen — hier wird sichtbar, ob die Serienerkennung plausibel greift.
  if(laeuft.length){

        +'<div class="pr-i"><div class="pr-n">'+esc(r.name)+'</div>'
        +'<div class="pr-d">'+esc(r.gr.map(g=>g.k).join(' · '))
        +' · fester Platz <b>'+esc(r.serie.label)+'</b> ('+r.serie.n+' Termine)</div></div></div>';
    });
    if(laeuft.length>zeig.length)b+='<div class="tp-hint">… und '+(laeuft.length-zeig.length)+' weitere.</div>';
    b+='</div>';
  }
  document.getElementById('pdListe').innerHTML=b;
}

// TAB: REZEPTE
// ---------------------------------------------------------------------------
// Vorbild ist das Rezept-Cockpit aus dem Kitzinger Physio-CKI: nicht eine Liste
// aller Verordnungen, sondern acht Fächer, die jeweils eine Handlung auslösen —
// anrufen, Folgerezept anfordern, Arzt ansprechen, Frequenz erhöhen. Wer nur
// nachschlagen will, wechselt auf „Nachschlagen"; dort liegt die alte
// Gesamtliste weiter, aber sie ist nicht mehr die Startansicht.
//
// Die Fächer selbst kommen aus buildRezepteTV (RCS[Standort].heute), also aus
// derselben Analyse, die auch der Lücken-Reiter und das Tagesziel benutzen.
// ═══════════════════════════════════════════════════════════════════════════
function rzSetLoc(id){rzLoc=id;renderRezepte();}
function rzSetSub(s){rzSub=s;renderRezepte();}
function rzSetStatus(s){rzStatus=s;rzTabelle();}
function rzSuchen(v){rzSuche=String(v||'').toLowerCase().trim();rzTabelle();}

// Die acht Fächer des Cockpits. Jede Kachel sagt, was der Fall ist (Titel),
// wie viele es sind (Zahl) und was zu tun wäre (Fußzeile).
function rzKacheln(c){
  if(!c)return[];
  const k=[
    {k:'nr',       l:'🔥 Nachrücker',      v:(c.nr||[]).length,       co:'var(--fire)',  s:'in eine Lücke rufen'},
    {k:'folge',    l:'🔴 Folgerezept',     v:(c.folge||[]).length,    co:'var(--red)',   s:'≤2 übrig · Rezept anfordern'},
    {k:'reserv',   l:'⚠️ Ohne Verordnung', v:(c.reserv||[]).length,   co:'var(--amber)', s:'Termin ohne Rezept · klären'},
    {k:'freq',     l:'📈 Frequenz erhöhen',v:(c.freq||[]).length,     co:'var(--blue)',  s:'Rezept läuft zu langsam'},
    {k:'blankopot',l:'💎 Blanko-Potenzial',v:(c.blankopot||[]).filter(x=>x.tv||x.bvbTyp||x.rest>0).length,co:'var(--purple)',s:'Arzt auf Blanko ansprechen'},
    {k:'blanko',   l:'💊 Blanko läuft',    v:(c.blanko||[]).length,   co:'var(--purple)',s:'16 Wochen · Menge selbst steuern'},
    {k:'bvb',      l:'🏥 BVB/LVB',         v:(c.bvb||[]).length,      co:'var(--green)', s:'außerhalb des Budgets'},
    {k:'all',      l:'📋 Alle Fälle',      v:(c.bvb||[]).length+(c.blanko||[]).length+(c.folge||[]).length+(c.reserv||[]).length+(c.freq||[]).length,co:'var(--dark)',s:'gesamt in dieser Ansicht'}
  ];
  const loc=LOCS.find(l=>l.id===rzLoc);
  if(loc&&loc.bereich===1&&typeof ergoDetailData!=='undefined'&&ergoDetailData){
    const ep=getErgoPatients();
    k.push({k:'patienten',l:'👥 Patienten',v:ep.length,co:'var(--teal)',s:'in Behandlung'});
  }
  return k;
}

// Echter Rueckstand nach Koepfen. Steht als eigene Funktion da, weil der
// Luecken-Reiter dieselbe Zahl nennt — zwei Rechenwege haetten zwei Zahlen
// fuer dieselbe Sache ergeben.
function rzRueckstand(c){
  if(!c)return 0;
  const koepfe=new Set();
  ['folge','reserv','freq','blankopot'].forEach(k=>(c[k]||[]).forEach(x=>{
    if(k==='blankopot'&&!(x.tv||x.bvbTyp||x.rest>0))return;
    koepfe.add(x.pid!=null?String(x.pid):'n:'+x.name);
  }));
  return koepfe.size;
}

function renderRezepte(){
  const loc=LOCS.find(l=>l.id===rzLoc)||LOCS[0];
  // showRD() und alle Detaillisten lesen das globale RC. Für diesen Reiter zeigt
  // es auf den Standort, der oben gewählt ist — nicht auf den des Tagesbriefings.
  const rcs=RCS[rzLoc];RC=rcs?(rcs.heute||null):null;
  const kach=rzKacheln(RC);
  // Für die Einleitung zählt nur echter Handlungsbedarf — und zwar nach Köpfen,
  // nicht nach Zeilen. Ein Patient kann in mehreren Fächern liegen; ihn dreimal
  // zu zählen würde die Liste größer aussehen lassen, als die Arbeit ist.
  // Nachrücker, BVB und laufende Blanko sind Nachschlagefächer, kein Rückstand.
  const summe=rzRueckstand(RC);

  let h='<div class="summary"><h2>💊 Rezepte · '+esc(loc.label)+'</h2>'
    +'<div class="tz-lead">'+(rzSub==='handeln'
      ? 'Jede Kachel ist ein Stapel Arbeit, kein Bericht: anklicken, Namen sehen, abarbeiten. '
        +'Echter Rückstand sind gerade <b>'+summe+'</b> Patienten — Folgerezept, fehlende Verordnung, zu langsame Frequenz oder Blanko-Gespräch. '
        +'Nachrücker, BVB und laufende Blanko stehen daneben zum Nachschlagen. Die reine Verordnungsliste liegt unter „Nachschlagen".'
      : 'Alle Verordnungen dieses Standorts zum Nachschlagen — auch Entwürfe und abgeschlossene. '
        +'Was tatsächlich zu tun ist, steht unter „Handeln".')
    +'</div></div>';
  h+='<div class="tabs" id="rzLocTabs"></div>';
  h+='<div class="flt" style="margin-bottom:14px"><span class="fl">Ansicht</span>'
    +'<button class="fb'+(rzSub==='handeln'?' a':'')+'" onclick="rzSetSub(\'handeln\')">⚡ Handeln</button>'
    +'<button class="fb'+(rzSub==='liste'?' a':'')+'" onclick="rzSetSub(\'liste\')">🔎 Nachschlagen</button></div>';

  if(rzSub==='handeln'){
    if(!RC){
      h+='<div class="empty">Für '+esc(loc.label)+' liegen noch keine Verordnungsdaten vor.</div>';
    }else{
      h+='<div class="search-wrap"><span class="sw-ico">🔍</span>'
        +'<input type="text" id="rzSearch" placeholder="Patient in der geöffneten Liste suchen..." oninput="filterRezeptSearch()"></div>';
      h+='<div class="rkpis">';
      kach.forEach(x=>{h+='<div class="rkpi" id="rk-'+x.k+'" onclick="showRD(\''+x.k+'\')">'
        +'<div class="rkpi-l">'+x.l+'</div><div class="rkpi-v" style="color:'+x.co+'">'+x.v+'</div>'
        +'<div class="rkpi-s">'+x.s+'</div></div>';});
      h+='</div><div id="rd"></div>';
    }
  }else{
    const rows=rzZeilen(rzLoc),proStatus=k=>rows.filter(r=>r.status===k).length;
    h+='<div class="sg" style="margin-bottom:14px">'
      +'<div class="si"><div class="si-l">In Behandlung</div><div class="si-v" style="color:var(--primary)">'+proStatus('InBehandlung')+'</div><div class="si-s">laufend</div></div>'
      +'<div class="si"><div class="si-l">Abgeschlossen</div><div class="si-v" style="color:var(--teal)">'+proStatus('Abgeschlossen')+'</div><div class="si-s">Serie beendet</div></div>'
      +'<div class="si"><div class="si-l">Entwurf</div><div class="si-v">'+proStatus('Entwurf')+'</div><div class="si-s">noch keine Leistung</div></div>'
      +'<div class="si"><div class="si-l">Blanko</div><div class="si-v" style="color:var(--purple)">'+rows.filter(r=>/blanko/i.test(r.formular)).length+'</div><div class="si-s">Menge bestimmt die Praxis</div></div>'
      +'</div>';
    h+='<div class="flt" id="rzFilter"></div>';
    h+='<div class="search-wrap"><span class="sw-ico">🔍</span><input type="text" id="rzSearchAll" placeholder="Patient, Heilmittel, Formular oder ICD suchen..." value="'+escA(rzSuche)+'" oninput="rzSuchen(this.value)"></div>';
    h+='<div id="rzTabelle"></div>';
  }
  h+='<div class="ft">KIMOJO · Rezepte</div>';
  document.getElementById('mc').innerHTML=h;

  let t='';LOCS.forEach(l=>{t+='<button class="tab'+(rzLoc===l.id?' a':'')+'" onclick="rzSetLoc(\''+l.id+'\')">'+esc(l.label)+'</button>';});
  document.getElementById('rzLocTabs').innerHTML=t;

  if(rzSub==='handeln'){
    // Beim Öffnen soll nicht die leere Fläche stehen. Aufgeklappt wird das
    // dringlichste Fach mit echtem Handlungsbedarf — in dieser Reihenfolge,
    // nicht nach Größe: ein auslaufendes Rezept kostet mehr als eine lange
    // Nachrückerliste.
    if(RC){
      const reihe=['folge','reserv','freq','blankopot','nr','bvb','blanko'];
      const start=reihe.map(k=>kach.find(x=>x.k===k&&x.v>0)).find(Boolean);
      if(start)showRD(start.k);
    }
    return;
  }
  let f='<span class="fl">Status</span>';
  [['all','Alle'],['InBehandlung','In Behandlung'],['Abgeschlossen','Abgeschlossen'],['Entwurf','Entwurf']].forEach(x=>{
    f+='<button class="fb'+(rzStatus===x[0]?' a':'')+'" data-st="'+x[0]+'" onclick="rzSetStatus(\''+x[0]+'\')">'+x[1]+'</button>';});
  document.getElementById('rzFilter').innerHTML=f;
  rzTabelle();

function rzZeilen(locId){
  const D=VOD[locId];if(!D||!D.vo)return[];
  const nodes=voNodes(D.vo)||[];
  const H=(D.hist&&D.hist.vo)?D.hist.vo:null;
  return nodes.filter(Boolean).map(v=>{
    const hv=H?H[String(v.id)]:null;
    const erb=voErb(v);
    const kann=voKann(v);
    const tv=hv?hv.n:null;
    const d=D.det?D.det[String(v.id)]:null;
    return{id:v.id,pid:v.verknuepfterPatientId!=null?String(v.verknuepfterPatientId):null,
      name:((v.nachname||'')+(v.vorname?', '+v.vorname:'')).trim()||'(ohne Namen)',
      heilmittel:v.heilmittel||'',formular:v.formular||'',status:v.status||'',
      erb,kann,gel:tv!=null?Math.max(erb,tv):erb,tv,tz:hv?hv.nZ:null,
      letzter:hv&&hv.letzter?hv.letzter:null,naechster:hv&&hv.naechster?hv.naechster:null,
      ausst:String(v.ausstellungsdatum||'').slice(0,10)||null,
      icd:d?(d.icd||''):'',dg:d?(d.dg||''):'',
      zz:parseFloat(v.zuzahlung||0)||0,rgOffen:!!v.rechnungOffen};
  }).sort((a,b)=>String(b.ausst||'').localeCompare(String(a.ausst||''))||a.name.localeCompare(b.name));
}

function rzTabelle(){
  const el=document.getElementById('rzTabelle');if(!el)return;
  let rows=rzZeilen(rzLoc);
  if(rzStatus!=='all')rows=rows.filter(r=>r.status===rzStatus);
  if(rzSuche)rows=rows.filter(r=>(r.name+' '+r.heilmittel+' '+r.formular+' '+r.icd+' '+r.dg).toLowerCase().includes(rzSuche));
  // Nur die Tabelle wird neu gebaut, darum muss der aktive Status-Chip von Hand
  // nachgezogen werden.
  document.querySelectorAll('#rzFilter .fb').forEach(b=>{
    b.classList.toggle('a',b.getAttribute('data-st')===rzStatus);});
  if(!rows.length){el.innerHTML='<div class="tp-hint">Keine Treffer.</div>';return;}
  const MAX=400;
  const zeig=rows.slice(0,MAX);
  let h='<div class="tcx"><div class="thd"><h3>Verordnungen</h3><span class="cnt">'+rows.length+(rows.length>MAX?' · zeigt '+MAX:'')+'</span></div>'
    +'<table class="data-t"><thead><tr><th>Patient</th><th>Heilmittel</th><th>ICD / DG</th><th>Formular</th><th>Status</th>'
    +'<th class="r">Erbracht</th><th>Ausstellung</th><th>Letzter Termin</th><th>Nächster</th></tr></thead><tbody>';
  zeig.forEach(r=>{
    const voll=r.kann>0&&r.gel>=r.kann;
    const stB=r.status==='InBehandlung'?'b-teal':r.status==='Abgeschlossen'?'b-amber':'b-red';
    h+='<tr><td><div class="pn">'+esc(r.name)+'</div>'+(r.rgOffen?'<div class="th-sub" style="color:var(--amber)">Rechnung offen</div>':'')+'</td>'
      +'<td style="font-size:11px">'+esc(r.heilmittel||'—')+'</td>'
      +'<td style="font-size:11px">'+esc(r.icd||'—')+(r.dg?' <span style="color:var(--muted)">'+esc(r.dg)+'</span>':'')+'</td>'
      +'<td style="font-size:11px">'+esc(r.formular||'—')+'</td>'
      +'<td><span class="badge '+stB+'">'+esc(r.status||'—')+'</span></td>'
      +'<td class="r"><strong'+(voll?' style="color:var(--red)"':'')+'>'+r.gel+'</strong><span style="color:var(--muted);font-size:10px"> / '+r.kann+'</span></td>'
      +'<td style="font-size:11px">'+esc(r.ausst||'—')+'</td>'
      +'<td style="font-size:11px">'+esc(r.letzter||'—')+'</td>'
      +'<td style="font-size:11px">'+esc(r.naechster||'—')+'</td></tr>';
  });
  h+='</tbody></table>';
  if(rows.length>MAX)h+='<div style="font-size:11px;color:var(--muted);margin-top:10px">Es werden die '+MAX+' jüngsten Verordnungen angezeigt. Weiter eingrenzen über Suche oder Status.</div>';
  h+='</div>';
  el.innerHTML=h;
}

// TAB: VERLAUF
// ---------------------------------------------------------------------------
// Es gibt keine zusätzliche Datenquelle. Bei jedem Laden wird ein Schnappschuss
// der Kennzahlen berechnet und an eine Historie im localStorage angehängt —
// ein Eintrag je Tag, spätere Läufe überschreiben den Tag. Daraus wird eine
// SVG-Linie. Das heißt auch: die Historie hängt am Gerät. Wer sie behalten
// will, exportiert sie; der Import führt zwei Geräte wieder zusammen.
// ═══════════════════════════════════════════════════════════════════════════
const VL_METRIK=[
  {k:'fertig', l:'Fertig, nicht abgerechnet',c:'#BE3A30'},
  {k:'steck',  l:'Steckengeblieben',          c:'#8A5F13'},
  {k:'fvo',    l:'Folge-VO offen',            c:'#A4522F'},
  {k:'pot',    l:'Blanko-Potenzial',          c:'#5D5289'},
  {k:'dplan',  l:'Ohne festen Takt',          c:'#7A5AA8'},
  {k:'zz',     l:'Zuzahlung offen',           c:'#3D7A5D'}
];
function getKpiHistorie(){const h=lsGet('kimojo_kpihist',[]);return Array.isArray(h)?h:[];}
function saveKpiHistorie(h){lsSet('kimojo_kpihist',h);}
function computeKpiSnapshot(){
  const zahl=k=>(offenTV||[]).filter(o=>o.kat===k).length;
  let fvo=0,pot=0,dplan=0;
  LOCS.forEach(l=>{
    try{fvo+=buildFolgeVO(l.id).length;}catch(e){}
    const c=(RCS[l.id]&&RCS[l.id].heute)||{};pot+=(c.blankopot||[]).length;
    // Dauerplanfähig, aber noch ohne festen Takt — die Zahl, die der Reiter
    // Potential-Dauer oben trägt. Sinkt sie über die Wochen, wirkt die Arbeit.
    try{dplan+=buildDauerplan(l.id).filter(p=>!p.serie).length;}catch(e){}
  });
  return{date:isoDay(0),ts:Date.now(),
    fertig:zahl('fertig'),steck:zahl('steck'),rgOffen:zahl('rgOffen'),
    zz:zahl('zuzahlung')+zahl('zuzahlungLaufend'),
    zzSum:Math.round((offenTV||[]).reduce((s,o)=>s+(o.zz||0),0)),
    fvo,pot,dplan};
}
function recordKpiSnapshot(){
  try{
    const h=getKpiHistorie(),s=computeKpiSnapshot();
    const i=h.findIndex(x=>x.date===s.date);
    if(i>=0)h[i]=s;else h.push(s);
    h.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    saveKpiHistorie(h.slice(-400));
  }catch(e){console.warn('KPI-Snapshot:',e);}
}
function exportKpiHistorie(){
  const b=new Blob([JSON.stringify(getKpiHistorie(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='kimojo-verlauf-'+isoDay(0)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importKpiHistorie(input){
  const f=input&&input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const neu=JSON.parse(r.result);if(!Array.isArray(neu))throw new Error('Kein Array');
      const map={};getKpiHistorie().forEach(s=>{map[s.date]=s;});
      // Bei gleichem Tag gewinnt der jüngere Schnappschuss.
      neu.forEach(s=>{if(s&&s.date&&(!map[s.date]||(s.ts||0)>(map[s.date].ts||0)))map[s.date]=s;});
      saveKpiHistorie(Object.values(map).sort((a,b)=>String(a.date).localeCompare(String(b.date))));
      renderVerlauf();
    }catch(e){alert('Import fehlgeschlagen: '+e.message);}
  };
  r.readAsText(f);
}
function clearKpiHistorie(){
  if(!confirm('Die gesamte Verlaufshistorie dieses Geräts löschen?'))return;
  saveKpiHistorie([]);renderVerlauf();
}

function vlChart(hist,metriken){
  const W=760,H=210,padL=42,padR=14,padT=16,padB=40;
  const n=hist.length;
  let max=1;
  metriken.forEach(m=>hist.forEach(s=>{const v=s[m.k]||0;if(v>max)max=v;}));
  const x=i=>padL+(W-padL-padR)*(n<=1?0:i/(n-1));
  const y=v=>padT+(H-padT-padB)*(1-(v/max));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px" preserveAspectRatio="none">';
  for(let g=0;g<=4;g++){
    const v=max*g/4;
    s+='<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="#E7E7EA" stroke-width="1"/>'
      +'<text x="'+(padL-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#777" font-family="Inter">'+Math.round(v)+'</text>';
  }
  metriken.forEach(m=>{
    const pts=hist.map((sn,i)=>x(i).toFixed(1)+','+y(sn[m.k]||0).toFixed(1)).join(' ');
    s+='<polyline points="'+pts+'" fill="none" stroke="'+m.c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    hist.forEach((sn,i)=>{s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(sn[m.k]||0).toFixed(1)+'" r="3" fill="'+m.c+'"/>';});
  });
  const step=Math.max(1,Math.ceil(n/8));
  hist.forEach((sn,i)=>{
    if(i%step)return;
    const d=new Date(sn.date+'T12:00:00');if(isNaN(d))return;
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="10" fill="#777" font-family="Inter">'
      +d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+'</text>';
  });
  return s+'</svg>';
}

// ═══════════════════════════════════════════════════════════════════════════
// VIEW: TELEFONIE — Erreichbarkeit aus der Webex-Anlage
// ---------------------------------------------------------------------------
// Quelle sind die Monatsdateien telefonie-legs-JJJJ-MM.json, geschrieben vom
// Webex-Flow. Sie enthalten die einzelnen Call Legs — zehn Felder je Leg, keine
// einzige Rufnummer. Die gesamte Auswertung passiert HIER, nicht im Flow.
//
// WARUM ROHDATEN UND KEINE FERTIGEN TAGESSUMMEN (Änderung vom 21.08.2026):
// Eine im Flow vorberechnete Quote friert die Zählregel für immer ein. Am
// 20.08.2026 stellte sich die Regel für „angenommen" als falsch heraus — sie
// maß die Ansage der Warteschlange und lieferte 100 % statt 65 %. Mit
// vorberechneten Zahlen wäre die Historie vor der Korrektur dauerhaft falsch
// geblieben und die Zeitreihe hätte an dem Tag einen Knick bekommen. Aus
// Roh-Legs rechnet sich jede Regeländerung rückwirkend über alles durch.
// Derselbe Grund gilt für Fragen, die heute niemand stellt: Wartezeiten,
// Stundenverteilung und Ferienvergleiche stecken bereits in den Daten.
//
// WARUM EIN TRICHTER UND KEINE VIER SPALTEN:
// Ein Anruf durchläuft bei euch ZWEI Stufen, und er kann auf beiden verloren
// gehen. Erst das Auto Attendant:
//   1  Termin vereinbaren  → Warteschlange
//   2  Termin absagen      → Mailbox (SO GEWOLLT, kein verpasster Anruf)
//   3  Weitere Fragen      → Warteschlange
//   nichts gedrückt        → nach Zeitablauf ebenfalls Warteschlange
//   aufgelegt              → verloren, ohne dass es je geklingelt hat
// Dann die Warteschlange: angenommen, auf die Mailbox übergelaufen, oder der
// Anrufer legt auf. Eine einzige Quote kann das nicht abbilden — deshalb zwei:
//   Annahmequote    = wsAngenommen / ws            (schafft die Person das?)
//   Durchkommquote  = (wsAngenommen+direkt)/(anrufe-absageMailbox)
//                                                  (erlebt der Anrufer es?)
// Im Nenner der Durchkommquote stehen bewusst NICHT alle Anrufe: wer „Termin
// absagen" drückt, will keinen Menschen sprechen und ist auf der Mailbox
// planmäßig bedient. Zählte man ihn mit, sänke die Quote, je öfter der
// Absageweg genutzt wird — genau verkehrt herum.
//
// DIE WICHTIGSTE REGEL steckt in telAusLegs(): "angenommen" heißt, ein APPARAT
// hat abgehoben (User/Place/VirtualLine), nicht die Warteschlange.
// Die Warteschlange nimmt jeden Anruf sofort an, um die Ansage zu spielen. Wer
// auf ihrem Leg misst, misst Wartemusik und bekommt immer 100 %. Am 20.08.2026
// war der Unterschied 100 % gegen 65 % an denselben Daten — aufgedeckt durch
// die Warteschlangen-Statistik in Control Hub. Details in
// WEBEX-API-BEFUNDE.md §6b.
//
// Die Dateien liegen bewusst NICHT unter BASE, sondern unter einem festen Pfad:
// Werneck und Kitzingen laden aus verschiedenen Ordnern, sollen aber dieselben
// Telefonzahlen sehen. Eine Ablage, zwei Dashboards.
//
// Der Standort kommt aus der gewählten Rufnummer, nicht aus der Webex-Location:
// beide Praxen hängen an "Hauptstandort". Der Flow übersetzt die Nummer in
// 'WER' oder 'KIT' und wirft sie danach weg — hier kommt nur das Kürzel an.
// ═══════════════════════════════════════════════════════════════════════════
// Monatsdateien: eine je Kalendermonat, damit der Flow nie eine wachsende Datei
// lesen und neu schreiben muss und der Browser nicht Jahre auf einmal lädt.
const TEL_LEGS_DIR='/12_Code/Patientenchecker/Dateien Export/';
// So viele Monate holt der Seitenaufruf sofort. Alles Ältere lädt telSicherstellen()
// erst nach, wenn jemand wirklich dorthin blättert — sonst wächst die Ladezeit
// mit jedem Jahr Historie, obwohl fast niemand so weit zurückschaut.
const TEL_MONATE=4;
// Schwellen für die Ampel. Bewusst nicht 90/80 wie im ersten Entwurf: Der erste
// echte Messtag lag bei 65 %. Bei 90/80 wäre alles dauerhaft rot und die Farbe
// damit wertlos. 85/70 lässt Verbesserung sichtbar werden und hält den heutigen
// Zustand trotzdem dort, wo er hingehört — im roten Bereich.
const TEL_GUT=85,TEL_MITTEL=70;
const TEL_C_AN='#3D7A5D',      // von einem Menschen angenommen
      TEL_C_DIR='#6FA189',     // direkt angenommen, ohne Warteschlange
      TEL_C_VM='#D98077',      // in der Warteschlange auf die Mailbox gelaufen
      TEL_C_WEG='#BE3A30',     // in der Warteschlange aufgelegt
      TEL_C_ABS='#9CB3C9',     // Absage-Mailbox — gewollt, kein Verlust
      TEL_C_MENU='#E0B25C';    // im Menü aufgelegt
function telFarbe(q){return q==null?'var(--muted)':(q>=TEL_GUT?'var(--green)':(q>=TEL_MITTEL?'var(--amber)':'var(--fire)'));}

// ── Roh-Legs → Tageszeilen ─────────────────────────────────────────────────
// Feldkürzel in den Monatsdateien, absichtlich kurz gehalten:
//   c   Correlation ID — klammert alle Legs EINES Gesprächs zusammen
//   t   Startzeit in deutscher Ortszeit, 'JJJJ-MM-TTTHH:MM:SS'
//   dir ORIGINATING (raus) | TERMINATING (rein)
//   u   User type        a  Answer indicator     k  gedrückte Menütaste
//   r   Klingeldauer     d  Gesprächsdauer       ct Call type
//   s   'WER' | 'KIT' | ''   — aus der Praxisnummer, die Nummer selbst fehlt
//
// Ein Gespräch besteht im Schnitt aus gut drei Legs: Sprachmenü, Warteschlange,
// und je ein Leg pro Apparat, der geklingelt hat. Wer Legs zählt statt
// Gespräche, verdreifacht sein Anrufaufkommen.
// Ortszeit-Datum als 'JJJJ-MM-TT'. Bewusst NICHT toISOString(): das rechnet nach
// UTC um und macht aus einem deutschen Abend den Vortag.
function telIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function telHeuteStr(){return telIso(new Date());}
function telMonat(ds){return String(ds||'').slice(0,7);}

// Die letzten n Monatskürzel, jüngster zuerst.
function telLetzteMonate(n){
  const out=[],d=new Date();d.setDate(1);
  for(let i=0;i<n;i++){out.push(telMonat(telIso(d)));d.setMonth(d.getMonth()-1);}
  return out;
}
// Alle Monate, die ein Zeitfenster berührt. Über den Ersten des Monats iterieren,
// sonst überspringt ein 31. den Februar.
function telMonateZwischen(von,bis){
  const out=[],d=new Date(von+'T12:00:00'),e=new Date(bis+'T12:00:00');
  if(isNaN(d)||isNaN(e)||d>e)return out;
  d.setDate(1);
  while(telIso(d)<=telIso(e)&&out.length<48){out.push(telMonat(telIso(d)));d.setMonth(d.getMonth()+1);}
  return out;
}

// Kennung eines Legs — dieselbe Kombination, mit der csv-zu-legs.py entdoppelt.
// Die Correlation ID allein reicht nicht: ein Anruf besteht aus mehreren Legs,
// die sich alle dieselbe ID teilen.
function telLegKey(l){
  return [l.c,l.t,l.dir,l.u,l.ct,l.d,l.r].join('|');
}

// Den Ordner einmal je Sitzung auflisten. Ohne Auflistung müsste der Loader
// Dateinamen raten — bei Tagesdateien wären das 31 Anfragen je Monat, von denen
// die meisten ins Leere gingen. Eine Auflistung kostet eine Anfrage und macht
// den Loader nebenbei unabhängig davon, wie die Dateien gerade heißen.
let telOrdnerCache=null;
async function telOrdner(){
  if(telOrdnerCache)return telOrdnerCache;
  const p=TEL_LEGS_DIR.split('/').filter(s=>s).map(s=>encodeURIComponent(s)).join('/');
  try{
    let url='https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+p+':/children?$select=name&$top=200';
    const namen=[];
    while(url){
      const r=await fetch(url,{headers:{Authorization:'Bearer '+window._token}});
      if(!r.ok)return null;
      const j=await r.json();
      (j.value||[]).forEach(x=>{if(x&&x.name)namen.push(x.name);});
      url=j['@odata.nextLink']||null;
    }
    telOrdnerCache=namen;
    return namen;
  }catch(_){return null;}
}

// Nicht alles auf einmal anfragen: Bei einem Jahr Tagesdateien wären das
// mehrere hundert gleichzeitige Anfragen, was der Browser ohnehin drosselt und
// Graph mit 429 quittiert.
async function telHole(namen){
  const aus=[];
  for(let i=0;i<namen.length;i+=8){
    const teil=await Promise.all(namen.slice(i,i+8)
      .map(n=>loadJSONAbs(TEL_LEGS_DIR+n).catch(()=>null)));
    teil.forEach(t=>{if(Array.isArray(t))aus.push(t);});
  }
  return aus;
}

// Fehlende Monatsdateien holen und die Auswertung neu rechnen. Fehlende Dateien
// sind kein Fehler — vor dem ersten Flow-Lauf und am Monatsanfang der Normalfall.
//
// Geladen wird ALLES, was zum Monat gehört:
//   telefonie-legs-JJJJ-MM.json           — die alte Flow-Datei. Sie wurde bei
//                                            jedem Lauf komplett neu mit nur dem
//                                            heutigen Tag beschrieben.
//   telefonie-legs-JJJJ-MM-TT.json        — die neue Flow-Datei: eine je Tag.
//                                            Nichts wird mehr überschrieben.
//   telefonie-legs-JJJJ-MM-historie.json  — schreibt csv-zu-legs.py aus dem
//                                            Control-Hub-Bericht. Den Namen fasst
//                                            der Flow nie an.
//   …auch OneDrive-Konfliktkopien. Ein Leg ist ein Ereignis, das stattgefunden
//   hat, kein änderbarer Datensatz — eine alte Kopie kann nichts verfälschen,
//   nur etwas zurückbringen, das der Flow überschrieben hatte. Genau das ist
//   hier schon zweimal passiert.
// Alles wird zusammengelegt und über telLegKey entdoppelt, damit ein Tag, der in
// mehreren Dateien steht, nur einmal zählt.
async function telLadeMonate(monate){
  const neu=[...new Set(monate)].filter(m=>/^\d{4}-\d{2}$/.test(m)&&!telGeladen[m]);
  if(!neu.length)return false;
  const alle=await telOrdner();
  const namen=[];
  neu.forEach(m=>{
    const pre='telefonie-legs-'+m;
    if(alle){
      alle.forEach(n=>{
        if(n.slice(0,pre.length)!==pre)return;
        const rest=n.slice(pre.length);
        if(!/\.json$/i.test(rest))return;
        // Nach dem Monat darf nur '.json' oder '-…' folgen, sonst würde
        // 'telefonie-legs-2026-081.json' als August durchgehen.
        if(rest.toLowerCase()!=='.json'&&rest[0]!=='-')return;
        namen.push(n);
      });
    }else{
      // Auflistung nicht möglich (fehlende Berechtigung, Netz weg): auf die
      // beiden festen Namen zurückfallen, damit das Dashboard nicht leer bleibt.
      namen.push(pre+'.json',pre+'-historie.json');
    }
    // Läuft der Flow nach Mitternacht, trägt die Datei schon das neue Datum,
    // enthält aber noch die Anrufe des Vorabends. Am Monatsersten liegt der
    // 31. daher in einer Datei des Folgemonats. Deshalb die ersten beiden Tage
    // des Folgemonats mitlesen — zwei Anfragen, die eine Lücke pro Monat
    // schließen. Entdoppelt wird ohnehin, und telAusLegs sortiert nach dem
    // Zeitstempel des Legs, nicht nach dem Dateinamen.
    const [jj,mo]=m.split('-').map(Number);
    const f=new Date(Date.UTC(jj,mo,1));
    const fp='telefonie-legs-'+f.getUTCFullYear()+'-'+String(f.getUTCMonth()+1).padStart(2,'0');
    [fp+'-01.json',fp+'-02.json'].forEach(n=>{
      if(alle&&alle.indexOf(n)<0)return;   // gibt es nicht, gar nicht erst anfragen
      if(namen.indexOf(n)<0)namen.push(n);
    });
  });
  const teile=await telHole(namen);
  neu.forEach(m=>{telGeladen[m]=true;});
  const bekannt=new Set(telLegs.map(telLegKey));
  const dazu=[];
  [].concat(...teile.filter(Array.isArray)).forEach(l=>{
    const k=telLegKey(l);
    if(bekannt.has(k))return;
    bekannt.add(k);dazu.push(l);
  });
  if(dazu.length)telLegs=telLegs.concat(dazu);
  telData=telLegs.length?telAusLegs(telLegs):null;
  return true;
}
// Vor dem Zeichnen aufrufen: blättert der Nutzer in einen Monat, der noch nicht
// im Speicher liegt, wird er nachgeladen und danach einmal neu gezeichnet.
function telSicherstellen(von,bis){
  if(telLaedt)return;
  const fehlend=telMonateZwischen(von,bis).filter(m=>!telGeladen[m]);
  if(!fehlend.length)return;
  telLaedt=true;
  telLadeMonate(fehlend)
    .then(()=>{telLaedt=false;renderTelefonie();})
    .catch(e=>{telLaedt=false;console.warn('Telefonie nachladen:',e);});
}
// Die vier Rollen, die ein Leg spielen kann. Reihenfolge der Prüfung zählt:
// ein Mailbox-Leg trägt manchmal zusätzlich eine Gruppenkennung, deshalb wird
// VoiceMail zuerst geprüft und in telIstQueue ausdrücklich ausgeschlossen.
const telIstVM      = u => /voicemail/i.test(String(u||''));
const telIstQueue   = u => !telIstVM(u) && /callcenter|huntgroup/i.test(String(u||''));
const telIstApparat = u => /^(user|place|virtualline)$/i.test(String(u||'').trim());
const telAngenommen = a => /^yes/i.test(String(a||''));

// Ein Menüabbruch ist kein einheitliches Ding. Über drei Monate haben ALLE 402
// Fälle genau ein Leg — die Ansage —, nie eine Warteschlange, nie einen Apparat.
// Was sie unterscheidet, ist einzig, wie lange zugehört wurde, und daran hängt
// eine völlig andere Bedeutung:
//
//   bis 3 s   Fehlwahl. Verwählt, sofort aufgelegt. Kein verlorener Patient.
//   4-19 s    während der Ansage aufgelegt. Ungeduld oder doch die falsche Nummer.
//   ab 20 s   die Ansage läuft rund 23 Sekunden. Wer so lange bleibt und dann
//             auflegt, hat sie zu Ende gehört und wusste nicht, was drücken.
//             Das ist die einzige Gruppe, an der sich überhaupt etwas ändern lässt.
//
// Die Grenzen stehen hier und nicht im Rendern, damit Trichter, Export und
// Stundenkurve nicht auseinanderlaufen können.
const TEL_MENU_FEHL = 3;
const TEL_MENU_GANZ = 20;

// Ab wann die Anlage auf Feierabend schaltet. Das ist keine Annahme, sondern
// steht in den Daten: um 16 Uhr laufen 96 Anrufe auf die Mailbox und 70 werden
// angenommen, um 17 Uhr sind es NULL Mailbox und ein einziger angenommener —
// dafür 62 Menüabbrüche. Ab 17 Uhr existiert die Warteschlange schlicht nicht
// mehr, es bleibt die Absage-Taste. Vor 7 Uhr entsprechend.
const TEL_OFFEN_VON = 7;
const TEL_OFFEN_BIS = 17;   // exklusiv: 16:59 ist offen, 17:00 nicht mehr

function telAusLegs(legs){
  const zeilen={};
  // Das Feld heißt "tag", nicht "datum". telRoh(), telTagRows() und telWochenRows()
  // lesen alle t.tag; ein "datum" hier ergibt eine stumm leere Reihe — die
  // Standort-Leiste erscheint (die liest t.standort), das Diagramm bleibt leer.
  const zeile=(tag,ort)=>{
    const k=tag+'|'+ort;
    return zeilen[k]||(zeilen[k]={standort:ort,tag,anrufe:0,ws:0,wsAngenommen:0,
      wsMailbox:0,wsAufgelegt:0,absageMailbox:0,direkt:0,menuAbbruch:0,
      menuFehl:0,menuAnsage:0,menuGanz:0,
      taste1:0,taste2:0,taste3:0,ohneAuswahl:0,ausgehend:0,
      wsOhneKlingeln:0,serieOhne:0,ohneZeiten:[],
      maxWartesek:0,_wSum:0,_wN:0,_dSum:0,_dN:0,_q:[],_std:{}});
  };
  const std=(z,h)=>z._std[h]||(z._std[h]={h,anrufe:0,ws:0,wsAn:0,wsVm:0,wsWeg:0,
      wsOhne:0,absage:0,direkt:0,menu:0,mF:0,mA:0,mG:0});
  // Leer statt "unbekannt": telStandorte() überspringt leere Werte, damit für
  // nicht zuordenbare Zeilen kein Geister-Reiter neben Werneck und Kitzingen
  // auftaucht. Unter "Alle Standorte" zählen sie trotzdem mit.
  const ortVon=k=>k==='KIT'?'Kitzingen':(k==='WER'?'Werneck':'');

  // ── eingehend: nach Correlation ID gruppieren ──
  const grp={};
  legs.forEach(l=>{if(l&&l.dir==='TERMINATING'&&l.c&&l.t)(grp[l.c]=grp[l.c]||[]).push(l);});

  Object.keys(grp).forEach(id=>{
    const g=grp[id].slice().sort((a,b)=>String(a.t).localeCompare(String(b.t)));
    // NUR echte Anrufe von außen. Ein Gespräch zwischen zwei Kolleginnen
    // erzeugt ebenfalls ein TERMINATING-Leg und würde sonst als eingehender
    // Anruf gezählt — und, weil keine Warteschlange beteiligt ist, auch noch
    // als "direkt angenommen". Der Eintritt von außen trägt immer genau ein
    // Leg mit SIP_INBOUND; alles Weitere läuft als SIP_ENTERPRISE.
    if(!g.some(l=>l.ct==='SIP_INBOUND'))return;
    const erst=g[0];
    // Der Standort steht nur auf den Legs, die von außen kommen — interne Legs
    // tragen eine Nebenstelle. Deshalb das erste Leg MIT Kürzel, nicht das
    // erste Leg überhaupt.
    const z=zeile(erst.t.slice(0,10),ortVon((g.find(l=>l.s==='WER'||l.s==='KIT')||{}).s));
    const x=std(z,Number(erst.t.slice(11,13)));

    const inQ=g.some(l=>telIstQueue(l.u));
    const ann=g.find(l=>telIstApparat(l.u)&&telAngenommen(l.a));
    const vm =g.some(l=>telIstVM(l.u));
    // Hat überhaupt ein Apparat GEKLINGELT — unabhängig davon, ob jemand
    // abgenommen hat. Das ist eine andere Frage als "angenommen": ein Anruf,
    // bei dem es klingelte und niemand ranging, ist Auslastung. Ein Anruf, bei
    // dem nie etwas klingelte, ist ein Loch in der Warteschlange.
    const klingelte=g.some(l=>telIstApparat(l.u));

    z.anrufe++;x.anrufe++;
    if(inQ){
      z.ws++;x.ws++;
      z._q.push({t:erst.t,k:klingelte});
      if(!klingelte){z.wsOhneKlingeln++;x.wsOhne++;}
    }
    // Prüfreihenfolge: erst ob ein Mensch dran war, dann die Mailbox, dann der
    // Rest. Andersherum würde ein Anrufer, der erst auf die Mailbox lief und
