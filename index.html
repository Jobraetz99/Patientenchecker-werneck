    // dann doch jemanden bekam, als verloren gezählt.
    if(ann){        if(inQ){z.wsAngenommen++;x.wsAn++;}  else {z.direkt++;x.direkt++;} }
    else if(vm){    if(inQ){z.wsMailbox++;x.wsVm++;}     else {z.absageMailbox++;x.absage++;} }
    else if(inQ){   z.wsAufgelegt++;x.wsWeg++; }
    else {
      z.menuAbbruch++;x.menu++;
      // Die Dauer des längsten Legs, nicht des ersten. In der Praxis ist es hier
      // immer dasselbe eine Leg; die Maximum-Bildung kostet nichts und hält den
      // Fall offen, dass ein Menüabbruch doch einmal zwei Legs trägt.
      const sek=Math.max(0,...g.map(l=>Number(l.d)||0));
      if(sek<=TEL_MENU_FEHL){       z.menuFehl++;  x.mF++; }
      else if(sek<TEL_MENU_GANZ){   z.menuAnsage++;x.mA++; }
      else {                        z.menuGanz++;  x.mG++; }
    }

    // 'NA' auf einem Leg heißt "für dieses Leg nicht zutreffend", nicht "nichts
    // gedrückt" — deshalb exakter Vergleich statt contains.
    const k=(g.find(l=>l.k==='1'||l.k==='2'||l.k==='3'||l.k==='No Selection')||{}).k;
    if(k==='1')z.taste1++;else if(k==='2')z.taste2++;
    else if(k==='3')z.taste3++;else if(k==='No Selection')z.ohneAuswahl++;

    // Wartezeit = vom ersten Leg des Gesprächs bis zum Abheben. Das ist der
    // Abstand zum annehmenden Leg plus dessen Klingeldauer — also inklusive
    // Ansage und Warteschleife, so wie der Anrufer es erlebt.
    if(ann&&ann.t){
      const w=Math.round((new Date(ann.t).getTime()-new Date(erst.t).getTime())/1000)+(Number(ann.r)||0);
      if(isFinite(w)&&w>=0){z._wSum+=w;z._wN++;if(w>z.maxWartesek)z.maxWartesek=w;}
      // Gesprächsdauer = Dauer des annehmenden Legs, also die reine Sprechzeit
      // am Apparat. Nicht die Dauer des Eintritts-Legs: die enthält Ansage und
      // Warteschleife und wäre damit keine Gesprächsdauer, sondern die
      // Gesamtdauer des Anrufs. Gezählt wird nur über angenommene Gespräche —
      // ein Anruf, bei dem niemand ranging, hat keine Gesprächsdauer.
      const dd=Number(ann.d);
      if(isFinite(dd)&&dd>=0){z._dSum+=dd;z._dN++;}
    }
  });

  // ── ausgehend: nur echte Telefonate nach außen ──
  // SIP_ENTERPRISE bleibt draußen, das sind interne Legs. Je Correlation ID
  // einmal, sonst zählt jeder Wählversuch mehrfach.
  const gesehen={};
  legs.forEach(l=>{
    if(!l||l.dir!=='ORIGINATING'||!l.t||!l.c)return;
    if(l.ct!=='SIP_NATIONAL'&&l.ct!=='SIP_MOBILE')return;
    if(gesehen[l.c])return;gesehen[l.c]=1;
    zeile(l.t.slice(0,10),ortVon(l.s)).ausgehend++;
  });

  const tage=Object.keys(zeilen).sort().map(k=>{
    const z=zeilen[k];
    z.stunden=Object.keys(z._std).map(h=>z._std[h]).sort((a,b)=>a.h-b.h);
    z.avgWartesek=z._wN?Math.round(z._wSum/z._wN):null;
    z.avgDauersek=z._dN?Math.round(z._dSum/z._dN):null;
    // Die längste ununterbrochene Serie von Anrufen, bei denen nichts klingelte.
    // Die Serie trennt die beiden Ursachen: einzelne Lücken sind Auslastung —
    // alle waren gerade im Gespräch. Eine lange Serie heißt, dass die
    // Warteschlange gar keinen Apparat mehr kannte. Deshalb wird sie mitgezählt
    // und nicht bloß die Summe; eine Summe verwischt genau diesen Unterschied.
    z._q.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
    let lauf=0;
    z._q.forEach(q=>{
      if(q.k){lauf=0;return;}
      lauf++;
      if(lauf>z.serieOhne)z.serieOhne=lauf;
      if(z.ohneZeiten.length<60)z.ohneZeiten.push(String(q.t).slice(11,16));
    });
    delete z._q;
    delete z._std;delete z._wSum;delete z._wN;delete z._dSum;delete z._dN;
    return z;
  });
  // Der jüngste Zeitstempel IN DEN DATEN. Nicht zu verwechseln mit "stand",
  // das nur sagt, wann der Browser die Datei gelesen hat — und damit auch dann
  // taufrisch aussieht, wenn er eine Stunden alte Kopie aus dem Cache gelesen
  // hat. Genau dieser Unterschied hat einen halben Vormittag gekostet.
  let neueste='';
  legs.forEach(l=>{const t=String((l&&l.t)||'');if(t>neueste)neueste=t;});
  return {stand:new Date().toISOString(),neueste,tage};
}

// Kalenderwoche nach ISO 8601 für ein beliebiges Datum. getCurrentKW() weiter
// oben kann nur "heute" — hier braucht es die Woche zu jedem Tagespunkt.
function telKW(ds){
  const d=new Date(ds+'T12:00:00');if(isNaN(d))return null;
  const t=new Date(d.getTime());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));       // Donnerstag der Woche
  const w1=new Date(t.getFullYear(),0,4);
  const kw=1+Math.round(((t.getTime()-w1.getTime())/864e5-3+((w1.getDay()+6)%7))/7);
  return {jahr:t.getFullYear(),kw,key:t.getFullYear()+'-KW'+String(kw).padStart(2,'0')};
}
function telStandorte(){
  const s=new Set();((telData&&telData.tage)||[]).forEach(t=>{if(t&&t.standort)s.add(String(t.standort));});
  return [...s].sort();
}
// Rohe Tagespunkte des gewählten Standort-Filters — ungefiltert nach Zeitraum.
// Zeitfenster-Filter: 'alle' | 'offen' | 'zu'.
let telZeit='alle';

// Die Standort-gefilterten Rohzeilen, IMMER über den ganzen Tag. Alles, was sich
// kein Zeitfenster aufzwingen lassen darf, holt sich die Zeilen hier — allen
// voran die Warnung über übergebene Anrufe. Eine Warnung, die ein Filter
// verschwinden lässt, ist schlimmer als gar keine.
function telRohAlle(){
  const alle=(telData&&Array.isArray(telData.tage))?telData.tage:[];
  return telLoc==='alle'?alle:alle.filter(t=>String((t&&t.standort)||'')===telLoc);
}

// Eine Tageszeile auf die Stunden im gewählten Fenster eindampfen. Gebaut wird
// eine NEUE Zeile im neuen Feldformat, damit telZerlege() sie ohne Sonderfall
// liest. Bewusst NICHT übernommen werden Tastendrücke, Warte- und Sprechzeiten:
// die stehen nur je Tag in der Datei, nicht je Stunde. Sie hier vom ganzen Tag
// zu übernehmen hieße, eine Zahl aus 08:00 Uhr unter "nach Feierabend" zu
// schreiben. Lieber fehlt die Angabe, als dass sie falsch dasteht.
function telAufZeitfenster(t){
  const st=Array.isArray(t&&t.stunden)?t.stunden:[];
  if(!st.length)return null;
  const offen=h=>h>=TEL_OFFEN_VON&&h<TEL_OFFEN_BIS;
  const drin =h=>telZeit==='offen'?offen(h):!offen(h);
  const o={standort:t.standort,tag:t.tag,anrufe:0,ws:0,wsAngenommen:0,wsMailbox:0,
           wsAufgelegt:0,absageMailbox:0,direkt:0,menuAbbruch:0,
           menuFehl:0,menuAnsage:0,menuGanz:0,wsOhneKlingeln:0,stunden:[]};
  st.forEach(s=>{
    const hh=Number(s&&s.h);
    if(!(hh>=0&&hh<=23)||!drin(hh))return;
    const z=telZerlegeStunde(s);
    o.anrufe+=z.anrufe;      o.ws+=z.ws;              o.wsAngenommen+=z.wsAn;
    o.wsMailbox+=z.wsVm;     o.wsAufgelegt+=z.wsWeg;  o.absageMailbox+=z.absage;
    o.direkt+=z.direkt;      o.menuAbbruch+=z.menu;   o.wsOhneKlingeln+=z.blind;
    o.menuFehl+=z.menuFehl;  o.menuAnsage+=z.menuAnsage; o.menuGanz+=z.menuGanz;
    o.stunden.push(s);
  });
  return o.anrufe?o:null;
}

function telRoh(){
  const r=telRohAlle();
  if(telZeit==='alle')return r;
  return r.map(telAufZeitfenster).filter(Boolean);
}

// Eine Roh-Zeile in die Trichter-Felder zerlegen.
//
// Zwei Formate müssen durch dieselbe Tür: das neue (ws/wsAngenommen/…) und das
// alte Vier-Kategorien-Format (eingehend/angenommen/verpasst/absage), falls in
// der Datei noch Zeilen aus einem früheren Flow-Lauf stehen. Die Umrechnung
// steht hier an EINER Stelle statt über den Block verstreut.
function telZerlege(t){
  const n=v=>Number(v)||0;
  const hatNeu=(t.ws!=null||t.wsAngenommen!=null);
  let ws,wsAn,wsVm,wsWeg,absage,direkt,menu,anrufe;

  if(hatNeu){
    ws=n(t.ws);wsAn=n(t.wsAngenommen);wsVm=n(t.wsMailbox);
    wsWeg=t.wsAufgelegt!=null?n(t.wsAufgelegt):Math.max(0,ws-wsAn-wsVm);
    if(!ws)ws=wsAn+wsVm+wsWeg;                       // ws fehlt → aus den Teilen
    absage=n(t.absageMailbox);direkt=n(t.direkt);menu=n(t.menuAbbruch);
    anrufe=t.anrufe!=null?n(t.anrufe):ws+absage+direkt+menu;
  }else{
    // Altes Format. "verpasst" hieß dort alles, was in der Warteschlange nicht
    // angenommen wurde — ob Mailbox-Überlauf oder Auflegen, war nicht getrennt.
    // Es landet komplett auf wsAufgelegt, wsMailbox bleibt 0. Die Annahmequote
    // stimmt dann; die Aufteilung darunter ist gröber. Das ist ehrlicher, als
    // eine Aufteilung zu erfinden, die in den Daten nicht steht.
    wsAn=n(t.angenommen);absage=n(t.absage);menu=n(t.abbruchMenue);direkt=0;wsVm=0;
    const einRoh=t.eingehend!=null?n(t.eingehend):null;
    if(t.verpasst!=null)wsWeg=n(t.verpasst);
    else if(einRoh!=null)wsWeg=Math.max(0,einRoh-wsAn-absage-menu);
    else wsWeg=0;
    ws=wsAn+wsWeg;
    anrufe=einRoh!=null?einRoh:ws+absage+menu;
  }

  // "blind" = Anruf war in der Warteschlange, es hat aber kein Apparat geklingelt.
  // Steht das Feld nicht in der Zeile, ist die Zeile aus einem alten Flow-Lauf
  // und die Frage ist für sie schlicht nicht beantwortbar. Dann 0 — geschätzt
  // wird hier nichts, sonst schlüge die Warnung auf erfundenen Zahlen an.
  // Die drei Menü-Untergruppen gibt es nur im neuen Format. Fehlen sie, wird
  // NICHTS geschätzt: menuFehl/menuAnsage/menuGanz bleiben 0 und die Anzeige
  // zeigt für solche Tage die Aufschlüsselung gar nicht erst an, statt eine
  // Verteilung zu erfinden, die in der Datei nicht steht.
  const mF=n(t.menuFehl),mA=n(t.menuAnsage),mG=n(t.menuGanz);
  return {anrufe,ws,wsAn,wsVm,wsWeg,absage,direkt,menu,blind:n(t.wsOhneKlingeln),
          menuFehl:mF,menuAnsage:mA,menuGanz:mG,hatMenuDetail:(mF+mA+mG)>0,
          t1:n(t.taste1),t2:n(t.taste2),t3:n(t.taste3),ohne:n(t.ohneAuswahl),
          hatTasten:(t.taste1!=null||t.taste3!=null)};
}

// Dieselbe Zerlegung für eine Stundenzeile. Kurze Schlüssel, weil die Datei
// sonst unnötig groß wird — 24 Stunden mal zwei Standorte mal 400 Tage.
function telZerlegeStunde(s){
  const n=v=>Number(v)||0;
  if(s.ws!=null||s.wsAn!=null){
    const wsR=n(s.ws),wsAn=n(s.wsAn),wsVm=n(s.wsVm);
    const wsWeg=s.wsWeg!=null?n(s.wsWeg):Math.max(0,wsR-wsAn-wsVm);
    const absage=n(s.absage),direkt=n(s.direkt),menu=n(s.menu!=null?s.menu:s.abbruch);
    const ws=wsR||wsAn+wsVm+wsWeg;
    return {anrufe:s.anrufe!=null?n(s.anrufe):ws+absage+direkt+menu,
            ws,wsAn,wsVm,wsWeg,absage,direkt,menu,blind:n(s.wsOhne),
            menuFehl:n(s.mF),menuAnsage:n(s.mA),menuGanz:n(s.mG)};
  }
  // altes Stundenformat: ein/an/verp/absage/abbruch
  const wsAn=n(s.an),absage=n(s.absage),menu=n(s.abbruch);
  const einRoh=s.ein!=null?n(s.ein):null;
  let wsWeg;
  if(s.verp!=null)wsWeg=n(s.verp);
  else if(einRoh!=null)wsWeg=Math.max(0,einRoh-wsAn-absage-menu);
  else wsWeg=0;
  const ws=wsAn+wsWeg;
  return {anrufe:einRoh!=null?einRoh:ws+absage+menu,ws,wsAn,wsVm:0,wsWeg,absage,direkt:0,menu,blind:0,
          menuFehl:0,menuAnsage:0,menuGanz:0};
}

const TEL_FELDER=['anrufe','ws','wsAn','wsVm','wsWeg','blind','absage','direkt','menu',
                  'menuFehl','menuAnsage','menuGanz','t1','t2','t3','ohne'];
const TEL_STD_FELDER=['anrufe','ws','wsAn','wsVm','wsWeg','blind','absage','direkt','menu',
                  'menuFehl','menuAnsage','menuGanz'];

// Ab wie vielen Anrufen ohne Klingeln HINTEREINANDER die Warnung von gelb auf
// rot springt. Drei, weil das über drei Monate an 12 % der Tage vorkommt und an
// 44 % mindestens ein einzelner — bei "ab eins rot" wäre die Warnung fast jeden
// zweiten Tag rot und damit nach einer Woche unsichtbar geworden.
const TEL_SERIE_ALARM=3;

// Die abgeleiteten Größen an einem Punkt nachziehen. Steht extra, weil sie an
// drei Stellen gebraucht werden und sonst dreimal leicht anders dastünden.
function telAbleiten(e){
  e.quote=e.ws?100*e.wsAn/e.ws:null;                    // Annahmequote der Warteschlange
  // Bezugsgröße der Durchkommquote sind NICHT alle Anrufer, sondern nur die, die
  // überhaupt jemanden sprechen wollten. Wer „Termin absagen" drückt, will keinen
  // Menschen — er will auf die Mailbox und bekommt genau das. Zählte man ihn in
  // den Nenner, sänke die Quote, je besser der Absageweg angenommen wird, und
  // zwei Praxen mit unterschiedlichem Absageanteil wären nicht vergleichbar.
  e.wollten=Math.max(0,e.anrufe-e.absage);
  e.durch=e.wollten?100*(e.wsAn+e.direkt)/e.wollten:null;
  e.verloren=e.wsVm+e.wsWeg+e.menu;                     // wollte jemanden, bekam niemanden
  // Die Menü-Aufschlüsselung wird NUR gezeigt, wenn die drei Teile den Menü-Wert
  // exakt ergeben. Bei gemischten Zeiträumen — ein paar Tage aus einem alten
  // Flow-Lauf ohne die Felder, der Rest neu — täte sie das nicht, und eine
  // Aufschlüsselung, die weniger ist als ihre Summe, führt in die Irre.
  e.hatMenuDetail=e.menu>0&&(e.menuFehl+e.menuAnsage+e.menuGanz)===e.menu;
  // Was Ihr Team beeinflussen konnte. Fehlwahlen sind es nicht: wer nach zwei
  // Sekunden auflegt, wollte nie jemanden sprechen. Sie bleiben in "anrufe" und
  // in "menu" stehen, damit nichts verschwindet — nur aus dieser Zahl heraus.
  e.echtVerloren=e.hatMenuDetail?e.verloren-e.menuFehl:e.verloren;
  e.wart=e.wN?e.wSum/e.wN:null;
  e.dauer=e.dN?e.dSum/e.dN:null;                        // mittlere Sprechzeit je Gespräch
  return e;
}
function telLeer(key,label){
  const e={key,label,aus:0,wSum:0,wN:0,wMax:0,dSum:0,dN:0,std:{},hatTasten:false};
  TEL_FELDER.forEach(k=>{e[k]=0;});
  return e;
}

// Ein Punkt aus mehreren Zeilen (Standorte, Tage einer Woche). Die Wartezeit
// wird nach Anrufmenge gewichtet — sonst zieht ein Standort mit drei Anrufen
// den Schnitt genauso stark wie einer mit dreihundert.
function telFasse(zeilen,key,label){
  const e=telLeer(key,label);
  zeilen.forEach(t=>{
    if(!t)return;
    const z=telZerlege(t);
    TEL_FELDER.forEach(k=>{e[k]+=z[k];});
    if(z.hatTasten)e.hatTasten=true;
    e.aus+=Number(t.ausgehend)||0;
    if(t.avgWartesek!=null&&z.ws>0){e.wSum+=(Number(t.avgWartesek)||0)*z.ws;e.wN+=z.ws;}
    // Die Gesprächsdauer wird nach der Zahl der Gespräche gewichtet, nicht nach
    // der Zahl der Anrufe — ein Tag mit zwei geführten Gesprächen darf den
    // Schnitt nicht so stark ziehen wie einer mit sechzig.
    if(t.avgDauersek!=null){const nG=z.wsAn+z.direkt;if(nG>0){e.dSum+=(Number(t.avgDauersek)||0)*nG;e.dN+=nG;}}
    if(t.maxWartesek!=null)e.wMax=Math.max(e.wMax,Number(t.maxWartesek)||0);
    (Array.isArray(t.stunden)?t.stunden:[]).forEach(s=>{
      const hh=Number(s&&s.h);if(!(hh>=0&&hh<=23))return;
      const z2=telZerlegeStunde(s);
      const x=e.std[hh]||(e.std[hh]={});
      TEL_STD_FELDER.forEach(k=>{x[k]=(x[k]||0)+z2[k];});
      e.std[hh]=x;
    });
  });
  return telAbleiten(e);
}
// Mehrere fertige Punkte zu einem zusammenziehen (Zeitraum-Summe).
function telSumme(punkte,key,label){
  const e=telLeer(key,label);
  punkte.forEach(d=>{
    TEL_FELDER.forEach(k=>{e[k]+=d[k]||0;});
    e.aus+=d.aus||0;e.wSum+=d.wSum||0;e.wN+=d.wN||0;
    e.dSum+=d.dSum||0;e.dN+=d.dN||0;
    e.wMax=Math.max(e.wMax,d.wMax||0);
    if(d.hatTasten)e.hatTasten=true;
    Object.entries(d.std||{}).forEach(([hh,v])=>{
      const x=e.std[hh]||(e.std[hh]={});
      TEL_STD_FELDER.forEach(k=>{x[k]=(x[k]||0)+(v[k]||0);});
      e.std[hh]=x;
    });
  });
  return telAbleiten(e);
}
// Wie weit weicht ein Teil vom Rest ab — gemessen in Standardfehlern, nicht in
// Prozentpunkten. Der Unterschied ist wichtig: 52 % gegen 56 % ist bei 200
// Anrufen Zufall und bei 2000 Anrufen ein Befund. Ohne diese Schranke erweckt
// jede Rangliste den Eindruck, der letzte Platz sei ein Problem — und man baut
// Dienstpläne auf Rauschen.
//
// Zwei Standardfehler sind die übliche Grenze. Darunter sagt der Block
// ausdrücklich "im Rauschen", statt die Zahl unkommentiert stehen zu lassen.
function telZWert(anTeil,nTeil,anRest,nRest){
  if(!nTeil||!nRest)return null;
  const p1=anTeil/nTeil,p2=anRest/nRest;
  const se=Math.sqrt(p1*(1-p1)/nTeil+p2*(1-p2)/nRest);
  return se>0?(p1-p2)/se:null;
}
const TEL_WOCHENTAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
// Mindestmenge, unter der eine Zeile gar nicht erst gezeigt wird. Eine Stunde
// mit drei Anrufen liefert eine Quote von 33 oder 67 % — beides bedeutungslos.
const TEL_MIN_MUSTER=20;
// Wie oft ein Wochentag im Zeitraum vorkommen muss, damit er als Muster zählt
// und nicht als einzelner Termin.
const TEL_MIN_WDH=3;

// Wiederkehrende Muster statt einzelner Termine. Ein schwacher Dienstag hat
// meist eine erklärbare Ursache — ein schwacher Dienstagnachmittag über zwölf
// Wochen ist eine Personalentscheidung.
//
// Beide Ranglisten messen dieselbe Größe wie die Kacheln oben: angenommene
// Anrufe ÷ Anrufe in der Warteschlange, aus den rohen Zählern gepoolt.
function telMusterBlock(fen,ges){
  const tage=telTagRows(fen[0],fen[1]);
  if(!tage.length||!ges.ws)return '';

  const zeile=(bez,zusatz,e)=>{
    const q=e.ws?100*e.wsAn/e.ws:null;
    const z=telZWert(e.wsAn,e.ws,ges.wsAn-e.wsAn,ges.ws-e.ws);
    const echt=z!=null&&Math.abs(z)>=2;
    return '<tr style="border-top:1px solid var(--border)">'
      +'<td style="padding:6px 0;font-weight:600">'+esc(bez)
        +(zusatz?'<span style="font-weight:400;color:var(--muted)"> · '+esc(zusatz)+'</span>':'')+'</td>'
      +'<td style="text-align:right">'+e.ws+'</td>'
      +'<td style="text-align:right;color:'+(e.wsVm?'var(--fire)':'var(--muted)')+';font-weight:'+(e.wsVm?'600':'400')+'">'+(e.wsVm||'–')+'</td>'
      +'<td style="text-align:right;color:'+(e.wsWeg?'var(--fire)':'var(--muted)')+';font-weight:'+(e.wsWeg?'600':'400')+'">'+(e.wsWeg||'–')+'</td>'
      +'<td style="text-align:right;font-weight:650;color:'+telFarbe(q)+'">'+telQ(q)+'</td>'
      +'<td style="text-align:right;font-size:11px;color:var(--muted);padding-left:10px">'
        +(z==null?'':(echt?'belastbar':'im Rauschen'))+'</td></tr>';
  };
  const kopf=(erste)=>'<table style="width:100%;border-collapse:collapse;font-size:12.5px">'
    +'<tr style="color:var(--muted);font-size:11px;text-align:left"><th style="padding-bottom:6px;font-weight:500">'+erste+'</th>'
    +'<th style="font-weight:500;text-align:right">Warteschlange</th><th style="font-weight:500;text-align:right">Mailbox</th>'
    +'<th style="font-weight:500;text-align:right">Aufgelegt</th><th style="font-weight:500;text-align:right">Quote</th>'
    +'<th style="font-weight:500;text-align:right;padding-left:10px">gegen den Schnitt</th></tr>';

  // Wochentage: alle, in natürlicher Reihenfolge. Eine Rangliste wäre hier
  // irreführend — man will sehen, ob ein Tag herausfällt, nicht welcher Platz
  // fünf belegt.
  const nachTag={};
  tage.forEach(d=>{const i=new Date(d.tag+'T12:00:00').getDay();(nachTag[i]=nachTag[i]||[]).push(d);});
  //
  // TEL_MIN_WDH ist hier die eigentliche Schutzschranke, nicht die Anrufmenge:
  // In einer Wochenauswahl kommt jeder Wochentag genau einmal vor. Ein
  // schwacher Dienstag wäre dann kein Muster, sondern ein Datum — und würde
  // als Muster ausgewiesen. Genau der Fehler, den dieser Block ersetzen soll.
  const wRows=[1,2,3,4,5,6,0].filter(i=>nachTag[i])
    .map(i=>({i,n:nachTag[i].length,e:telSumme(nachTag[i],'wt'+i,TEL_WOCHENTAGE[i])}))
    .filter(x=>x.e.ws>=TEL_MIN_MUSTER&&x.n>=TEL_MIN_WDH);
  const zuKurz=wRows.length<2;

  // Stunden: nur die fünf schwächsten. Der volle Tagesverlauf steht schon
  // weiter oben als Grafik, hier geht es um die Frage, wo Besetzung fehlt.
  const sRows=Object.entries(ges.std||{})
    .map(([hh,v])=>({h:Number(hh),e:v}))
    .filter(x=>x.e.ws>=TEL_MIN_MUSTER&&x.h>=0&&x.h<=23)
    .sort((a,b)=>(a.e.wsAn/a.e.ws)-(b.e.wsAn/b.e.ws)).slice(0,5);

  if(zuKurz&&!sRows.length)return '';

  let h='<div class="vl-card"><div style="font-weight:600;font-size:13px;margin-bottom:2px">Muster im Zeitraum</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.55">'
    +'Nicht einzelne Tage, sondern was sich wiederholt. Zeilen unter '+TEL_MIN_MUSTER+' Anrufen sind weggelassen. '
    +'<b>„im Rauschen"</b> heißt: Der Abstand zum Schnitt ist kleiner als die übliche Schwankung bei dieser Anzahl — '
    +'darauf sollte man keinen Dienstplan bauen.</div>';

  if(zuKurz){
    h+='<div style="font-size:12px;font-weight:600;margin-bottom:6px">Nach Wochentag</div>'
      +'<div style="font-size:12px;color:var(--muted);line-height:1.55">Dafür ist der Zeitraum zu kurz. '
      +'Jeder Wochentag müsste mindestens '+TEL_MIN_WDH+'-mal vorkommen — sonst zeigt die Zeile keinen Wochentag, '
      +'sondern ein einzelnes Datum. Wähle oben einen längeren Zeitraum.</div>';
  }else{
    h+='<div style="font-size:12px;font-weight:600;margin-bottom:6px">Nach Wochentag</div>'+kopf('Tag');
    wRows.forEach(x=>{h+=zeile(TEL_WOCHENTAGE[x.i],x.n+(x.n===1?' Tag':' Tage'),x.e);});
    h+='</table>';
  }
  if(sRows.length){
    h+='<div style="font-size:12px;font-weight:600;margin:16px 0 6px">Schwächste Uhrzeiten</div>'+kopf('Uhrzeit');
    sRows.forEach(x=>{h+=zeile(String(x.h).padStart(2,'0')+':00–'+String(x.h).padStart(2,'0')+':59','',x.e);});
    h+='</table>';
  }
  return h+'</div>';
}

// ── Analyse-Export ───────────────────────────────────────────────────────────
// Legt die Zahlen des gewählten Zeitraums als Text in die Zwischenablage, zum
// Einfügen in ein Gespräch mit Claude. Bewusst kein eigener Analyse-Reiter:
// Fragen wie "welche Stunde ist die schwächste" beantwortet man einmal und
// ändert dann den Dienstplan — dafür eine Dauer-Ansicht zu bauen und zu pflegen
// lohnt nicht. Ein Textblock beantwortet auch die Fragen, die hier noch niemand
// gestellt hat.
//
// Enthalten sind ausschließlich Zähler. Keine Rufnummern, keine Namen, keine
// Einzelanrufe — die stehen in diesen Dateien ohnehin nicht.
function telAnalyseText(fen,ges){
  const tage=telTagRows(fen[0],fen[1]);
  const z=(...v)=>v.join(';');
  const n=v=>v==null?'':(typeof v==='number'?Math.round(v):v);
  const L=[];
  L.push('KIMOJO Telefonie — Analyse-Export');
  L.push('Zeitraum: '+fen[0]+' bis '+fen[1]+'  ·  Standort: '+(telLoc==='alle'?'alle':telLoc)
    +'  ·  Tage mit Anrufen: '+tage.length);
  L.push('Datenstand: '+(telData&&telData.stand?new Date(telData.stand).toLocaleString('de-DE'):'unbekannt'));
  L.push('');
  L.push('SO SIND DIE SPALTEN ZU LESEN');
  L.push('Jeder Anruf laeuft: Sprachmenue -> Tastenwahl -> Warteschlange -> Apparat.');
  L.push('  anrufe  eingehende Anrufe von aussen (ohne interne Gespraeche)');
  L.push('  ws      davon in der Warteschlange angekommen');
  L.push('  wsAn    davon von einem Menschen angenommen');
  L.push('  wsVm    davon auf der Mailbox gelandet  (Verlust)');
  L.push('  wsWeg   davon aufgelegt, bevor jemand ranging  (Verlust)');
  L.push('  blind   davon OHNE dass irgendein Apparat auch nur geklingelt hat.');
  L.push('          In Control Hub heissen diese Anrufe "uebergeben". Sie stecken in');
  L.push('          wsVm bzw. wsWeg schon drin, sind also keine zusaetzlichen Anrufe,');
  L.push('          sondern eine schaerfere Frage: nicht "hat niemand abgenommen",');
  L.push('          sondern "hat es ueberhaupt irgendwo geklingelt".');
  L.push('  serie   die laengste ununterbrochene Folge solcher Anrufe an diesem Tag.');
  L.push('          Einzelne bedeuten meist, dass gerade alle im Gespraech waren.');
  L.push('          Eine lange Serie bedeutet, dass die Warteschlange keinen');
  L.push('          erreichbaren Apparat mehr kannte — das ist ein Fehler, keine Last.');
  L.push('  direkt  ohne Warteschlange direkt angenommen');
  L.push('  absage  Taste 2 gedrueckt, wollte nur absagen — KEIN Verlust, der Weg hat funktioniert');
  L.push('  menu    schon im Sprachmenue aufgelegt, nie in der Warteschlange angekommen.');
  L.push('          Bei diesen Anrufen hat NIE ein Apparat geklingelt — die Anmeldung');
  L.push('          hat davon nichts mitbekommen und konnte nichts tun.');
  L.push('  menuFehl   davon bis '+TEL_MENU_FEHL+' s: Fehlwahl. Verwaehlt, sofort aufgelegt.');
  L.push('             KEIN verlorener Patient — wer sich verwaehlt, wollte niemanden.');
  L.push('  menuAnsage davon '+(TEL_MENU_FEHL+1)+' bis '+(TEL_MENU_GANZ-1)+' s: waehrend der Ansage aufgelegt.');
  L.push('  menuGanz   davon ab '+TEL_MENU_GANZ+' s: Die Ansage laeuft rund 23 Sekunden. Wer so');
  L.push('             lange bleibt und dann auflegt, hat sie zu Ende gehoert und wusste');
  L.push('             nicht, was er druecken soll. Einzige Gruppe mit einem Hebel.');
  L.push('             Die drei ergeben zusammen genau menu.');
  L.push('  t1/t2/t3  Tastenwahl 1 / 2 / 3, ohne = keine Taste gedrueckt');
  L.push('  wart    mittlere Wartezeit bis zum Abheben, Sekunden, inkl. Ansage');
  L.push('  dauer   mittlere Sprechzeit je gefuehrtem Gespraech, Sekunden');
  L.push('Annahmequote   = wsAn / ws');
  L.push('Durchkommquote = (wsAn + direkt) / (anrufe - absage)');
  L.push('  Achtung: menuFehl steckt im Nenner mit drin. Wer die Quote ohne Fehlwahlen');
  L.push('  rechnen will, zieht menuFehl von (anrufe - absage) ab.');
  L.push('Oeffnungszeiten: Die Anlage schaltet um '+TEL_OFFEN_BIS+':00 Uhr auf Feierabend. Das ist');
  L.push('keine Annahme, sondern steht in den Daten: um 16 Uhr werden noch Anrufe');
  L.push('angenommen und laufen auf die Mailbox, ab 17 Uhr ist beides null und es');
  L.push('bleibt die Ansage mit der Absage-Taste. Zeitfenster dieses Exports: '
    +(telZeit==='alle'?'ganzer Tag'
     :telZeit==='offen'?('nur '+TEL_OFFEN_VON+':00-'+TEL_OFFEN_BIS+':00 Uhr')
     :('nur ausserhalb '+TEL_OFFEN_VON+':00-'+TEL_OFFEN_BIS+':00 Uhr'))+'.');
  if(telZeit!=='alle'){
    L.push('ACHTUNG: Bei gesetztem Zeitfenster sind wart, dauer und t1/t2/t3 leer — die');
    L.push('stehen in der Datei nur je Tag, nicht je Stunde.');
  }
  L.push('Der Standort kommt aus der gewaehlten Rufnummer (9321 = Kitzingen, 9722 = Werneck).');
  L.push('');
  L.push('GESAMT');
  L.push(z('anrufe','ws','wsAn','wsVm','wsWeg','blind','direkt','absage','menu',
    'menuFehl','menuAnsage','menuGanz','t1','t2','t3','ohne','wart','dauer'));
  L.push(z(ges.anrufe,ges.ws,ges.wsAn,ges.wsVm,ges.wsWeg,ges.blind,ges.direkt,ges.absage,ges.menu,
    ges.menuFehl,ges.menuAnsage,ges.menuGanz,
    ges.t1,ges.t2,ges.t3,ges.ohne,n(ges.wart),n(ges.dauer)));
  L.push('');
  L.push('JE TAG UND STANDORT');
  L.push(z('tag','wochentag','standort','anrufe','ws','wsAn','wsVm','wsWeg','blind','serie','direkt','absage','menu',
    'menuFehl','menuAnsage','menuGanz','wart','dauer'));
  telRoh().forEach(t=>{
    const d=String(t&&t.tag||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<fen[0]||d>fen[1])return;
    if(telLoc!=='alle'&&t.standort!==telLoc)return;
    const x=telZerlege(t);
    // Zeilen ohne Standort enthalten nur ausgehende Gespraeche und stuenden
    // sonst als Reihe von Nullen da, die wie ein Ausfall aussieht. Haette so
    // eine Zeile wider Erwarten doch eingehende Anrufe, bleibt sie stehen —
    // dann waere es ein echter Befund und kein Rauschen.
    if(!t.standort&&!x.anrufe)return;
    L.push(z(d,TEL_WOCHENTAGE[new Date(d+'T12:00:00').getDay()],t.standort||'unbekannt',
      x.anrufe,x.ws,x.wsAn,x.wsVm,x.wsWeg,x.blind,Number(t.serieOhne)||0,
      x.direkt,x.absage,x.menu,x.menuFehl,x.menuAnsage,x.menuGanz,
      n(t.avgWartesek),n(t.avgDauersek)));
  });
  L.push('');
  L.push('JE WOCHENTAG (ganzer Zeitraum zusammengefasst)');
  L.push(z('wochentag','vorkommen','anrufe','ws','wsAn','wsVm','wsWeg','direkt','absage','menu','wart','dauer'));
  const nachTag={};
  tage.forEach(d=>{const i=new Date(d.tag+'T12:00:00').getDay();(nachTag[i]=nachTag[i]||[]).push(d);});
  [1,2,3,4,5,6,0].filter(i=>nachTag[i]).forEach(i=>{
    const e=telSumme(nachTag[i],'w'+i,TEL_WOCHENTAGE[i]);
    L.push(z(TEL_WOCHENTAGE[i],nachTag[i].length,e.anrufe,e.ws,e.wsAn,e.wsVm,e.wsWeg,
      e.direkt,e.absage,e.menu,n(e.wart),n(e.dauer)));
  });
  L.push('');
  L.push('JE STUNDE (ganzer Zeitraum zusammengefasst)');
  L.push(z('stunde','anrufe','ws','wsAn','wsVm','wsWeg','direkt','absage','menu'));
  Object.keys(ges.std||{}).map(Number).sort((a,b)=>a-b).forEach(hh=>{
    const s=ges.std[hh];
    L.push(z(String(hh).padStart(2,'0'),s.anrufe,s.ws,s.wsAn,s.wsVm,s.wsWeg,s.direkt,s.absage,s.menu));
  });
  if(telLoc==='alle'){
    L.push('');
    L.push('JE STANDORT (ganzer Zeitraum zusammengefasst)');
    L.push(z('standort','tage','anrufe','ws','wsAn','wsVm','wsWeg','direkt','absage','menu','wart','dauer'));
    const nachOrt={};
    tage.length&&telRoh().forEach(t=>{
      const d=String(t&&t.tag||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<fen[0]||d>fen[1])return;
      if(!t.standort)return;              // nur ausgehende Gespraeche, siehe oben
      (nachOrt[t.standort]=nachOrt[t.standort]||[]).push(t);
    });
    Object.keys(nachOrt).sort().forEach(o=>{
      const e=telFasse(nachOrt[o],o,o);
      L.push(z(o,new Set(nachOrt[o].map(t=>String(t.tag).slice(0,10))).size,
        e.anrufe,e.ws,e.wsAn,e.wsVm,e.wsWeg,e.direkt,e.absage,e.menu,n(e.wart),n(e.dauer)));
    });
  }
  L.push('');
  L.push('NICHT IN DIESEM EXPORT');
  L.push('Rufnummern — weder unsere noch die der Anrufer. Damit laesst sich aus diesen');
  L.push('Zahlen nicht beantworten, ob jemand mehrfach anrufen musste; dafuer braucht es');
  L.push('den Control-Hub-Bericht "Calling Detailed Call History".');
  L.push('Ausgehende Gespraeche. Sie tragen keine eigene Rufnummer und liessen sich');
  L.push('deshalb nur teilweise einem Standort zuordnen — halb zugeordnete Zahlen');
  L.push('waeren irrefuehrender als gar keine. Es geht hier um Erreichbarkeit,');
  L.push('also um das, was hereinkommt.');
  return L.join('\n');
}

function telAnalyseKopieren(){
  const fen=telFenster(),r=telReihe();
  if(!r.length){alert('Für diese Auswahl liegen keine Anrufe vor.');return;}
  const txt=telAnalyseText(fen,telSumme(r,'ges','Zeitraum'));
  const fertig=ok=>{
    const b=document.getElementById('telExpBtn');
    if(!b)return;
    const alt=b.textContent;
    b.textContent=ok?'In die Zwischenablage kopiert':'Kopieren fehlgeschlagen';
    setTimeout(()=>{b.textContent=alt;},2500);
  };
  // Der moderne Weg braucht einen sicheren Kontext. Ist die Seite über http
  // eingebunden, gibt es navigator.clipboard nicht — dann der alte Weg über ein
  // verstecktes Textfeld, damit der Knopf nicht wortlos nichts tut.
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>fertig(true),()=>fertig(telKopieAlt(txt)));
  }else{
    fertig(telKopieAlt(txt));
  }
}
function telKopieAlt(txt){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';
    document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);return ok;
  }catch(e){return false;}
}

// von und bis sind optional und beide einschließlich.
function telTagRows(von,bis){
  const m={};
  telRoh().forEach(t=>{
    if(!t)return;
    const d=String(t.tag||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(von&&(d<von||d>bis))return;
    (m[d]=m[d]||[]).push(t);
  });
  return Object.keys(m).sort().map(d=>{
    const r=telFasse(m[d],d,telDatum(d));
    r.tag=d;return r;
  });
}
function telWochenRows(von,bis){
  const m={};
  telRoh().forEach(t=>{
    const d=String((t&&t.tag)||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(von&&(d<von||d>bis))return;
    const k=telKW(d);if(!k)return;
    (m[k.key]=m[k.key]||{k,zeilen:[]}).zeilen.push(t);
  });
  const tage=telTagRows(von,bis);
  return Object.keys(m).sort().map(key=>{
    const g=m[key];
    const r=telFasse(g.zeilen,key,'KW '+g.k.kw);
    r.tage=tage.filter(x=>{const kk=telKW(x.tag);return kk&&kk.key===key;});
    r.tag=r.tage.length?r.tage[0].tag:'';
    r.kw=g.k.kw;
    return r;
  });
}

// ── Monate und Jahre ────────────────────────────────────────────────────────
// Dieselbe Verdichtung wie bei Tagen und Wochen, nur gröber gruppiert. Gebraucht
// vom Trend-Chart, das bis auf Jahresebene rauszoomt. Bewusst KEIN r.tag: der
// Schlüssel ist "2026-08" und kein Datum, und telZoomTag() würde daran ersticken.
const TEL_MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function telGruppRows(von,bis,schluessel,beschriften){
  const m={};
  telRoh().forEach(t=>{
    const d=String((t&&t.tag)||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(von&&(d<von||d>bis))return;
    const k=schluessel(d);if(!k)return;
    (m[k]=m[k]||[]).push(t);
  });
  return Object.keys(m).sort().map(k=>telFasse(m[k],k,beschriften(k)));
}
function telMonatsRows(von,bis){
  return telGruppRows(von,bis,d=>d.slice(0,7),
    k=>(TEL_MON[Number(k.slice(5,7))-1]||k)+' '+k.slice(2,4));
}
function telJahresRows(von,bis){
  return telGruppRows(von,bis,d=>d.slice(0,4),k=>k);
}

// ── Steuerung des Trend-Charts ──────────────────────────────────────────────
const TEL_TREND_SPANNEN={tag:[14,30,60,90],woche:[8,13,26,52],monat:[6,12,24,36],jahr:[2,3,5,10]};
const TEL_TREND_STD={tag:30,woche:26,monat:12,jahr:5};
const TEL_TREND_EINHEIT={tag:'Tage',woche:'Wochen',monat:'Monate',jahr:'Jahre'};
const TEL_TASTEN=[['alle','Alle Anrufe'],['t1','1 · Termin vereinbaren'],
                  ['t2','2 · Termin absagen'],['t3','3 · weitere Themen'],
                  ['ohne','keine Taste']];
const TEL_TASTEN_FARBE={alle:'#3C5A80',t1:'#4E7BA8',t2:TEL_C_ABS,t3:'#7C9BBF',ohne:'#9A9AA2'};

function telTrendFenster(){
  const heute=telHeuteStr(),n=Math.max(1,telTrendSpanne);
  if(telTrendKorn==='tag')return [telPlusTage(heute,-(n-1)),heute];
  if(telTrendKorn==='woche')return [telPlusTage(telMontag(heute),-7*(n-1)),heute];
  if(telTrendKorn==='monat'){
    const a=new Date(heute+'T12:00:00');a.setDate(1);a.setMonth(a.getMonth()-(n-1));
    return [telIso(a),heute];
  }
  return [(new Date(heute+'T12:00:00').getFullYear()-(n-1))+'-01-01',heute];
}
function telTrendRows(){
  const f=telTrendFenster();
  // Samstag und Sonntag fliegen aus der TAGES-Achse raus. Sie sind keine
  // schwachen Tage, sondern gar keine Tage: die Praxis ist zu, es kommen ein
  // bis vier verirrte Anrufe an. Ein solcher Balken neben einem Werktag mit 34
  // ist kein Vergleich, und für die Trendgerade ist er Gift — steht am Anfang
  // des Fensters ein Wochenende, startet die Gerade bei 13 statt bei 30 und
  // meldet "+119 %", obwohl sich nichts geändert hat.
  //
  // Es geht bewusst nach Wochentag und nicht nach "wenig Anrufe": sonst würde
  // ein echter Ausfall wie der 18.08. stillschweigend verschwinden — und genau
  // den will man sehen. Wochen, Monate und Jahre mitteln das ohnehin weg.
  if(telTrendKorn==='tag')return telTagRows(f[0],f[1]).filter(d=>{
    const w=new Date(String(d.tag)+'T12:00:00').getDay();
    return w>=1&&w<=5;
  });
  if(telTrendKorn==='woche')return telWochenRows(f[0],f[1]);
  if(telTrendKorn==='monat')return telMonatsRows(f[0],f[1]);
  return telJahresRows(f[0],f[1]);
}
function telSetTrendKorn(k){
  if(telTrendKorn===k||!TEL_TREND_STD[k])return;
  telTrendKorn=k;telTrendSpanne=TEL_TREND_STD[k];
  renderTelefonie();
  const f=telTrendFenster();telSicherstellen(f[0],f[1]);
}
function telSetTrendSpanne(n){
  n=Number(n)||TEL_TREND_STD[telTrendKorn];
  if(telTrendSpanne===n)return;
  telTrendSpanne=n;renderTelefonie();
  const f=telTrendFenster();telSicherstellen(f[0],f[1]);
}
function telSetTrendTaste(t){
  if(telTrendTaste===t)return;
  telTrendTaste=t;renderTelefonie();
}

// ── Zeitfenster ──────────────────────────────────────────────────────────────
function telMontag(ds){const d=new Date(ds+'T12:00:00');if(isNaN(d))return ds;d.setDate(d.getDate()-((d.getDay()+6)%7));return telIso(d);}
function telPlusTage(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return telIso(d);}
function telTageDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1;}
function telWocheAnker(){return telWoche||telHeuteStr();}

// Das Fenster, das der aktuelle Modus aufspannt — [von, bis], beide inklusive.
function telFenster(){
  const heute=telHeuteStr();
  if(telModus==='woche'){const mo=telMontag(telWocheAnker());return [mo,telPlusTage(mo,6)];}
  if(telModus==='zeitraum'&&telVon&&telBis)return [telVon,telBis];
  return [heute,heute];
}

// Die Reihe, die gezeichnet wird. Sie setzt nebenbei telEbene: Tagesbalken
// werden ab etwa zehn Wochen unlesbar schmal, deshalb fasst ein langer freier
// Zeitraum automatisch zu Wochen zusammen. In den Modi heute und woche bleibt
// es immer bei Tagen — dort ist die Spanne ja bekannt und kurz.
function telReihe(){
  const f=telFenster();
  telEbene=(telModus==='zeitraum'&&telTageDiff(f[0],f[1])>70)?'woche':'tag';
  return telEbene==='woche'?telWochenRows(f[0],f[1]):telTagRows(f[0],f[1]);
}

function telSetLoc(l){telLoc=l;telSel=null;renderTelefonie();}
// telSel wird mit zurückgesetzt: Die Auswahl zeigt auf einen Tag, dessen Zahlen
// nach dem Umschalten andere sind — stehenzulassen hieße, eine Detailansicht mit
// dem Kopf des einen und dem Inhalt des anderen Fensters zu zeigen.
function telSetZeit(z){telZeit=z;telSel=null;renderTelefonie();}
function telSetModus(m){
  if(telModus===m)return;
  telModus=m;telSel=null;
  if(m==='woche'&&!telWoche)telWoche=telHeuteStr();
  if(m==='zeitraum'&&!(telVon&&telBis)){telBis=telHeuteStr();telVon=telPlusTage(telBis,-29);}
  renderTelefonie();
  const f=telFenster();telSicherstellen(f[0],f[1]);
}
// Eine Woche vor oder zurück. In die Zukunft gibt es nichts zu sehen, deshalb
// stoppt der Vorwärtsschritt an der laufenden Woche.
function telWocheSchritt(n){
  const neu=telPlusTage(telWocheAnker(),7*n);
  if(telMontag(neu)>telMontag(telHeuteStr()))return;
  telWoche=neu;telSel=null;renderTelefonie();
  const f=telFenster();telSicherstellen(f[0],f[1]);
}
function telWocheJetzt(){telWoche=telHeuteStr();telSel=null;renderTelefonie();}
function telSetVon(v){if(!v)return;telVon=v;if(!telBis||telBis<v)telBis=v;telSel=null;renderTelefonie();telSicherstellen(telVon,telBis);}
function telSetBis(v){if(!v)return;telBis=v;if(!telVon||telVon>v)telVon=v;telSel=null;renderTelefonie();telSicherstellen(telVon,telBis);}
function telScrollDetail(){setTimeout(()=>{const el=document.getElementById('telDetail');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},30);}
function telSelect(k){telSel=(telSel===k)?null:k;renderTelefonie();telScrollDetail();}
// Aus der Wochenansicht in einen einzelnen Tag springen.
// Aus einer Wochenzeile in einen einzelnen Tag springen: in die Wochenansicht
// wechseln, dort auf die Woche dieses Tages stellen und ihn gleich aufklappen.
function telZoomTag(ds){
  telModus='woche';telWoche=ds;telSel=ds;renderTelefonie();telScrollDetail();
  const f=telFenster();telSicherstellen(f[0],f[1]);
}
function telDatum(d){const x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function telWochentag(d){const x=new Date(d+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString('de-DE',{weekday:'short'});}
function telSek(s){return s==null?'–':(s<60?Math.round(s)+' s':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+' min');}
function telLang(d){const x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});}
function telQ(q){return q==null?'–':q.toFixed(0)+' %';}

// ── Der Trichter ────────────────────────────────────────────────────────────
// Zwei Balken übereinander, jeder auf seine eigene Grundgesamtheit normiert:
// oben alle Anrufe, unten nur die, die in der Warteschlange landeten. Das ist
// der Kern des Reiters — alles andere sind Verlaufsdarstellungen davon.
function telBalken(segmente,gesamt,hoehe){
  if(!gesamt)return'';
  let s='<div style="display:flex;height:'+hoehe+'px;border-radius:5px;overflow:hidden;background:var(--sunken)">';
  segmente.forEach(g=>{
    if(!(g.n>0))return;
    const pct=100*g.n/gesamt;
    s+='<div title="'+esc(g.t+': '+g.n+' ('+pct.toFixed(0)+' %)')+'" style="width:'+pct.toFixed(2)+'%;background:'+g.c
      +';display:flex;align-items:center;justify-content:center;color:'+(g.hell?'#3A3A3C':'#fff')
      +';font-size:11px;font-weight:600;font-feature-settings:\'tnum\';overflow:hidden;white-space:nowrap">'
      +(pct>=7?g.n:'')+'</div>';
  });
  return s+'</div>';
}
function telLegende(segmente){
  return '<div class="vl-legend" style="margin-top:7px">'
    +segmente.filter(g=>g.n>0).map(g=>'<span class="vl-leg"><i style="background:'+g.c+'"></i>'
      +esc(g.t)+' <b style="font-feature-settings:\'tnum\'">'+g.n+'</b></span>').join('')
    +'</div>';
}
function telTrichter(e,titel,unterzeile){
  const stufe1=[
    {n:e.ws,     c:'#8FA9C4', t:'in die Warteschlange'},
    {n:e.absage, c:TEL_C_ABS, t:'Absage-Mailbox (Taste 2, gewollt)'},
    {n:e.direkt, c:TEL_C_DIR, t:'direkt angenommen'},
    {n:e.menu,   c:TEL_C_MENU,t:'im Menü aufgelegt',hell:true}
  ];
  const stufe2=[
    {n:e.wsAn, c:TEL_C_AN, t:'von einem Menschen angenommen'},
    {n:e.wsVm, c:TEL_C_VM, t:'auf die Mailbox übergelaufen'},
    {n:e.wsWeg,c:TEL_C_WEG,t:'Anrufer hat aufgelegt'}
  ];
  let h='<div class="vl-card">';
  h+='<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">'
    +'<div style="font-weight:650;font-size:14px">'+esc(titel)+'</div>'
    +'<div style="font-size:12px;color:var(--muted)">'+esc(unterzeile||'')+'</div></div>';

  h+='<div style="margin-top:14px;font-size:12px;color:var(--muted);margin-bottom:5px">'
    +'<b style="color:var(--text);font-size:13px">Stufe 1 · Sprachmenü</b> — '+e.anrufe+' Anrufe kommen an</div>';
  h+=telBalken(stufe1,e.anrufe,26)+telLegende(stufe1);

  if(e.ws){
    h+='<div style="margin-top:18px;font-size:12px;color:var(--muted);margin-bottom:5px">'
      +'<b style="color:var(--text);font-size:13px">Stufe 2 · Warteschlange</b> — '+e.ws+' Anrufer wollen jemanden sprechen</div>';
    h+=telBalken(stufe2,e.ws,26)+telLegende(stufe2);
  }

  // Die Menütasten laufen quer zum Trichter: Sie sagen, was der Anrufer wollte,
  // nicht wie es ausging. Deshalb eine eigene Zeile und keine Stufe.
  const tSumme=e.t1+e.t2+e.t3+e.ohne;
  if(e.hatTasten&&tSumme>0){
    const tasten=[
      {n:e.t1,  c:'#4E7BA8', t:'1 · Termin vereinbaren'},
      {n:e.t3,  c:'#7C9BBF', t:'3 · weitere Fragen'},
      {n:e.t2,  c:TEL_C_ABS, t:'2 · Termin absagen'},
      {n:e.ohne,c:'#D8D8DE', t:'keine Taste gedrückt → Warteschlange',hell:true}
    ];
    h+='<div style="margin-top:18px;font-size:12px;color:var(--muted);margin-bottom:5px">'
      +'<b style="color:var(--text);font-size:13px">Was gedrückt wurde</b> — '+tSumme+' von '+e.anrufe+' Anrufern haben das Menü erreicht<br>'
      +'<span style="font-size:11.5px">Diese Zeile liegt quer zum Trichter oben: Taste 1, Taste 3 und „keine Taste" landen alle in der Warteschlange, nur Taste 2 geht direkt auf die Mailbox.</span></div>';
    h+=telBalken(tasten,tSumme,22)+telLegende(tasten);
  }

  // Woraus die Menüabbrüche bestehen. Ohne diese Zeile liest man alle drei
  // Gruppen als denselben Verlust, und das sind sie nicht einmal annähernd.
  if(e.hatMenuDetail){
    const mg=[
      {n:e.menuFehl,  c:'#D8D8DE',   t:'bis '+TEL_MENU_FEHL+' s · Fehlwahl',hell:true},
      {n:e.menuAnsage,c:'#EBCB92',   t:'während der Ansage aufgelegt',hell:true},
      {n:e.menuGanz,  c:TEL_C_MENU,  t:'ab '+TEL_MENU_GANZ+' s · Ansage zu Ende gehört'}
    ];
    h+='<div style="margin-top:18px;font-size:12px;color:var(--muted);margin-bottom:5px">'
      +'<b style="color:var(--text);font-size:13px">Die Menüabbrüche genauer</b> — '+e.menu+' Anrufer, die das Menü nie verlassen haben<br>'
      +'<span style="font-size:11.5px">Bei allen dreien hat nie ein Apparat geklingelt; die Anmeldung hat davon nichts mitbekommen. '
      +'Unterscheiden lassen sie sich nur an der Zuhördauer — und die trennt drei sehr verschiedene Dinge.</span></div>';
    h+=telBalken(mg,e.menu,22)+telLegende(mg);
    if(e.menuGanz)
      h+='<div style="margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.6">'
        +'Die <b style="color:var(--text)">'+e.menuGanz+'</b> rechts sind die einzige Gruppe mit einem Hebel: Die Ansage läuft rund 23 Sekunden. '
        +'Wer so lange bleibt und dann auflegt, hat sie zu Ende gehört und wusste nicht, was er drücken soll.</div>';
  }

  // Der Satz, um den es eigentlich geht. Ohne ihn muss man die Balken lesen.
  const erreicht=e.wsAn+e.direkt;
  h+='<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;line-height:1.7">'
    // Die Absagen kommen VOR der Quote, weil sie deren Bezugsgröße verkleinern.
    // Stünden sie dahinter, läse man 5 gegen 10 und käme auf eine andere Zahl.
    +'Von <b>'+e.anrufe+'</b> Anrufern '
    +(e.absage?'wollten <b>'+e.absage+'</b> nur absagen und sind planmäßig bedient. '
        +'Von den <b>'+e.wollten+'</b>, die jemanden sprechen wollten, haben ':'haben ')
    +'<b style="color:'+telFarbe(e.durch)+'">'+erreicht+'</b> mit einem Menschen gesprochen'
    +(e.durch!=null?' <span style="color:var(--muted)">('+telQ(e.durch)+')</span>':'')+'. '
    +(e.verloren?'<b style="color:var(--fire)">'+(e.hatMenuDetail?e.echtVerloren:e.verloren)+'</b> wollten jemanden erreichen und haben niemanden bekommen — '
       +[e.wsVm?e.wsVm+' auf der Mailbox':'',e.wsWeg?e.wsWeg+' in der Warteschlange aufgelegt':'',
         (e.hatMenuDetail?e.menu-e.menuFehl:e.menu)?((e.hatMenuDetail?e.menu-e.menuFehl:e.menu)+' schon im Menü aufgelegt'):''].filter(Boolean).join(', ')+'.'
       // Die Fehlwahlen stehen bewusst DAHINTER und in Grau: Sie gehören zur
       // Gesamtzahl oben, aber nicht in die Verlustrechnung. Sie ganz zu
       // verschweigen hieße, dass die Zahlen sich nicht mehr aufaddieren lassen.
       +(e.hatMenuDetail&&e.menuFehl?' <span style="color:var(--muted)">Die '+e.menuFehl
          +' Fehlwahlen unter '+(TEL_MENU_FEHL+1)+' Sekunden sind hier nicht mitgezählt — wer sich verwählt, wollte niemanden erreichen.</span>':'')
     :'Niemand ging verloren.')
    +'</div>';
  return h+'</div>';
}

// Säulen = Anrufe je Tag bzw. Woche, gestapelt nach dem, was aus ihnen wurde.
// Linie = Annahmequote der Warteschlange auf eigener Achse rechts. Beides in
// ein Bild, weil die Quote allein täuscht: 100 % bei vier Anrufen sagt nichts
// über einen Tag mit zweihundert. Säulen sind anklickbar.
function telChart(r){
  const W=760,H=250,padL=42,padR=44,padT=16,padB=44;
  const n=r.length;if(!n)return'';
  const maxA=Math.max(1,...r.map(d=>d.anrufe));
  const slot=(W-padL-padR)/n;
  const bw=Math.max(2,Math.min(30,slot*0.62));
  const x=i=>padL+(W-padL-padR)*(n<=1?0.5:(i+0.5)/n);
  const y=v=>padT+(H-padT-padB)*(1-v/maxA);
  const yq=q=>padT+(H-padT-padB)*(1-q/100);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px">';
  for(let g=0;g<=4;g++){
    const v=maxA*g/4,q=100*g/4;
    s+='<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="#E5E5EA" stroke-width="1"/>'
      +'<text x="'+(padL-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#777" font-family="Inter">'+Math.round(v)+'</text>'
      +'<text x="'+(W-padR+6)+'" y="'+(yq(q)+4).toFixed(1)+'" text-anchor="start" font-size="10" fill="#A4522F" font-family="Inter">'+Math.round(q)+'%</text>';
  }
  // Zielmarke. Ohne sie ist die Quotenlinie eine Kurve ohne Maßstab.
  s+='<line x1="'+padL+'" y1="'+yq(TEL_GUT).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yq(TEL_GUT).toFixed(1)+'" stroke="#3D7A5D" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>'
    +'<text x="'+(padL+4)+'" y="'+(yq(TEL_GUT)-4).toFixed(1)+'" font-size="9" fill="#3D7A5D" font-family="Inter">Ziel '+TEL_GUT+' %</text>';
  r.forEach((d,i)=>{
    const cx=x(i)-bw/2,sel=telSel===d.key;
    const tip=esc(d.label)+': '+d.anrufe+' Anrufe · '+(d.wsAn+d.direkt)+' erreichten jemanden'
      +(d.wsVm?' · '+d.wsVm+' Mailbox-Überlauf':'')+(d.wsWeg?' · '+d.wsWeg+' aufgelegt':'')
      +(d.absage?' · '+d.absage+' Absage-Mailbox':'')+(d.menu?' · '+d.menu+' im Menü aufgelegt':'')
      +(d.quote!=null?' — Annahmequote '+d.quote.toFixed(0)+' %':'');
    // Unsichtbare Klickfläche über die volle Slot-Breite — sonst muss man
    // millimetergenau die Säule treffen, was auf dem Tablet nicht klappt.
    s+='<rect x="'+(x(i)-slot/2).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+(H-padT-padB).toFixed(1)+'" fill="'+(sel?'#00000008':'transparent')+'" style="cursor:pointer" onclick="telSelect(\''+d.key+'\')"><title>'+tip+'</title></rect>';
    // Stapel von unten nach oben in der Reihenfolge des Trichters: was
    // funktioniert hat zuerst, was verloren ging darüber.
    let unten=0;
    [[d.wsAn,sel?'#2E5B45':TEL_C_AN],[d.direkt,TEL_C_DIR],[d.absage,TEL_C_ABS],
     [d.wsVm,TEL_C_VM],[d.wsWeg,TEL_C_WEG],[d.menu,TEL_C_MENU]].forEach(seg=>{
      if(!(seg[0]>0))return;
      const oben=unten+seg[0];
      s+='<rect x="'+cx.toFixed(1)+'" y="'+y(oben).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y(unten)-y(oben))).toFixed(1)+'" fill="'+seg[1]+'" style="pointer-events:none"/>';
      unten=oben;
    });
    if(sel)s+='<rect x="'+(cx-2).toFixed(1)+'" y="'+(y(d.anrufe)-3).toFixed(1)+'" width="'+(bw+4).toFixed(1)+'" height="'+Math.max(0,(y(0)-y(d.anrufe)+3)).toFixed(1)+'" rx="3" fill="none" stroke="#1C1C1E" stroke-width="1.5" style="pointer-events:none"/>';
  });
  const poly=r.map((d,i)=>d.quote==null?null:x(i).toFixed(1)+','+yq(d.quote).toFixed(1)).filter(Boolean).join(' ');
  if(poly.split(' ').length>1)s+='<polyline points="'+poly+'" fill="none" stroke="#A4522F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:none"/>';
  r.forEach((d,i)=>{if(d.quote!=null)s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+yq(d.quote).toFixed(1)+'" r="'+(telSel===d.key?4.5:3)+'" fill="#A4522F" style="pointer-events:none"/>';});
  const step=Math.max(1,Math.ceil(n/9));
  r.forEach((d,i)=>{
    if(i%step&&telSel!==d.key)return;
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-20)+'" text-anchor="middle" font-size="10" fill="'+(telSel===d.key?'#1C1C1E':'#777')+'" font-weight="'+(telSel===d.key?'600':'400')+'" font-family="Inter" style="pointer-events:none">'+esc(d.label)+'</text>';
  });
  s+='<text x="'+(W/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="#9A9AA2" font-family="Inter" style="pointer-events:none">'
    +(telEbene==='woche'?'Woche anklicken für die Tage darin':'Tag anklicken für den Stundenverlauf')+'</text>';
  return s+'</svg>';
}

// Stundenverlauf. Wird für den gewählten Tag, die gewählte Woche oder den
// ganzen Zeitraum gezeichnet — immer dieselbe Funktion, nur andere Datenbasis.
function telStundenChart(std){
  const hs=Object.keys(std||{}).map(Number).filter(h=>h>=0&&h<=23).sort((a,b)=>a-b);
  if(!hs.length)return'';
  const von=Math.min(...hs),bis=Math.max(...hs);
  const W=760,H=190,padL=42,padR=14,padT=14,padB=42,n=bis-von+1;
  const maxA=Math.max(1,...hs.map(h=>std[h].anrufe||0));
  const bw=Math.max(3,(W-padL-padR)/n*0.66);
  const x=i=>padL+(W-padL-padR)*((i+0.5)/n);
  const y=v=>padT+(H-padT-padB)*(1-v/maxA);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px">';
  for(let g=0;g<=3;g++){const v=maxA*g/3;
    s+='<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="#E5E5EA" stroke-width="1"/>'
      +'<text x="'+(padL-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#777" font-family="Inter">'+Math.round(v)+'</text>';}
  for(let h=von;h<=bis;h++){
    const a=std[h]||{},i=h-von,cx=x(i)-bw/2;
    const g=k=>a[k]||0;
    const q=g('ws')?100*g('wsAn')/g('ws'):null;
    const schlecht=q!=null&&q<TEL_MITTEL&&g('ws')>=3;
    let unten=0;
    [[g('wsAn'),'#3C5A80'],[g('direkt'),TEL_C_DIR],[g('absage'),TEL_C_ABS],
     [g('wsVm'),TEL_C_VM],[g('wsWeg'),TEL_C_WEG],[g('menu'),TEL_C_MENU]].forEach(seg=>{
      if(!(seg[0]>0))return;
      const oben=unten+seg[0];
      s+='<rect x="'+cx.toFixed(1)+'" y="'+y(oben).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y(unten)-y(oben))).toFixed(1)+'" fill="'+seg[1]+'"><title>'+h+' Uhr: '+g('wsAn')+' von '+g('ws')+' in der Warteschlange angenommen'+(q!=null?' ('+q.toFixed(0)+' %)':'')+(g('wsVm')?' · '+g('wsVm')+' Mailbox':'')+(g('menu')?' · '+g('menu')+' Menü-Abbruch':'')+'</title></rect>';
      unten=oben;
    });
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-24)+'" text-anchor="middle" font-size="10" fill="#777" font-family="Inter">'+h+'</text>';
    if(q!=null&&g('ws')>=3)s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-11)+'" text-anchor="middle" font-size="9" fill="'+(schlecht?'#BE3A30':'#9A9AA2')+'" font-weight="'+(schlecht?'600':'400')+'" font-family="Inter">'+q.toFixed(0)+'%</text>';
  }
  return s+'</svg>';
}

// ── Verpasste Anrufe je Stunde ──────────────────────────────────────────────
// "Verpasst" heißt hier: der Anrufer wollte einen Menschen und bekam keinen.
// Das sind drei Wege — Mailbox-Überlauf aus der Warteschlange, Auflegen in der
// Warteschlange, Auflegen im Menü. Die gewollten Absagen über Taste 2 sind
// bewusst draußen; wer absagen will, hat bekommen, was er wollte.
//
// Balken UND Linie, weil beide allein in die Irre führen: die Anzahl macht
// immer die Stunde mit dem meisten Aufkommen zur schlimmsten, die Quote immer
// die mit den wenigsten Anrufen. Erst zusammen zeigen sie, wo Besetzung wirkt.
function telVerpasstChart(std){
  const hs=Object.keys(std||{}).map(Number).filter(h=>h>=0&&h<=23).sort((a,b)=>a-b);
  if(!hs.length)return'';
  const wert=h=>{
    const a=std[h]||{},g=k=>Number(a[k])||0;
    const verpasst=g('wsVm')+g('wsWeg')+g('menu');
    const wollten=Math.max(0,g('anrufe')-g('absage'));
    return {verpasst,wollten,vm:g('wsVm'),weg:g('wsWeg'),menu:g('menu'),
            quote:wollten?100*verpasst/wollten:null};
  };
  const daten={};hs.forEach(h=>{daten[h]=wert(h);});
  if(!hs.some(h=>daten[h].verpasst>0))return'LEER';

  const von=Math.min(...hs),bis=Math.max(...hs),n=bis-von+1;
  const W=760,H=210,padL=42,padR=44,padT=16,padB=40;
  const maxV=Math.max(1,...hs.map(h=>daten[h].verpasst));
  const bw=Math.max(3,(W-padL-padR)/n*0.62);
  const x=i=>padL+(W-padL-padR)*((i+0.5)/n);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const yq=q=>padT+(H-padT-padB)*(1-Math.min(100,q)/100);

  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px">';
  for(let g=0;g<=4;g++){
    const v=maxV*g/4,q=100*g/4;
    s+='<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="#E5E5EA" stroke-width="1"/>'
      +'<text x="'+(padL-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#777" font-family="Inter">'+Math.round(v)+'</text>'
      +'<text x="'+(W-padR+6)+'" y="'+(yq(q)+4).toFixed(1)+'" text-anchor="start" font-size="10" fill="#A4522F" font-family="Inter">'+Math.round(q)+'%</text>';
  }
  for(let h=von;h<=bis;h++){
    const d=daten[h]||{verpasst:0,wollten:0,vm:0,weg:0,menu:0,quote:null};
    const i=h-von,cx=x(i)-bw/2;
    const tip=h+' Uhr: '+d.verpasst+' von '+d.wollten+' erreichten niemanden'
      +(d.quote!=null?' ('+d.quote.toFixed(0)+' %)':'')
      +(d.vm?' · '+d.vm+' Mailbox-Überlauf':'')
      +(d.weg?' · '+d.weg+' in der Warteschlange aufgelegt':'')
      +(d.menu?' · '+d.menu+' im Menü aufgelegt':'');
    let unten=0;
    [[d.weg,TEL_C_WEG],[d.vm,TEL_C_VM],[d.menu,TEL_C_MENU]].forEach(seg=>{
      if(!(seg[0]>0))return;
      const oben=unten+seg[0];
      s+='<rect x="'+cx.toFixed(1)+'" y="'+y(oben).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y(unten)-y(oben))).toFixed(1)+'" fill="'+seg[1]+'"><title>'+tip+'</title></rect>';
      unten=oben;
    });
    if(!d.verpasst)s+='<rect x="'+cx.toFixed(1)+'" y="'+(y(0)-1.5).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="1.5" fill="#D8D8DE"><title>'+tip+'</title></rect>';
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-22)+'" text-anchor="middle" font-size="10" fill="#777" font-family="Inter">'+h+'</text>';
  }
  // Die Quotenlinie nur über Stunden mit genug Anrufen. Eine Stunde mit einem
  // einzigen Anrufer ergibt sonst 0 % oder 100 % und lässt die Linie springen.
  const pkt=[];
  for(let h=von;h<=bis;h++){
    const d=daten[h];
    if(d&&d.quote!=null&&d.wollten>=3)pkt.push({i:h-von,q:d.quote});
    else pkt.push(null);
  }
  let lauf=[];
  const zeichne=()=>{
    if(lauf.length>1)s+='<polyline points="'+lauf.map(p=>x(p.i).toFixed(1)+','+yq(p.q).toFixed(1)).join(' ')+'" fill="none" stroke="#A4522F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:none"/>';
    lauf=[];
  };
  pkt.forEach(p=>{if(p)lauf.push(p);else zeichne();});
  zeichne();
  pkt.forEach(p=>{if(p)s+='<circle cx="'+x(p.i).toFixed(1)+'" cy="'+yq(p.q).toFixed(1)+'" r="3" fill="#A4522F" style="pointer-events:none"/>';});
  s+='<text x="'+(W/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="10" fill="#9A9AA2" font-family="Inter">Balken = Anzahl verpasst · Linie = Anteil der Anrufer, die niemanden erreichten (Achse rechts)</text>';
  return s+'</svg>';
}

// Der ganze Block inklusive Erklärung und Fazit-Satz. Der Satz steht drin, weil
// aus "9 Uhr ist am schlimmsten" sonst niemand eine Dienstplanung ableitet.
function telVerpasstBlock(ges,titel){
  const sc=telVerpasstChart(ges.std);
  if(!sc)return'';
  let h='<div class="vl-card">'
    +'<div style="font-weight:600;font-size:13px;margin-bottom:2px">'+esc(titel)+'</div>';
  if(sc==='LEER'){
    return h+'<div style="font-size:12.5px;color:var(--muted);line-height:1.55">'
      +'In diesem Zeitraum hat jeder Anrufer, der jemanden sprechen wollte, auch jemanden erreicht. '
      +'Nichts zu zeigen — das ist die gute Nachricht.</div></div>';
  }
  h+='<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.55">'
    +'Verpasst heißt: der Anrufer wollte einen Menschen und bekam keinen. Die gewollten Absagen über Taste 2 sind nicht enthalten. '
    +'Die Linie zeigt erst ab drei Anrufern pro Stunde etwas an — darunter wäre eine Quote reines Rauschen.</div>'
    +'<div class="vl-legend" style="margin-bottom:10px">'
      +'<span class="vl-leg"><i style="background:'+TEL_C_WEG+'"></i>in der Warteschlange aufgelegt</span>'
      +'<span class="vl-leg"><i style="background:'+TEL_C_VM+'"></i>Mailbox-Überlauf</span>'
      +'<span class="vl-leg"><i style="background:'+TEL_C_MENU+'"></i>im Menü aufgelegt</span>'
      +'<span class="vl-leg"><i style="background:#A4522F"></i>Verlustquote (Achse rechts)</span>'
    +'</div>'+sc;

  // Zwei Sieger küren: die Stunde mit den meisten verlorenen Anrufern (dort
  // bringt Besetzung absolut am meisten) und die mit der höchsten Quote bei
  // ausreichender Menge (dort ist die Erfahrung des Anrufers am schlechtesten).
  const stunden=Object.keys(ges.std||{}).map(Number).filter(x=>x>=0&&x<=23).map(hh=>{
    const a=ges.std[hh],g=k=>Number(a[k])||0;
    return {h:hh,verpasst:g('wsVm')+g('wsWeg')+g('menu'),
            wollten:Math.max(0,g('anrufe')-g('absage'))};
  }).map(o=>Object.assign(o,{quote:o.wollten?100*o.verpasst/o.wollten:null}));
  const nachAnzahl=stunden.slice().sort((a,b)=>b.verpasst-a.verpasst)[0];
  const nachQuote=stunden.filter(o=>o.wollten>=10&&o.quote!=null).sort((a,b)=>b.quote-a.quote)[0];
  const gesVerp=stunden.reduce((a,o)=>a+o.verpasst,0);
  h+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.7">';
  // Schwelle, weil sonst eine Stunde mit 2 von 3 verlorenen Anrufen zur
  // "Problemstunde" erklärt wird und die 9-Uhr-Spitze mit 1 von 10 schlägt.
  // Genau dieser Fall trat im Test an einem einzelnen Tag auf.
  if(gesVerp<8){
    h+='Insgesamt '+gesVerp+' verlorene Anrufer in diesem Zeitraum — zu wenige, um eine Problemstunde zu benennen. '
      +'Jede Spitze im Chart oben kann hier noch Zufall sein. Aussagekräftig wird es ab etwa zwei Wochen im Zeitraum-Modus.';
  }else{
    h+='Die meisten Anrufer gehen zwischen <b>'+nachAnzahl.h+' und '+(nachAnzahl.h+1)+' Uhr</b> verloren — '
      +'<b style="color:var(--fire)">'+nachAnzahl.verpasst+'</b> von insgesamt '+gesVerp+'. '
      +'Dort bringt eine zusätzliche Besetzung absolut am meisten.';
    if(nachQuote&&nachQuote.h!==nachAnzahl.h)
      h+=' Am schlechtesten <i>läuft</i> es aber zwischen <b>'+nachQuote.h+' und '+(nachQuote.h+1)+' Uhr</b>: '
        +'dort erreichen <b style="color:var(--fire)">'+nachQuote.quote.toFixed(0)+' %</b> niemanden. '
        +'Die erste Stunde kostet mehr Patienten, die zweite ärgert mehr Anrufer.';
  }
  h+='</div>';
  return h+'</div>';
}

// ── Trend über Tage, Wochen, Monate, Jahre ──────────────────────────────────
function telTrendWert(d){return telTrendTaste==='alle'?(d.anrufe||0):(d[telTrendTaste]||0);}

// Läuft dieser Zeitraum noch? Eine angebrochene Woche sieht sonst aus wie ein
// Einbruch, und genau daraus entstehen falsche Trendmeldungen. Der letzte
// Balken wird deshalb blass gezeichnet und aus der Trendgeraden herausgehalten.
function telTrendOffen(key){
  const heute=telHeuteStr();
  if(telTrendKorn==='tag')return key===heute;
  if(telTrendKorn==='woche'){const k=telKW(heute);return !!k&&k.key===key;}
  if(telTrendKorn==='monat')return key===heute.slice(0,7);
  return key===heute.slice(0,4);
}

function telTrendChart(){
  const rows=telTrendRows();
  const p=rows.map(d=>({key:d.key,label:d.label,v:telTrendWert(d),offen:telTrendOffen(d.key)}));
  if(!p.length)return'';
  const n=p.length,W=760,H=225,padL=44,padR=14,padT=16,padB=46;
  const maxV=Math.max(1,...p.map(o=>o.v));
  const slot=(W-padL-padR)/n;
  const bw=Math.max(2,Math.min(34,slot*0.66));
  const x=i=>padL+(W-padL-padR)*(n<=1?0.5:(i+0.5)/n);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const farbe=TEL_TASTEN_FARBE[telTrendTaste]||'#3C5A80';

  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px">';
  for(let g=0;g<=4;g++){const v=maxV*g/4;
    s+='<line x1="'+padL+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(v).toFixed(1)+'" stroke="#E5E5EA" stroke-width="1"/>'
      +'<text x="'+(padL-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#777" font-family="Inter">'+Math.round(v)+'</text>';}
  p.forEach((o,i)=>{
    const cx=x(i)-bw/2;
    s+='<rect x="'+cx.toFixed(1)+'" y="'+y(o.v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,(y(0)-y(o.v))).toFixed(1)+'" fill="'+farbe+'" opacity="'+(o.offen?'.35':'1')+'"><title>'+esc(o.label)+': '+o.v+(o.offen?' — läuft noch':'')+'</title></rect>';
  });

  // Trendgerade über die abgeschlossenen Punkte. Kleinste Quadrate, nichts
  // Ausgefallenes — sie soll die Richtung zeigen, nicht die Zukunft vorhersagen.
  const idx=[];p.forEach((o,i)=>{if(!o.offen)idx.push(i);});
  let satz='';
  if(idx.length>=4){
    const mx=idx.reduce((a,b)=>a+b,0)/idx.length;
    const my=idx.reduce((a,i)=>a+p[i].v,0)/idx.length;
    let sxy=0,sxx=0;
    idx.forEach(i=>{sxy+=(i-mx)*(p[i].v-my);sxx+=(i-mx)*(i-mx);});
    if(sxx>0){
      const m=sxy/sxx,b=my-m*mx,i0=idx[0],i1=idx[idx.length-1];
      const v0=Math.max(0,m*i0+b),v1=Math.max(0,m*i1+b);
      s+='<line x1="'+x(i0).toFixed(1)+'" y1="'+y(v0).toFixed(1)+'" x2="'+x(i1).toFixed(1)+'" y2="'+y(v1).toFixed(1)+'" stroke="#A4522F" stroke-width="2" stroke-dasharray="5 4" opacity=".85"/>';
      const proz=v0>0?100*(v1-v0)/v0:null;
      // Ohne toLowerCase — "abgeschlossenen tage" war schlicht falsch geschrieben.
      const einheit=TEL_TREND_EINHEIT[telTrendKorn];
      // Ist die Steigung mehr als Rauschen? Gemessen am Standardfehler der
      // Steigung selbst, also an der Streuung der Punkte UM die Gerade — nicht
      // an der Anrufmenge. Das ist dieselbe Haltung wie beim z-Wert in den
      // Mustern: erst ab zwei Standardfehlern wird von einer Richtung geredet.
      //
      // Die frühere Faustregel hing allein an der Anrufmenge und hat deshalb
      // eine Gerade durch zwölf stark schwankende Tage für "belastbar" erklärt.
      // Eine Zahl, die groß aussieht, ist nicht dasselbe wie eine Zahl, die
      // nicht auch Zufall sein kann.
      let rss=0;
      idx.forEach(i=>{const e=p[i].v-(m*i+b);rss+=e*e;});
      const se=(idx.length>2&&sxx>0)?Math.sqrt((rss/(idx.length-2))/sxx):null;
      const tWert=(se&&se>0)?m/se:null;
      if(proz==null)satz='';
      else if(tWert==null||Math.abs(tWert)<2)
        satz='Über die '+idx.length+' abgeschlossenen '+einheit+' ist <b>keine Richtung erkennbar</b>. '
            +'Die Gerade zeigt zwar '+(proz>0?'+':'')+proz.toFixed(0)+' %, aber die einzelnen '+einheit
            +' schwanken stärker, als die Gerade fällt oder steigt — dieselbe Zahl käme auch heraus, '
            +'wenn sich gar nichts geändert hätte.';
      else
        satz='Über die '+idx.length+' abgeschlossenen '+einheit+' geht es um <b style="color:'
            +(proz>0?'#3D7A5D':'#BE3A30')+'">'+(proz>0?'+':'')+proz.toFixed(0)+' %</b> '
            +(proz>0?'nach oben':'nach unten')+'. '
            +'Die Steigung ist das '+Math.abs(tWert).toFixed(1)+'-fache ihrer eigenen Unsicherheit'
            +(idx.length<12?' — bei nur '+idx.length+' Punkten bleibt es trotzdem ein Hinweis.'
                           :', das trägt.');
    }
  } else {
    satz='Für eine Trendgerade sind noch zu wenige abgeschlossene Zeiträume da.';
  }

  const step=Math.max(1,Math.ceil(n/12));
  p.forEach((o,i)=>{
    if(i%step&&i!==n-1)return;
    s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-24)+'" text-anchor="middle" font-size="10" fill="'+(o.offen?'#B0B0B8':'#777')+'" font-family="Inter">'+esc(o.label)+'</text>';
  });
  const summe=p.reduce((a,o)=>a+o.v,0),fest=idx.reduce((a,i)=>a+p[i].v,0);
  s+='<text x="'+(W/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="#9A9AA2" font-family="Inter">'
    +summe+' Anrufe im Zeitraum'+(idx.length&&idx.length<n?' · '+(fest/idx.length).toFixed(1)+' je abgeschlossenem Zeitraum':'')+'</text>';
  s+='</svg>';
  if(satz)s+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.7">'+satz+'</div>';
  return s;
}

        +'<td style="text-align:right;color:'+(t.wsVm?'var(--fire)':'var(--muted)')+'">'+(t.wsVm||'–')+'</td>'
        +'<td style="text-align:right;color:'+(t.wsWeg?'var(--fire)':'var(--muted)')+'">'+(t.wsWeg||'–')+'</td>'

    });

  // Standort-Aufschlüsselung — nur sinnvoll, wenn es mehrere gibt und gerade

  if(telLoc==='alle'&&telStandorte().length>1){

    const proLoc={};
    zeilen.forEach(t=>{const l=String((t&&t.standort)||'—');(proLoc[l]=proLoc[l]||[]).push(t);});

        +'<th style="font-weight:500;text-align:right">Anrufe</th><th style="font-weight:500;text-align:right">Warteschl.</th>'
