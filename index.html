  h+=`<div id="statsDiv" class="hero"></div>`;
  h+=`<div class="tcx"><div class="thd"><h3>Rezepte mit offenem Abrechnungsstand</h3><span class="cnt" id="resultCount">0</span></div>`;
  h+=`<table class="data-t"><thead><tr>`
    +`<th data-sort="patient" onclick="sortOffen('patient')">Patient <span class="arrow"></span></th>`
    +`<th data-sort="kat" onclick="sortOffen('kat')">Grund <span class="arrow"></span></th>`
    +`<th>Heilmittel</th>`
    +`<th class="r" data-sort="ausst" onclick="sortOffen('ausst')">Rezept vom <span class="arrow"></span></th>`
    +`<th data-sort="standort" onclick="sortOffen('standort')">Standort <span class="arrow"></span></th>`
    +`<th class="r" data-sort="letzter" onclick="sortOffen('letzter')">Letzter Termin <span class="arrow"></span></th>`
    +`<th class="r" data-sort="daysAgo" onclick="sortOffen('daysAgo')">Tage her <span class="arrow"></span></th>`
    +`<th class="r" data-sort="gel" onclick="sortOffen('gel')">Einheiten <span class="arrow"></span></th>`
    +`<th class="r" data-sort="rest" onclick="sortOffen('rest')">Rest <span class="arrow"></span></th>`
    +`<th class="r" data-sort="zz" onclick="sortOffen('zz')">Zuzahlung <span class="arrow"></span></th>`
    // Dieselbe Leiste wie im Tagesziel. Eine Verordnung ist EINE Sache, egal in
    // welchem Reiter sie gerade steht — Status, Zuständige, Frist und Notiz
    // gehören deshalb an beide Stellen und teilen sich dieselbe Aufgaben-Id
    // („abr|" + Verordnungsnummer). Wer hier abhakt, hakt im Tagesziel mit ab.
    +`<th>Status &amp; Notiz</th>`

function renderOffenTable(){
  const F=offenRows();
  const{col,asc}=currentSort;
  const sc=col==='kat'?'kat':col;
  F.sort((a,b)=>{let va=a[sc],vb=b[sc];
    if(typeof va==='string'||typeof vb==='string'){va=String(va||'').toLowerCase();vb=String(vb||'').toLowerCase();}
    if(va==null)va=-1;if(vb==null)vb=-1;
    if(va<vb)return asc?-1:1;if(va>vb)return asc?1:-1;return 0;});

  const fert=F.filter(r=>r.kat==='fertig'),stk=F.filter(r=>r.kat==='steck'),
        nRgO=F.filter(r=>r.kat==='rgOffen'),zzSum=F.reduce((s,r)=>s+r.zz,0),zzN=F.filter(r=>r.zz>0).length;
  const ehFert=fert.reduce((s,r)=>s+r.gel,0)+nRgO.reduce((s,r)=>s+r.gel,0);
  const ehStk=stk.reduce((s,r)=>s+r.rest,0);
  const blockiert=fert.filter(r=>r.offenImProgramm).length;
  const nLuecke=fert.filter(r=>r.dokuLuecke>0).length;
  const sEl=document.getElementById('statsDiv');
  if(sEl)sEl.innerHTML=
     `<div class="hk"><div class="hk-l">Fertig, nicht abgerechnet</div><div class="hk-v" style="color:${fert.length?'var(--red)':'var(--teal)'}">${fert.length}</div><div class="hk-sub">${ehFert} erbrachte Einheiten${blockiert?' · '+blockiert+'× noch nicht abgeschlossen':''}${nLuecke?' · '+nLuecke+'× Doku unvollständig':''}</div></div>`
    +`<div class="hk"><div class="hk-l">Steckengeblieben</div><div class="hk-v" style="color:${stk.length?'var(--amber)':'var(--teal)'}">${stk.length}</div><div class="hk-sub">${ehStk} Einheiten drohen zu verfallen</div></div>`
    +`<div class="hk"><div class="hk-l">Rechnung offen</div><div class="hk-v" style="color:${nRgO.length?'var(--amber)':'var(--teal)'}">${nRgO.length}</div><div class="hk-sub">gestellt, nicht bezahlt</div></div>`
    +`<div class="hk"><div class="hk-l">Zuzahlung offen</div><div class="hk-v" style="color:${zzSum>0?'var(--red)':'var(--teal)'}">${fm(zzSum)}</div><div class="hk-sub">${zzN} Rezepte</div></div>`;

  document.querySelectorAll('.tcx thead th').forEach(th=>{const s=th.dataset.sort,ar=th.querySelector('.arrow');if(!ar)return;
    if(s===col){th.classList.add('sorted');ar.textContent=asc?'▲':'▼';}else{th.classList.remove('sorted');ar.textContent='';}});
  const cEl=document.getElementById('resultCount');if(cEl)cEl.textContent=F.length+' Rezepte';
  const tb=document.getElementById('tbody');if(!tb)return;tb.innerHTML='';
  F.forEach(r=>{
    const K=OFFEN_KAT[r.kat]||{l:r.kat,b:'b-teal',t:''};
    const tr=document.createElement('tr');
    if((r.kat==='fertig'||r.kat==='steck')&&r.daysAgo!=null&&r.daysAgo>=42)tr.className='urgent';
    // Angezeigt wird der Stichtag, ab dem gezählt wird — mit Herkunftszeichen,
    // damit eine Näherung nicht wie ein gemessenes Datum aussieht.
    const stich=r.quelle==='termin'?r.letzter:(r.quelle==='vorFenster'?null:r.ausst);
    const fd=stich?stich.split('-').reverse().join('.')
      :(r.quelle==='vorFenster'?'<span style="color:var(--amber)" title="letzter Termin liegt vor dem Rückblickfenster">&gt; '+(r.daysAgo!=null?r.daysAgo+' T':'')+'</span>':'–');
    const marke=r.quelle==='ausstellung'&&stich
      ?'<span style="color:var(--muted)" title="kein Termin zu diesem Rezept — gezählt ab Ausstellungsdatum">~</span> ':'';
    const voll=r.kann>0&&r.gel>=r.kann;
    // Steht in der Spalte eine andere Zahl als in thevea dokumentiert, muss man
    // das sehen können — sonst wirkt der Reiter, als würde er sich verrechnen.
    const luecke=r.dokuLuecke>0
      ?` <span style="color:var(--amber);font-size:9px;font-weight:700" title="${r.tv} Termine liegen in der Vergangenheit, dokumentiert sind nur ${r.erb} Einheiten — ${r.dokuLuecke} nicht abgezeichnet">△${r.dokuLuecke}</span>`:'';
    // Bei "fertig" ist die Handlung eine andere, je nachdem ob das Rezept in thevea
    // überhaupt schon abgeschlossen ist. Das gehört sichtbar in die Zeile.
    const zusatz=r.kat==='fertig'?(r.offenImProgramm?' <span style="font-size:9px;color:var(--red);font-weight:700">noch offen</span>':' <span style="font-size:9px;color:var(--muted);font-weight:700">abgeschlossen</span>')
      +(r.ueberhang?' <span style="font-size:9px;color:var(--amber);font-weight:700" title="Menge ist durch, es steht aber noch '+r.ueberhang+' Termin(e) im Kalender — gehört auf ein Folgerezept">+'+r.ueberhang+' Termin'+(r.ueberhang>1?'e':'')+'</span>':''):'';
    tr.innerHTML=`<td><div class="pn">${esc(r.patient)}</div></td>`
      +`<td><span class="badge ${K.b}" title="${esc(K.t)}">${K.l}</span>${zusatz}</td>`
      +`<td style="font-size:11px">${esc(String(r.heilmittel).slice(0,40))}${r.formular&&r.formular!=='GKV'?' <span style="color:var(--muted);font-size:9px;font-weight:700">'+esc(r.formular)+'</span>':''}</td>`
      +`<td class="r" style="white-space:nowrap">${r.ausst?esc(r.ausst.split('-').reverse().join('.')):'<span style="color:var(--muted)">–</span>'}</td>`
      +`<td><span class="standort ${sC(r.standort)}">${esc(r.standort)}</span></td>`
      +`<td class="r">${marke}${fd}</td>`
      +`<td class="r"><span class="days">${r.daysAgo!=null?r.daysAgo:'–'}</span></td>`
      +`<td class="r"><strong${voll?' style="color:var(--red)"':''}>${r.gel}</strong><span style="color:var(--muted);font-size:10px"> / ${r.kann}</span>${luecke}</td>`
      +`<td class="r">${r.rest>0?'<strong style="color:var(--amber)">'+r.rest+'</strong>':'<span style="color:var(--muted)">–</span>'}</td>`
      +`<td class="r">${r.zz>0?'<strong>'+fm(r.zz)+'</strong>':'<span style="color:var(--muted)">–</span>'}</td>`
      +`<td class="rz-meta">${taskMeta(aufIdRezept(r),'abr',r.patient)}${notizZeile(aufIdRezept(r))}</td>`;
    tb.appendChild(tr);
  });
}

function setOffenKat(k,el){offenKatFilter=k;const c=document.getElementById('offeneContainer');if(c)renderOffeneTV(c);}
function setOffenWeeks(w){offenWeeks=w;const c=document.getElementById('offeneContainer');if(c)renderOffeneTV(c);}
function sortOffen(c){if(currentSort.col===c)currentSort.asc=!currentSort.asc;else{currentSort.col=c;currentSort.asc=c==='patient'||c==='standort'||c==='kat';}renderOffenTable();}

function sortBy(c){if(currentSort.col===c)currentSort.asc=!currentSort.asc;else{currentSort.col=c;currentSort.asc=c==='patient'||c==='therapeut';}renderTable();}
function setWeeks(w,el){minWeeks=w;document.querySelectorAll('#offeneContainer .flt .fb').forEach(p=>{if(!p.dataset.s)p.classList.remove('a')});el.classList.add('a');renderTable();}
function setStandort(s,el){standortFilter=s;document.querySelectorAll('#offeneContainer .flt .fb[data-s]').forEach(p=>p.classList.remove('a'));el.classList.add('a');
  if(offenTV&&offenTV.length)renderOffenTable();else renderTable();}
function toggleDetail(i,b){document.getElementById('detail-'+i).classList.toggle('open');b.classList.toggle('open');}
function setStatus(p,s){if(statusMap[p]===s)delete statusMap[p];else statusMap[p]=s;localStorage.setItem('rezeptStatus',JSON.stringify(statusMap));renderTable();}

async function autoDetectWLPatients(allRows){
  const now=new Date(),cutoff=new Date(now.getTime()-21*24*60*60*1000);
  const patients={};
  for(const r of allRows){if(!r.patient||!r.datum||r.abgerechnet)continue;if(/Hausbesuch|Ausfallrechnung|PhFiP.?Club|FBE/i.test(r.leistung))continue;const k=r.patient;if(!patients[k])patients[k]={patient:r.patient,therapeut:r.therapeut,standort:r.standort,lastDate:null,leistung:r.leistung};if(!patients[k].lastDate||r.datum>patients[k].lastDate){patients[k].lastDate=r.datum;patients[k].therapeut=r.therapeut;patients[k].leistung=r.leistung;patients[k].standort=r.standort;}}
  const existing=new Set(wlData.map(w=>w.patient.toLowerCase()));
  const autoPatients=Object.values(patients).filter(p=>p.lastDate&&p.lastDate<cutoff&&!existing.has(p.patient.toLowerCase()));
  if(!autoPatients.length)return;
  const user='🤖 System';const nowStr=new Date().toLocaleDateString('de-DE');
  const did=drives.kimojo;if(!did)return;
  let nextRow=wlData.length+2;
  for(const p of autoPatients.slice(0,50)){const daysAgo=Math.floor((now-p.lastDate)/(864e5));const fd=p.lastDate.toLocaleDateString('de-DE');const values=[p.patient,'',pName(p.therapeut),p.standort,'Normal','Auto-Erkannt','Flexibel',`Seit ${daysAgo} Tagen kein Termin`,'Neu',p.leistung,fd,String(daysAgo),nowStr,user];try{await writeWLRow(nextRow,values);nextRow++;}catch(e){console.warn('Auto-write:',e);}}
  await loadWL();
}

// PORTIERUNG CKI-DASHBOARD  ·  Darstellungsschicht
// ---------------------------------------------------------------------------
// Alles ab hier ist neu und rührt die Datenlade- und Analyse-Logik nicht an.
// Gerechnet wird ausschließlich auf dem, was loadAll ohnehin schon gebaut hat:
// DATA (Terminpläne), RCS (Rezept-Buckets), offenTV (Abrechnungsstand) und VOD
// (Rohdaten je Standort).
//
// Zustand liegt komplett im localStorage unter dem Prefix kimojo_. Das ist
// Absicht: Werneck hat keine Schreib-API in thevea, und ein Haken am Empfang
// darf nicht davon abhängen, dass irgendwo ein Dienst läuft. Der Preis ist,
// dass Haken und Zuweisungen am Gerät kleben — deshalb der Export im Reiter
// Verlauf. Das Prefix trennt Werneck sauber vom Kitzinger Dashboard (cki_).
// ═══════════════════════════════════════════════════════════════════════════

function lsGet(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v);}catch(e){return fallback;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
// Für onclick-Attribute: ein Apostroph im Namen zerlegt sonst den Handler.
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function hhmm(d){return d instanceof Date&&!isNaN(d)?d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';}

// ═══════════════════════════════════════════════════════════════════════════
// AUFGABEN-PROTOKOLL — geteilt über SharePoint, eine Datei je Person und Monat
// ═══════════════════════════════════════════════════════════════════════════
// Warum eine Datei je Person und nicht eine gemeinsame?
//   Weil damit die ganze Klasse der Schreibkonflikte verschwindet. Zwei Leute,
//   die gleichzeitig abhaken, schreiben in zwei verschiedene Dateien — niemand
//   überschreibt niemanden. Eine gemeinsame Datei bräuchte Sperren oder ETags,
//   und der Preis eines Fehlers wäre ein still verlorener Haken. Genau das
//   würde am Empfang niemand bemerken.
//
// Warum ein Ereignisprotokoll und kein Zustand ("Haken ja/nein")?
//   Weil der Report sonst nicht zu bauen wäre. Die Aufgabenliste wird bei
//   jedem Laden neu aus den thevea-Daten berechnet; was erledigt ist,
//   verschwindet daraus. Ein reiner Zustand kann deshalb nie beantworten, wer
//   letzte Woche wie viel geschafft hat — die Frage wäre für immer verloren.
//   Der Zustand wird stattdessen abgeleitet: je Aufgabe zählt das jüngste
//   Ereignis.
//
// Warum bleibt der localStorage trotzdem?
//   Als Notbetrieb. Ist SharePoint nicht erreichbar oder die Anmeldung
//   abgelaufen, muss ein Haken am Empfang weiter funktionieren. Er ist dann
//   nur lokal — und die Teamleiste sagt das auch.
const AUF_DIR='/12_Code/Patientenchecker/Dateien Export/aufgaben/';
const AUF_V=1;
const AUF_TEAM_DATEI=AUF_DIR+'team.json';
const AUF_GUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

let aufEv=[];              // alle geladenen Ereignisse
let aufStand={};           // Aufgaben-ID       -> jüngstes check-Ereignis
let aufZuw={};             // ID, 'kat:'+c oder 'area:'+a -> jüngstes zuw-Ereignis
let aufBer={};             // Aufgaben-ID       -> jüngstes ber-Ereignis (Bereich)
let aufFrist={};           // Aufgaben-ID       -> jüngstes frist-Ereignis
let aufNotiz={};           // Aufgaben-ID       -> jüngstes notiz-Ereignis
let aufLeute={};           // oid -> {oid,n,mail,quelle}
let aufMonate={};          // 'YYYY-MM' -> true, sobald geladen
let aufBereit=false;       // mindestens einmal erfolgreich geladen
let aufFehler='';          // letzte Störung, für die Anzeige in der Teamleiste
let aufSchreibt=0;         // laufende Schreibvorgänge
let aufManager=[];         // [{oid,n,mail,aktiv}] — die Praxismanager aus team.json
let aufTeamFehler='';      // Störung beim Pflegen oder Suchen, für die Teamleiste
const aufGesehen=new Set();// verhindert Doppelzählung beim Nachladen

// Die Konto-ID (oid) ist die einzige Kennung, die einen Namenswechsel, eine
// Heirat und einen zweiten "Anna" im Team übersteht. Namen sind Anzeige.
function meKonto(){
  try{
    const a=(typeof ma!=='undefined'&&ma&&ma.getActiveAccount)?ma.getActiveAccount():null;
    if(!a)return null;
    const oid=String(a.localAccountId||a.homeAccountId||a.username||'').trim();
    if(!oid)return null;
    return {oid,n:a.name||a.username||'Unbekannt',mail:String(a.username||'').toLowerCase()};
  }catch(_){return null;}
}

// Die Kategorie steckt bereits im Präfix der Aufgaben-ID. Sie daraus abzuleiten
// spart es, jeden der rund zwanzig toggleTask-Aufrufe anzufassen — und kann
// nicht auseinanderlaufen, weil es nur eine Quelle gibt.
const AUF_PRAEFIX={luecke:'luecke',abr:'abr',fvo:'fvo',vpl:'verplan',vplo:'vplOhne',ft:'ft',dplan:'dauer',blanko:'blankopot',rezende:'rezende'};
function aufKatVon(id){return AUF_PRAEFIX[String(id||'').split('|')[0]]||'sonst';}
// Die Ereignisarten als Liste statt als if-Kette: Wer eine weitere ergänzt,
// muss sie hier eintragen — sonst landet sie beim Laden stillschweigend als
// 'check' im Protokoll und setzt fremde Haken.
//   check -> Status              (nutzt ziel: Schlüssel aus AUF_STATUS;
//                                 an bleibt gesetzt, solange der Status 'fertig' ist)
//   zuw   -> Zuständige          (nutzt ziel, Komma-Liste von Konto-IDs)
//   ber   -> Bereich der Aufgabe (nutzt ziel: '' | 'tg' | 'bo')
//   frist -> Fälligkeitsdatum    (nutzt ziel: '' | 'YYYY-MM-DD')
//   notiz -> Freitext            (nutzt ziel)
const AUF_AKT={check:1,zuw:1,ber:1,frist:1,notiz:1};
function aufMonatVon(ts){const d=new Date(ts||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function aufEvKey(e){return e.oid+'|'+e.a+'|'+e.id+'|'+e.ts;}

function aufAbleiten(){
  aufStand={};aufZuw={};aufBer={};aufFrist={};aufNotiz={};
  // Gleichstand auf die Millisekunde ist selten, aber möglich. Dann entscheidet
  // die Konto-ID: willkürlich, aber auf jedem Gerät gleich. Ohne diese Regel
  // könnten zwei Browser dauerhaft verschiedene Haken zeigen, und niemand fände
  // je heraus, warum.
  const nimm=(topf,e)=>{const c=topf[e.id];
    if(!c||e.ts>c.ts||(e.ts===c.ts&&String(e.oid)>String(c.oid)))topf[e.id]=e;};
  // Jede Art hat ihren eigenen Topf. Status, Zuständige, Bereich, Frist und
  // Notiz einer Aufgabe sind unabhängige Angaben — lägen sie in einem Topf,
  // würde das Setzen einer Frist die Zuständigen überschreiben, weil nur das
  // jüngste gilt.
  const toepfe={check:aufStand,zuw:aufZuw,ber:aufBer,frist:aufFrist,notiz:aufNotiz};
  aufEv.forEach(e=>{
    if(!e||!e.id||!e.ts)return;
    const topf=toepfe[e.a];if(topf)nimm(topf,e);
  });
}

// Ein Zugangstoken still erneuern — niemals mit Popup.
//
// getToken() fragt im Zweifel per Popup nach. Aus einem Hintergrund-Takt wäre
// das falsch: Der Browser blockiert Popups ohne Klick, und selbst wenn nicht,
// spränge es dem Nutzer mitten in der Arbeit ins Gesicht. Schlägt die stille
// Erneuerung fehl, hört der Takt auf und sagt es — dann hilft „Neu laden".
async function aufTokenStill(){
  try{
    const a=ma.getActiveAccount();if(!a)return false;
    const r=await ma.acquireTokenSilent({...LR,account:a});
    if(r&&r.accessToken){window._token=r.accessToken;return true;}
  }catch(_){}
  return false;
}

// [{name,mod}] — null heißt „noch nicht gelesen".
let aufOrdnerCache=null;
// lastModifiedDateTime kommt mit der Liste. Der Hintergrund-Abgleich erkennt
// daran, welche Datei neu zu holen ist; eine zweite Abfrage dafür wäre
// Verschwendung, und ohne das Feld müsste er jede Minute alles herunterladen.
async function aufOrdnerLesen(){
  const p=AUF_DIR.split('/').filter(s=>s).map(s=>encodeURIComponent(s)).join('/');
  try{
    let url='https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+p
      +':/children?$select=name,lastModifiedDateTime&$top=200';
    const aus=[];
    while(url){
      const hol=()=>fetch(url,{cache:'no-store',headers:{Authorization:'Bearer '+window._token}});
      let r=await hol();
      // Nach einer Stunde ist das Token abgelaufen. Einmal still erneuern und
      // denselben Aufruf wiederholen — ein abgelaufenes Token ist kein Fehler,
      // sondern der Normalfall an einem Arbeitstag.
      if(r.status===401&&await aufTokenStill())r=await hol();
      // 404 heißt: den Ordner gibt es noch nicht. Das ist kein Fehler, sondern
      // der Zustand vor dem allerersten Haken.
      if(r.status===404){aufOrdnerCache=[];return aufOrdnerCache;}
      if(!r.ok)return null;
      const j=await r.json();
      (j.value||[]).forEach(x=>{if(x&&x.name)
        aus.push({name:x.name,mod:String(x.lastModifiedDateTime||'')});});
      url=j['@odata.nextLink']||null;
    }
    aufOrdnerCache=aus;return aus;
  }catch(_){return null;}
}
// Die Namen. Beim ersten Mal wird gelesen, danach gilt der gemerkte Stand —
// den hält der Hintergrund-Abgleich frisch.
async function aufOrdner(){
  const l=aufOrdnerCache||await aufOrdnerLesen();
  return l?l.map(x=>x.name):null;
}

function aufUebernehmen(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.ev))return;
  const oid=String(d.oid||'');if(!oid)return;
  if(!aufLeute[oid])aufLeute[oid]={oid,n:d.name||d.mail||'Unbekannt',mail:d.mail||'',quelle:'protokoll'};
  else if(d.name)aufLeute[oid].n=d.name;
  d.ev.forEach(e=>{
    if(!e||!e.id||!e.ts)return;
    if(!AUF_AKT[e.a])return;   // unbekannte Art lieber verwerfen als missdeuten
    const n={a:e.a,id:String(e.id),cat:e.cat||aufKatVon(e.id),
             ts:Number(e.ts)||0,an:!!e.an,ziel:e.ziel==null?'':String(e.ziel),
             oid,alt:!!e.alt};
    const k=aufEvKey(n);if(aufGesehen.has(k))return;
    aufGesehen.add(k);aufEv.push(n);
  });
}

async function aufLadeMonate(monate){
  const namen=await aufOrdner();
  if(namen===null){aufFehler='Der Aufgaben-Ordner ließ sich nicht lesen.';return false;}
  const offen=monate.filter(m=>!aufMonate[m]);
  if(!offen.length)return true;
  const passend=namen.filter(n=>/^protokoll-/.test(n)&&offen.some(m=>n.endsWith('-'+m+'.json')));
  // In Achterblöcken, nicht alles auf einmal: Graph quittiert Hunderte
  // gleichzeitiger Anfragen mit 429, und der Browser drosselt ohnehin.
  for(let i=0;i<passend.length;i+=8){
    const teil=await Promise.all(passend.slice(i,i+8).map(async n=>{
      const d=await loadJSONAbs(AUF_DIR+n).catch(()=>null);
      // Den Stand nur bei Erfolg vermerken. Eine Datei, die nicht ankam, muss
      // der nächste Abgleich erneut versuchen — sonst gilt sie als gelesen,
      // obwohl nichts davon in der Liste steht.
      if(d)aufStempel[n]=aufModVon(n);
      return d;
    }));
    teil.forEach(aufUebernehmen);
  }
  offen.forEach(m=>{aufMonate[m]=true;});
  aufBereit=true;aufFehler='';aufAbleiten();
  return true;
}

// Schreibvorgänge laufen hintereinander, nicht gleichzeitig: Zwei schnelle
// Klicks würden sonst beide dieselbe Datei lesen, und der zweite überschriebe
// den ersten. Die Kette kostet Millisekunden und spart genau diesen Fehler.
let aufKette=Promise.resolve();
function aufMerken(roh){
  const k=meKonto();
  const ev={a:roh.a,id:String(roh.id),cat:roh.cat||aufKatVon(roh.id),ts:Date.now(),
            an:!!roh.an,ziel:roh.ziel==null?'':String(roh.ziel),
            oid:k?k.oid:'lokal',alt:false};
  // Erst anzeigen, dann speichern. Ein Haken muss sich sofort setzen; auf eine
  // SharePoint-Antwort zu warten würde sich wie ein Hänger anfühlen.
  aufGesehen.add(aufEvKey(ev));aufEv.push(ev);aufAbleiten();
  // Ein Klick verändert die Zahlen, die das Management-Dashboard liest.
  kennMarkieren();
  if(!k)return Promise.resolve(false);
  if(!aufLeute[k.oid])aufLeute[k.oid]={oid:k.oid,n:k.n,mail:k.mail,quelle:'ich'};
  aufSchreibt++;
  aufKette=aufKette.then(()=>aufSchreiben([ev])).then(ok=>{
    aufSchreibt--;aufFehler=ok?'':'Der letzte Klick ließ sich nicht speichern — er gilt vorerst nur auf diesem Gerät.';
    rerenderTasks();return ok;
  },()=>{aufSchreibt--;aufFehler='Der letzte Klick ließ sich nicht speichern — er gilt vorerst nur auf diesem Gerät.';rerenderTasks();return false;});
  return aufKette;
}

async function aufSchreiben(liste){
  const k=meKonto();if(!k||!liste.length)return false;
  const monat=aufMonatVon(liste[0].ts);
  const nm='protokoll-'+k.oid+'-'+monat+'.json';
  const pfad=AUF_DIR+nm;
  let d=null;try{d=await loadJSONAbs(pfad);}catch(_){d=null;}
  if(!d||typeof d!=='object'||!Array.isArray(d.ev))d={v:AUF_V,oid:k.oid,name:k.n,mail:k.mail,monat,ev:[]};
  d.name=k.n;d.mail=k.mail;   // ein Namenswechsel im Konto zieht mit
  // Beim Status werden BEIDE Felder geschrieben: `ziel` ist der eigentliche
  // Zustand, `an` die alte Ja/Nein-Form davon. So bleibt ein Protokoll auch für
  // einen Stand lesbar, der nur den Haken kennt — und ein Protokoll aus der
  // Zeit vor dem Status bleibt hier lesbar, weil taskStatus auf `an` zurückfällt.
  liste.forEach(e=>{const o={a:e.a,id:e.id,cat:e.cat,ts:e.ts};
    if(e.a==='check')o.an=e.an;
    o.ziel=e.ziel;
    if(e.alt)o.alt=1;d.ev.push(o);});
  const ok=await saveJSONAbs(pfad,d);
  // Die eigene, gerade geschriebene Datei in die gemerkte Liste aufnehmen —
  // sonst käme sie dem Abgleich erst beim nächsten Verzeichnislesen unter.
  // Der Zeitstempel bleibt bewusst leer: Das eigene Ereignis steht schon in
  // aufEv, aber in der Datei können auch Ereignisse eines Kollegen stehen,
  // die nur dort liegen. Ein leerer Stempel heißt „beim nächsten Takt lesen".
  if(ok&&aufOrdnerCache&&!aufOrdnerCache.some(x=>x.name===nm))
    aufOrdnerCache.push({name:nm,mod:''});
  return ok;
}

// ── Einmalige Übernahme des Altbestands ────────────────────────────────────
// Ohne diesen Schritt stünde am Umstellungstag jede bereits erledigte Aufgabe
// wieder offen da, und das Team würde die Liste zweimal abarbeiten. Die
// übernommenen Haken tragen alt:1 und werden im Report NICHT mitgezählt: Ihr
// Zeitstempel ist der Umstellungstag, nicht der Tag, an dem wirklich gearbeitet
// wurde. Sie als Leistung zu zählen wäre eine erfundene Zahl.
async function aufAltbestand(){
  if(lsGet('kimojo_auf_migriert',false))return;
  const k=meKonto();if(!k)return;
  const ts=Date.now(),evs=[];
  const nachOid=n=>{
    const s=String(n||'').trim().toLowerCase();if(!s)return '';
    const tr=Object.keys(aufLeute).find(o=>String(aufLeute[o].n||'').trim().toLowerCase()===s);
    return tr||String(n);   // unbekannter Name bleibt als Klartext stehen
  };
  try{
    const keys=[];for(let i=0;i<localStorage.length;i++){const x=localStorage.key(i);if(x)keys.push(x);}
    keys.forEach(key=>{
      if(key.indexOf('kimojo_check_')===0){
        const id=key.slice(13);
        if(lsGet(key,false)===true)evs.push({a:'check',id,cat:aufKatVon(id),ts,an:true,ziel:'fertig',alt:true});
      }else if(key.indexOf('kimojo_assign_')===0){
        const id=key.slice(14),v=lsGet(key,'');
        if(v)evs.push({a:'zuw',id,cat:aufKatVon(id),ts,an:false,ziel:nachOid(v),alt:true});
      }else if(key.indexOf('kimojo_catassign_')===0){
        const c=key.slice(17),v=lsGet(key,'');
        if(v)evs.push({a:'zuw',id:'kat:'+c,cat:c,ts,an:false,ziel:nachOid(v),alt:true});
      }else if(key.indexOf('kimojo_areaassign_')===0){
        const a=key.slice(18),v=lsGet(key,'');
        if(v)evs.push({a:'zuw',id:'area:'+a,cat:'sonst',ts,an:false,ziel:v,alt:true});
      }else if(key.indexOf('kimojo_taskarea_')===0){
        const id=key.slice(16),v=lsGet(key,'');
        if(v)evs.push({a:'ber',id,cat:aufKatVon(id),ts,an:false,ziel:v,alt:true});
      }else if(key.indexOf('kimojo_catarea_')===0){
        const c=key.slice(15),v=lsGet(key,'');
        if(v)evs.push({a:'ber',id:'kat-ber:'+c,cat:c,ts,an:false,ziel:v,alt:true});
      }else if(key.indexOf('kimojo_frist_')===0){
        const id=key.slice(13),v=lsGet(key,'');
        if(v)evs.push({a:'frist',id,cat:aufKatVon(id),ts,an:false,ziel:v,alt:true});
      }else if(key.indexOf('kimojo_notiz_')===0){
        const id=key.slice(13),v=lsGet(key,'');
        if(v)evs.push({a:'notiz',id,cat:aufKatVon(id),ts,an:false,ziel:v,alt:true});
      }
    });
  }catch(_){return;}
  if(!evs.length){lsSet('kimojo_auf_migriert',true);return;}
  evs.forEach(e=>{e.oid=k.oid;const kk=aufEvKey(e);if(!aufGesehen.has(kk)){aufGesehen.add(kk);aufEv.push(e);}});
  aufAbleiten();
  const ok=await aufSchreiben(evs);
  if(ok)lsSet('kimojo_auf_migriert',true);
}

// ── Praxismanager ──────────────────────────────────────────────────────────
// Zuweisbar ist, wer in team.json als Praxismanager steht — eine bewusst
// gepflegte Liste, keine Automatik. Aufgaben gehen an den Empfang und die
// Praxisleitung, nicht an jeden, der sich einmal angemeldet hat. Wer nur im
// Protokoll vorkommt, bleibt deshalb als NAME lesbar (für alte Zuweisungen und
// den Team-Report), ist aber kein Zuweisungsziel mehr.
//
// Entfernt wird niemand hart: Ein abgewählter Manager bekommt aktiv:false und
// bleibt mit Namen in der Datei stehen. Ohne das zeigte jede Zuweisung, die er
// noch trägt, nach dem nächsten Laden "Unbekannt" — sein Name stünde dann
// nirgends mehr, wenn er selbst nie etwas abgehakt hat.
async function aufTeamKonfig(){
  let d=null;
  try{d=await loadJSONAbs(AUF_TEAM_DATEI);}catch(_){}
  aufManager=(d&&Array.isArray(d.manager)?d.manager:[])
    .filter(m=>m&&m.oid)
    .map(m=>({oid:String(m.oid),n:String(m.n||m.mail||'Unbekannt'),
              mail:String(m.mail||'').toLowerCase(),aktiv:m.aktiv!==false}));
  // Auch ins Namensregister, damit eine Zuweisung sofort einen Namen zeigt und
  // nicht erst, wenn die Person selbst das erste Mal etwas abgehakt hat.
  aufManager.forEach(m=>{
    if(aufLeute[m.oid]){aufLeute[m.oid].n=m.n;aufLeute[m.oid].quelle='manager';}
    else aufLeute[m.oid]={oid:m.oid,n:m.n,mail:m.mail,quelle:'manager'};
  });
}

// Pflegen heißt: lesen, ändern, zurückschreiben. Dazwischen liegen
// Millisekunden, aber zwei Klicks hintereinander würden sich sonst gegenseitig
// überschreiben — der zweite liest, bevor der erste geschrieben hat. Die Kette
// serialisiert das. Zwei Personen gleichzeitig deckt sie nicht ab; bei einer
// Datei, die im Monat zweimal angefasst wird, ist das vertretbar.
let aufTeamKette=Promise.resolve();
function aufTeamSchreiben(aendern){
  aufTeamKette=aufTeamKette.then(async()=>{
    let d=null;
    try{d=await loadJSONAbs(AUF_TEAM_DATEI);}catch(_){}
    const liste=(d&&Array.isArray(d.manager)?d.manager:[]).filter(m=>m&&m.oid)
      .map(m=>({oid:String(m.oid),n:String(m.n||''),mail:String(m.mail||''),aktiv:m.aktiv!==false}));
    const ok=await saveJSONAbs(AUF_TEAM_DATEI,
      {v:AUF_V,manager:aendern(liste),von:meName(),zeit:Date.now()});
    aufTeamFehler=ok?'':'Die Praxismanager-Liste ließ sich nicht speichern — bitte neu laden und erneut versuchen.';
    if(ok)await aufTeamKonfig();
    rerenderTasks();
    return ok;
  },()=>false);
  return aufTeamKette;
}
function aufManagerDazu(oid,n,mail){
  return aufTeamSchreiben(l=>{
    const t=l.find(m=>m.oid===String(oid));
    if(t){t.aktiv=true;t.n=String(n||t.n);t.mail=String(mail||t.mail);}
    else l.push({oid:String(oid),n:String(n||''),mail:String(mail||''),aktiv:true});
    return l;
  });
}
function aufManagerRaus(oid){
  if(!confirm('"'+personName(oid)+'" aus den Praxismanagern nehmen?\n\nBereits vergebene Zuweisungen bleiben bestehen und lesbar — die Person ist nur kein Ziel für neue Zuweisungen mehr.'))return;
  return aufTeamSchreiben(l=>{const t=l.find(m=>m.oid===String(oid));if(t)t.aktiv=false;return l;});
}

// ── Nutzersuche im Verzeichnis ─────────────────────────────────────────────
// Getrennter Token, weil dieses Recht eine eigene Zustimmung braucht: Steckte
// es im Anmelde-Token, würde eine fehlende Zustimmung die ganze Anmeldung
// blockieren. So scheitert im schlimmsten Fall nur die Suche, und das Dashboard
// läuft weiter. Geholt wird erst, wenn jemand tippt — ein Zustimmungsfenster
// bei jedem Seitenaufruf wäre eine Zumutung.
//
// User.ReadBasic.All ist als DELEGIERTE Berechtigung ausdrücklich ohne
// Admin-Zustimmung freigegeben (Graph-Referenz: AdminConsentRequired = No; nur
// die Anwendungs-Variante verlangt einen Admin). Eingetragen sein muss sie in
// der App-Registrierung trotzdem — zustimmen darf dann jeder selbst, solange
// der Tenant die Nutzer-Zustimmung nicht abgeschaltet hat. Deshalb nennen die
// Meldungen unten den Eintrag, nicht pauschal "frag einen Admin".
const AUF_TEAM_SCOPES=["User.ReadBasic.All"];
let aufTeamToken='';
async function aufHoleTeamToken(){
  if(aufTeamToken)return aufTeamToken;
  let a=null;try{a=ma.getActiveAccount();}catch(_){}
  if(!a)return '';
  try{
    const r=await ma.acquireTokenSilent({scopes:AUF_TEAM_SCOPES,account:a});
    aufTeamToken=r.accessToken;return aufTeamToken;
  }catch(_){}
  try{
    const r=isMobile
      ? await ma.acquireTokenRedirect({scopes:AUF_TEAM_SCOPES})
      : await ma.acquireTokenPopup({scopes:AUF_TEAM_SCOPES,account:a,redirectUri:POPUP_REDIRECT});
    if(!r||!r.accessToken)return '';
    aufTeamToken=r.accessToken;aufTeamFehler='';return aufTeamToken;
  }catch(e){
    aufTeamFehler='Die Nutzersuche wurde nicht freigegeben: '+(e&&e.message?e.message:'unbekannt')
      +' — dafür muss User.ReadBasic.All in der App-Registrierung als delegierte Berechtigung eingetragen sein.';
    return '';
  }
}

let aufSucheQ='',aufSucheTreffer=[],aufSucheLaeuft=false,aufSucheTimer=null;
function aufSucheInput(v){
  aufSucheQ=String(v);
  if(aufSucheTimer)clearTimeout(aufSucheTimer);
  // Unter zwei Zeichen lohnt die Anfrage nicht — sie träfe halbe Belegschaften.
  if(aufSucheQ.trim().length<2){aufSucheTreffer=[];aufSucheLaeuft=false;aufSucheRender();return;}
  // 300 ms Ruhe vor dem Call: Ohne die Verzögerung schickt jeder Tastendruck
  // eine Anfrage, und Graph quittiert das irgendwann mit 429.
  aufSucheTimer=setTimeout(()=>aufSuchen(aufSucheQ.trim()),300);
}
async function aufSuchen(q){
  aufSucheLaeuft=true;aufTeamFehler='';aufSucheRender();
  const tok=await aufHoleTeamToken();
  if(!tok){aufSucheLaeuft=false;aufSucheTreffer=[];aufSucheRender();return;}
  try{
    // $search statt startswith: findet "nüß" auch mitten in "Vanessa Nüßlein".
    // Dafür verlangt Graph zwingend den Header ConsistencyLevel: eventual —
    // ohne ihn antwortet er mit 400.
    const t=q.replace(/"/g,'');
    const url='https://graph.microsoft.com/v1.0/users?$select=id,displayName,mail,userPrincipalName&$top=15'
      +'&$search='+encodeURIComponent('"displayName:'+t+'" OR "mail:'+t+'"');
    const r=await fetch(url,{cache:'no-store',
      headers:{Authorization:'Bearer '+tok,ConsistencyLevel:'eventual'}});
    if(r.status===403){
      // Die Ursache steht hier, weil sie sonst nur im Netzwerk-Tab sichtbar wäre.
      aufTeamFehler='Die Nutzersuche ist nicht freigegeben: In der App-Registrierung "BM Group Dashboard" fehlt die delegierte Berechtigung User.ReadBasic.All.';
      aufSucheTreffer=[];
    }else if(!r.ok){
      aufTeamFehler='Die Suche schlug fehl (HTTP '+r.status+').';aufSucheTreffer=[];
    }else{
      const j=await r.json();
      aufSucheTreffer=(j.value||[])
        .filter(u=>u&&u.id&&(u.displayName||u.mail||u.userPrincipalName))
        .map(u=>({oid:String(u.id),n:u.displayName||u.mail||u.userPrincipalName,
                  mail:String(u.mail||u.userPrincipalName||'').toLowerCase()}));
    }
  }catch(_){aufTeamFehler='Die Suche schlug fehl.';aufSucheTreffer=[];}
  aufSucheLaeuft=false;aufSucheRender();
}

// Die Trefferzeile hängt unter der Teamleiste und wird einzeln aktualisiert,
// nicht über rerenderTasks: Ein Neubau der ganzen Leiste bei jedem Tastendruck
// würde den Fokus aus dem Suchfeld reißen.
function aufSucheMarkup(){
  if(aufSucheQ.trim().length<2)return '';
  if(aufSucheLaeuft)return '<span class="tm-empty">sucht…</span>';
  if(!aufSucheTreffer.length)return '<span class="tm-empty">kein Treffer im Verzeichnis</span>';
  const drin=new Set(aufManager.filter(m=>m.aktiv).map(m=>m.oid));
  return aufSucheTreffer.map(u=>drin.has(u.oid)
    ? '<span class="tm-chip" style="opacity:.45" title="'+escA(u.mail)+'">'+esc(u.n)+' · schon dabei</span>'
    : '<button class="tm-addbtn" title="'+escA(u.mail)+'" onclick="aufManagerDazu(\''+jsq(u.oid)+'\',\''+jsq(u.n)+'\',\''+jsq(u.mail)+'\')">+ '+esc(u.n)+'</button>'
  ).join('');
}
function aufSucheRender(){
  const el=document.getElementById('tmTreffer');
  if(el)el.innerHTML=aufSucheMarkup();
}

// Welche Monate der Ordner überhaupt hergibt. Die Dateinamen tragen den Monat
// am Ende (protokoll-<oid>-YYYY-MM.json), also muss dafür keine Datei geöffnet
// werden — die Verzeichnisliste reicht.
function aufAlleMonate(namen){
  const s=new Set();
  // Das Präfix muss mit geprüft werden. Im selben Ordner liegen andere Dateien
  // mit Monat im Namen; ohne das Präfix würde ein Monat als geladen vermerkt,
  // zu dem es gar kein Protokoll gibt — und nie wieder nachgesehen.
  (namen||[]).forEach(n=>{const m=/^protokoll-.*-(\d{4}-\d{2})\.json$/.exec(String(n));if(m)s.add(m[1]);});
  return[...s].sort();
}

// Nach dem Start alles Übrige, im Hintergrund.
//
// Warum überhaupt alles? Eine Aufgabe lebt so lange wie ihr Rezept, und das sind
// Monate. Wer im Juli abgehakt hat, dessen Ereignis liegt in der Juli-Datei. Mit
// einem Fenster von zwei Monaten stand dieselbe Aufgabe im Oktober wieder offen
// da — und zwar nur bei den Kollegen, denn im Browser des Klickenden hielt der
// localStorage den Haken noch. Genau diese Asymmetrie war der Fehler: Zwei Leute
// sahen zwei verschiedene Listen und keiner konnte wissen, wer richtig lag.
//
// Warum nicht gleich beim Start? Weil der laufende Monat der häufige Fall ist.
// Er ist nach zwei Dateien da; auf den ganzen Ordner zu warten würde jeden Start
// so lang machen wie die Historie.
async function aufLadeRest(){
  const namen=await aufOrdner();if(!namen)return;
  const offen=aufAlleMonate(namen).filter(m=>!aufMonate[m]);
  if(!offen.length)return;
  await aufLadeMonate(offen);
}

// Beim Start: Praxismanager, laufender und Vormonat. Der Vormonat muss mit,
// weil eine Aufgabe vom 31. am 1. noch offen sein kann und ihr Haken sonst
// unsichtbar wäre.
async function aufStart(){
  try{
    const jetzt=new Date(),vor=new Date(jetzt.getFullYear(),jetzt.getMonth()-1,1);
    await aufTeamKonfig();
    await aufLadeMonate([aufMonatVon(vor.getTime()),aufMonatVon(jetzt.getTime())]);
    rerenderTasks();
    // Der Altbestand wartet auf den vollen Stand. Die Übernahme schreibt aus dem
    // localStorage ausschließlich „fertig"; liefe sie vor dem Nachladen, würde
    // ihr frischer Zeitstempel ein älteres „Abgelehnt" aus einem fernen Monat
    // überstimmen und eine getroffene Entscheidung stillschweigend umdrehen.
    await aufLadeRest();
    await aufAltbestand();
    rerenderTasks();
  }catch(e){console.warn('Aufgaben-Protokoll:',e);}
}

// ═══════════════════════════════════════════════════════════════════════════
// KENNZAHLENDATEI
// ---------------------------------------------------------------------------
// Eine Datei je Monat, geschrieben nach jedem Laden. Das Management-Dashboard
// liest sie und zeigt daraus den Reiter „Praxismanagement" — keine Schnittstelle
// dazwischen, keine zweite Rechnung.
//
// Eine Schnittstelle wäre auch nicht möglich: Beide Dashboards sind Browser-
// Seiten, keine Server. Eine Seite, die niemand offen hat, kann nichts
// beantworten. Die Datei ist deshalb nicht der Transportweg — sie IST die
// Messung. Wer sie liest, bekommt den Stand von dem Moment, in dem sie zuletzt
// geschrieben wurde, und der Zeitstempel sagt genau, wann das war.
//
// Nachgerechnet wird nichts: Jede Zahl hier ist dieselbe, die der Reiter im
// Patientenchecker zeigt. Zwei Implementierungen derselben Kennzahl laufen
// auseinander, und danach traut man keiner von beiden mehr.
//
// Gleichzeitiges Schreiben aus zwei Browsern kann eine gerade nachgetragene
// Telefonie-Korrektur verlieren. Das ist in Kauf genommen: Der nächste Lauf
// holt sie wieder, weil die Telefoniezahlen des ganzen Monats jedes Mal neu
// gerechnet werden.
// ═══════════════════════════════════════════════════════════════════════════
const KENN_DIR='/12_Code/Patientenchecker/Dateien Export/kennzahlen/';
// 2: Auslastung je Therapeut, getrennte Zeittöpfe, bereinigte Quote.
// 3: Tagespensum statt Momentaufnahme bei den Aufgaben.
// 4: Das Pensum merkt sich auch den Bereich, nicht nur die Kategorie.
// Jede Erhöhung wirft die älteren Dateien absichtlich weg. Sie tragen Zahlen,
// die anders gemeint waren — die Auslastung aus der Zeit vor dem Fehlerfund,
// die Aufgabenquote aus der Zeit vor dem Pensum. Unvollständig wäre
// hinnehmbar, falsch nicht.
const KENN_V=4;
function kennDatei(monat){return KENN_DIR+'kennzahlen-'+monat+'.json';}

// ── Die Aufgabenliste des Tages ────────────────────────────────────────────
// Die Kennzahlendatei hält die ZAHLEN eines Tages fest. Für die Frage „was war
// da eigentlich los" reicht das nicht — dafür braucht es die Liste selbst.
//
// Sie bekommt eine eigene Datei JE TAG. Rund 95 KB, und geladen wird immer nur
// die eine, die man gerade ansieht. In der Monatsdatei stünden am Monatsende
// zwei Megabyte, die beide Dashboards bei jedem Öffnen mitziehen müssten.
//
// Gespeichert wird nur, was sich NICHT rekonstruieren lässt: die Aufgaben
// selbst. Status, Notiz, Zuständige und Frist stehen im Protokoll und werden
// von dort geholt — sonst lägen dieselben Angaben doppelt, und die Kopie wäre
// die, die irgendwann veraltet.
const TZL_V=1;
function tzlDatei(ds){return KENN_DIR+'tagesziel/tagesziel-'+ds+'.json';}
// Als Arrays statt als Objekte: bei 640 Zeilen spart das ein Viertel der Datei,
// und die Reihenfolge steht hier direkt daneben.
const TZL_FELD=['id','cat','txt','sub','name','pid','loc'];
function tzlPacken(alle){
  return(alle||[]).map(t=>TZL_FELD.map(f=>t[f]==null?'':String(t[f])));
}
function tzlEntpacken(rows){
  return(rows||[]).map(r=>{const o={};TZL_FELD.forEach((f,i)=>{o[f]=r[i]||'';});
    o.ico=(TZ_KAT[o.cat]&&TZ_KAT[o.cat].ico)||'•';return o;});
}
async function tzlSchreiben(ds,alle){
  if(!ds||!alle)return false;
  try{return await saveJSONAbs(tzlDatei(ds),
    {v:TZL_V,ds,stand:Date.now(),n:alle.length,tasks:tzlPacken(alle)});}
  catch(e){return false;}
}
// Gemerkt je Tag. `false` heißt „nachgesehen, gibt es nicht" — das ist etwas
// anderes als „noch nicht nachgesehen" und darf nicht erneut laden.
const tzlCache={};
async function tzlLaden(ds){
  if(ds in tzlCache)return tzlCache[ds];
  tzlCache[ds]=null;
  try{
    const f=await loadJSONAbs(tzlDatei(ds));
    tzlCache[ds]=(f&&f.v===TZL_V&&Array.isArray(f.tasks))?tzlEntpacken(f.tasks):false;
  }catch(e){tzlCache[ds]=false;}
  return tzlCache[ds];
}

// ── Das Tagespensum im Blick des Praxismanagers ────────────────────────────
// Dieselbe Buchführung, die kennAufgaben für das Management-Dashboard
// schreibt, muss auch hier sichtbar sein. Sonst passiert genau das, was der
// Reiter heute tut: Eine Lücke wird geschlossen, beim nächsten Export ist sie
// weg — und oben ändert sich keine Zahl. Wer gut arbeitet, sieht nichts davon,
// und die Führung sieht nicht, was getan wurde.
//
// NICHT neu gerechnet, sondern DIESELBE Liste gelesen: `aufPensum` ist der
// Stand aus der Kennzahlendatei (Kurzschlüssel -> „Kategorie|Bereich|Standort")
// für den Tag des Exports. Zwei Implementierungen derselben Zahl liefen sonst
// auseinander, und danach traut man keiner.
let aufPensum={},aufPensumTag='';
// Die vollständige Aufgabenliste des letzten Laufs — der Rohstoff für die
// Tagesdatei. Steht hier, weil kennAufgaben sie ohnehin baut.
let aufTagesListe=null;
// Sind die Quellen des Tages überhaupt vollständig geladen?
//
// „Erledigt durch die Ursache" wird durch VERGLEICH erkannt: Was im Pensum
// steht und jetzt fehlt, gilt als getan. Fehlt dagegen eine Quelle, fehlen auf
// einen Schlag alle Aufgaben, die aus ihr kommen — und das sähe aus wie ein
// perfekter Tag. Eine nicht geladene Verordnungsübersicht hätte am 08.10.2026
// allein 197 Abrechnungen als erledigt gemeldet.
//
// Geprüft werden beide Quellen, aus denen Aufgaben entstehen: der Terminplan
// je Standort und die Verordnungsübersicht. Fehlt eine, wird gar nichts
// gezählt — zu wenig Erfolg zu zeigen ist der harmlosere Fehler.
function aufQuellenDa(){
  return LOCS.every(l=>{
    const dd=DATA[l.suf];
    if(!(dd&&dd.heute&&Array.isArray(dd.heute.tp)&&dd.heute.tp.length))return false;
    return!!(VOD[l.id]&&VOD[l.id].vo);
  });
}
// Was aus dem Pensum heute weggefallen ist — gefiltert wie die Ansicht selbst,
// sonst nennt der Kopf eine Zahl, die in der Liste darunter nicht vorkommt.
// `drin` sind die Kurzschlüssel, die JETZT noch dastehen.
function aufEntfallen(drin,area,locId){
  // `ohneLoc` zählt die Einträge, die mangels Standortangabe in dieser Ansicht
  // fehlen. Ohne diese Zahl widersprächen sich die Reiter stillschweigend:
  // „Alle" zeigte 28, Physio 2 und Ergo 0 — und niemand könnte sehen, warum.
  // Benannt wird sie an beiden Stellen, und sie verschwindet von selbst, sobald
  // die Einträge von heute früh aus dem Pensum gelaufen sind.
  const out={n:0,jeKat:{},jeKatGes:{},jePerson:{},ohneBer:0,ohneLoc:0};
  Object.keys(aufPensum).forEach(k=>{
    const[kat,ber,loc]=String(aufPensum[k]).split('|');
    if(area&&area!=='alle'&&ber!==area)return;
    // Standortwahl: Alles, was nicht hierher gehört, fällt raus — auch die
    // älteren Einträge ohne Standortangabe. Zähler und Nenner müssen dieselbe
    // Menge meinen, sonst stünde „9 von 27" über zwei verschiedenen Mengen.
    // Nur die weggefallenen davon werden als „ohne Standort" ausgewiesen; die
    // noch offenen stehen ja in der Liste und brauchen keinen Hinweis.
    if(locId&&locId!==TZ_ALLE&&loc!==locId){
      if(!loc&&!drin.has(k))out.ohneLoc++;
      return;
    }
    // Das Tagespensum je Kategorie — der Nenner für „9 von 27 Lücken". Gezählt
    // wird hier ALLES, was heute anlag, auch was noch offen ist; erst danach
    // kommt die Frage, was davon weg ist.
    out.jeKatGes[kat||'?']=(out.jeKatGes[kat||'?']||0)+1;
    if(drin.has(k))return;
    // Unter „Alle" zählen die standortlosen mit — dort fehlt nichts. Die Zahl
    // steht trotzdem dabei, weil sie erklärt, warum Physio und Ergo zusammen
    // weniger ergeben.
    if(!loc)out.ohneLoc++;
    out.n++;out.jeKat[kat||'?']=(out.jeKat[kat||'?']||0)+1;
    // Wer war dafür zuständig? Die Aufgabe ist weg, ihre Zuweisung damit auch
    // — was bleibt, ist der BEREICH im Pensum und die stehende Besetzung
    // dieses Bereichs. Das ist eine Zuordnung über die Zuständigkeit, keine
    // Beobachtung: Es sagt, wer dafür eingeteilt war, nicht wer es getan hat.
    // Steht niemand im Bereich oder trägt die Aufgabe gar keinen, wird nichts
    // erfunden — sie zählt unter „ohne Bereich".
    const wer=(ber&&ber!=='ohne')?getAreaAssign(ber):[];
    if(!wer.length){out.ohneBer++;return;}
    wer.forEach(o=>{out.jePerson[o]=(out.jePerson[o]||0)+1;});
  });
  return out;
}
// Beim Start einmal lesen. Ohne das stünde bis zum ersten Schreibtakt kein
// Pensum zur Verfügung, und die Zahlen sprängen fünf Minuten nach dem Laden.
async function kennPensumLaden(){
  try{
    const f=await loadJSONAbs(kennDatei(aufMonatVon(Date.now())));
    const tag=kennDatenTag();if(!f||!Array.isArray(f.tage)||!tag)return;
    const e=f.tage.filter(t=>t&&t.ds===tag)[0];
    if(e&&e.auf&&e.auf.pensum){aufPensum=e.auf.pensum;aufPensumTag=tag;}
  }catch(e){}
}

// Tageszeilen der Telefonie — BEWUSST nicht über telRoh(). Diese Funktion
// gehorcht den Filtern des Telefonie-Reiters (Standort, Zeitfenster). Die
// geschriebene Zahl darf aber nicht davon abhängen, was jemand zufällig
// ausgewählt hatte, als die Seite geladen wurde.
function kennTelTage(von,bis){
  const alle=(telData&&Array.isArray(telData.tage))?telData.tage:[];
  const m={};
  alle.forEach(t=>{
    const d=String((t&&t.tag)||'').slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(von&&(d<von||d>bis))return;
    (m[d]=m[d]||[]).push(t);
  });
  return Object.keys(m).sort().map(d=>{const r=telFasse(m[d],d,d);r.tag=d;return r;});
}

// Ab wie vielen verlorenen Anrufern am Tag überhaupt eine Problemstunde
// benannt wird. Dieselbe Schwelle wie im Telefonie-Reiter: Darunter schlägt
// eine Stunde mit 2 von 3 verlorenen Anrufen die 9-Uhr-Spitze mit 1 von 10,
// und die „Spitze" ist dann Zufall.
const KENN_SPITZE_MIN=8;
function kennTel(e){
  if(!e)return null;
  const r1=v=>v==null?null:Math.round(v*10)/10;
  const o={anrufe:e.anrufe,ws:e.ws,wsAn:e.wsAn,absage:e.absage,
    wollten:e.wollten,quote:r1(e.quote),durch:r1(e.durch),
    verloren:e.verloren,echtVerloren:e.echtVerloren,
    aus:e.aus,wart:e.wart==null?null:Math.round(e.wart),
    spitze:null};
  const st=Object.keys(e.std||{}).map(Number).filter(h=>h>=0&&h<=23).map(h=>{
    const a=e.std[h],g=k=>Number(a[k])||0;
    return{h,verpasst:g('wsVm')+g('wsWeg')+g('menu')};
  });
  const ges=st.reduce((s,x)=>s+x.verpasst,0);
  if(ges>=KENN_SPITZE_MIN){
    const b=st.slice().sort((a,b)=>b.verpasst-a.verpasst)[0];
    if(b&&b.verpasst>0)o.spitze={h:b.h,verpasst:b.verpasst};
  }
  return o;
}

// Auslastung und Lücken eines Standorts an einem Tag.
//
// `ausl` ist der Mittelwert der Therapeuten-Auslastungen, nicht Patientenzeit
// durch Arbeitszeit über alle. Das ist dieselbe Zahl, die der Reiter „Lücken"
// oben trägt — darum stehen `wm` und `pm` mit in der Datei: Wer später lieber
// gewichtet rechnen will, kann es, ohne dass sich das Dateiformat ändert.
function kennLoc(locId,sub){
  const loc=LOCS.find(l=>l.id===locId);if(!loc)return null;
  const dd=DATA[loc.suf];if(!dd||!dd[sub]||!dd[sub].tp||!dd[sub].tp.length)return null;
  const f=filterTP(dd[sub].tp,dd[sub].az,loc.filter);
  if(!f.tp.length)return null;
  const I=analyzeDay(f.tp,f.az),act=I.act||[];
  const r=m=>Math.round(m||0);
  // Jeder Therapeut mit seinen Zahlen — nicht nur die mit Lücken. „Wie viel
  // ihrer acht Stunden war Sophia am Patienten" muss auch für den beantwortbar
  // sein, der an dem Tag lückenlos durchgearbeitet hat.
  const th=act.map(t=>({name:t.name,au:t.au,auB:t.auB,
      wm:r(t.wm),vm:r(t.vm),pm:r(t.pm),aus:r(t.pmAus),ausFahrt:r(t.ausFahrt),
      blk:r(t.blk),rsv:r(t.rsv),son:r(t.son),
      kggFrei:t.kggFrei||0,kggMin:r(t.kggMin),
      // Die Touren dieses Therapeuten, einzeln. Wer außer Haus war und was die
      // Tour gebracht hat, ist eine Frage an die Person, nicht an den
      // Standort — eine Summe über elf Therapeuten beantwortet sie nicht.
      // Künftige Tage tragen keine, siehe hb weiter unten.
      touren:(String(f.tp[0].Beginn||'').slice(0,10)>isoDay(0))?[]
        :(t.touren||[]).map(x=>({txt:x.txt,min:x.min,n:x.n,geraten:x.geraten,
            ums:x.ums,eurH:x.eurH,bewertbar:x.bewertbar})),
      pc:t.pc,n:(t.gaps||[]).length,min:r(t.gt)}))
    .sort((a,b)=>a.au-b.au);
  return{ds:String(f.tp[0].Beginn||'').slice(0,10),
    // ausl ist die Praxiszahl: Patientenzeit geteilt durch Arbeitszeit über
    // alle. auslSchnitt ist der Schnitt über die Köpfe — eine andere Frage,
    // und ihre Verwechslung ist die häufigste stille Fehldeutung einer
    // Auslastung. Deshalb stehen beide in der Datei.
    ausl:I.aG,auslB:I.aB,auslSchnitt:I.aA,
    wm:r(I.sWm),vm:r(I.sVm),pg:r(I.sPg),pm:r(I.sPm),
    aus:r(I.sAus),ausFahrt:r(I.sAusFahrt),blk:r(I.sBlk),rsv:r(I.sRsv),son:r(I.sSon),
    // Die Aufschlüsselung, nach Minuten sortiert und auf die größten Posten
    // begrenzt. Hundertachtundsechzig verschiedene Bezeichnungen vollständig
    // in jede Monatsdatei zu schreiben wäre Ballast; die Spitze erklärt die
    // Zahl, der Rest steht als Sammelposten.
    sonDetail:Object.keys(I.sSonDetail||{}).map(k=>[k,r(I.sSonDetail[k])])
      .filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,14),
    th:act.length,abwesend:(I.absent||[]).length,termine:I.tp2,
    freiMin:r(I.tgm),luecken:act.reduce((s,t)=>s+(t.gaps||[]).length,0),slots:I.ps,
    // Wann die Lücken liegen, Stunde für Stunde. Erst daraus lässt sich etwas
    // tun: Steht freitags ab 15 Uhr jede Woche dasselbe Loch, verlegt man
    // Arbeitszeit oder legt einen Kurs hinein.
    //
    // Eine Lücke über eine volle Stunde hinweg wird aufgeteilt — sonst stünde
    // eine von 11:40 bis 12:40 vollständig unter „11 Uhr" und das Mittagsloch
    // wäre unsichtbar. Freie KGG-Plätze bleiben draußen: Sie sind unverkaufte
    // Kapazität bei beschäftigtem Therapeuten, keine Zeitlücke.
    luStd:(()=>{
      const o={};
      act.forEach(t=>(t.gaps||[]).forEach(g=>{
        if(g.kgg)return;
        let a=new Date(g.start);const e=new Date(g.end);
        while(a<e){
          const h=a.getHours(),naechste=new Date(a);
          naechste.setHours(h+1,0,0,0);
          const bis=naechste<e?naechste:e;
          o[h]=(o[h]||0)+(bis-a)/6e4;
          a=bis;
        }
      }));
      Object.keys(o).forEach(k=>{o[k]=Math.round(o[k]);});
      return o;
    })(),
    // Fehlende KGG-Plätze stehen getrennt: Unterbesetzte Gruppenkapazität bei
    // beschäftigtem Therapeuten ist keine Zeitlücke.
    kggFrei:I.sKggFrei,kggMin:r(I.sKggMin),
    // Die Touren, zusammengefasst — aber NUR rückblickend.
    //
    // Hausbesuche werden nicht im Voraus geplant: Ein Heimblock für nächsten
    // Dienstag steht im Kalender, die Patienten darin stehen noch nicht fest.
    // Ihn zu bewerten hieße, fehlende Planung als fehlenden Umsatz zu zeigen.
    // Sieben von acht scheinbar leeren Touren lagen genau deshalb in der
    // Zukunft. Für kommende Tage bleibt das Feld leer.
    //
    // Bewertbar und nicht bewertbar bleiben auch rückblickend getrennt: Eine
    // vergangene Tour ohne eingetragene Termine sagt nichts über
    // Wirtschaftlichkeit, sondern über Kalenderpflege.
    hb:(String(f.tp[0].Beginn||'').slice(0,10)>isoDay(0))?null:(()=>{
      const T=I.sTouren||[],B=T.filter(x=>x.bewertbar);
      const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
      const bMin=sum(B,x=>x.min),bUms=sum(B,x=>x.ums);
      return{touren:T.length,min:sum(T,x=>x.min),
        bewertbar:B.length,bMin,bUms,
        eurH:bMin?Math.round(100*60*bUms/bMin)/100:null,
        unterZiel:B.filter(x=>x.eurH<HB_ZIEL).length,
        ohneTermine:T.filter(x=>x.n===0).length,
        // Wie viele Behandlungen mit dem Standardsatz angenommen wurden, und
        // wie viele es insgesamt waren. Daraus sieht man auf einen Blick, wie
        // belastbar die Umsatzzahl ist.
        geraten:sum(B,x=>x.geraten),beh:sum(B,x=>x.n),
        ziel:HB_ZIEL};
    })(),
    thListe:th};
}

// Der Aufgabenstand von heute — über ALLE Standorte und ohne die Schalter des
// Tagesziels. Dauerpatienten und Hausbesuche werden also mitgezählt, auch wenn
// sie in der Ansicht gerade ausgeblendet sind: Eine Kennzahl, die davon
// abhängt, welches Häkchen zuletzt gesetzt war, ist keine Kennzahl.
// Kurzschlüssel einer Aufgaben-Id. Die Ids sind lang — „luecke|wp|2026-10-07|
// Annika Braun|09:40" — und sechshundert davon im Klartext wären ein halbes
// Megabyte je Tag in einer Datei, die beide Dashboards bei jedem Laden lesen.
// Gebraucht wird aber nur die Mengendifferenz zum vorigen Lauf, und dafür
// genügt ein Fingerabdruck. Bei sechshundert Aufgaben liegt die Chance auf
// eine Kollision bei etwa einem Zwanzigtausendstel, und sie kostete dann genau
// eine falsch gezählte Aufgabe.
function aufKurz(id){
  let h=5381;const t=String(id);
  for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;
  return h.toString(36);
}

// ── Das Tagespensum ────────────────────────────────────────────────────────
// Die Aufgabenliste wird gerechnet, nicht gespeichert. Eine Lücke ist eine
// Aufgabe, WEIL sie da ist — wird sie besetzt, fehlt sie im nächsten Export.
// Sie wird nicht „abgeschlossen", es gibt sie schlicht nicht mehr.
//
// Eine Quote auf den jeweils aktuellen Bestand ist deshalb nicht bloß ungenau,
// sie misst das Gegenteil: Wer zehn von vierundzwanzig Lücken schließt, steht
// danach mit vierzehn offenen und null erledigten da — Quote 0 %. Wer alle
// schließt, hat überhaupt keine Bezugsgröße mehr. Je besser gearbeitet wird,
// desto schlechter die Zahl.
//
// Deshalb wird festgehalten, was an diesem Tag überhaupt einmal dastand. Was
// heute früh da war und jetzt fehlt, ist erledigt — die Ursache ist weg.
// Gezählt wird das aber GETRENNT von dem, was jemand abgehakt hat: Eine
// Aufgabe kann auch verschwinden, weil der Patient abgesagt hat oder der
// Therapeut krank wurde. In einer Zahl zusammengeworfen wüsste niemand mehr,
// welcher Teil davon Arbeit war.
// `tag` ist der Tag, zu dem die geladenen Terminpläne gehören — nicht
// zwangsläufig der von der Systemuhr. Fristen und das Tagesprotokoll richten
// sich danach, damit ein Eintrag in sich stimmig bleibt.
function kennAufgaben(alt,tag){
  // Vollständig heißt: Jeder Standort hat einen Terminplan geliefert. Fehlt
  // einer, liefert er keine Aufgaben — und alles, was dort heute früh stand,
  // sähe aus wie erledigt. Ein einziger fehlgeschlagener Export würde so
  // hunderte Erfolge erfinden. Das Pensum läuft dann zwar weiter, aber es wird
  // NICHTS als entfallen gewertet.
  const vollstaendig=aufQuellenDa();
  const dauerVor=zeigeDauer,hbVor=zeigeHb;
  let alle=[];
  try{
    zeigeDauer=true;zeigeHb=true;
    LOCS.forEach(l=>{
      const heuteDs=(VOD[l.id]&&VOD[l.id].heuteDs)||isoDay(0);
      try{alle=alle.concat(buildTasks(l.id,'heute',heuteDs).alle);}catch(e){}
    });
  }finally{zeigeDauer=dauerVor;zeigeHb=hbVor;}
  // Dieselbe vollständige Liste, die auch das Pensum speist, wandert in die
  // Tagesdatei. Ein zweiter Durchlauf wäre nicht nur Arbeit, sondern ein
  // zweites Ergebnis — und dann stimmte die Liste von gestern nicht mehr mit
  // den Zahlen von gestern überein.
  aufTagesListe=alle;

  const heute=tag||isoDay(0),gesehen={};
  const stand={offen:0,arbeit:0,fertig:0,abgelehnt:0};
  const jeBereich={},jeKat={};
  let ueberfaellig=0,ohneZuweisung=0;
  // Kurzschlüssel -> „Kategorie|Bereich|Standort". Alle drei, weil die Aufgabe
  // beim nächsten Lauf weg sein kann und dann niemand mehr nachsehen könnte,
  // wohin sie gehörte. Drei Angaben in einer Zeichenkette statt in drei
  // Feldern: Die Liste steht sechshundertfach in einer Datei, die beide
  // Dashboards bei jedem Laden lesen. Ältere Dateien führen nur zwei Teile —
  // der dritte wird dort schlicht leer gelesen, nichts bricht.
  const jetzt={};
  alle.forEach(t=>{
    // Dieselbe Aufgabe kann aus zwei Standorten kommen (die Lücke von morgen
    // steht auch unter dem Folgetag). Gezählt wird jede ID genau einmal.
    if(!t||!t.id||gesehen[t.id])return;gesehen[t.id]=1;
    const ber=effectiveArea(t.id,t.cat)||'ohne';
    jetzt[aufKurz(t.id)]=t.cat+'|'+ber+'|'+(t.loc||'');
    const st=taskStatus(t.id),weg=(st==='fertig'||st==='abgelehnt');
    stand[st]=(stand[st]||0)+1;
    const topf=(o,k)=>{const x=o[k]||(o[k]={offen:0,erledigt:0});if(weg)x.erledigt++;else x.offen++;};
    topf(jeBereich,ber);
    topf(jeKat,t.cat);
    if(weg)return;
    const fr=getFrist(t.id);
    if(fr&&fr<heute)ueberfaellig++;
    if(!effectiveAssignee(t.id,t.cat).length)ohneZuweisung++;
  });

  // Pensum = alles vom bisherigen Tag plus alles, was jetzt dasteht. Neue
  // Aufgaben dürfen im Lauf des Tages dazukommen — eine Absage reißt eine neue
  // Lücke, und die gehört zum Pensum dieses Tages.
  const pensum=Object.assign({},(alt&&alt.pensum)||{},jetzt);
  // Die Anzeige liest denselben Stand. Das Zuweisen hier ist der einzige Ort,
  // an dem er entsteht — es gibt keine zweite Rechnung.
  aufPensum=pensum;aufPensumTag=heute;
  let entfallen=0;
  // Wem die entfallenen Aufgaben zugeordnet werden. Mitgeschrieben, nicht nur
  // angezeigt: Der Team-Report fragt danach über Wochen, und die stehende
  // Besetzung von heute sagt nichts darüber, wer vorletzten Dienstag Dienst
  // hatte. Was hier nicht in die Datei kommt, ist morgen nicht mehr zu klären.
  const entfPerson={};
  if(vollstaendig)Object.keys(pensum).forEach(k=>{
    if(jetzt[k])return;
    entfallen++;
    // Kategorie und Bereich stehen im Pensum, also bekommen beide Auswertungen
    // die Gutschrift. Ohne das stünde eine geschlossene Lücke zwar unter
    // „Lücken", aber unter keinem Bereich — und das Backoffice sähe nie, was
    // es geschafft hat.
    const[kat,ber]=String(pensum[k]).split('|');
    const gut=(o,k2)=>{const x=o[k2]||(o[k2]={offen:0,erledigt:0});x.erledigt++;};
    gut(jeKat,kat||'?');
    gut(jeBereich,ber||'ohne');
    // Zuordnung über die Zuständigkeit: Wer im Bereich dieser Aufgabe
    // eingeteilt war, bekommt sie gutgeschrieben. Steht dort niemand, wird
    // niemand erfunden.
    ((ber&&ber!=='ohne')?getAreaAssign(ber):[]).forEach(o=>{
      entfPerson[o]=(entfPerson[o]||0)+1;});
  });
  const n=Object.keys(pensum).length;
  const erledigt=stand.fertig+stand.abgelehnt+entfallen;

  // Was heute wirklich entschieden wurde — aus dem Protokoll, nicht aus der
  // Liste. Der Unterschied ist wichtig: Eine Aufgabe, deren Ursache
  // verschwunden ist, steht nicht mehr in der Liste, die Entscheidung von
  // heute Morgen steht aber im Protokoll.
  const d0=new Date(heute+'T00:00:00'),d1=new Date(heute+'T23:59:59.999');
  let tz={ges:0,abg:0,proPerson:{}};
  try{tz=trZaehlen(d0.getTime(),d1.getTime());}catch(e){}

  return{
    stand:{
      pensum:n,
      offen:stand.offen,arbeit:stand.arbeit,
      fertig:stand.fertig,abgelehnt:stand.abgelehnt,entfallen,
      // „rest" ist die Zahl, auf die es am Abend ankommt: Was liegt noch da?
      // Fünfundzwanzig erledigte Aufgaben und acht offene Patientenanfragen
      // sind kein guter Tag, und das sieht man nur an dieser Zahl.
      rest:stand.offen+stand.arbeit,
      erledigt,
      quote:n?Math.round(1000*erledigt/n)/10:null,
      // Sagt dem Dashboard, dass an diesem Lauf Standortdaten fehlten und
      // „entfallen" deshalb zu niedrig steht. Lieber zu wenig Erfolg zeigen
      // als erfundenen.
      unsicher:!vollstaendig},
    pensum,
    heute:{erledigt:tz.ges,abgelehnt:tz.abg,beteiligt:Object.keys(tz.proPerson||{}).length},
    // Je Konto-ID die Zahl der an diesem Tag entfallenen Aufgaben. Klein genug
    // für die Tagesdatei — eine Handvoll Praxismanager, kein Namensregister.
    entfPerson,
    ueberfaellig,ohneZuweisung,jeBereich,jeKat};
}

// An welchem Tag hängen die geladenen Terminpläne? Nicht die Systemuhr
// entscheidet das, sondern der Export.
//
// Ein Browser, der über Mitternacht offen bleibt — und mit dem
// Fünf-Minuten-Takt bleibt einer offen —, würde sonst die Zahlen von gestern
// unter dem heutigen Datum ablegen und damit beide Tage verderben: den neuen
// mit alten Zahlen, den alten um seinen Abschluss. Dasselbe früh am Morgen,
// bevor der Flow den neuen Tag geschrieben hat.
function kennDatenTag(){
  for(const l of LOCS){
    const dd=DATA[l.suf],tp=dd&&dd.heute&&dd.heute.tp;
    const f=Array.isArray(tp)?tp.flat()[0]:null;
    const ds=f&&String(f.Beginn||'').slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(ds||''))return ds;
  }
  return'';
}

function kennBau(vorhanden){
  const monat=aufMonatVon(Date.now());
  const proTag={};
  if(vorhanden&&vorhanden.v===KENN_V&&Array.isArray(vorhanden.tage))
    vorhanden.tage.forEach(t=>{if(t&&t.ds)proTag[t.ds]=t;});

  // Telefonie für den GANZEN Monat jedes Mal neu. Webex trägt Gespräche
  // verspätet nach; ein Tag, der gestern 71 % hatte, kann heute 78 % haben.
  // Wer nur den heutigen Tag schreibt, friert den falschen Wert für immer ein.
  kennTelTage(monat+'-01',monat+'-31').forEach(e=>{
    const t=proTag[e.tag]||(proTag[e.tag]={ds:e.tag});
    t.tel=kennTel(e);t.ts=Date.now();
  });

  // Alles andere kennt nur den Tag, den der Export trägt. Für vergangene Tage
  // liegen die Terminpläne nicht mehr vor — rückwirkend rechnen geht also
  // nicht, und eine erfundene Zahl wäre schlimmer als eine Lücke in der Reihe.
  const datenTag=kennDatenTag();
  if(datenTag){
    const t=proTag[datenTag]||(proTag[datenTag]={ds:datenTag});
    t.ts=Date.now();t.loc={};
    LOCS.forEach(l=>{
      const h=kennLoc(l.id,'heute');if(!h)return;
      // Morgen steht mit in der Datei. Daraus wird am Folgetag gratis sichtbar,
      // wie viele Lücken kurzfristig noch geschlossen wurden — ohne dass dafür
      // irgendwo etwas Zusätzliches mitgeschrieben werden muss.
      t.loc[l.id]={label:l.label,heute:h,morgen:kennLoc(l.id,'morgen')};
    });
    // Der Stand des letzten Laufs, BEVOR er überschrieben wird — daraus kennt
    // das Pensum, was an diesem Tag schon einmal dastand.
    t.auf=kennAufgaben(t.auf,datenTag);
    try{const s=computeKpiSnapshot();delete s.date;delete s.ts;t.rez=s;}catch(e){}
  }

  // Die Schlüsselliste braucht nur der laufende Tag: Sie dient allein dem
  // Vergleich mit dem nächsten Lauf. Für vergangene Tage bleiben die Zahlen
  // stehen, die Liste fällt weg — sonst wüchse die Monatsdatei um das Zehnfache
  // für eine Auskunft, die niemand mehr braucht.
  Object.keys(proTag).forEach(k=>{
    if(k!==datenTag&&proTag[k]&&proTag[k].auf)delete proTag[k].auf.pensum;
  });
  return{v:KENN_V,monat,stand:Date.now(),quelle:'patientenchecker-werneck',
    tage:Object.keys(proTag).sort().map(k=>proTag[k])};
}

async function kennSchreiben(){
  const pfad=kennDatei(aufMonatVon(Date.now()));
  let alt=null;try{alt=await loadJSONAbs(pfad);}catch(e){}
  const datei=kennBau(alt);
  const ok=await saveJSONAbs(pfad,datei);
  // Die Aufgabenliste des Tages daneben. Eigene Datei, eigener Fehlerfall: Ein
  // Fehlschlag hier darf die Kennzahlen nicht mitreißen — die sind die
  // wichtigere Zahl, die Liste ist die Bequemlichkeit.
  try{
    const tag=kennDatenTag();
    if(tag&&aufTagesListe){
      await tzlSchreiben(tag,aufTagesListe);
      tzlCache[tag]=aufTagesListe;
    }
  }catch(e){}
  return ok;
}
// Erst nach dem Aufgabenprotokoll. Vorher stünde jede Aufgabe als „offen" in
// der Datei, deren Haken noch in einer ungelesenen Monatsdatei liegt — und das
// Management-Dashboard würde einen Rückstand melden, den es nicht gibt.
async function kennStart(){
  try{await kennPensumLaden();}catch(e){}
  try{await kennSchreiben();}catch(e){console.warn('Kennzahlen:',e);}
  // Die vergangenen Tage des laufenden und des Vormonats mitladen: Ohne sie
  // bliebe die Rückblick-Auswahl leer, und niemand käme auf die Idee, dass es
  // sie gibt.
  try{
    const j=new Date();
    await trEntfLaden([aufMonatVon(new Date(j.getFullYear(),j.getMonth()-1,1).getTime()),
                       aufMonatVon(Date.now())]);
  }catch(e){}
  try{rerenderTasks();}catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════════
// HINTERGRUND-ABGLEICH
// ---------------------------------------------------------------------------
// Zwei Praxismanager arbeiten gleichzeitig an derselben Liste. Ohne Abgleich
// sieht jeder nur seinen eigenen Stand, bis er die Seite neu lädt — und dann
// telefonieren beide denselben Patienten an, weil keiner wusste, dass der
// andere schon dran war. Jede Minute wird deshalb nachgesehen, was sich im
// Protokollordner bewegt hat.
//
// Nachgesehen wird über die VERZEICHNISLISTE, nicht durch Neuladen aller
// Dateien: Im Ordner liegt je Person und Monat eine Datei, nach einem Jahr sind
// das Dutzende. Jede Minute alle zu holen wäre ein Vielfaches des Verkehrs für
// eine Auskunft, die in einem einzigen Feld steht — lastModifiedDateTime.
//
// Was NICHT mitläuft: die thevea- und Webex-Exporte. Die schreibt der Flow ein
// paar Mal am Tag, und sie neu zu laden heißt, den halben Datenbestand neu zu
// holen und jede Ansicht neu zu rechnen. Terminpläne und Telefonie bleiben
// deshalb der Stand des Seitenaufrufs; „↻ Neu laden" holt sie.
// ═══════════════════════════════════════════════════════════════════════════
const AUF_TAKT=60000;
// Zu jeder Protokolldatei der Zeitstempel, mit dem sie gelesen wurde.
let aufStempel={};
let aufTakt=null,aufPrueft=false,aufNachzeichnen=false,aufTaktAus='';
function aufModVon(name){
  const e=(aufOrdnerCache||[]).filter(x=>x.name===name)[0];
  return e?e.mod:'';
}
// Aus dem Dateinamen den Monat: protokoll-<oid>-YYYY-MM.json
function aufMonatAusName(name){
  const m=/^protokoll-.*-(\d{4}-\d{2})\.json$/.exec(String(name));
  return m?m[1]:'';
}

// Nicht neu zeichnen, während jemand in einem Feld steht. Ein Datumsfeld, ein
// Bereichs-Dropdown oder eine halb getippte Eingabe würde unter den Händen
// verschwinden, und der Abgleich sähe aus wie ein Fehler. Verloren ist nichts:
// Gezeichnet wird, sobald das Feld wieder frei ist.
function aufDarfZeichnen(){
  const a=document.activeElement;
  if(!a)return true;
  const tag=String(a.tagName||'').toLowerCase();
  return!(tag==='input'||tag==='select'||tag==='textarea');
}

// Liefert true, wenn etwas Neues angekommen ist.
async function aufAbgleich(){
  if(aufPrueft||!driveId||!window._token)return false;
  aufPrueft=true;
  try{
    const liste=await aufOrdnerLesen();
    if(!liste){aufTaktAus='Der Protokollordner ließ sich nicht lesen.';return false;}
    aufTaktAus='';
    // Jede Protokolldatei, deren Zeitstempel sich bewegt hat — auch die eines
    // Monats, der beim Start noch nicht existierte. Eine Bedingung auf die
    // geladenen Monate hätte am Monatsersten ein Loch: Die neue Datei wäre nie
    // an der Reihe, weil ihr Monat als nicht geladen gilt.
    const neu=liste.filter(x=>/^protokoll-/.test(x.name)&&aufStempel[x.name]!==x.mod);
    if(!neu.length)return false;
    const vorher=aufEv.length;
    for(let i=0;i<neu.length;i+=8){
      const teil=await Promise.all(neu.slice(i,i+8).map(async x=>{
        const d=await loadJSONAbs(AUF_DIR+x.name).catch(()=>null);
        if(d){aufStempel[x.name]=x.mod;
          const m=aufMonatAusName(x.name);if(m)aufMonate[m]=true;}
        return d;
      }));
      teil.forEach(aufUebernehmen);
    }
    // aufUebernehmen verwirft, was schon bekannt ist. Dass eine Datei neu
    // geschrieben wurde, heißt also nicht, dass etwas Neues darin steht — der
    // eigene Klick von vorhin zum Beispiel steht längst in aufEv. Nur wenn die
    // Ereignisliste wirklich gewachsen ist, wird neu gezeichnet.
    if(aufEv.length===vorher)return false;
    aufAbleiten();
    return true;
  }catch(e){console.warn('Abgleich:',e);return false;}
  finally{aufPrueft=false;}
}

function aufTaktAnzeigen(neu){
  const el=document.getElementById('lastUp');if(!el)return;
  const uhr=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  if(aufTaktAus){el.textContent='⚠ '+aufTaktAus;el.title='Der Hintergrund-Abgleich steht. „Neu laden" hilft.';return;}
  el.textContent=(neu?'🔄 ':'⏱ ')+uhr;
  el.title=neu?'Gerade wurden Änderungen von Kollegen übernommen.'
              :'Letzter Abgleich mit dem Protokoll der Kollegen.';
}

async function aufTaktSchlag(){
  // Ein Reiter im Hintergrund fragt nicht. Dort sieht niemand etwas, und über
  // Nacht offene Reiter würden den Ordner tausendfach abfragen.
  if(document.hidden)return;
  const neu=await aufAbgleich();
  aufTaktAnzeigen(neu);
  if(neu){
    // Der eigene Stand hat sich geändert, also auch die Zahlen, die das
    // Management-Dashboard liest.
    kennMarkieren();
    if(aufDarfZeichnen())rerenderTasks();else aufNachzeichnen=true;
  }else if(aufNachzeichnen&&aufDarfZeichnen()){
    aufNachzeichnen=false;rerenderTasks();
  }
}

function aufTaktStart(){
  if(aufTakt)return;
  aufTakt=setInterval(aufTaktSchlag,AUF_TAKT);
  // Zurück im Reiter: sofort nachsehen, nicht erst in einer Minute. Wer vom
  // Telefon zum Rechner wechselt, will den Stand von jetzt sehen.
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)aufTaktSchlag();});
}

// ── Die Kennzahlendatei im Takt, aber viel langsamer ───────────────────────
// Sie wird nur geschrieben, wenn sich wirklich etwas geändert hat, und
// höchstens alle fünf Minuten. Warum nicht auch minütlich? Weil JEDER offene
// Browser dieselbe Datei schreibt. Bei sechzig Schreibvorgängen je Stunde und
// Gerät überschreiben sich die Läufe gegenseitig, ohne dass dabei eine
// einzige Zahl besser würde: Das Management-Dashboard ist eine Führungssicht,
// kein Live-Ticker.
const KENN_TAKT=300000;
let kennSchmutzig=false,kennTakt=null;
function kennMarkieren(){kennSchmutzig=true;}
async function kennTaktSchlag(){
  if(document.hidden||!kennSchmutzig)return;
  kennSchmutzig=false;
  // Bei einem Fehlschlag wieder als schmutzig markieren, damit der nächste
  // Schlag es erneut versucht. Sonst bliebe die Datei bis zum nächsten Klick
  // auf dem alten Stand stehen.
  try{const ok=await kennSchreiben();if(!ok)kennSchmutzig=true;}
  catch(e){kennSchmutzig=true;console.warn('Kennzahlen:',e);}
}
function kennTaktStart(){
  if(kennTakt)return;
  kennTakt=setInterval(kennTaktSchlag,KENN_TAKT);
}

// ── Status ─────────────────────────────────────────────────────────────────
// Die ID einer Aufgabe ist Typ + Rezept- bzw. Patienten-ID. Dadurch zeigen
// Tagesziel, Tagesplan und der jeweilige Fachreiter denselben Stand, ohne dass
// etwas synchronisiert werden muss — es ist schlicht dieselbe ID.
//
// Der Haken war eine Ja/Nein-Frage, und das reichte nicht: „ruf ich nachher an"
// und „der Patient will nicht" sind beides „nicht erledigt" und bedeuten das
// Gegenteil voneinander. Vier Zustände, nicht mehr — jeder weitere wäre eine
// Meinung, die niemand pflegt.
const AUF_STATUS={
  offen:    {l:'Offen',          ico:'○',k:'st-offen'},
  arbeit:   {l:'In Bearbeitung', ico:'◐',k:'st-arbeit'},
  fertig:   {l:'Abgeschlossen',  ico:'✓',k:'st-fertig'},
  abgelehnt:{l:'Abgelehnt',      ico:'✕',k:'st-abgelehnt'}
};
const AUF_STATUS_REIHE=['offen','arbeit','fertig','abgelehnt'];
// Der geteilte Stand hat Vorrang. Nur wenn zu einer Aufgabe gar kein Ereignis
// vorliegt, zählt der lokale Haken — das ist der Notbetrieb und der Zustand
// vor der ersten Anmeldung.
function taskStatus(id){
  const e=aufStand[id];
  // Ereignisse aus der Zeit des reinen Hakens tragen kein `ziel`. Dort ist ein
  // gesetzter Haken „Abgeschlossen" und ein fehlender „Offen" — genau das, was
  // damals gemeint war.
  if(e)return AUF_STATUS[e.ziel]?e.ziel:(e.an?'fertig':'offen');
  return lsGet('kimojo_check_'+id,false)?'fertig':'offen';
}
// „Erledigt" heißt im ganzen Dashboard „liegt nicht mehr an" — abgeschlossen
// UND abgelehnt. Eine abgelehnte Aufgabe gehört nicht in die offene Liste, sie
// wurde ja entschieden. Wer die beiden unterscheiden will, fragt taskStatus.
function taskDone(id){const s=taskStatus(id);return s==='fertig'||s==='abgelehnt';}
function setTaskStatus(id,s){
  if(!AUF_STATUS[s])s='offen';
  lsSet('kimojo_check_'+id,s==='fertig');
  // `an` wird wahrheitsgemäß mitgeführt: Wer nur den Haken liest — ein alter
  // Stand, ein Export — sieht weiterhin das Richtige.
  aufMerken({a:'check',id,cat:aufKatVon(id),an:s==='fertig',ziel:s});
  rerenderTasks();
}
// Der Klick auf die Zeile bleibt der schnelle Weg: abhaken und wieder öffnen.
// Die Zwischenzustände holt man sich über das Status-Menü.
function toggleTask(id){setTaskStatus(id,taskDone(id)?'offen':'fertig');}
// Ohne Begründung kein „Abgelehnt": Eine abgelehnte Aufgabe ohne Grund ist in
// zwei Wochen nicht mehr nachvollziehbar und wird dann von vorne aufgerollt.
function statusWaehlen(id,s,titel){
  if(s==='abgelehnt'){
    const grund=prompt('Warum abgelehnt?'+(titel?' ('+titel+')':'')
      +'\nDie Begründung wird als Notiz gespeichert, z. B. „Patient will keinen Dauerplan".',getNotiz(id));
    if(grund===null||!String(grund).trim()){rerenderTasks();return;}  // Auswahl zurückdrehen
    setNotiz(id,grund);
  }
  setTaskStatus(id,s);
}
// Wer hat zuletzt am Status gedreht, und wann? Für den Tooltip an der Aufgabe.
function taskDoneVon(id){
  const e=aufStand[id];
  if(!e||!e.oid||e.oid==='lokal')return '';
  return personName(e.oid)+' · '+new Date(e.ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

// ── Notiz je Aufgabe ───────────────────────────────────────────────────────
// Jede Handlung braucht Platz für den einen Satz, der sie erklärt: „Arzt ruft
// Donnerstag zurück", „Nummer stimmt nicht". Die Notiz hängt an der Aufgabe,
// nicht am Patienten — derselbe Patient kann bei der Abrechnung etwas anderes
// offen haben als beim Folgerezept.
const AUF_NOTIZ_MAX=500;
function getNotiz(id){const e=aufNotiz[id];return String((e?e.ziel:lsGet('kimojo_notiz_'+id,''))||'');}
function notizVon(id){const e=aufNotiz[id];return(e&&e.oid&&e.oid!=='lokal')?e.oid:'';}
function setNotiz(id,txt){
  // Gekappt, weil jede Notiz im Monatsprotokoll landet und dieses bei jedem
  // Laden vollständig gelesen wird. Ein eingefügter Brief würde das Dashboard
  // für alle langsamer machen.
  const s=String(txt||'').trim().slice(0,AUF_NOTIZ_MAX);
  lsSet('kimojo_notiz_'+id,s);aufMerken({a:'notiz',id:String(id),cat:aufKatVon(id),ziel:s});rerenderTasks();
}
function notizFragen(id,titel){
  const v=prompt('Notiz'+(titel?' zu „'+titel+'"':'')+':\n(leer lassen löscht sie)',getNotiz(id));
  if(v===null)return;
  setNotiz(id,v);
}

function rerenderTasks(){
  if(curView==='tagesziel')renderAufgaben();
  else if(curView==='folgevo')renderFolgeVO();
  else if(curView==='potential')renderPotential();
  else if(curView==='verplanung')renderVerplanung();
  else if(curView==='team')renderTeamReport();
  else if(curView==='luecken')renderDayView();
  // „Offene Rezepte" trägt seit der Vereinheitlichung dieselbe Aufgabenleiste.
  // Ohne diese Zeile bliebe ein dort gesetzter Status stehen, bis jemand den
  // Reiter wechselt — er wäre gespeichert, aber unsichtbar, und das sieht aus
  // wie ein Klick, der nicht angekommen ist.
  else if(curView==='offene')renderOffeneRezepte();
}

// ── Team & Zuweisung ───────────────────────────────────────────────────────
// Avatarfarben: dieselbe warme Familie wie die Signalfarben, alle dunkel
// genug, dass weiße Initialen darauf sicher lesbar bleiben.
const TEAM_PALETTE=['#9E2C24','#3C5A80','#3D7A5D','#8A5F13','#A4522F','#5D5289','#2E767C','#6B4A6E'];

// Zugewiesen wird an die Konto-ID, nicht an den Namen. Die Farbe hängt deshalb
// am Hash der ID und nicht an der Position in der Liste: Käme ein neuer Kollege
// dazu, würden sonst reihum alle Farben wechseln.
function aufHash(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
// Nur die aktiven Praxismanager, alphabetisch. Bewusst NICHT ergänzt um das
// eigene Konto: Wer zuweisen darf, ist nicht automatisch auch Ziel. Solange die
// Liste leer ist, ist niemand zuweisbar — die Teamleiste sagt das und zeigt die
// Suche. Für die Anzeige von Namen ist personName() zuständig, nicht diese
// Funktion; sonst würden alte Zuweisungen an Ausgeschiedene unlesbar.
function getTeam(){
  return aufManager.filter(m=>m.aktiv)
    .map(m=>({oid:m.oid,n:m.n,mail:m.mail,quelle:'manager'}))
    .sort((a,b)=>String(a.n).localeCompare(String(b.n),'de'));
}
// Zuweisungen aus der Zeit vor der Umstellung tragen einen Klartextnamen statt
// einer Konto-ID. Sie sollen weiter lesbar bleiben, statt als "Unbekannt" zu
// enden — deshalb der Rückfall auf den Wert selbst, wenn er keine GUID ist.
function personName(v){
  const p=aufLeute[v];if(p)return p.n;
  return AUF_GUID.test(String(v))?'Unbekannt':String(v||'');
}
function teamColor(v){return TEAM_PALETTE[aufHash(v)%TEAM_PALETTE.length];}
function teamInitials(v){
  const n=personName(v)||String(v||'');
  const p=n.trim().split(/\s+/);
  return(p.length>=2?(p[0][0]+p[1][0]):n.slice(0,2)).toUpperCase();
}
// ── Mehrere Zuständige je Aufgabe ──────────────────────────────────────────
// Eine Aufgabe hat selten genau eine Person. Eine Lücke rufen zwei Leute
// gleichzeitig ab, eine Abrechnung macht die eine und prüft die andere. Die
// Zielangabe ist deshalb eine Liste — und zwar als Komma-String, nicht als
// Array: Das Feld `ziel` im Protokoll war von Anfang an ein String, ein bereits
// geschriebener Einzelwert liest sich hier als Liste mit einem Element. Jedes
// Protokoll aus der Zeit davor bleibt damit gültig, ohne Umwandlung.
function aufListe(s){return String(s||'').split(',').map(x=>x.trim()).filter(x=>x);}
function aufListeStr(a){return a.filter((x,i)=>x&&a.indexOf(x)===i).join(',');}
// „Ausdrücklich niemand" ist nicht dasselbe wie „noch nichts eingetragen". Ohne
// diesen Platzhalter liesse sich die letzte Person an einer Aufgabe nie
// abwählen: Die Liste wäre leer, und die Aufgabe erbte sofort wieder die
// Zuständigen der Kategorie.
const AUF_NIEMAND='-';
// „Erbt weiter". Eine Stufe kann eigene Leute haben UND die der Stufe darüber
// mitnehmen.
//
// Ohne diesen Platzhalter schnitt das Dazunehmen einer zweiten Person die
// Verbindung nach oben ab: Die geerbten Namen wurden in die eigene Liste
// kopiert, und danach kam eine Änderung an der stehenden Besetzung unten nie
// mehr an. Wer im Backoffice jemanden austauschte, sah in den Aufgaben weiter
// die alte Person — ohne Hinweis, woran es liegt.
//
// Jetzt steht in der eigenen Liste nur, was ausdrücklich dazukam; „+" sagt,
// dass die Stufe darüber weiter gilt. Eine Liste ohne „+" ist eine bewusste
// Festlegung und erbt nicht — nur so bleibt eine geerbte Person abwählbar.
const AUF_ERBT='+';
function aufUniq(a){return a.filter((x,i)=>x&&a.indexOf(x)===i);}
// Die drei Zustände einer Stufe in einem String:
//   ''        noch nichts festgelegt — erbt
//   '+,a,b'   erbt UND hat eigene Leute
//   'a,b'     eigene Festlegung, erbt nicht
//   '-'       ausdrücklich niemand
// „Erbt, aber nichts eigenes" ist derselbe Zustand wie „noch nichts
// festgelegt" — er wird deshalb nicht als eigener geschrieben. Sonst gäbe es
// zwei Schreibweisen für dieselbe Lage, und die eine wäre immer die, die
// irgendwo nicht behandelt wird.
function aufZielStr(arr,erbt){
  const l=aufListeStr(arr);
  return erbt?(l?AUF_ERBT+','+l:''):(l||AUF_NIEMAND);
}

// Die Kategorie erbt genauso vom Bereich, wie die Aufgabe von der Kategorie
// erbt — mit demselben Platzhalter für „ausdrücklich niemand". Ohne diese
// Unterscheidung stand im Kategoriekopf „niemand", obwohl die Bereichsbesetzung
// längst jemanden hat und jede Aufgabe darunter diese Person anzeigt.
