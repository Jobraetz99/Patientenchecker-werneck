        h+='<tr style="border-top:1px solid var(--border)"><td style="padding:6px 0;font-weight:600">'+esc(t.label)+'</td>'
          +'<td style="text-align:right">'+t.anrufe+'</td><td style="text-align:right">'+t.ws+'</td>'
          +'<td style="text-align:right;font-weight:600">'+(t.wsAn+t.direkt)+'</td>'
          +'<td style="text-align:right;color:'+(t.verloren?'var(--fire)':'var(--muted)')+';font-weight:'+(t.verloren?'600':'400')+'">'+t.verloren+'</td>'
          +'<td style="text-align:right;font-weight:650;color:'+telFarbe(t.quote)+'">'+telQ(t.quote)+'</td></tr>';
      });
      h+='</table></div>';
    }
  }
  return h+'</div>';
}

// ── Warnung: Anrufe, bei denen kein Apparat geklingelt hat ─────────────────
//
// Der Fall, für den dieser Block gebaut ist: Werneck, Dienstag 18.08.2026.
// 22 Anrufe in der Warteschlange, 22 auf die Mailbox, kein einziges Klingeln
// den ganzen Tag. Die Anmeldung hat es nicht gemerkt — ein Telefon, das NICHT
// klingelt, fällt niemandem auf, man erlebt es als ruhigen Tag. Genau deshalb
// muss es das Dashboard sagen; es ist der einzige Beteiligte, der ein
// ausbleibendes Ereignis überhaupt sehen kann.
//
// Zwei Stufen, weil es zwei verschiedene Ursachen sind:
//   gelb  einzelne Anrufe — meist waren gerade alle im Gespräch. Verlorene
//         Anrufer sind es trotzdem, deshalb stehen sie da.
//   rot   mehrere hintereinander — dann kannte die Warteschlange keinen
//         erreichbaren Apparat mehr. Das ist ein Fehler, keine Auslastung.
// Ein Zeitfenster lässt sich nur auf Zeilen anwenden, die ein Stundenraster
// tragen. Zeilen aus einem alten Flow-Lauf haben keines und fallen deshalb still
// heraus. "Still" ist genau das Problem: Die Gesamtzahl wäre plötzlich kleiner,
// ohne dass irgendwo stünde warum. Also steht es hier — aber nur dann, wenn es
// im gewählten Zeitraum tatsächlich solche Zeilen gibt.
// Zeigt, wie frisch die Datei ist — nicht, wann der Browser sie gelesen hat.
// Der Unterschied ist genau der Fehler vom 25.08.: Das Dashboard meldete
// "heute keine Anrufe", während die Datei die Anrufe längst enthielt; der
// Browser hatte eine alte Kopie aus dem Cache. Steht der jüngste Anruf hier,
// ist so ein Zustand sofort sichtbar statt stumm.
function telFrische(){
  const n=String((telData&&telData.neueste)||'');
  if(n.length<16)return '';
  const heute=new Date().toISOString().slice(0,10);
  const alt=n.slice(0,10)<heute;
  return '<br><span style="font-size:12px'+(alt?';color:var(--fire)':'')+'">'
    +'Jüngster Anruf in der Datei: <b>'+esc(telDatum(n.slice(0,10)))+', '+esc(n.slice(11,16))+' Uhr</b>'
    +(alt?' — die Datei ist noch von gestern oder älter. Mit ⌘⇧R neu laden.':'')+'</span>';
}
function telOhneStundenHinweis(fen){
  // Der Zusatz auf anrufe>0 ist nicht kosmetisch: Zu jedem Tag steht zusätzlich
  // eine Zeile ohne Standort, die NUR ausgehende Gespräche trägt. Die hat kein
  // Stundenraster, weil sie keinen einzigen eingehenden Anruf enthält — sie
  // fehlt im Zeitfenster also auch nicht. Ohne diese Bedingung meldete der
  // Hinweis über die echten Daten 64 angeblich fehlende Tage, an denen in
  // Wahrheit nichts fehlt.
  const fehlt=telRohAlle().filter(t=>t&&t.tag&&t.tag>=fen[0]&&t.tag<=fen[1]
    &&!(Array.isArray(t.stunden)&&t.stunden.length)
    &&telZerlege(t).anrufe>0);
  if(!fehlt.length)return '';
  const tage=[...new Set(fehlt.map(t=>String(t.tag).slice(0,10)))].sort();
  const eins=tage.length===1;
  // telDatum() liefert bereits "22.05." mit Punkt — ein Satzpunkt dahinter gäbe
  // zwei. Deshalb endet der Satz auf dem Doppelpunkt-Teil und nicht auf einem Punkt.
  return '<br><span style="font-size:11.5px;color:var(--fire)"><b>'+tage.length
    +(eins?' Tag ist':' Tage sind')+' in dieser Ansicht nicht enthalten</b>, weil '
    +(eins?'für ihn kein Stundenraster in der Datei steht — er stammt':'für sie kein Stundenraster in der Datei steht — sie stammen')
    +' aus einem älteren Flow-Lauf ('+esc(tage.slice(0,8).map(telDatum).join(', '))
    +(tage.length>8?' und '+(tage.length-8)+' weitere':'')+'). Auf „Ganzer Tag" '
    +(eins?'ist er':'sind sie')+' wieder dabei.</span>';
}

function telWarnBlock(fen){
  // telRohAlle, nicht telRoh: Das Zeitfenster oben darf diese Warnung nicht
  // wegfiltern. Steht der Filter auf "nach Feierabend" und war morgens um zehn
  // eine halbe Stunde niemand in der Warteschlange, muss das trotzdem hier stehen.
  const roh=telRohAlle().filter(t=>t&&t.tag&&t.tag>=fen[0]&&t.tag<=fen[1]
                               &&(Number(t.wsOhneKlingeln)||0)>0);
  if(!roh.length)return '';
  roh.sort((a,b)=>String(b.tag).localeCompare(String(a.tag))
                 ||(Number(b.wsOhneKlingeln)||0)-(Number(a.wsOhneKlingeln)||0));

  const nAnrufe=roh.reduce((s,t)=>s+(Number(t.wsOhneKlingeln)||0),0);
  const schwer=roh.filter(t=>(Number(t.serieOhne)||0)>=TEL_SERIE_ALARM);
  const rot=schwer.length>0;
  const farbe=rot?'#B3261E':'#B36B00';

  let h='<div class="vl-card" style="border-left:4px solid '+farbe+'">'
    +'<div style="font-weight:600;font-size:13px;margin-bottom:2px;color:'+farbe+'">'
    +(rot?'⚠ Die Warteschlange hat keinen Apparat gefunden'
         :'Anrufe, bei denen kein Apparat geklingelt hat')+'</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.55">'
    +'Diese Anrufe haben die Warteschlange erreicht, aber es hat <b>nirgends geklingelt</b>. '
    +'Sie wurden ohne einen einzigen Klingelversuch weitergereicht, in aller Regel auf die Mailbox. '
    +'In Control Hub stehen sie als <b>übergebene Anrufe</b>.<br>'
    +'Ein einzelner solcher Anruf kann bedeuten, dass gerade alle im Gespräch waren. '
    +'<b>Ab '+TEL_SERIE_ALARM+' hintereinander wird die Warnung rot</b> — dann war es keine Auslastung, '
    +'dann war für die Warteschlange kein Apparat mehr da.</div>';

  h+='<div style="font-size:12.5px;line-height:1.6">';
  roh.slice(0,12).forEach(t=>{
    const n=Number(t.wsOhneKlingeln)||0,ser=Number(t.serieOhne)||0,ws=Number(t.ws)||0;
    const r2=ser>=TEL_SERIE_ALARM;
    const zt=Array.isArray(t.ohneZeiten)?t.ohneZeiten:[];
    h+='<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border)">'
      +'<span style="width:9px;height:9px;border-radius:50%;flex:none;position:relative;top:1px;background:'
        +(r2?'#B3261E':'#B36B00')+'"></span>'
      +'<span style="font-weight:600;min-width:150px">'
        +esc(telWochentag(t.tag))+' '+esc(telDatum(t.tag))
        +(t.standort?' · '+esc(t.standort):'')+'</span>'
      +'<span style="color:var(--muted)">'
        +'<b style="color:var(--text)">'+n+'</b> von '+ws+' Anrufen'
        +(ser>1?' · '+ser+' in Folge':'')
        +(zt.length?' · '+esc(zt[0])+(zt.length>1?'–'+esc(zt[zt.length-1]):'')+' Uhr':'')
      +'</span></div>';
  });
  h+='</div>';
  if(roh.length>12)h+='<div style="font-size:12px;color:var(--muted);margin-top:6px">'
    +'… und '+(roh.length-12)+' weitere Tage im Zeitraum.</div>';

  h+='<div style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55">'
    +'Im gewählten Zeitraum sind das <b>'+nAnrufe+' Anrufe</b> an '+roh.length+' Tag'+(roh.length===1?'':'en')+'.'
    +(rot?' <b style="color:'+farbe+'">Nachsehen in Control Hub</b> unter Anrufe → Funktionen → Anrufwarteschlange → '
        +'Agenten: Steht der Apparat in der Liste, und ist er beigetreten? Ein Agent kann auch versehentlich '
        +'auf „nicht verfügbar" stehen oder nach einem Neustart nicht zurückgekehrt sein.':'')
    +'</div>';
  return h+'</div>';
}

function renderTelefonie(){
  let h='<div class="summary"><h2>📞 Telefonie · Erreichbarkeit</h2>'
    +'<div class="tz-lead">Was aus den Anrufen an der Webex-Anlage wird. Ein Anruf zählt einmal — auch wenn er '
    +'auf mehreren Apparaten geklingelt hat; zusammengeführt wird hier im Dashboard über die Correlation ID. '
    +'Der Weg hat <b>zwei Stufen</b>: erst das Sprachmenü, dann die Warteschlange. Verloren gehen kann ein Anrufer auf beiden. '
    +'Die <b>Annahmequote</b> misst nur die zweite Stufe — ob ein Mensch abgenommen hat, gemessen am Apparat und nicht an der '
    +'Warteschlange, die jeden Anruf sofort annimmt, um die Ansage zu spielen. Es ist dieselbe Zahl, die in Control Hub steht. '
    +'Die <b>Durchkommquote</b> misst beide Stufen zusammen: wie viele von denen, die jemanden sprechen wollten, tatsächlich mit jemandem gesprochen haben. '
    +'Wer „Termin absagen" wählt, landet planmäßig auf der Mailbox und gilt weder als erreicht noch als verloren. '
    +'Gespeichert sind die einzelnen Gesprächsabschnitte — aber <b>keine einzige Rufnummer</b>, weder eure noch die der Anrufer.</div></div>';

  const tage=(telData&&Array.isArray(telData.tage))?telData.tage:null;
  if(!tage||!tage.length){
    // Kein Fehler, sondern der Normalzustand vor dem ersten Flow-Lauf.
    h+='<div class="empty" style="text-align:left;padding:26px 28px;line-height:1.7">'
      +'<b>Noch keine Telefondaten.</b><br><br>'
      +'Das Dashboard erwartet Monatsdateien wie <code>'+esc(TEL_LEGS_DIR+'telefonie-legs-JJJJ-MM.json')+'</code>. '
      +'Sie werden vom Flow „KIMOJO Telefonie CDR" geschrieben, achtmal an jedem Werktag.<br><br>'
      +'Aufbau, Endpunkte und Bauanleitung stehen in <b>WEBEX-API-BEFUNDE.md</b>. Vorher einmal '
      +'<b>webex-cdr-probe.js</b> laufen lassen — das prüft Feldnamen, Standorttrennung und vor allem, '
      +'ob die Annahmequote mit der Warteschlangen-Statistik in Control Hub übereinstimmt.<br><br>'
      +'<b>Historie:</b> Die CDR-Schnittstelle liefert nur die letzten 48 Stunden — der Flow kann also '
      +'nichts nachholen, was er verpasst hat. Control Hub selbst hält die Nachweise aber 400 Tage vor. '
      +'Über <b>Berichte → Vorlagen → Calling Detailed Call History</b> lässt sich das rückwirkend '
      +'exportieren; <code>csv-zu-legs.py</code> im Datenordner macht daraus Monatsdateien in genau '
      +'diesem Format.'
      +'</div>';
    h+='<div class="ft">KIMOJO · Telefonie</div>';
    document.getElementById('mc').innerHTML=h;return;
  }

  const locs=telStandorte();
  if(locs.length>1){
    h+='<div class="tabs"><button class="tab'+(telLoc==='alle'?' a':'')+'" onclick="telSetLoc(\'alle\')">Alle Standorte</button>';
    locs.forEach(l=>{h+='<button class="tab'+(telLoc===l?' a':'')+'" onclick="telSetLoc(&quot;'+esc(l)+'&quot;)">'+esc(l)+'</button>';});
    h+='</div>';
  }

  const heute=telHeuteStr();
  const fen=telFenster();
  const dIn='padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);'
    +'color:var(--text);font:inherit;font-size:12.5px';

  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">'
    +unterLeiste([['heute','Heute'],['woche','Woche'],['zeitraum','Zeitraum']],telModus,'telSetModus');

  if(telModus==='woche'){
    const mo=fen[0],so=fen[1],kw=telKW(mo),istJetzt=(mo===telMontag(heute));
    // Der mittlere Knopf ist bewusst kein Knopf, sondern die Anzeige zwischen
    // den Pfeilen — er trägt die Kalenderwoche UND die Daten, weil "KW 34"
    // allein niemand im Kopf in ein Datum übersetzt.
    h+='<div class="tz-modebar">'
      +'<button class="tz-mode" onclick="telWocheSchritt(-1)" title="eine Woche zurück">‹</button>'
      +'<button class="tz-mode a" style="cursor:default">KW '+(kw?kw.kw:'–')+' · '+esc(telDatum(mo))+'–'+esc(telDatum(so))+'</button>'
      +(istJetzt
        ? '<button class="tz-mode" style="opacity:.3;cursor:default" title="die laufende Woche ist die letzte">›</button>'
        : '<button class="tz-mode" onclick="telWocheSchritt(1)" title="eine Woche vor">›</button>')
      +'</div>'
      +(istJetzt?'':'<button class="fb" onclick="telWocheJetzt()">Diese Woche</button>');
  }

  if(telModus==='zeitraum'){
    h+='<div style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)">'
      +'<span>von</span><input type="date" value="'+esc(fen[0])+'" max="'+heute+'" onchange="telSetVon(this.value)" style="'+dIn+'">'
      +'<span>bis</span><input type="date" value="'+esc(fen[1])+'" max="'+heute+'" onchange="telSetBis(this.value)" style="'+dIn+'">'
      +'</div>';
  }
  // Zeitfenster. Steht bewusst in derselben Leiste wie der Zeitraum und nicht in
  // einem eigenen Kasten — es ist dieselbe Art von Auswahl, nur auf der Uhr
  // statt auf dem Kalender.
  h+=unterLeiste([['alle','Ganzer Tag'],['offen','Öffnungszeiten'],['zu','Nach Feierabend']],telZeit,'telSetZeit');

  if(telLaedt)h+='<span style="font-size:12px;color:var(--muted)">lädt ältere Monate…</span>';
  h+='</div>';

  // Vor allem anderen. Eine Warnung, die unter drei Diagrammen steht, ist keine
  // Warnung mehr — sie steht deshalb über dem Trichter und über dem Verlauf.
  h+=telWarnBlock(fen);

  // Was der Filter mit den Zahlen macht, muss dort stehen, wo die Zahlen stehen.
  if(telZeit!=='alle')
    h+='<div class="vl-card" style="padding:11px 14px;font-size:12.5px;line-height:1.65;color:var(--muted)">'
      +(telZeit==='offen'
        ? '<b style="color:var(--text)">Nur '+TEL_OFFEN_VON+':00 bis '+TEL_OFFEN_BIS+':00 Uhr.</b> '
         +'Alles unten zählt ausschließlich Anrufe in diesem Fenster — Trichter, Verlauf, Tabelle und Trend.'
        : '<b style="color:var(--text)">Nur vor '+TEL_OFFEN_VON+':00 und ab '+TEL_OFFEN_BIS+':00 Uhr.</b> '
         +'Ab '+TEL_OFFEN_BIS+' Uhr existiert die Warteschlange nicht mehr: Es bleibt die Ansage mit der Absage-Taste, '
         +'sonst nichts. Wer hier als „im Menü aufgelegt" steht, hätte niemanden erreichen können — '
         +'das ist die Zahl, an der sich ablesen lässt, ob sich längere Besetzung lohnen würde.')
      +'<br><span style="font-size:11.5px">Wartezeiten, Sprechzeiten und die Tastenzeile fehlen in dieser Ansicht: '
      +'Die stehen in der Datei nur je Tag, nicht je Stunde. Lieber gar keine Angabe als eine, die aus der falschen Tageszeit stammt.</span>'
      +telOhneStundenHinweis(fen)
      +'</div>';

  const r=telReihe();
  if(!r.length){
    // Der leere Tag ist morgens um acht der Normalfall, nicht der Fehlerfall —
    // deshalb ein Weg zurück zum letzten Tag mit Daten statt einer Sackgasse.
    const alle=telTagRows();
    const letzterTag=alle.length?alle[alle.length-1].tag:'';
    if(telModus==='heute'){
      h+='<div class="empty" style="line-height:1.7">Für heute liegen noch keine Anrufe vor.<br>'
        +'<span style="font-size:12px">Der Flow schreibt achtmal am Werktag, der erste Lauf ist um 6:05 Uhr.</span>'
        +telFrische()
        +(letzterTag?'<br><br><button class="fb" onclick="telZoomTag(\''+letzterTag+'\')">Letzter Tag mit Daten: '+esc(telDatum(letzterTag))+'</button>':'')
        +'</div>';
    }else if(telLaedt){
      h+='<div class="empty">Ältere Monate werden geladen…</div>';
    }else{
      h+='<div class="empty" style="line-height:1.7">Für diese Auswahl liegen keine Anrufe vor.<br>'
        +'<span style="font-size:12px">'+esc(telLang(fen[0]))+' bis '+esc(telLang(fen[1]))
        +(letzterTag?' · Daten gibt es bis '+esc(telDatum(letzterTag)):'')+'</span></div>';
    }
    // Der Trend hat eine eigene Zeitachse und ist deshalb auch dann noch da,
    // wenn oben nichts ausgewählt ist, was Daten hätte — z.B. morgens um acht.
    h+=telTrendBlock();
    h+='<div class="ft">KIMOJO · Telefonie</div>';
    document.getElementById('mc').innerHTML=h;return;
  }

  const letzt=r[r.length-1];
  const ges=telSumme(r,'ges','Zeitraum');     // der ganze Zeitraum als ein Punkt
  const einheit=telEbene==='woche'?'Woche':'Tag';

  // Worauf sich die Kacheln beziehen. "Heute" meint den laufenden Tag; bei
  // "Woche" und "Zeitraum" meint die Auswahl den ganzen Zeitraum, und dann nur
  // dessen letzten Tag zu zeigen, beantwortet nicht die gestellte Frage.
  //
  // Zusammengefasst wird über telSumme, also über die rohen Zähler: die Quote
  // des Zeitraums ist angenommene Anrufe ÷ Anrufe in der Warteschlange, nicht
  // der Mittelwert der Tagesquoten. Sonst zählte ein Dienstag mit vier Anrufen
  // so schwer wie ein Montag mit achtzig.
  const perZeitraum=telModus!=='heute';
  const bezug=perZeitraum?ges:letzt;

  // Der Vergleichspunkt, passend zur Bezugsgröße: gegen den Vortag, wenn eine
  // Kachel einen Tag zeigt, und gegen den gleich langen Zeitraum davor, wenn
  // sie einen Zeitraum zeigt. Liegt der Vorzeitraum außerhalb der geladenen
  // Monate, bleibt die Zeile leer statt eine falsche Zahl zu behaupten.
  let vor=null,gegen='m Vortag';
  if(perZeitraum){
    const laenge=telTageDiff(fen[0],fen[1]);
    const vorRows=telTagRows(telPlusTage(fen[0],-laenge),telPlusTage(fen[0],-1));
    if(vorRows.length)vor=telSumme(vorRows,'vor','davor');
    gegen=telModus==='woche'?'r Vorwoche':'m Zeitraum davor';
  }else{
    vor=r.length>1?r[r.length-2]:null;
    if(!vor&&telEbene==='tag'){
      const alle=telTagRows();
      const i=alle.findIndex(x=>x.tag===letzt.tag);
      if(i>0)vor=alle[i-1];
    }
    gegen=telEbene==='woche'?'r Vorwoche':'m Vortag';
  }

  const dq=(bezug.quote!=null&&vor&&vor.quote!=null)?bezug.quote-vor.quote:null;
  const dqTxt=dq==null?'&nbsp;':(Math.abs(dq)<0.5?'unverändert zu'+gegen
    :(dq>0?'▲ +':'▼ ')+Math.abs(dq).toFixed(1)+' Punkte zu'+gegen);

  // Aufschrift der Kacheln. Im Zeitraum-Modus nennt sie die Zahl der Tage mit
  // Anrufen, nicht die Kalendertage — Wochenenden sind leer und würden den
  // Nenner nur verwässern.
  const nT=r.length+' '+(telEbene==='woche'?(r.length===1?'Woche':'Wochen'):(r.length===1?'Tag':'Tage'));
  const pl=telModus==='heute'?'heute'
    :(telModus==='woche'?'KW '+((telKW(fen[0])||{}).kw||'') : nT);
  h+='<div class="sg">'
    +'<div class="si"><div class="si-l">Annahmequote '+esc(pl)+'</div>'
      +'<div class="si-v" style="color:'+telFarbe(bezug.quote)+'">'+telQ(bezug.quote)+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+dqTxt+'</div></div>'
    +'<div class="si"><div class="si-l">Durchkommquote '+esc(pl)+'</div>'
      +'<div class="si-v" style="color:'+telFarbe(bezug.durch)+'">'+telQ(bezug.durch)+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+(bezug.wsAn+bezug.direkt)+' von '+bezug.wollten+' haben jemanden erreicht'
        +(bezug.absage?' · '+bezug.absage+' wollten nur absagen':'')+'</div></div>'
    +'<div class="si"><div class="si-l">Niemanden erreicht '+esc(pl)+'</div>'
      +'<div class="si-v" style="color:'+(bezug.verloren?'var(--fire)':'var(--green)')+'">'+bezug.verloren+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'
        +(bezug.verloren?[bezug.wsVm?bezug.wsVm+' Mailbox':'',bezug.wsWeg?bezug.wsWeg+' aufgelegt':'',bezug.menu?bezug.menu+' im Menü':''].filter(Boolean).join(' · ')
          :'jeder kam durch')+'</div></div>'
    // Die vierte Kachel trug früher die Zeitraumquote. Die steht jetzt in der
    // ersten, also zeigt sie hier das Aufkommen — die Zahl, die den anderen
    // dreien erst ihr Gewicht gibt.
    +(perZeitraum
      ? '<div class="si"><div class="si-l">Anrufe '+esc(pl)+'</div>'
        +'<div class="si-v">'+ges.anrufe+'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+(ges.anrufe/r.length).toFixed(0)+' Anrufe/'+einheit
        // Bei der Wochenauswahl steht der Teiler nicht in der Aufschrift ("KW 34"),
        // deshalb hier — sonst bliebe unklar, durch wie viele Tage geteilt wurde.
        +(telModus==='woche'?' an '+nT:'')
        +(ges.wart!=null?' · '+esc(telSek(ges.wart))+' Wartezeit':'')
        +(ges.aus?' · '+ges.aus+' ausgehend':'')+'</div></div>'
      : '<div class="si"><div class="si-l">Anrufe heute</div>'
        +'<div class="si-v">'+letzt.anrufe+'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'
        +(letzt.wart!=null?esc(telSek(letzt.wart))+' Wartezeit':'noch keine Wartezeit')
        +(letzt.aus?' · '+letzt.aus+' ausgehend':'')+'</div></div>')
    +'</div>';

  // Der Trichter über den ganzen Zeitraum. Er steht vor dem Verlauf, weil er
  // die Frage beantwortet — wo geht wer verloren —, während der Verlauf nur
  // zeigt, ob es besser oder schlechter wird.
  const spanneTxt=telModus==='heute'?esc(telLang(letzt.tag))
    :r.length+' '+(telEbene==='woche'?'Wochen':'Tage')+' zusammengefasst';
  h+='<div style="margin-top:18px">'+telTrichter(ges,
      'Der Weg durch die Anlage · '+(telLoc==='alle'?'alle Standorte':telLoc),
      spanneTxt)+'</div>';

  // Ein Verlauf aus einer einzigen Säule zeigt nichts, was die Kacheln nicht
  // schon sagen — im Modus "heute" übernimmt der Stundenverlauf diese Rolle.
  if(r.length>1){
    h+='<div class="vl-card">'
      +'<div style="font-weight:600;font-size:13px;margin-bottom:2px">Verlauf</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.55">Säulenhöhe = alle Anrufe, gestapelt nach Ausgang. '
      +'Die braune Linie ist die Annahmequote der Warteschlange auf der rechten Achse.'
      +(telEbene==='woche'?' Der Zeitraum ist länger als zehn Wochen, deshalb steht je Säule eine Kalenderwoche statt eines Tages.':'')+'</div>'
      +'<div class="vl-legend" style="margin-bottom:10px">'
        +'<span class="vl-leg"><i style="background:'+TEL_C_AN+'"></i>angenommen</span>'
        +(ges.direkt?'<span class="vl-leg"><i style="background:'+TEL_C_DIR+'"></i>direkt angenommen</span>':'')
        +(ges.absage?'<span class="vl-leg"><i style="background:'+TEL_C_ABS+'"></i>Absage-Mailbox (gewollt)</span>':'')
        +(ges.wsVm?'<span class="vl-leg"><i style="background:'+TEL_C_VM+'"></i>Mailbox-Überlauf</span>':'')
        +(ges.wsWeg?'<span class="vl-leg"><i style="background:'+TEL_C_WEG+'"></i>in der Warteschlange aufgelegt</span>':'')
        +(ges.menu?'<span class="vl-leg"><i style="background:'+TEL_C_MENU+'"></i>im Menü aufgelegt</span>':'')
        +'<span class="vl-leg"><i style="background:#A4522F"></i>Annahmequote (Achse rechts)</span>'
      +'</div>'+telChart(r)+'</div>';
  }

  h+=telDetailBlock(r);

  // Der Gesamt-Stundenverlauf bleibt sichtbar, solange nichts ausgewählt ist —
  // ausgewählt hat der Detailblock den besseren, weil genaueren.
  if(!telSel){
    const sc=telStundenChart(ges.std);
    if(sc)h+='<div class="vl-card">'
      +'<div style="font-weight:600;font-size:13px;margin-bottom:2px">'
        +(telModus==='heute'?'Stundenverlauf heute':'Tagesverlauf über den ganzen Zeitraum')+'</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.55">'
      +(telModus==='heute'
        ? 'Anrufe je Stunde, gestapelt nach Ausgang. Die Prozentzahl darunter ist die Annahmequote dieser Stunde.'
        : 'Alle '+r.length+' '+(telEbene==='woche'?'Wochen':'Tage')+' übereinandergelegt. ')
      +' Die Stunde mit dem größten roten Anteil ist die, in der Anrufe liegenbleiben — dort fehlt Besetzung, nicht über den Tag verteilt.</div>'+sc+'</div>';
  }

  // Derselbe Stundenraster, aber nur die Verluste. Der Verlauf darüber zeigt
  // das Aufkommen, dieser hier die Frage dahinter: wann kommt keiner durch.
  h+=telVerpasstBlock(ges,'Wann Anrufer niemanden erreichen'
    +(telModus==='heute'?' · heute':'')
    +(telLoc==='alle'?'':' · '+telLoc));

  // Der Trend ganz unten, weil er die längste Zeitachse hat: erst der Tag, dann
  // der Zeitraum, dann das Jahr. Er hört bewusst nicht auf die Auswahl oben.
  h+=telTrendBlock();

  // Früher standen hier die fünf schwächsten Einzeltage. Die haben meist eine
  // erklärbare Tagesursache — jemand krank, ein Feiertag davor — und führen zu
  // keiner Entscheidung. Was zu einer Entscheidung führt, ist das Muster.
  h+=telMusterBlock(fen,ges);

  // Alles, was über wiederkehrende Muster hinausgeht, wandert nicht in eine
  // eigene Ansicht, sondern hier heraus.
  h+='<div class="vl-card"><div style="font-weight:600;font-size:13px;margin-bottom:2px">Tiefer analysieren</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.55">'
    +'Legt die Zahlen dieses Zeitraums als Text in die Zwischenablage — je Tag, Wochentag, Stunde und Standort, '
    +'mit Erklärung der Spalten. In ein Gespräch mit Claude einfügen und fragen, was du wissen willst. '
    +'Enthält keine Rufnummern und keine Patientendaten.</div>'
    +'<button id="telExpBtn" class="fb" onclick="telAnalyseKopieren()">Zahlen für die Analyse kopieren</button></div>';

  h+='<div style="font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:4px">'
    +'Stand der Daten: '+esc(telData.stand?new Date(telData.stand).toLocaleString('de-DE'):'unbekannt')+'. '
    +'Quelle: Webex Detailed Call History. Der Flow legt die einzelnen Gesprächsabschnitte ab, verdichtet wird hier im Dashboard. '
    +'Annahmequote = von einem Menschen angenommen ÷ Anrufe in der Warteschlange — dieselbe Zahl, die in Control Hub unter '
    +'Analysen → Anrufwarteschlange steht. Durchkommquote = erreichte Menschen ÷ Anrufe ohne die gewollten Absagen.'
    +(ges.wart==null?' Wartezeiten liefert der Flow noch nicht mit.':'')+'</div>';
  h+='<div class="ft">KIMOJO · Telefonie</div>';
  document.getElementById('mc').innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB-LEISTE — der CKI-Satz, acht Reiter
// ═══════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════
// TEAM-REPORT
// ═══════════════════════════════════════════════════════════════════════════
// Gezählt wird nach einer einzigen Regel, und die steht bewusst auch in der
// Ansicht: Je Aufgabe zählt ihr LETZTER Stand. Ist er "erledigt" und fällt sein
// Zeitstempel in den Zeitraum, zählt die Aufgabe einmal für die Person, die den
// Haken zuletzt gesetzt hat.
//
// Warum nicht einfach alle Erledigt-Ereignisse zählen? Weil ein versehentlich
// gesetzter und wieder entfernter Haken sonst als Leistung erschiene, und ein
// zweimal gesetzter als zwei. Beides wäre eine erfundene Zahl.
//
// Übernommene Altbestände (alt:1) bleiben draußen: Ihr Zeitstempel ist der Tag
// der Umstellung, nicht der Tag, an dem gearbeitet wurde.
let trZeit='monat',trLaedt=false;
function trSetZeit(z){trZeit=z;renderTeamReport();}

function trFenster(){
  const j=new Date();j.setHours(0,0,0,0);
  const ende=new Date();ende.setHours(23,59,59,999);
  if(trZeit==='woche'){const d=new Date(j);d.setDate(d.getDate()-((d.getDay()+6)%7));return[d.getTime(),ende.getTime()];}
  if(trZeit==='monat')return[new Date(j.getFullYear(),j.getMonth(),1).getTime(),ende.getTime()];
  if(trZeit==='vormonat')return[new Date(j.getFullYear(),j.getMonth()-1,1).getTime(),
                                new Date(j.getFullYear(),j.getMonth(),0,23,59,59,999).getTime()];
  const d=new Date(j);d.setDate(d.getDate()-89);return[d.getTime(),ende.getTime()];
}
function trMonate(von,bis){
  const aus=[],d=new Date(von);d.setDate(1);d.setHours(0,0,0,0);
  const e=new Date(bis);
  while(d<=e){aus.push(aufMonatVon(d.getTime()));d.setMonth(d.getMonth()+1);}
  return aus;
}
// Der laufende Monat kommt immer mit, auch wenn der Zeitraum weiter zurückliegt:
// Wird ein alter Haken heute wieder entfernt, steht diese Korrektur in der
// Datei des laufenden Monats. Ohne sie zeigte der Report eine Aufgabe als
// erledigt, die es längst nicht mehr ist.
function trSicherstellen(von,bis){
  if(trLaedt)return false;
  const m=trMonate(von,bis);
  const jetzt=aufMonatVon(Date.now());
  if(m.indexOf(jetzt)<0)m.push(jetzt);
  if(!m.some(x=>!aufMonate[x]))return false;
  trLaedt=true;
  aufLadeMonate(m).then(()=>{trLaedt=false;if(curView==='team')renderTeamReport();},
                        ()=>{trLaedt=false;});
  return true;
}

// „Abgelehnt" wird getrennt gezählt und nicht zu „Erledigt" addiert.
//
// Beides ist Arbeit und beides ist eine Entscheidung — aber es sind nicht
// dieselben Zahlen. Wer dreißig Aufgaben abhakt und wer dreißig ablehnt, hat
// nicht dasselbe getan; in einer Summe wäre dieser Unterschied für immer weg.
// Unterschlagen darf man das Ablehnen aber auch nicht: Es stünde als Lücke da
// und sähe aus wie Nichtstun.
function trZaehlen(von,bis){
  const proPerson={},proKat={};let ges=0,abg=0;
  Object.keys(aufStand).forEach(id=>{
    const e=aufStand[id];
    if(!e||e.alt)return;
    if(e.ts<von||e.ts>bis)return;
    // Der Stand entscheidet, nicht der Haken: „Abgelehnt" trägt an:false und
    // wäre am Haken allein nicht von „Offen" zu unterscheiden.
    const st=AUF_STATUS[e.ziel]?e.ziel:(e.an?'fertig':'offen');
    if(st!=='fertig'&&st!=='abgelehnt')return;
    const p=proPerson[e.oid]||(proPerson[e.oid]={oid:e.oid,ges:0,abg:0,kat:{}});
    if(st==='abgelehnt'){p.abg++;abg++;return;}
    p.ges++;p.kat[e.cat]=(p.kat[e.cat]||0)+1;
    proKat[e.cat]=(proKat[e.cat]||0)+1;ges++;
  });
  return{proPerson,proKat,ges,abg};
}

// ── Vergangene Tage aus der Kennzahlendatei ────────────────────────────────
// Was gestern los war, steht nicht mehr im Terminplan — der schaut nur nach
// vorn. Es steht in der Kennzahlendatei, die bei jedem Lauf fortgeschrieben
// wird: Pensum, Abgehaktes, Entfallenes je Kategorie und je Person, dazu
// Auslastung, Lücken und Telefonie. Rund acht Kilobyte je Tag.
//
// Zwei Leser teilen sich diesen Cache: der Team-Report über Wochen und der
// Tagesrückblick über einen einzelnen Tag. Gemerkt wird je MONAT, weil die
// Dateien monatsweise liegen.
const trEntfCache={};let trEntfLaedt=false;
async function trEntfLaden(monate){
  const offen=monate.filter(m=>!(m in trEntfCache));
  if(!offen.length)return false;
  trEntfLaedt=true;
  try{
    await Promise.all(offen.map(async m=>{
      try{const f=await loadJSONAbs(kennDatei(m));
        trEntfCache[m]=(f&&Array.isArray(f.tage))?f.tage:[];}
      catch(e){trEntfCache[m]=[];}
    }));
  }finally{trEntfLaedt=false;}
  return true;
}
// Ein einzelner Tag aus dem Cache. null heißt „nicht geladen oder nicht da" —
// beides darf nicht als „nichts passiert" durchgehen.
function kennTagAus(ds){
  if(!ds)return null;
  const m=String(ds).slice(0,7);
  const liste=trEntfCache[m];
  if(!liste)return null;
  return liste.filter(t=>t&&t.ds===ds)[0]||null;
}
// Alle Tage, für die überhaupt Aufgabenzahlen vorliegen, jüngster zuerst.
function kennTageMitAufgaben(){
  const aus=[];
  Object.keys(trEntfCache).forEach(m=>(trEntfCache[m]||[]).forEach(t=>{
    if(t&&t.ds&&t.auf&&t.auf.stand)aus.push(t.ds);}));
  return [...new Set(aus)].sort().reverse();
}
// Summiert die entfallenen Aufgaben je Person über den Zeitraum. Gezählt wird
// je TAG, nicht je Lauf: In der Datei steht ein Eintrag pro Tag, und der trägt
// den Stand des letzten Laufs.
function trEntfallen(von,bis){
  const aus={proPerson:{},tage:0,ges:0};
  const v=new Date(von),b=new Date(bis);
  const vs=v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const bs=b.getFullYear()+'-'+String(b.getMonth()+1).padStart(2,'0')+'-'+String(b.getDate()).padStart(2,'0');
  Object.keys(trEntfCache).forEach(m=>{
    (trEntfCache[m]||[]).forEach(t=>{
      if(!t||!t.ds||t.ds<vs||t.ds>bs)return;
      const ep=(t.auf&&t.auf.entfPerson)||null;
      const n=(t.auf&&t.auf.stand&&t.auf.stand.entfallen)||0;
      if(n)aus.ges+=n;
      if(n||ep)aus.tage++;
      if(!ep)return;
      Object.keys(ep).forEach(o=>{aus.proPerson[o]=(aus.proPerson[o]||0)+(ep[o]||0);});
    });
  });
  return aus;
}

function renderTeamReport(){
  const fen=trFenster();
  let h='<div class="summary"><h2>👤 Team-Report</h2>'
    +'<div class="tz-lead">Wer hat wie viele Aufgaben abgehakt — aus dem geteilten Protokoll, '
    +'nicht aus den Haken dieses einen Geräts.</div></div>';
  h+=unterLeiste([['woche','Diese Woche'],['monat','Dieser Monat'],
                  ['vormonat','Letzter Monat'],['quartal','Letzte 90 Tage']],trZeit,'trSetZeit');
  const laedt=trSicherstellen(fen[0],fen[1]);
  if(!meKonto()){
    h+='<div class="empty" style="line-height:1.7">Nicht angemeldet.<br>'
      +'<span style="font-size:12px">Der Report liest die Protokolldateien aus SharePoint; dafür braucht es die Microsoft-Anmeldung.</span></div>';
    document.getElementById('mc').innerHTML=h;return;
  }
  if(laedt||trLaedt||!aufBereit){
    h+='<div class="empty">Protokoll wird geladen…</div>';
    document.getElementById('mc').innerHTML=h;return;
  }
  const z=trZaehlen(fen[0],fen[1]);
  // Die zweite Quelle: Was ohne Haken wegging. Liegt in den Kennzahlendateien,
  // nicht im Protokoll — deshalb ein eigener Ladevorgang.
  trEntfLaden(trMonate(fen[0],fen[1])).then(neu=>{if(neu&&curView==='team')renderTeamReport();});
  const ef=trEntfallen(fen[0],fen[1]);
  const dat=t=>new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  h+='<div style="font-size:12.5px;color:var(--muted);margin:-6px 0 14px">'
    +dat(fen[0])+' bis '+dat(Math.min(fen[1],Date.now()))+'</div>';

  if(!z.ges&&!z.abg&&!ef.ges){
    h+='<div class="empty" style="line-height:1.7">In diesem Zeitraum wurde nichts abgehakt.<br>'
      +'<span style="font-size:12px">Gezählt wird ab dem Tag, an dem das geteilte Protokoll in Betrieb ging — '
      +'was davor auf einzelnen Geräten stand, ist übernommen, aber nicht als Leistung gezählt.</span></div>';
    h+='<div class="ft">KIMOJO · Team-Report</div>';
    document.getElementById('mc').innerHTML=h;return;
  }

  // Nur Kategorien, in denen wirklich etwas passiert ist — eine Tabelle mit
  // acht leeren Spalten liest niemand.
  const kats=TZ_REIHE.filter(k=>z.proKat[k]).concat(z.proKat.sonst?['sonst']:[]);
  const katName=k=>k==='sonst'?'Sonstige':((TZ_KAT[k]&&TZ_KAT[k].l)||k);
  // Die Personenliste muss beide Quellen kennen: Wer nichts abgehakt, aber
  // einen Bereich besetzt hat, an dem Aufgaben wegfielen, fehlte sonst ganz.
  const alleOids=[...new Set(Object.keys(z.proPerson).concat(Object.keys(ef.proPerson)))];
  const leute=alleOids.map(o=>Object.assign({oid:o,ges:0,abg:0,kat:{}},z.proPerson[o]||{},
      {entf:ef.proPerson[o]||0}))
    .sort((a,b)=>(b.ges+b.entf)-(a.ges+a.entf)||b.abg-a.abg);
  // Die Abgelehnt-Spalte erscheint nur, wenn es etwas abzulehnen gab. Eine
  // Spalte voller Striche erzählt nichts und drängt die Kategorien zusammen.
  const zeigeAbg=z.abg>0;

  const top=leute.find(p=>(p.ges+p.entf)>0);
  h+='<div class="sg" style="grid-template-columns:repeat('+(zeigeAbg?5:4)+',1fr);margin-bottom:18px">'
    +'<div class="si"><div class="si-l">✅ Abgehakt</div><div class="si-v">'+z.ges+'</div>'
      +'<div class="si-s">jemand hat entschieden</div></div>'
    +'<div class="si"><div class="si-l">🏁 Ohne Haken</div><div class="si-v">'+ef.ges+'</div>'
      +'<div class="si-s">'+(ef.tage?'an '+ef.tage+' Tag'+(ef.tage===1?'':'en')+' erfasst':'noch nichts erfasst')+'</div></div>'
    +(zeigeAbg?'<div class="si"><div class="si-l">⊘ Abgelehnt</div><div class="si-v">'+z.abg+'</div>'
      +'<div class="si-s">entschieden, nicht offen</div></div>':'')
    +'<div class="si"><div class="si-l">👥 Beteiligt</div><div class="si-v">'+leute.length+'</div>'
      +'<div class="si-s">'+(leute.length===1?'Person hat entschieden':'Personen haben entschieden')+'</div></div>'
    +'<div class="si"><div class="si-l">🥇 Die meisten</div><div class="si-v" style="font-size:18px">'
      +esc(top?personName(top.oid):'–')+'</div><div class="si-s">'
      +(top?(top.ges+top.entf)+' Aufgaben':'')+'</div></div>'
    +'</div>';

  h+='<div class="vl-card"><table class="data-t"><thead><tr><th>Person</th>';
  kats.forEach(k=>{h+='<th class="r">'+esc(katName(k))+'</th>';});
  h+='<th class="r">Abgehakt</th>';
  // Getrennte Spalte, keine Addition in „Abgehakt": Das eine ist eine
  // Entscheidung aus dem Protokoll, das andere eine Zuordnung über den
  // Bereich, in dem die Person an dem Tag eingeteilt war.
  h+='<th class="r" title="Aufgaben, die an einem Tag aus der Liste fielen, '
    +'während diese Person den zuständigen Bereich besetzt hatte. Zugeordnet über '
    +'die Besetzung, nicht aus dem Protokoll — niemand hat hier geklickt.">🏁 Ohne Haken</th>';
  // Hinter dem Gesamt, nicht davor: Die Summe gehört zu den Kategorien links
  // von ihr. Abgelehnt steht daneben, weil es nicht hineinzählt.
  if(zeigeAbg)h+='<th class="r" title="Abgelehnt — zählt nicht in „Abgehakt“">⊘ Abgelehnt</th>';
  h+='</tr></thead><tbody>';
  leute.forEach(p=>{
    h+='<tr><td><span class="asg-chip" style="background:'+teamColor(p.oid)+';margin-right:7px">'
      +esc(teamInitials(p.oid))+'</span>'+esc(personName(p.oid))+'</td>';
    kats.forEach(k=>{const n=p.kat[k]||0;
      h+='<td class="r"'+(n?'':' style="color:var(--faint)"')+'>'+(n||'–')+'</td>';});
    h+='<td class="r"><b>'+p.ges+'</b></td>';
    h+='<td class="r"'+(p.entf?'':' style="color:var(--faint)"')+'>'+(p.entf||'–')+'</td>';
    if(zeigeAbg)h+='<td class="r"'+(p.abg?'':' style="color:var(--faint)"')+'>'+(p.abg||'–')+'</td>';
    h+='</tr>';
  });
  h+='<tr style="border-top:2px solid var(--border)"><td><b>Alle</b></td>';
  kats.forEach(k=>{h+='<td class="r"><b>'+(z.proKat[k]||0)+'</b></td>';});
  h+='<td class="r"><b>'+z.ges+'</b></td>';
  // Die Spaltensumme ist NICHT die Summe der Zeilen: Besetzen zwei Leute
  // denselben Bereich, bekommen beide dieselbe Aufgabe gutgeschrieben. Hier
  // steht deshalb die Zahl der Aufgaben, nicht die Summe der Gutschriften.
  h+='<td class="r" title="Zahl der Aufgaben. Besetzen zwei Personen einen '
    +'Bereich, steht dieselbe Aufgabe bei beiden — die Spalte darüber summiert '
    +'sich deshalb höher."><b>'+ef.ges+'</b></td>';
  if(zeigeAbg)h+='<td class="r"><b>'+z.abg+'</b></td>';
  h+='</tr>';
  h+='</tbody></table></div>';

  // Wer nichts abgehakt hat, taucht in der Tabelle nicht auf. Das einmal zu
  // benennen ist wichtiger, als es zu verschweigen: Eine Null kann heißen "hat
  // nichts getan" — oder "arbeitet, ohne Haken zu setzen".
  const aktiv=new Set(leute.map(p=>p.oid));
  const ohne=getTeam().filter(m=>!aktiv.has(m.oid));
  if(ohne.length)
    h+='<div style="font-size:12px;color:var(--muted);margin:-8px 0 16px;line-height:1.6">'
      +'Ohne Eintrag in diesem Zeitraum: '+esc(ohne.map(m=>m.n).join(', '))
      +'. Das kann heißen, dass nichts anfiel — oder dass gearbeitet, aber nicht abgehakt wurde. '
      +'Der Report misst Haken, nicht Arbeit.</div>';

  h+='<div class="vl-card" style="font-size:12.5px;color:var(--muted);line-height:1.7">'
    +'<b style="color:var(--text)">Wie gezählt wird</b><br>'
    +'Je Aufgabe zählt ihr letzter Stand. Ist er „erledigt“ und fällt sein Zeitstempel in den Zeitraum, '
    +'zählt die Aufgabe einmal — für die Person, die den Haken zuletzt gesetzt hat. '
    +'Ein versehentlich gesetzter und wieder entfernter Haken zählt dadurch gar nicht, ein zweimal gesetzter nicht doppelt.<br>'
    +'<b style="color:var(--text)">Abgelehnt</b> steht in einer eigenen Spalte und zählt nicht in „Gesamt“. '
    +'Eine abgelehnte Aufgabe ist entschieden und liegt nicht mehr an — aber sie ist nicht dasselbe wie eine erledigte, '
    +'und in einer Summe wäre dieser Unterschied nicht mehr zu sehen. Die Begründung steht als Notiz an der Aufgabe.<br>'
    +'Haken, die bei der Umstellung von den einzelnen Geräten übernommen wurden, bleiben draußen: '
    +'Ihr Zeitstempel ist der Umstellungstag, nicht der Tag der Arbeit.<br>'
    +'Zugewiesen ist nicht dasselbe wie erledigt. Gezählt wird, wer abgehakt hat.</div>';
  h+='<div class="ft">KIMOJO · Team-Report</div>';
  document.getElementById('mc').innerHTML=h;
}

const MAIN_TABS=[
  ['tagesziel','🎯 Tagesziel'],
  ['luecken','⚡ Lücken'],
  ['rezepte','💊 Rezepte'],
  ['offene','💰 Offene Rezepte'],
  ['verplanung','🗓️ Verplanung'],
  ['potential','💎 Potential-Dauer'],
  ['folgevo','🔄 Folge-VO'],
  ['rezende','🎯 Rezept-Ende'],
  ['controlling','📊 Controlling'],
  ['telefonie','📞 Telefonie'],
  ['team','👤 Team-Report'],
  ['verlauf','📈 Verlauf']
];
function renderMainTabs(){
  let h='';
  MAIN_TABS.forEach(t=>{h+='<button class="m-tab'+(curView===t[0]?' a':'')+'" onclick="switchView(\''+t[0]+'\')">'+t[1]+'</button>';});
  document.getElementById('mainTabs').innerHTML=h;
}
function switchView(v){
  curView=v;renderMainTabs();
  if(v==='tagesziel')renderAufgaben();
  else if(v==='luecken')renderLueckenTab();
  else if(v==='rezepte')renderRezepte();
  else if(v==='offene')renderOffenePage();
  else if(v==='verplanung')renderVerplanung();
  else if(v==='potential')renderPotential();
  else if(v==='folgevo')renderFolgeVO();
  else if(v==='rezende')renderRezEnde();
  else if(v==='controlling')renderControllingTab();
  else if(v==='telefonie')renderTelefonie();
  else if(v==='team')renderTeamReport();
  else if(v==='verlauf')renderVerlauf();
  // Altbestand: 'warteliste' und 'feedback' sind keine eigenen Reiter mehr,
  // sie hängen unter Lücken bzw. Controlling. 'rezende' ist seit der
  // thevea-Umstellung der Rechnung wieder ein eigener Reiter (siehe oben).
  else if(v==='warteliste'){curView='luecken';lkSub='warteliste';renderMainTabs();renderLueckenTab();}
  else if(v==='feedback'){curView='controlling';ctSub='feedback';renderMainTabs();renderControllingTab();}
  else renderAufgaben();
}

// Beim Laden des Skripts: gespeicherten Modus und angemeldeten Namen übernehmen.
tzMode=lsGet('kimojo_tzmode','liste')==='kalender'?'kalender':'liste';
</script>
