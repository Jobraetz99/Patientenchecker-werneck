function showGapNR(gapMin,btn,thName,gapStart,isKGG){
  const el=document.getElementById('gapNR');if(!el)return;
  document.querySelectorAll('.ac-p').forEach(b=>b.style.background='');
  btn.style.background=isKGG?'var(--teal-bg)':'var(--fire-bg)';
  // Der Kasten gehört unter die Lücke, auf die geklickt wurde. Am Ende der
  // Liste stand er zwar auch, aber bei zehn Lücken sieht man dort nicht mehr,
  // zu welcher er gehört. Es bleibt derselbe eine Kasten und er wandert mit —
  // zwei offene Kästen wären zwei Antworten auf denselben Platz.
  const zeile=btn&&btn.closest?btn.closest('.ac'):null;
  if(zeile&&zeile.nextElementSibling!==el)zeile.insertAdjacentElement('afterend',el);
  window._curGap={gapMin,btn,thName,gapStart,isKGG}; // für Auto-Refresh nach Notiz-Änderung
  if(!RC||!RC.nr.length){el.innerHTML='<div style="padding:12px;color:var(--muted);font-size:11px">Keine Nachrücker verfügbar</div>';return;}
  const gapH=gapStart?new Date(gapStart).getHours():12;const isVM=gapH<12;
  // Tracking für Transparenz: warum wurde ein Patient ausgefiltert?
  let rejectedFreq=0,rejectedTherapeut=0,rejectedKGG=0;
  const scored=RC.nr.map(it=>{
    let bonus=0;const hints=[];
    const dauer=it._hmDauer||20;
    // KGG-Platz: nur Patienten mit KG-Gerät/KGG-Verordnung vorschlagen
    if(isKGG&&!it._kgg){rejectedKGG++;return{...it,_gapScore:-4,_hints:['💪 kein KG-Gerät'],_rejectReason:'kgg'};}
    if(isKGG&&it._kgg){bonus+=2;hints.push('💪 KG-Gerät');}
    if(dauer>gapMin){return{...it,_gapScore:-1,_hints:['⛔ '+dauer+'min passt nicht'],_rejectReason:'dauer'};}
    if(dauer<=gapMin)hints.push('✓ '+dauer+'min');
    // HARD-FILTER 1: Frequenz ≥ 2/Woche → Patient kommt schon oft genug, nicht mehr vorschlagen
    if(it._freqPerWeek&&it._freqPerWeek>=2){rejectedFreq++;return{...it,_gapScore:-2,_hints:['📈 Kommt schon '+it._freqPerWeek+'x/Wo'],_rejectReason:'freq'};}
    // HARD-FILTER 2: Stammtherapeut-Check — Patient muss diesen Therapeut schonmal gehabt haben
    // Robustes Token-Matching: ignoriert Reihenfolge ("Nüßlein, Vanessa" vs "Vanessa Nüßlein"),
    // Klammern-Suffixe ("(Physio - PhFiP)") und Komma-Trennung.
    // Match wenn ALLE relevanten Tokens des kürzeren Namens im längeren vorkommen.
    if(thName&&it._thHistory&&it._thHistory.length){
      const tokenize=s=>String(s||'').toLowerCase()
        .replace(/\(.*?\)/g,'')         // Klammer-Inhalte raus: (Physio - #2)
        .replace(/[,]/g,' ')            // Kommas zu Leerzeichen
        .split(/\s+/)                   // Split auf Whitespace
        .map(t=>t.trim())
        .filter(t=>t.length>=2);        // Mind. 2 Zeichen, ignoriere leer/Müll
      const thTokens=tokenize(thName);
      const match=it._thHistory.some(n=>{
        const nTokens=tokenize(n);
        if(!thTokens.length||!nTokens.length)return false;
        // Mindestens 2 Tokens müssen matchen (typisch Vor- + Nachname)
        // ODER bei kurzen Namen (1 Token): mindestens 1 muss matchen
        const matched=thTokens.filter(t=>nTokens.includes(t)).length;
        const minRequired=Math.min(2,Math.min(thTokens.length,nTokens.length));
        return matched>=minRequired;
      });
      if(!match){rejectedTherapeut++;return{...it,_gapScore:-3,_hints:['👤 Kein Bezug zu '+thName],_rejectReason:'therapeut'};}
      bonus+=2;hints.push('👤 Stammtherapeut');
    }else if(thName){
      // Kein Stammtherapeut bekannt. Das sind zwei verschiedene Dinge, und sie
      // dürfen nicht dieselbe Folge haben:
      //
      //   Die Daten SAGEN nichts — die Ergo-Terminhistorie führt überhaupt
      //   keinen Mitarbeiter (0 von 7.246 Terminen; Physio dagegen 100 %).
      //   Daraus „der Patient war nie bei dieser Therapeutin" zu schließen wäre
      //   ein Schluss aus einer Datenlücke. Der Kandidat bleibt deshalb drin,
      //   bekommt aber keinen Bonus und sagt im Hinweis, woran es liegt.
      //
      //   Die Daten sagen etwas anderes — fängt der Zweig oben ab.
      if(it._thQuelle==='keine'){hints.push('👤 Mitarbeiter nicht in der Historie');}
      else{rejectedTherapeut++;
        return{...it,_gapScore:-3,_hints:['👤 Keine Historie mit '+thName],_rejectReason:'therapeut'};}
    }
    // Kein Zukunftstermin: Das ist der Grund, warum er in die Lücke passt, und
    // gehört deshalb an die Zeile — nicht nur in die Begründungsliste.
    if(it._abriss!=null)hints.push('🔌 '+it._abriss+' T ohne Termin');
    if(it._timePat){if(it._timePat==='vm'&&isVM){bonus+=1;hints.push('🕐 VM-Patient');}else if(it._timePat==='nm'&&!isVM){bonus+=1;hints.push('🕐 NM-Patient');}else if(it._timePat==='vm'&&!isVM){bonus-=1;hints.push('⚠ eher VM');}else if(it._timePat==='nm'&&isVM){bonus-=1;hints.push('⚠ eher NM');}}
    return{...it,_gapScore:it.score+bonus,_hints:hints};
  });
  const fits=scored.filter(x=>x._gapScore>=0).sort((a,b)=>b._gapScore-a._gapScore);
  const noFit=scored.filter(x=>x._gapScore<0);
  const top=fits.slice(0,10);
  let h=`<div style="margin-top:8px;padding:14px;background:var(--fire-bg);border-radius:16px;border:1px solid rgba(239,68,68,.15)">`;
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-family:Inter;font-size:12px;font-weight:600;color:${isKGG?'var(--teal)':'var(--fire)'}">${isKGG?'💪 KGG-Nachrücker':'🔥 Top Nachrücker für '+gapMin+'min'} ${thName?'bei '+thName:''}</span><span style="cursor:pointer;color:var(--muted);font-size:14px" onclick="gapNRzu()">✕</span></div>`;
  if(!top.length){h+=`<div style="padding:8px;color:var(--muted);font-size:11px">Kein Heilmittel passt in ${gapMin}min</div>`;}
  top.forEach((it,i)=>{
    const reasons=it.reasons||[];let badges='';reasons.forEach(r=>{const cc=r.includes('BVB')||r.includes('LVB')?'c-green':r.includes('Blanko')?'c-purple':r.includes('Post')?'c-amber':r.includes('+')?'c-blue':'c-fire';badges+=`<span class="pr-b ${cc}">${r}</span>`;});
    const hintStr=it._hints?it._hints.join(' · '):'';
    // Geteilte Notiz + "angerufen"-Status (aus SharePoint)
    const pid=it.pid;const nt=(pid&&nrNotes[pid])||{};
    const called=!!nt.angerufen&&nt.angerufenDatum===nrToday();const noteTxt=String(nt.notiz||'').trim();
    const meta=nt.von?esc(nt.von)+(nt.zeit?', '+new Date(nt.zeit).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+new Date(nt.zeit).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''):'';
    const pidEsc=String(pid||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const nameEsc=String(it.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    h+=`<div style="background:var(--card);border-radius:10px;margin-bottom:3px;border:1px solid var(--border)${called?';box-shadow:inset 3px 0 0 var(--green)':''}">`;
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px">`;
    h+=`<div style="font-family:Inter;font-size:14px;font-weight:650;color:var(--fire);width:22px;text-align:center;flex-shrink:0">${i+1}</div>`;
    h+=`<div style="flex:1;min-width:0"><div style="font-family:Inter;font-size:12px;font-weight:600">${it.name}</div><div style="font-size:9px;color:var(--muted)">${it.detail}</div>`;
    if(hintStr)h+=`<div style="font-size:8px;color:var(--teal);margin-top:1px">${hintStr}</div>`;
    h+=`</div>`;
    h+=`<div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:120px;flex-shrink:0">${badges}</div>`;
    h+=`<div style="font-family:Inter;font-size:11px;font-weight:600;color:var(--fire);flex-shrink:0;padding:3px 8px;background:var(--fire-bg);border-radius:100px">${it._gapScore}pt</div>`;
    h+=`</div>`;
    // Notiz-Zeile
    if(pid){
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px dashed var(--border)">`;
      h+=`<button onclick="nrToggleCalled('${pidEsc}',this)" title="Angerufen-Status umschalten" style="flex-shrink:0;padding:3px 10px;border-radius:100px;font-family:Inter;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid ${called?'var(--green)':'var(--border)'};background:${called?'var(--green)':'#fff'};color:${called?'#fff':'var(--muted)'}">${called?'✅ angerufen':'📞 angerufen?'}</button>`;
      h+=`<div style="flex:1;min-width:0;font-size:10px;line-height:1.3;overflow:hidden;text-overflow:ellipsis">${noteTxt?'📝 '+esc(noteTxt):'<span style="color:var(--muted);font-style:italic">keine Notiz</span>'}${meta?`<span style="color:var(--muted)"> · ${meta}</span>`:''}</div>`;
      h+=`<button onclick="nrEditNote('${pidEsc}','${nameEsc}')" title="Notiz bearbeiten" style="flex-shrink:0;padding:3px 8px;border-radius:8px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:#fff">✏️</button>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(noFit.length){
    const rejectedDauer=noFit.length-rejectedFreq-rejectedTherapeut-rejectedKGG;
    const reasons=[];
    if(rejectedDauer>0)reasons.push(rejectedDauer+' zeitlich unpassend');
    if(rejectedKGG>0)reasons.push(rejectedKGG+' ohne KG-Gerät');
    if(rejectedFreq>0)reasons.push(rejectedFreq+' bereits 2+x/Woche');
    if(rejectedTherapeut>0)reasons.push(rejectedTherapeut+' kein Bezug zu '+thName);
    // Rausgefilterte im globalen State speichern für den Toggle
    window._lastGapRejected=noFit;
    window._lastGapThName=thName;
    h+=`<div style="margin-top:10px;padding:8px 4px;border-top:1px dashed rgba(239,68,68,.2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">`;
    h+=`<span style="font-size:10px;color:var(--muted)">${noFit.length} Patienten ausgefiltert · ${reasons.join(' · ')}</span>`;
    h+=`<button onclick="toggleGapRejected(this)" style="padding:4px 12px;border:1.5px solid var(--muted);background:#fff;border-radius:100px;font-family:Inter;font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap">👁 Trotzdem anzeigen</button>`;
    h+=`</div>`;
    h+=`<div id="gapRejectedList" style="display:none;margin-top:6px"></div>`;
  }
  // Hausbesuche kommen gar nicht erst in die Nachrücker-Liste — sie würden den
  // Platz nicht besetzen. Dass es sie gibt, steht hier trotzdem, mit Namen im
  // Tooltip: eine Zahl, die man nicht aufklären kann, ist keine Auskunft.
  const hbAus=(RC&&RC.hbAus)||[];
  if(hbAus.length)h+=`<div style="margin-top:8px;padding:6px 4px;font-size:10px;color:var(--muted)" `
    +`title="${escA(hbAus.map(x=>x.name).join(', '))}">`
    +`🚗 ${hbAus.length} Hausbesuch${hbAus.length===1?'':'e'} nicht vorgeschlagen — `
    +`diese Patienten kommen nicht in die Praxis.</div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

// Schließen heißt leeren UND zurück ans Ende der Lückenliste. Bliebe der leere

function gapNRzu(){
  const el=document.getElementById('gapNR');
  if(el){
    el.innerHTML='';
    const acs=document.querySelectorAll('#dayBriefing .ac');
    if(acs.length)acs[acs.length-1].insertAdjacentElement('afterend',el);

// ── NACHRÜCKER AUS DER THEVEA-VERORDNUNGSÜBERSICHT ──────────────────────────
// Medifox lieferte je Verordnung die vollständige Termin-Historie; daraus leitete
// analyzeRezepte() BVB/LVB, Blanko-Potenzial und Frequenz ab. Die thevea-
// Verordnungsübersicht kennt davon nur die Summen (durchführbar/durchgeführt).
// ICD, Blanko-Kennzeichen und Termin-Historie je Rezept fehlen dort komplett.
// Diese Funktion füllt die fehlenden Felder BEWUSST NICHT mit Platzhaltern —
// sonst entstünden Kategorien, die fachlich nicht belegt sind. Gerechnet wird
// nur, was die Daten hergeben: offene Einheiten, Rezeptalter und die tatsächliche
// Besuchsfrequenz aus dem Terminplan. BVB/Blanko/Frequenz bleiben leer, bis die
// Verordnungsdetails (verordnung(id) mit ICD und Diagnosegruppe) nachgeladen sind.
// ═══════════════════════════════════════════════════════════
// OFFENE REZEPTE — thevea
// ═══════════════════════════════════════════════════════════
// Medifox lieferte je Behandlung eine Zeile mit Preis und einem Häkchen
// "abgerechnet". Diese Ebene gibt es in thevea nicht — die Verordnungsübersicht
// führt den Abrechnungsstand je Rezept. Das ist ohnehin die richtige Einheit:
// fakturiert wird das Rezept, nicht die einzelne Behandlung.
//
// Zwei Fälle, in denen erbrachte Leistung nicht zu Geld wird:
//
//   fertig — alle verordneten Einheiten liegen als Termin in der Vergangenheit
//        (6 von 6), es steht keiner mehr aus, abgerechnet ist nichts. Zwei
//        Spielarten: das Rezept steht noch auf "InBehandlung", dann ist
//        Abrechnung technisch gar nicht möglich und es fällt niemandem auf; oder
//        es ist abgeschlossen, aber es wurde keine Rechnung erzeugt.
//   steck  — angefangen und liegengeblieben (4 von 6 Terminen durch) und für den
//        Rest ist nichts gebucht. Der Patient kommt nicht wieder, die Restmenge
//        verfällt.
//
// Entscheidend ist dabei die Terminlage, nicht der Dokumentationsstand — siehe
// die Begründung bei "Wieviel ist geleistet?" in buildOffeneTV().
//
// Dazu zwei Nebenposten, die ebenfalls offenes Geld sind:
//   rgOffen   — Rechnung gestellt und unbezahlt (in der Praxis durchweg Privat).
//   zuzahlung — gesetzliche Zuzahlung weder kassiert noch berechnet.
//
// Jedes Rezept erscheint genau einmal, mit dem dringlichsten zutreffenden Grund.
// Eine offene Zuzahlung wird zusätzlich als Betrag mitgeführt, auch wenn das
// Rezept schon aus einem anderen Grund in der Liste steht.
//
// Zum Alter: gemessen wird ab dem **letzten Termin des Rezepts**, nicht ab dem
// Ausstellungsdatum. Die Verordnungsübersicht führt dieses Datum nicht — es kommt
// aus termine_historie{suf}.json, siehe histMap(). Fehlt die Datei, fällt die
// Rechnung auf das Ausstellungsdatum zurück und die Zeile wird als Näherung
// gekennzeichnet; der Reiter funktioniert also auch ohne sie, nur ungenauer.

// ── Termin-Historie ────────────────────────────────────────
// Der Terminplan-Export schaut nur nach vorn, weil er für den Tagesplan gebaut
// wurde. Für die offenen Rezepte brauchen wir die Gegenrichtung: wann wurde
// zuletzt behandelt, und steht überhaupt noch etwas an? Beides liefert dieselbe
// termine-Query mit anderem Zeitfenster (from = heute−180 Tage, until = heute+90).
// Jeder Termin trägt eine VerordnungId, also lässt sich das je Rezept bestimmen
// und nicht nur je Patient — wichtig, weil ein Patient ein zweites, laufendes
// Rezept haben kann, während das erste liegenbleibt.
//
// Abgesagte Termine zählen weder als Behandlung noch als Folgetermin. Welche
// Statuswerte thevea genau vergibt, steht nicht im Schema (Introspection ist
// gesperrt); erkannt wird deshalb über ein Muster, und die tatsächlich
// vorkommenden Werte landen zur Kontrolle in der Konsole.
const HIST_ABGESAGT=/ABGESAGT|ABSAGE|STORN|AUSGEFALLEN|ENTFALLEN|NICHT.?ERSCHIENEN|GEL[OÖ]SCHT|CANCEL/i;
// Ab wie vielen Terminen im selben Wochentag-Uhrzeit-Fenster gilt ein Patient
// als fest eingetaktet. Drei ist bewusst niedrig: schon drei gleiche Termine
// sind kein Zufall, und wer knapp darunter liegt, taucht als Kandidat auf —
// das ist die richtige Fehlerrichtung, denn eine falsche Empfehlung kostet
// einen Blick, ein übersehener Dauerpatient kostet Termine.
const SERIE_MIN=3;
// Wie lange eine abgerissene Behandlung als Nachrücker gilt. 120 Tage: Wer vor
// vier Monaten zuletzt da war, ist ein Reaktivierungsgespräch und kein Anruf
// für die Lücke von morgen früh. Darunter ist die Behandlung abgerissen, nicht
// beendet — und das Rezept hat noch Einheiten.
const NR_ABRISS_MAX=120;

function histMap(roh,heuteDs){
  if(!roh)return null;
  // Drei Formate werden angenommen: das schlanke Select-Ergebnis {v,p,d,s}, die
  // Terminplan-Schreibweise {VerordnungId,PatientId,Beginn} und der rohe
  // HTTP-Body {data:{termine:[…]}}. Wer den Flow schlank halten will, hängt
  // einfach den Body an — dann ist eine Aktion weniger zu bauen.
  const arr=[];
  const schluck=(x)=>{
    if(!x)return;
    if(Array.isArray(x)){x.forEach(schluck);return;}
    if(typeof x!=='object')return;
    if(x.data&&typeof x.data==='object')return schluck(x.data);
    if(Array.isArray(x.termine))return schluck(x.termine);
    if(Array.isArray(x.nodes))return schluck(x.nodes);
    arr.push(x);
  };
  schluck(roh);
  if(!arr.length)return null;

  const VO={},PAT={},SER={},statZ={};let von=null,bis=null,ohneVO=0;
  arr.forEach(t=>{
    if(!t||typeof t!=='object')return;
    const vRaw=t.v!=null?t.v:(t.VerordnungId!=null?t.VerordnungId
              :(t.terminVerordnung&&t.terminVerordnung.id!=null?t.terminVerordnung.id:null));
    const pRaw=t.p!=null?t.p:(t.PatientId!=null?t.PatientId:(t.patientId!=null?t.patientId:null));
    const dRaw=t.d||t.Datum||t.from||t.Beginn;
    if(!dRaw)return;
    // Die GraphQL-Zeiten kommen in UTC. Für das reine Datum genügt das: der erste
    // Termin des Tages liegt bei 07:00 Ortszeit, also 05:00 UTC — der Tag kippt
    // nicht. Nur Termine vor 02:00 nachts würden verrutschen, die gibt es nicht.
    const d=String(dRaw).slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    const s=t.s!=null?String(t.s):(t.status!=null?String(t.status)
           :(t.Status!=null?String(t.Status):''));
    statZ[s]=(statZ[s]||0)+1;
    if(!von||d<von)von=d;if(!bis||d>bis)bis=d;
    if(vRaw==null)ohneVO++;
    const abgesagt=HIST_ABGESAGT.test(s);
    const vergangen=d<heuteDs;
    // Wer hat behandelt, und zu welcher Stunde? Beides braucht die
    // Nachrücker-Zuordnung, und beides stand bisher nur im 14-Tage-Terminplan
    // zur Verfügung — also nur für Patienten, bei denen noch ein Termin steht.
    // Für die abgerissenen Behandlungen ist die Vergangenheit die einzige
    // Quelle. Physio liefert den Mitarbeiter zu 100 %, die Ergo-Historie
    // führt ihn gar nicht; das Feld bleibt dort leer und wird nicht geraten.
    const mp=(t.mitarbeiter&&t.mitarbeiter.person)||null;
    const mName=mp?((mp.vorname||'')+' '+(mp.nachname||'')).trim()
      :(Array.isArray(t.Mitarbeiter)&&t.Mitarbeiter[0]
        ?((t.Mitarbeiter[0].Vorname||'')+' '+(t.Mitarbeiter[0].Nachname||'')).trim():'');
    const stunde=(()=>{const x=new Date(dRaw);return isNaN(x.getTime())?null:x.getHours();})();
    const eintragen=(m,k)=>{
      if(k==null)return;
      const e=m[String(k)]||(m[String(k)]={letzter:null,naechster:null,n:0,nZ:0,nAbg:0,
        tage:new Set(),alle:[],th:new Set(),std:[]});
      if(abgesagt){e.nAbg++;return;}
      // Alle nicht abgesagten Termine aufheben — Rezept-Ende braucht die volle
      // Terminreihe je Rezept, nicht nur letzter/naechster. Zweigleisig:
      //   tage — die Besuchstage (Set: zwei Einheiten am selben Tag = EIN Besuch),
      //          fuer die Frage "ist heute der letzte/vorletzte Besuch?"
      //   alle — jede Einheit einzeln, fuer den Fortschritt "5/6" so, wie ihn
      //          thevea und der Kalender zaehlen
      e.tage.add(d);e.alle.push(d);
      if(mName)e.th.add(mName);
      if(stunde!=null)e.std.push(stunde);
      if(vergangen){e.n++;if(!e.letzter||d>e.letzter)e.letzter=d;}
      else{e.nZ++;if(!e.naechster||d<e.naechster)e.naechster=d;}
    };
    eintragen(VO,vRaw);eintragen(PAT,pRaw);
    // ── Serienslot je Patient ──────────────────────────────────────────────
    // Medifox kannte die "Maske D": ein Patient mit festem Dauerplan trug ein
    // Kennzeichen. thevea hat das nicht. Ersatz ist die Wirklichkeit statt des
    // Kennzeichens: wer Woche für Woche am selben Wochentag zur selben Uhrzeit
    // kommt, HAT einen Dauerplan — egal ob ihn jemand als solchen angelegt hat.
    // Gezählt wird nur, was wirklich stattgefunden hat oder fest steht;
    // abgesagte Termine bilden keine Serie.
    if(pRaw!=null&&!abgesagt){
      const dt=new Date(dRaw);
      if(!isNaN(dt.getTime())){
        const key=dt.getDay()+'|'+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
        const p=SER[String(pRaw)]||(SER[String(pRaw)]={});
        const sl=p[key]||(p[key]={n:0,erster:null,letzter:null});
        sl.n++;
        if(!sl.erster||d<sl.erster)sl.erster=d;
        if(!sl.letzter||d>sl.letzter)sl.letzter=d;
      }
    }
  });
  // Aus den Slot-Zählungen je Patient den stärksten Slot herausziehen. Ab drei
  // Terminen im selben Fenster ist es kein Zufall mehr, sondern ein Rhythmus.
  const SERIEN={};
  Object.keys(SER).forEach(pid=>{
    let best=null,bk=null;
    Object.keys(SER[pid]).forEach(k=>{const s=SER[pid][k];if(!best||s.n>best.n){best=s;bk=k;}});
    if(best&&best.n>=SERIE_MIN){
      const[wd,uhr]=bk.split('|');
      SERIEN[pid]={tag:HWTAG[+wd]||'?',uhr,n:best.n,erster:best.erster,letzter:best.letzter,
        label:(HWTAG[+wd]||'?')+' '+uhr};
    }
  });
  const h={vo:VO,pat:PAT,serien:SERIEN,von,bis,n:arr.length,ohneVO,status:statZ};
  console.log('Termin-Historie:',arr.length,'Termine',von,'bis',bis,
    '|',Object.keys(VO).length,'Rezepte,',Object.keys(PAT).length,'Patienten',
    '| ohne VerordnungId:',ohneVO,'| Status:',statZ,
    '| feste Serienslots (≥'+SERIE_MIN+'):',Object.keys(SERIEN).length);
  return h;
}

function buildOffeneTV(voRoh,standort,heuteDs,dd,hist){
  const out=[];const nodes=voNodes(voRoh);if(!nodes)return out;
  const tage=(ds)=>ds?Math.round((new Date(heuteDs+'T12:00:00')-new Date(String(ds).slice(0,10)+'T12:00:00'))/864e5):null;

  // Rückfallebene ohne Historie: Patienten mit mindestens einem Termin im
  // 14-Tage-Fenster des Terminplans. Gröber als die Rezept-Ebene, aber besser
  // als nichts, solange die Historiendatei fehlt.
  const hatTermin=new Set();
  const buckets=[];
  if(dd&&dd.heute&&Array.isArray(dd.heute.tp))buckets.push(dd.heute.tp);
  if(dd&&dd.morgen&&Array.isArray(dd.morgen.tp))buckets.push(dd.morgen.tp);
  ((dd&&dd.extraDays)||[]).forEach(a=>{if(Array.isArray(a))buckets.push(a.flat());});
  buckets.forEach(arr=>(arr||[]).forEach(t=>{if(t&&t.PatientId!=null)hatTermin.add(String(t.PatientId));}));
  const H=(hist&&hist.vo)?hist:null;

  nodes.forEach(v=>{
    if(!v||v.status==='Entwurf')return;                 // Entwürfe sind noch keine Leistung
    const erb=voErb(v);
    const kann=voKann(v);
    const zzB=parseFloat(v.zuzahlung||0)||0;
    // "quittiert" heißt bar kassiert, "zuzahlungsrechnungBezahlt" per Rechnung —
    // beides erledigt die Forderung.
    const zzOffen=!!v.zuzahlungsrelevant&&!v.zuzahlungQuittiert&&!v.zuzahlungsrechnungBezahlt&&zzB>0;
    const pid=v.verknuepfterPatientId!=null?String(v.verknuepfterPatientId):null;
    const hv=H?H.vo[String(v.id)]:null;
    // "Kein zukünftiger Termin" wird mit Historie auf Rezept-Ebene geprüft und
    // über das volle Vorausfenster, nicht nur über 14 Tage.
    const ohneTermin=H?!(hv&&hv.naechster):(!pid||!hatTermin.has(pid));

    // Stichtag für "offen seit": der letzte Termin des Rezepts. Drei Quellen in
    // absteigender Güte:
    //   termin      — echter letzter Termin aus der Historie
    //   vorFenster  — es wurde behandelt, aber vor dem Anfang des Fensters;
    //                 dann ist der Fensteranfang eine sichere Untergrenze
    //   ausstellung — ohne Historie oder ohne erbrachte Einheit
    let stichtag=hv&&hv.letzter?hv.letzter:null,quelle='termin';
    if(!stichtag){
      if(H&&erb>0&&H.von){stichtag=H.von;quelle='vorFenster';}
      else{stichtag=String(v.ausstellungsdatum||'').slice(0,10)||null;quelle='ausstellung';}
    }
    // ── Wieviel ist geleistet? ────────────────────────────────
    // Zwei Zeugen, und der Terminplan ist der ehrlichere. Eine Zeile in der
    // Historie entspricht einer Behandlungseinheit, nicht einem Besuch: bei 70 %
    // der Rezepte ergibt vergangene + künftige Zeilen exakt die verordnete Menge,
    // eine 45-Minuten-Behandlung belegt eben zwei Zeilen am selben Tag. Damit ist
    // die Terminlage direkt mit summeDurchfuehrbareBehandlungen vergleichbar.
    //
    // summeDurchgefuehrteBehandlungen zählt dagegen nur, was jemand als
    // durchgeführt markiert hat, und das hinkt hinterher — je weiter zurück,
    // desto mehr. Sechs abgelaufene Termine auf einer 6er-Verordnung heißen: die
    // Behandlung ist durch, egal was in der Dokumentation steht.
    //
    // Genommen wird deshalb der höhere der beiden Werte. Die Dokumentation kann
    // ihrerseits höher liegen, wenn Termine vor dem Anfang des Rückblickfensters
    // liegen; dann trägt sie. Beide Zahlen bleiben in der Zeile sichtbar.
    const tv=hv?hv.n:null;                 // vergangene Einheiten laut Terminplan
    const tz=hv?hv.nZ:null;                // künftige, nicht abgesagte Einheiten
    const gel=tv!=null?Math.max(erb,tv):erb;

    // Fertig heißt: die verordnete Menge ist durch und abgerechnet ist nichts.
    // Zwei Wege dorthin, und der erste sticht:
    //   1. die Termine selbst sind durch (tv >= kann). Dann ist das Rezept fertig,
    //      auch wenn im Kalender noch ein Termin steht — der ist dann ein Überhang
    //      und gehört auf das Folgerezept, nicht auf dieses. Sechs abgelaufene
    //      Termine auf einer 6er-Verordnung sind sechs abgelaufene Termine.
    //   2. nur die Dokumentation ist voll, die Terminlage nicht (Termine vor dem
    //      Rückblickfenster). Dann muss zusätzlich der Kalender leer sein, sonst
    //      wäre eine vorausgetragene Dokumentation genug, um ein laufendes Rezept
    //      fälschlich fertigzumelden.
    // Ein Termin **heute** zählt als offen, nicht als gelaufen — die Einheit ist
    // ja noch nicht erbracht.
    const mengeDurch=(tv!=null&&tv>=kann)||(gel>=kann&&ohneTermin);
    // Ist das Rezept schon aus dem Haus? „Versandt" heißt: an die Abrechnung
    // gegeben; „Rechnung" heißt: dort ist eine Rechnung daraus geworden. In
    // beiden Fällen ist in der Praxis nichts mehr zu tun.
    //
    // Das war der Fehler: Gezählt wurde nur `hatAktuelleRechnungen`, und das
    // steht bei 121 der 558 versandten Rezepte auf false — weil das
    // Abrechnungszentrum noch keine Rechnung erzeugt hat. Dadurch standen am
    // 09.10.2026 **108 längst versandte Rezepte** unter „Fertig, nicht
    // abgerechnet" und sahen aus wie Arbeit. Echte Arbeit waren 81.
    const anAbrechnung=(v.status==='Versandt'||v.status==='Rechnung');
    let kat=null;
    if(v.rechnungOffen)kat='rgOffen';
    else if(kann>0&&mengeDurch&&!v.hatAktuelleRechnungen&&!anAbrechnung)kat='fertig';
    else if(v.status==='InBehandlung'&&kann>0&&gel>0&&gel<kann&&ohneTermin)kat='steck';
    // Zuzahlung: fällig oder nicht entscheidet die TERMINLAGE, nicht der
    // Status. Der Zweig hing vorher an `status==='Abgeschlossen'` — den vergibt
    // thevea bei 2 von 1.200 Rezepten. Praktisch fiel deshalb alles in
    // „laufend", auch die 68, bei denen längst nichts mehr lief.
    else if(zzOffen&&mengeDurch&&ohneTermin)kat='zuzahlung';
    else if(zzOffen)kat='zuzahlungLaufend';
    if(!kat)return;
    out.push({id:v.id,
      patient:((v.nachname||'')+(v.vorname?', '+v.vorname:'')).trim()||'(ohne Namen)',
      pid,standort,kat,
      heilmittel:v.heilmittel||'',formular:v.formular||'',status:v.status||'',
      // Bei "fertig" ist der entscheidende Unterschied, ob das Rezept überhaupt
      // abschließbar gemacht wurde — davon hängt ab, was zu tun ist.
      offenImProgramm:kat==='fertig'&&v.status==='InBehandlung',
      ausst:String(v.ausstellungsdatum||'').slice(0,10)||null,
      letzter:hv&&hv.letzter?hv.letzter:null,
      naechster:hv&&hv.naechster?hv.naechster:null,
      nTermine:hv?hv.n:null,quelle,
      daysAgo:tage(stichtag),
      // erb = dokumentiert, gel = tatsächlich zugrunde gelegt. Weichen sie ab,
      // fehlt Dokumentation; das wird in der Zeile markiert, nicht versteckt.
      erb,gel,tv,tz,dokuLuecke:tv!=null&&tv>erb?tv-erb:0,
      // Menge erreicht und trotzdem steht noch etwas im Kalender: der Termin
      // gehört auf ein Folgerezept. Muss sichtbar sein, sonst wirkt die Zeile
      // wie ein Fehler.
      ueberhang:kat==='fertig'&&tz?tz:0,
      kann,rest:Math.max(0,kann-gel),zz:zzOffen?zzB:0});
  });
  return out;
}

// Die Aufgaben-Id einer Verordnung. Steht an EINER Stelle, weil das Tagesziel
// und der Reiter „Offene Rezepte" dieselbe Aufgabe meinen: Wer im Reiter eine
// Notiz schreibt oder abhakt, tut das für dieselbe Zeile, die morgens in der
// Tagesliste steht. Zwei Schreibweisen hätten zwei getrennte Protokolle ergeben
// und niemand hätte gemerkt, dass die Notiz nicht ankommt.
function aufIdRezept(r){return'abr|'+((r&&r.id)!=null?r.id:'');}

const OFFEN_KAT={
  fertig   :{l:'Fertig, nicht abgerechnet',b:'b-red',  t:'Alle verordneten Einheiten liegen als Termin in der Vergangenheit, kein Termin mehr offen — und das Rezept ist noch nicht an die Abrechnung gegeben. Versandte Rezepte stehen hier NICHT: dort ist in der Praxis nichts mehr zu tun.'},
  steck    :{l:'Steckengeblieben',         b:'b-amber',t:'Ein Teil der Einheiten ist terminlich durch, der Rest ist nicht terminiert — die Restmenge verfällt'},
  rgOffen  :{l:'Rechnung offen',           b:'b-amber',t:'Rechnung gestellt und noch nicht bezahlt'},
  zuzahlung:{l:'Zuzahlung fällig',         b:'b-teal', t:'Die verordnete Menge ist erbracht und es steht kein Termin mehr an — die Zuzahlung ist weder kassiert noch berechnet. Hier lässt sich kassieren.'},
  zuzahlungLaufend:{l:'Zuzahlung (laufend)',b:'b-teal',t:'Das Rezept läuft noch: Es steht ein Termin an oder die Menge ist nicht durch. Kassiert wird üblicherweise am Ende.'}
};

// ── Die Erstbefundung ist keine Terminmenge ────────────────────────────────
// „Physiotherapeutische Erstbefundung zur Erstellung eines Behandlungsplans"
// steht auf Privat- und Beihilferezepten als eigene Position. Sie ist eine
// abrechenbare Leistung, aber KEIN Termin: Sie entsteht beim ersten
// Behandlungstermin mit, sie wird nicht eigens vereinbart.
//
// thevea führt sie trotzdem als Einheit in `summeDurchfuehrbareBehandlungen`.
// Belegt an den echten Daten vom 08.10.2026: Behandlungsmengen werden in
// geraden Schritten verordnet, aber alle 48 Privatrezepte mit dieser Position
// tragen eine UNGERADE Menge — 3, 7, 9, 11, 13, 17, 21, 31. Zieht man die eine
// Einheit ab, ist jede davon gerade. Die Position zählt also genau eins.
//
// Die Folge ohne Korrektur: Die Terminhistorie kennt die Erstbefundung nicht,
// weil sie kein Termin ist. verordnet − erbracht − gebucht ließ deshalb auf
// jedem dieser Rezepte dauerhaft „eine Einheit nicht terminiert" stehen; sieben
// Patienten standen allein heute mit genau dieser Phantomeinheit in der
// Verplanung, und kein Privatrezept erreichte je den Zustand „ausgeschöpft".
//
// Herausgerechnet wird aus BEIDEN thevea-Summen: Sobald die Erstbefundung
// erbracht ist, zählt thevea sie auch in `summeDurchgefuehrteBehandlungen`
// mit — ein abgeschlossenes Rezept steht dort auf 11 von 11. Nur aus der
// verordneten Menge zu kürzen würde den Rest um eins zu niedrig zeigen.
// Die Terminhistorie bleibt unangetastet, sie hat die Einheit nie gezählt.
//
// Betroffen ist jede Zahl, die eine Menge mit Terminen vergleicht: die
// Verplanung, „Folgetermin vereinbaren", der Zustand „ausgeschöpft" und in der
// Rezeptsteuerung „fertig" und „steckengeblieben". Ein Privatrezept erreichte
// „fertig" vorher nie, weil die gezählten Termine die verordnete Menge nie
// einholen konnten.
//
// Die ABRECHNUNG rührt das nicht an: Zuzahlungsbetrag und Rechnungsstand kommen
// aus eigenen Feldern (`zuzahlung`, `rechnungOffen`) und bleiben ungekürzt —
// die Erstbefundung ist und bleibt eine abrechenbare Leistung.
const VO_DIAG_RE=/erstbefund|physiotherapeutische\s*diagnostik/i;
function voDiag(v){return VO_DIAG_RE.test(String((v&&v.heilmittel)||''))?1:0;}
// Terminierbare Menge eines Rezepts — das, was der Empfang noch verplanen muss.
function voKann(v){return Math.max(0,(((v&&v.summeDurchfuehrbareBehandlungen)||0)-voDiag(v)));}
// Erbrachte Menge nach thevea, auf derselben Grundlage gezählt.
function voErb(v){return Math.max(0,(((v&&v.summeDurchgefuehrteBehandlungen)||0)-voDiag(v)));}

function voNodes(roh){
  if(!roh)return null;
  if(Array.isArray(roh))return roh;
  const n=(roh.data&&roh.data.verordnungUebersicht&&roh.data.verordnungUebersicht.nodes)
        ||(roh.verordnungUebersicht&&roh.verordnungUebersicht.nodes)||roh.nodes;
  return Array.isArray(n)?n:null;
}
function plusTag(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// thevea schreibt Heilmittel mal als Kürzel ("KG;MT"), mal ausgeschrieben
// ("Manuelle Therapie - Einzelstunde - MT - Privat"). Für die Erkennung von
// Kombi-Rezepten (KG+MT) muss beides auf denselben Nenner. Erstbefundung und
// Hausbesuch-Pauschale sind Positionen, keine Heilmittel — sie zählen nicht mit,
// sonst wäre fast jedes Privatrezept fälschlich ein Kombi-Rezept.
function hmKurz(s){
  const t=String(s||'').toLowerCase().trim();
  if(!t)return null;
  if(/erstbefund|befundung|hausbesuch|pauschale|blankoverordnung/.test(t))return null;
  if(/ger(ä|ae)tegest|kg-?ger(ä|ae)t|kgg/.test(t))return 'KG-Gerät';
  if(/mld|lymphdrain/.test(t))return 'MLD';
  if(/manuelle therapie|(^|[^a-z])mt([^a-z]|$)/.test(t))return 'MT';
  if(/kg-?zns|bobath|pnf|neurophysiolog/.test(t))return 'KG-ZNS';
  if(/kg-?atem|atemtherap/.test(t))return 'KG-Atem';
  if(/heiße rolle|(^|[^a-z])hr([^a-z]|$)|(^|[^a-z])wt([^a-z]|$)|(^|[^a-z])wp([^a-z]|$)|wärme|warmpack|packung|fango/.test(t))return 'Wärme';
  if(/(^|[^a-z])mfb([^a-z]|$)|manuelle behandlung/.test(t))return 'MFB';
  if(/(^|[^a-z])kg([^a-z]|$)|krankengymnast/.test(t))return 'KG';
  if(/(^|[^a-z])spb([^a-z]|$)|sensomotor/.test(t))return 'SPB';
  return null;
}

// thevea liefert ICD-Codes ohne Punkt ("M542", "G8201"). Die vorhandenen Prüfungen
// isBP/isPO und die Anzeige erwarten die amtliche Schreibweise M54.2 — nach der
// dritten Stelle kommt der Punkt.
function icdPunkt(c){const s=String(c||'').trim().toUpperCase();return s.length>3?s.slice(0,3)+'.'+s.slice(3):s;}

// Verordnungsdetails nach Verordnungs-ID. Zwei Dateiformate werden akzeptiert, damit
// der Power-Automate-Flow so einfach wie möglich bleiben kann:
//
//   1. kompakt   — [{id, icd, icdT, dg, ...}] oder {nodes:[...]}
//   2. roh       — die GraphQL-Antwort, so wie thevea sie schickt: ein Objekt (oder ein
//                  Array mehrerer Blöcke) mit den Aliassen v<id> und b<id>.
//
// Variante 2 ist der bequeme Weg: der Flow hängt einfach body('HTTP Details')?['data']
// an eine Array-Variable und schreibt sie weg. Kein Umbau der Felder, keine
// Schlüssel-Wert-Tabelle mit dreizehn Ausdrücken — das Umrechnen passiert hier.
function detMap(roh){
  const M={};
  if(!roh)return M;
  const komp=roh.nodes||(Array.isArray(roh)&&roh.length&&roh[0]&&roh[0].id!=null?roh:null);
  if(komp){(komp||[]).forEach(d=>{if(d&&d.id!=null)M[String(d.id)]=d;});return M;}
  (Array.isArray(roh)?roh:[roh]).forEach(blk=>{
    if(!blk||typeof blk!=='object')return;
    // Der Flow darf den kompletten HTTP-Body anhängen — dann steckt alles noch in der
    // GraphQL-Hülle {data:{…}, errors:[…]}. Ein Ausdruck weniger in Power Automate,
    // und die Fehlermeldungen landen sichtbar in der Datei statt lautlos im Nichts.
    const o=(blk.data&&typeof blk.data==='object')?blk.data:blk;
    Object.keys(o).forEach(k=>{
      const m=/^v(\d+)$/.exec(k);if(!m)return;
      const v=o[k];if(!v)return;                       // gelöschte Verordnungen kommen als null
      const id=m[1];
      const di=v.diagnose||{},ic=di.icd101||{},dg=di.diagnosegruppe||{},tf=v.therapiefrequenz||{};
      M[id]={id:Number(id),
        ausst:String(v.ausstellungsdatum||'').slice(0,10),
        bl:v.blankoverordnung?1:0,hb:v.hausbesuch?1:0,dr:v.dringlicherBehandlungsbedarf?1:0,
        icd:ic.code||'',icdT:ic.titel||'',
        dg:dg.kuerzel||'',dgMax:dg.hoechstverordnungsmengeJeVerordnung||0,
        fv:tf.von||0,fb:tf.bis||0,
        ende:(v.behandlungsendeFrist&&v.behandlungsendeFrist.ende)||'',
        bvb:o['b'+id]===true?1:0};
    });
  });
  return M;
}

// ── Hausbesuch: wer nicht in die Praxis kommt, füllt auch keine Praxislücke ──
// Der Hausbesuch steht in drei Quellen, und keine einzige reicht allein:
//
//   1. Das Hausbesuch-Häkchen der Verordnung (verordnung_details_*.json → hb).
//      Das ist das echte Feld auf dem Rezept. Es trägt die Kassenrezepte.
//   2. Der Heilmittel-Text ("Hausbesuch Pauschale"). Privat- und Beihilfe-
//      formulare bekommen von thevea gar keinen Detailsatz — bei ihnen gibt es
//      nur diese Zeile, das Häkchen ist dort undefined.
//   3. IsHausbesuch am Termin (HB_VO aus dem Terminplan). Fängt die Fälle, über
//      die das Rezept nichts sagt, der Empfang den Besuch aber so eingetragen hat.
//
// Gemessen am Live-Stand Werneck: Quelle 1 findet 71 Patienten, Quelle 2 findet
// 8 — und zwar vollständig verschiedene. Die Mengen überschneiden sich in keinem
// einzigen Fall, weil Kassenrezepte das Häkchen tragen und "KG" im Text haben,
// Privatrezepte umgekehrt. Wer eine der beiden Quellen weglässt, verliert eine
// ganze Abrechnungsklasse.
const HB_TEXT=/haus\s*-?\s*besuch/i;
function voHausbesuch(v,det){
  if(!v)return false;
  const D=det&&det[String(v.id)];
  if(D&&D.hb)return true;
  if(HB_TEXT.test(String(v.heilmittel||'')))return true;
  if(typeof HB_VO!=='undefined'&&HB_VO&&v.id!=null&&HB_VO.has(v.id))return true;
  return false;
}

function buildRezepteTV(voRoh,dd,refDs,detRoh,hist){
  const cat={bvb:[],blanko:[],blankopot:[],folge:[],reserv:[],freq:[],nr:[],hbAus:[]};
  const nodes=voNodes(voRoh);
  if(!nodes)return cat;

  // 0) Verordnungsdetails. Nicht jede Verordnung hat welche: Privat- und
  //    BG-Formulare tragen keine Diagnose, die fallen hier heraus.
  const DET=detMap(detRoh);

  // 1) Termine je Patient aus allen geladenen Tagesdateien (heute, morgen, t2..t13).
  //    Daraus kommen Stammtherapeut, Besuchsfrequenz und Tageszeit-Muster — genau
  //    die drei Dinge, die die Lücken-Zuordnung im Popup braucht.
  const buckets=[];
  if(dd.heute&&Array.isArray(dd.heute.tp))buckets.push(dd.heute.tp);
  if(dd.morgen&&Array.isArray(dd.morgen.tp))buckets.push(dd.morgen.tp);
  (dd.extraDays||[]).forEach(a=>{if(Array.isArray(a))buckets.push(a.flat());});
  const pi={};
  buckets.forEach(arr=>(arr||[]).forEach(t=>{
    if(!t||!t.PatientId)return;
    const id=String(t.PatientId);
    if(!pi[id])pi[id]={name:((t.PatientNachname||'')+', '+(t.PatientVorname||'')).replace(/(^, )|(, $)/,''),
                       termine:[],th:new Set(),tage:new Set(),ohneVo:0,hbT:0,praxisT:0};
    pi[id].termine.push({beginn:t.Beginn,ende:t.Ende,bez:t.Bezeichnung,ma:t.Mitarbeiter});
    pi[id].tage.add(String(t.Beginn||'').slice(0,10));
    // Hausbesuch am Termin getrennt mitzählen. Ein Patient, der im ganzen
    // 14-Tage-Fenster ausschließlich besucht wird, ist auch dann kein
    // Lückenfüller, wenn sein Rezept dazu schweigt.
    if(t.IsHausbesuch===true)pi[id].hbT++;else pi[id].praxisT++;
    if(!t.VerordnungId)pi[id].ohneVo++;
    (t.Mitarbeiter||[]).forEach(m=>{if(m&&(m.Vorname||m.Nachname))
      pi[id].th.add(((m.Vorname||'')+' '+(m.Nachname||'')).trim());});
  }));
  Object.values(pi).forEach(p=>p.termine.sort((a,b)=>String(a.beginn)<String(b.beginn)?-1:1));

  // 2) Offene Einheiten je Patient. Entwürfe und abgeschlossene Rezepte zählen nicht mit,
  //    sonst stünden längst erledigte Verordnungen als Potenzial in der Liste.
  //    Blanko ist ein Sonderfall: thevea führt dort weder durchführbare noch
  //    durchgeführte Einheiten (beides steht auf 0), weil die Menge ja der Therapeut
  //    bestimmt. Gezählt wird bei Blanko deshalb nicht die Einheit, sondern die Frist —
  //    16 Wochen ab Ausstellung. Wer das nicht gesondert behandelt, verliert die
  //    wertvollsten Rezepte komplett aus der Liste.
  const pat={};
  nodes.forEach(v=>{
    if(v.verknuepfterPatientId==null)return;
    const k=String(v.verknuepfterPatientId);
    if(!pat[k])pat[k]={offen:0,erbracht:0,gesamt:0,hm:[],hmSet:new Set(),aeltestes:null,
                       vos:0,hbNur:true,bl:false,blNeu:null,
                       icds:new Set(),icdT:null,dgs:new Set(),
                       bvb:false,po:false,bp:false,fv:null,fb:null,dgMax:0,
                       blEnde:null,blIcd:null,blHm:null,blBvb:false,
                       name:((v.nachname||'')+', '+(v.vorname||''))};
    if(v.status!=='InBehandlung')return;
    const P=pat[k];
    P.vos++;
    const hm=String(v.heilmittel||'');
    const ad=String(v.ausstellungsdatum||'').slice(0,10);
    const istBlanko=v.formular==='Blanko'||/blankoverordnung/i.test(hm);

    // Diagnose-Ebene aus den Verordnungsdetails. Sie entscheidet über BVB/LVB,
    // Post-OP und Blanko-Eignung — Dinge, die aus der Mengenübersicht nicht
    // hervorgehen.
    const D=DET[String(v.id)]||null;
    if(D){
      const code=icdPunkt(D.icd);
      if(code){P.icds.add(code);if(!P.icdT&&D.icdT)P.icdT=D.icdT;}
      if(D.dg)P.dgs.add(D.dg);
      if(D.bvb)P.bvb=true;                       // thevea hat die Prüfung selbst gemacht
      if(isPO(code))P.po=true;
      if(isBP(code))P.bp=true;
      // Verordnete Frequenz: bei mehreren Rezepten zählt die höchste Vorgabe,
      // denn danach richtet sich, wie oft der Patient kommen darf.
      if(D.fv!=null&&(P.fv==null||D.fv>P.fv))P.fv=D.fv;
      if(D.fb!=null&&(P.fb==null||D.fb>P.fb))P.fb=D.fb;
      if(D.dgMax&&D.dgMax>P.dgMax)P.dgMax=D.dgMax;
    }

    if(istBlanko){
      P.bl=true;
      // die jüngste Blanko zählt für die Frist — und deren Details für die Anzeige
      if(ad&&(!P.blNeu||ad>P.blNeu)){
        P.blNeu=ad;
        P.blEnde=(D&&D.ende)?String(D.ende).slice(0,10):null;
        P.blIcd=(D&&D.icd)?icdPunkt(D.icd):null;
        P.blHm=hm||null;
        P.blBvb=!!(D&&D.bvb);
      }
    }else{
      P.offen+=Math.max(0,voKann(v)-voErb(v));
      P.erbracht+=voErb(v);
      P.gesamt+=voKann(v);
      if(ad&&(!P.aeltestes||ad<P.aeltestes))P.aeltestes=ad;
    }
    if(hm)P.hm.push(hm);
    hm.split(';').forEach(t=>{const kz=hmKurz(t);if(kz)P.hmSet.add(kz);});
    if(!voHausbesuch(v,DET))P.hbNur=false;
  });

  const heuteDs=refDs||isoDay(0);
  const morgenDs=plusTag(heuteDs,1);
  const tageSeit=(ds)=>Math.round((new Date(heuteDs+'T12:00:00')-new Date(ds+'T12:00:00'))/864e5);

  Object.keys(pat).forEach(k=>{
    const P=pat[k],inf=pi[k];
    if(!P.vos)return;
    // Blanko-Restfrist. thevea liefert die Frist bei Blanko selbst mit
    // (behandlungsendeFrist) — die ist maßgeblich. Nur wenn sie fehlt, wird auf die
    // Regel "16 Wochen ab Ausstellung" zurückgerechnet. Negativ heißt abgelaufen:
    // dann ist das Rezept keine Chance mehr, sondern ein Fall für den Arzt.
    const blEndeDs=P.bl?(P.blEnde||(P.blNeu?plusTag(P.blNeu,112):null)):null;
    const blRest=blEndeDs?-tageSeit(blEndeDs):null;
    const blAktiv=P.bl&&blRest!=null&&blRest>=0;

    // Anzeige-ICD: bei mehreren Rezepten die ersten beiden Codes, mehr wird unleserlich.
    const icdStr=P.icds.size?[...P.icds].slice(0,2).join(', '):'—';
    const icdLang=P.icdT?(icdStr+' · '+P.icdT):icdStr;
    const dgStr=P.dgs.size?[...P.dgs].join('/'):'';

    // Folgerezept-Warnung gilt unabhängig davon, ob ein Termin ansteht.
    if(P.offen<=2&&P.erbracht>0&&!blAktiv)
      cat.folge.push({pid:Number(k)||k,name:(inf&&inf.name)||P.name,icd:icdStr,beschr:P.hm[0]||'',
        detail:'Noch '+P.offen+(dgStr?' · '+dgStr:''),hint:'Folgerezept!',termin:inf?inf.termine[0]:null,
        gep:P.offen,erb:P.erbracht,tot:P.gesamt,
        badge:P.offen===0?'Leer':'Noch '+P.offen,badgeC:'c-red'});
    if(P.bl&&blRest!=null&&blRest<0)
      cat.folge.push({pid:Number(k)||k,name:(inf&&inf.name)||P.name,icd:P.blIcd||icdStr,beschr:'Blanko',
        detail:'Blanko seit '+Math.abs(blRest)+' Tagen abgelaufen',hint:'Neues Rezept nötig',
        termin:inf?inf.termine[0]:null,gep:0,erb:P.erbracht,tot:P.gesamt,
        badge:'abgelaufen',badgeC:'c-red'});

    // Blanko-Kachel: alle laufenden Blankoverordnungen, auch die von Patienten,
    // die ohnehin heute kommen. Die Frist läuft unabhängig vom Terminplan.
    if(blAktiv)
      cat.blanko.push({name:(inf&&inf.name)||P.name,icd:P.blIcd||icdStr,beschr:P.blHm||P.hm[0]||'Blankoverordnung',
        detail:'Noch '+blRest+' Tage Laufzeit (bis '+blEndeDs+')'+(P.blBvb?' · BVB':''),
        hint:blRest<=21?'Frist läuft ab — terminieren!':'Therapeut bestimmt Menge und Dauer',
        termin:inf?inf.termine[0]:null,gep:0,erb:P.erbracht,tot:P.gesamt,
        badge:blRest+'T',badgeC:blRest<=21?'c-red':'c-purple'});

    // BVB/LVB-Kachel: thevea beantwortet die Frage nach besonderem Verordnungsbedarf
    // oder Einzelgenehmigung selbst. Diese Behandlungen laufen nicht gegen das
    // Praxisbudget — sie dürfen also ohne Rücksicht auf den Richtwert geplant werden.
    if(P.bvb&&(P.offen>0||blAktiv))
      cat.bvb.push({name:(inf&&inf.name)||P.name,icd:icdStr,beschr:P.hm[0]||'',
        detail:'BVB/Einzelgenehmigung'+(dgStr?' · Diagnosegruppe '+dgStr:'')+(P.icdT?' · '+P.icdT:''),
        hint:'Nicht im Budget — frei planbar',termin:inf?inf.termine[0]:null,
        gep:blAktiv?0:P.offen,erb:P.erbracht,tot:P.gesamt,hb:P.hbNur,dau:false,
        badge:'BVB',badgeC:'c-green'});

    // Blanko-Potenzial: Diagnosen, für die eine Blankoverordnung möglich wäre
    // (Schulter/Extremitäten nach Anlage 3), der Patient aber noch auf einem
    // normalen Muster 13 läuft. Das ist der Gesprächsanlass mit dem Arzt.
    if(P.bp&&!blAktiv&&P.offen>0)
      cat.blankopot.push({pid:Number(k)||k,name:(inf&&inf.name)||P.name,icd:icdStr,
        tv:true,kandidat:true,bvbTyp:P.bvb?'BVB':null,bvbName:P.icdT||'',
        verordnet:P.hm[0]||'',dgMax:P.dgMax,offen:P.offen,
        rest:0,verplant:0,mediMax:P.dgMax,istVoll:false,
        gueltigBis:null,tageUebrig:null,
        termin:inf?inf.termine[0]:null});

    // Frequenz-Kachel: der Arzt hat eine Frequenz verordnet (z. B. 2–3x/Woche),
    // tatsächlich kommt der Patient seltener. Die Differenz ist Termine, die
    // bereits genehmigt sind und nur nicht vergeben wurden.
    const pwIst=inf?Math.round(inf.tage.size/2*10)/10:0;
    if(inf&&P.fv&&(P.offen>0||blAktiv)&&pwIst<P.fv)
      cat.freq.push({name:inf.name||P.name,icd:icdStr,beschr:P.hm[0]||'',
        detail:'Verordnet '+P.fv+(P.fb&&P.fb!==P.fv?'–'+P.fb:'')+'x/Wo · tatsächlich '+pwIst+'x/Wo',
        hint:'Frequenz erhöhbar',termin:inf.termine[0],
        gep:P.offen,erb:P.erbracht,tot:P.gesamt,
        badge:'+'+Math.round((P.fv-pwIst)*10)/10+'/Wo',badgeC:'c-blue'});

    // Ab hier nur noch Lückenfüller.
    //
    // Bis hierher galt: Der Patient muss im 14-Tage-Fenster einen Termin haben,
    // sonst „gehört er zur Reaktivierung". Das war falsch gedacht. Genau die
    // Patienten OHNE Zukunftstermin sind die besten Kandidaten: Sie haben ein
    // laufendes Rezept mit offenen Einheiten, und es steht nichts davor. Am
    // 08.10.2026 waren das 50 Patienten mit 283 offenen Einheiten — und bei 36
    // von ihnen lag der letzte Termin höchstens zwei Wochen zurück. Das ist
    // keine Reaktivierung, das ist eine abgerissene Behandlungsserie.
    //
    // Was dafür nötig war: Stammtherapeut und Tageszeit kamen bisher aus dem
    // 14-Tage-Terminplan, den diese Patienten ja gerade nicht haben. Beides
    // kommt jetzt aus der Vergangenheit (hist.pat). Für Physio trägt die
    // Historie den Mitarbeiter zu 100 %, bei Ergo gar nicht — dort bleibt das
    // Feld leer, statt einen Therapeuten zu erfinden.
    const hp=(hist&&hist.pat)?hist.pat[k]:null;
    const abriss=(!inf&&hp&&hp.letzter)?tageSeit(hp.letzter):null;
    // Zu lange her: Dann ist es ein Reaktivierungsgespräch und keine Lücke.
    if(!inf&&(abriss==null||abriss>NR_ABRISS_MAX))return;
    if(P.offen<=0&&!blAktiv)return;
    // Reiner Hausbesuch füllt keine Praxislücke. Zwei Wege führen hierher: alle
    // laufenden Rezepte tragen den Hausbesuch, oder der Patient hat im
    // 14-Tage-Fenster ausschließlich Hausbesuchstermine. Gemerkt wird der Name,
    // damit im Nachrücker-Popup steht, dass es ihn gibt — lautlos verschwinden
    // darf hier niemand.
    if(P.hbNur||(inf&&inf.hbT>0&&inf.praxisT===0)){
      cat.hbAus.push({pid:Number(k)||k,name:(inf&&inf.name)||P.name});return;
    }
    if(inf&&(inf.tage.has(heuteDs)||inf.tage.has(morgenDs)))return;

    let sc=0;const re=[];
    // Blanko zuerst — das ist der stärkste Hebel, den die Praxis selbst in der Hand hat.
    if(blAktiv){
      sc+=3;re.push('Blanko');
      if(blRest<=21){sc+=2;re.push('⏳ '+blRest+'T');}
      else if(blRest<=42)sc+=1;
    }
    // BVB/LVB: läuft nicht gegen das Budget, darf also bedenkenlos zusätzlich geplant
    // werden — der wichtigste Punkt nach der Blanko-Frist.
    if(P.bvb){sc+=2;re.push('BVB');}
    if(P.po){sc+=1;re.push('Post-OP');}
    if(P.bp&&!blAktiv){sc+=1;re.push('Blanko möglich');}
    if(P.offen>=10){sc+=3;re.push(P.offen+' offen');}
    else if(P.offen>=6){sc+=2;re.push(P.offen+' offen');}
    else if(P.offen>=3){sc+=1;re.push(P.offen+' offen');}
    // Mehrere Heilmittel auf den laufenden Rezepten (KG+MT und ähnlich): mehr Zeit
    // pro Termin, mehr Umsatz — und der Patient hat mehr Gründe zu kommen.
    const mH=P.hmSet.size>=2?[...P.hmSet].join('+'):null;
    if(mH){sc+=2;re.push(mH);}
    // Rezeptalter: alte Verordnungen mit vielen Resteinheiten sind das eigentliche
    // Risiko — sie verfallen, wenn nicht terminiert wird.
    if(P.aeltestes&&P.offen>0){
      const tage=tageSeit(P.aeltestes);
      if(tage>=112){sc+=3;re.push('⏳ '+Math.floor(tage/7)+' Wo alt');}
      else if(tage>=84){sc+=2;re.push('⏳ '+Math.floor(tage/7)+' Wo alt');}
      else if(tage>=56)sc+=1;
    }
    // Die abgerissene Serie ist das stärkste Argument überhaupt: Das Rezept
    // läuft, Einheiten sind offen, und vor dem Patienten steht nichts. Je
    // frischer der Abriss, desto wahrscheinlicher kommt er auch kurzfristig.
    if(abriss!=null){
      if(abriss<=14){sc+=4;re.push('🔌 seit '+abriss+' T kein Termin');}
      else if(abriss<=42){sc+=3;re.push('🔌 seit '+Math.floor(abriss/7)+' Wo kein Termin');}
      else{sc+=2;re.push('🔌 seit '+Math.floor(abriss/7)+' Wo kein Termin');}
    }
    // Besuchsfrequenz aus dem 14-Tage-Fenster. Wer selten kommt, hat Luft nach oben;
    // wer schon zweimal die Woche da ist, wird im Lücken-Popup ohnehin aussortiert.
    // Ohne Zukunftstermin ist sie null — und das ist die Wahrheit, nicht eine
    // fehlende Angabe.
    const proWoche=inf?Math.round(inf.tage.size/2*10)/10:0;
    // Ist die verordnete Frequenz bekannt, ist sie der bessere Maßstab als eine
    // pauschale Schwelle: der Arzt hat sie festgelegt, mehr Termine brauchen kein
    // neues Rezept. Beides zusammen zu zählen wäre derselbe Sachverhalt doppelt.
    if(P.fv){
      const luecke=Math.round((P.fv-proWoche)*10)/10;
      if(luecke>=1){sc+=3;re.push('nur '+proWoche+' statt '+P.fv+'x/Wo');}
      else if(luecke>0){sc+=2;re.push('nur '+proWoche+' statt '+P.fv+'x/Wo');}
    }else{
      if(proWoche<1){sc+=2;re.push(proWoche+'x/Wo');}
      else if(proWoche<1.5){sc+=1;re.push(proWoche+'x/Wo');}
    }
    if(P.vos>1){sc+=1;re.push(P.vos+' Rezepte');}
    if(sc<2)return;

    const hmD=P.hm.length?Math.max.apply(null,P.hm.map(h=>getHMDauer(h))):20;
    // Stammtherapeut und Tageszeit: aus dem Terminplan, wenn er etwas hergibt,
    // sonst aus der Vergangenheit. Der harte Therapeutenfilter im Lücken-Popup
    // hängt daran — ohne diese beiden Zeilen landete jeder abgerissene Fall
    // dort unter „Keine Historie mit …" und wäre damit umsonst aufgenommen.
    const thListe=inf&&inf.th.size?[...inf.th]:(hp&&hp.th?[...hp.th]:[]);
    const zeitPat=inf&&inf.termine.length>=2
      ? analyzeTimePattern(inf.termine.map(t=>t.beginn))
      : (hp&&hp.std&&hp.std.length>=2
         ? (()=>{const vm=hp.std.filter(h=>h<12).length,n=hp.std.length;
                 return vm/n>=0.7?'vm':(n-vm)/n>=0.7?'nm':null;})()
         : null);
    cat.nr.push({pid:Number(k)||k,name:(inf&&inf.name)||P.name,icd:icdStr,icdText:P.icdT||'',dg:dgStr,
      detail:re.join(' · '),
      hint:blAktiv?('Blanko · noch '+blRest+' Tage')
          :(abriss!=null?('Noch '+P.offen+' Einheiten · seit '+abriss+' T kein Termin')
                        :('Noch '+P.offen+' Einheiten')),
      termin:(inf&&inf.termine[0])||null,gep:P.offen,erb:P.erbracht,tot:P.gesamt,
      score:sc,reasons:re,badge:String(sc),badgeC:'c-fire',
      tags:{bvb:P.bvb,blanko:blAktiv,blankopot:P.bp&&!blAktiv,postop:P.po,multi:!!mH},
      _hmDauer:blAktiv?20:hmD,        // Blanko: Dauer bestimmt der Therapeut, passt in jede Lücke
      _thHistory:thListe,
      // Woher der Stammtherapeut kommt. Entscheidet im Lücken-Popup, ob ein
      // fehlender Name „passt nicht" heißt oder „steht nicht in den Daten".
      _thQuelle:thListe.length?((inf&&inf.th.size)?'plan':'hist'):'keine',
      _timePat:zeitPat,
      // Null heisst hier „kein Zukunftstermin", nicht „unbekannt" — die Zahl
      // steht im Popup und soll nicht aussehen wie eine Lücke in den Daten.
      _abriss:abriss,_letzter:(hp&&hp.letzter)||null,
      _freqPerWeek:proWoche,_freqVerordnet:P.fv||null,
      _kgg:P.hmSet.has('KG-Gerät'),
      _blankoOffen:0,_blankoTage:blAktiv?blRest:null,_blankoBvb:P.blBvb?'BVB':null});
  });

  // 3) Termine ohne Rezept — im Terminplan steht keine VerordnungId und der Patient
  //    hat auch keine laufende Verordnung. Das ist Leistung, die so nicht abgerechnet
  //    werden kann, und fällt hier ohne Zusatzabfrage mit ab.
  Object.keys(pi).forEach(k=>{
    if(pat[k]&&pat[k].vos)return;
    const inf=pi[k];
    if(!inf.ohneVo)return;
    cat.reserv.push({name:inf.name,detail:'Termine ohne Rezept',hint:'Rezept mitbringen?',
      termin:inf.termine[0],badge:String(inf.ohneVo),badgeC:'c-amber'});
  });

  cat.nr.sort((a,b)=>b.score-a.score);
  cat.hbAus.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  return cat;
}

function analyzeRezepte(tp,beh,pl,bereich,ergoDet,refDate){
  const nm={};const geb={};if(pl&&Array.isArray(pl))pl.forEach(p=>{if(p.Id){nm[p.Id]=(p.Nachname||'')+', '+(p.Vorname||'');geb[p.Id]=p.Geburtsdatum||'';}});
  const ergoDG=buildErgoDGMap(ergoDet);
  const pi={};tp.forEach(t=>{if(!t.PatientId)return;const id=t.PatientId;if(!pi[id])pi[id]={name:(t.PatientNachname||'')+', '+(t.PatientVorname||''),termine:[]};pi[id].termine.push({beginn:t.Beginn,ende:t.Ende,bez:t.Bezeichnung,ma:t.Mitarbeiter});});
  const now=new Date();Object.values(pi).forEach(p=>{p.termine.sort((a,b)=>new Date(a.beginn)-new Date(b.beginn));p.nextTermin=p.termine.find(t=>new Date(t.beginn)>=new Date(now.toDateString()))||p.termine[0];});
  const rd=refDate?new Date(refDate+'T00:00:00'):new Date();rd.setHours(0,0,0,0);
  const rdPlus1=new Date(rd);rdPlus1.setDate(rdPlus1.getDate()+1);
  const rdMinus1=new Date(rd);rdMinus1.setDate(rdMinus1.getDate()-1);
  const cat={bvb:[],blanko:[],blankopot:[],folge:[],reserv:[],freq:[],nr:[]};
  beh.forEach(p=>{
    const pid=p.patientId;const d=p.data||{};const vos=d.Verordnungen||[];const rv=d.Terminreservierungen||[];
    const inf=pi[pid]||{name:nm[pid]||'Unbekannt',nextTermin:null,termine:[]};
    const act=vos.filter(v=>!v.IsReadOnly&&(!bereich||v.Bereich===bereich));
    if(!act.length){const fr=rv.filter(r=>(r.Beginn||'')>now.toISOString().split('T')[0]);if(fr.length>0)cat.reserv.push({name:inf.name,detail:'Termine ohne Rezept',hint:'Rezept mitbringen?',termin:inf.nextTermin,badge:fr.length+'',badgeC:'c-amber'});return;}
    if(!inf.nextTermin){const at=[];vos.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Status===1&&t.Datum)at.push(t);});});at.sort((a,b)=>new Date(a.Datum)-new Date(b.Datum));const nb=at.find(t=>new Date(t.Datum)>=new Date(now.toDateString()));if(nb)inf.nextTermin={beginn:nb.Datum};}
    let pB=null,pBl=false,pBP=false,pPO=false,pFr=null,pG=0,pE=0,pT=0;const mH=hMHM(act);let aB=[];
    let pBlOpenRest=0,pBlTage=null,pBlBvb=null; // offenes Blanko-Potenzial + BVB/LVB-Status des Patienten
    let vosTotal=0,vosHB=0; // Hausbesuch-Zähler: aktive Verordnungen gesamt + davon Hausbesuch
    act.forEach(v=>{
      const icd=v.ErsterIcd10;const be=v.Beschreibung||'';const roi=v.ReadOnlyInformation||{};const isB=roi.IsBlankoverordnung||false;
      const te=v.Termine||[];const gp=te.filter(t=>t.Status===1).length;const er=te.filter(t=>t.Status===4).length;const to=te.length;
      pG+=gp;pE+=er;pT+=to;aB.push(be);
      // BVB/LVB-Prüfung: vollständige KBV-Diagnoseliste, BEIDE ICD-Codes + Altersprüfung (Geburtsdatum)
      const pAge=ageAt(geb[pid],rd);const hm=fHMpat(v,pAge);const bvb=hm?hm.rec:null;const bvbIcd=hm?hm.icd:icd;
      // Hausbesuch-Check: PRIMÄR aus dem Terminplan (IsHausbesuch am Termin, gematcht über
      // VerordnungId bzw. PatientId), FALLBACK auf etwaige Verordnungs-Felder via isHB().
      const voHB=(v&&v.Id&&HB_VO.has(v.Id))||isHB(v);
      vosTotal++;if(voHB)vosHB++;
      if(bvb&&bvb.t!=='KEIN'){pB=bvb;cat.bvb.push({name:inf.name,icd:bvbIcd,beschr:be,detail:`${bvb.t}: ${bvb.n}${bvb.h?' ('+bvb.h+')':''}`,hint:hm.warn||`Arzt kann bis ${bvb.vo} verordnen`,termin:inf.nextTermin,gep:gp,erb:er,tot:to,hb:voHB,dau:(/\bDAU\b/i.test(inf.name||'')||/\bDAU\b/i.test(nm[pid]||'')),badge:bvb.t,badgeC:hm.warn?'c-amber':'c-green'});}
      if(isBP(icd)&&!isB){pBP=true;cat.blanko.push({name:inf.name,icd,beschr:be,detail:'Schulter → Blanko (16 Wo)',hint:'Arzt → Blanko-Umstellung',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:'Blanko',badgeC:'c-purple'});}
      if(bereich===1&&!isB&&v.Id&&ergoDG[v.Id]){const dg=ergoDG[v.Id];if(['PS3','PS4','SB1'].includes(dg)){pBP=true;cat.blanko.push({name:inf.name,icd,beschr:be,detail:'Ergo '+dg+' → Blanko möglich (16 Wo)',hint:'Arzt → Blanko-Umstellung empfohlen',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:'Ergo-Blanko',badgeC:'c-purple'});}}
      if(isB){pBl=true;
        // Blanko offenes Potenzial: Medifox' eigene Zahl "X von Y verplant" nutzen.
        // Y = aktuell verordnete Menge (KEIN regulatorisches Limit). BVB/LVB-Diagnosen = kein Limit.
        const vp=parseBlankoVerplant(be); // X (verplant) + Y (verordnet) bzw. 'abgerechnet'/'voll'
        if(!vp||vp.status!=='abgerechnet'){
          const bvbTyp=(bvb&&(bvb.t==='BVB'||bvb.t==='LVB'))?bvb.t:null;
          const verplant=(vp&&vp.verplant!=null)?vp.verplant:(gp+er);
          const mediMax=(vp&&vp.gesamt)?vp.gesamt:0;          // Y = aktuell verordnet
          const rest=mediMax?Math.max(0,mediMax-verplant):0;  // noch einzuplanende (bereits verordnete) Behandlungen
          const istVoll=!!(vp&&vp.status==='voll');
          // exakte 16-Wochen-Gültigkeit ab echtem VO-Datum
          let gbISO=null,tg=null;
          if(v.Datum){const sd=new Date(v.Datum);if(!isNaN(sd.getTime())){const gb=new Date(sd.getTime()+112*864e5);gbISO=gb.toISOString();tg=Math.ceil((gb-now)/864e5);}}
          if(rest>0){pBlOpenRest+=rest;if(tg!=null&&(pBlTage==null||tg<pBlTage))pBlTage=tg;}
          if(bvbTyp)pBlBvb=bvbTyp;
          cat.blankopot.push({pid,name:inf.name,icd:icd||'—',verordnet:cleanBlankoBeschr(be),bvbTyp,bvbName:bvbTyp?(bvb.n||''):'',verplant,mediMax,rest,istVoll,vodatum:v.Datum||null,gueltigBis:gbISO,tageUebrig:tg});
        }
      }
      if(isPO(icd))pPO=true;
      if(gp<=2&&to>0)cat.folge.push({name:inf.name,icd,beschr:be,detail:`Noch ${gp}`,hint:'Folgerezept!',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:gp===0?'Leer':'Noch '+gp,badgeC:'c-red'});
      const fr=aFreq(te);if(fr&&fr.avg>=7&&gp>=4){pFr=fr;cat.freq.push({name:inf.name,icd,beschr:be,detail:`~${fr.pw}x/Wo`,hint:'Frequenz↑?',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:fr.pw+'x/Wo',badgeC:'c-blue'});}
      if(!pFr&&fr)pFr=fr;
    });
    const td=new Date(rd);const tm2=new Date(rdPlus1);const yd=new Date(rdMinus1);
    let hR=(inf.termine||[]).some(t=>{const d=new Date(t.beginn);d.setHours(0,0,0,0);return d>=yd&&d<=tm2;});
    if(!hR)act.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Status===1&&t.Datum){const d=new Date(t.Datum);d.setHours(0,0,0,0);if(d>=yd&&d<=tm2)hR=true;}});});
    let sc=0;const re=[];if(pB){sc+=3;re.push(pB.t);}if(pBl){sc+=3;re.push('Blanko');}if(pBP){sc+=2;re.push('Blanko mögl.');}if(pPO){sc+=3;re.push('Post-OP');}if(mH){sc+=2;re.push(mH.join('+'));}if(pFr&&pFr.avg>=7){sc+=2;re.push(pFr.pw+'x/Wo');}if(pG>6){sc+=1;re.push(pG+' offen');}
    // Blanko-Potenzial als Top-Nachrücker-Bonus: offene (verordnete, nicht verplante) Behandlungen + BVB/LVB (kein Limit) + Ablauf-Dringlichkeit
    if(pBlBvb){sc+=2;re.push('💎 kein Limit');}
    if(pBlOpenRest>0){sc+=2;re.push('💎 Blanko '+pBlOpenRest+' frei');if(pBlTage!=null&&pBlTage<=21){sc+=2;re.push('⏳ '+pBlTage+'T');}else if(pBlTage!=null&&pBlTage<=42){sc+=1;}}
    if(sc>=2&&!hR){
      // Hausbesuch-Filter: Patienten mit AUSSCHLIESSLICH Hausbesuch-Verordnungen
      // sind keine sinnvollen Nachrücker für Praxislücken → überspringen
      const onlyHB=(vosTotal>0&&vosHB===vosTotal);
      if(onlyHB)return;
      const hmD=aB.length?Math.max(...aB.map(b=>getHMDauer(b))):20;
      const isKGGpat=aB.some(b=>/ger(ä|ae?)tegest|kg-?ger(ä|ae?)t|kgg/i.test(b)); // Patient bekommt KG-Gerät/KGG
      // Stammtherapeut-Definition:
      //   Rückwärts: Termine der letzten 6 Monate (Status 4 = erbracht oder jeder Status mit Datum)
      //   Vorwärts: ALLE zukünftigen geplanten Termine (Status 1) aus den Rezepten
      const thHist=new Set();
      const today=new Date();today.setHours(0,0,0,0);
      const sixMonthsAgo=new Date(today);sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
      act.forEach(v=>{(v.Termine||[]).forEach(t=>{
        if(!t.MitarbeiterName||!t.Datum)return;
        const d=new Date(t.Datum);
        // Vergangene Termine: nur wenn innerhalb der letzten 6 Monate
        // Zukünftige Termine: immer zählen (egal wie weit in der Zukunft)
        if(d>=today||(d>=sixMonthsAgo&&d<today)){
          thHist.add(t.MitarbeiterName);
        }
      });});
      // Zusätzlich: Termine aus den TP-JSONs (heute/morgen) — Fallback, falls nicht in behData
      (inf.termine||[]).forEach(t=>{if(t.ma)(t.ma).forEach(m=>{if(m.Vorname||m.Nachname)thHist.add(((m.Vorname||'')+' '+(m.Nachname||'')).trim());});});
      const allDates=[];act.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Datum&&t.Status===4)allDates.push(t.Datum);});});
      const tPat=analyzeTimePattern(allDates);
      cat.nr.push({pid,name:inf.name,icd:act[0]?.ErsterIcd10||'—',detail:re.join(' · '),hint:pFr?`~${pFr.pw}x/Wo`:'Mehr möglich',termin:inf.nextTermin,gep:pG,erb:pE,tot:pT,score:sc,reasons:re,badge:sc+'',badgeC:'c-fire',tags:{bvb:!!pB,blanko:pBl||pBP,blankopot:(pBlOpenRest>0||!!pBlBvb),postop:pPO,multi:!!mH},_hmDauer:hmD,_thHistory:[...thHist],_timePat:tPat,_freqPerWeek:pFr?pFr.pw:0,_kgg:isKGGpat,_blankoOffen:pBlOpenRest,_blankoTage:pBlTage,_blankoBvb:pBlBvb});
    }
  });
  cat.nr.sort((a,b)=>b.score-a.score);return cat;
}

// Prüft einen EINZELNEN Termin auf Hausbesuch-Merkmale (feldnamen-unabhängig, wertbasiert).
// Hausbesuch ist bei KIMOJO am Termin hinterlegt, nicht zwingend an der Verordnung.
function hbTermin(t){
  if(!t||typeof t!=='object')return false;
  for(const k in t){
    const val=t[k];if(val==null)continue;
    if(/hausbesuch/i.test(k)){
      // Schlüssel enthält "Hausbesuch" → nur bei tatsächlich positivem Wert werten (kein false/0/leer)
      if(val===true)return true;
      if(typeof val==='number'&&val>0)return true;
      if(typeof val==='string'&&val.trim()&&!/^(false|0|nein|no|kein)/i.test(val.trim()))return true;
      if(typeof val==='object'&&(val.PositionsnummerHausbesuchPauschaleId||val.EntfernungInKilometern>0))return true;
    }
    // Textfelder (z.B. Behandlungsort, Bezeichnung, Leistung) mit "Hausbesuch" im Wert
    if(typeof val==='string'&&/hausbesuch/i.test(val))return true;
  }
  return false;
}
// Prüft ob ein Rezept/Termin als Hausbesuch markiert ist
// Checks: explizite Felder, Beschreibungstexte, Heilmittel-Bezeichnungen, sowie alle Termine der Verordnung
function isHB(v){
  if(!v)return false;
  // Direkte Boolean-Flags (verschiedene Schreibweisen)
  if(v.IstHausbesuch===true||v.Hausbesuch===true||v.AlsHausbesuch===true)return true;
  if(v.Behandlungsort&&/hausbesuch/i.test(v.Behandlungsort))return true;
  if(v.Beschreibung&&/hausbesuch/i.test(v.Beschreibung))return true;
  // Hausbesuch-Objekt mit Pauschalen-ID = aktiver Hausbesuch
  if(v.Hausbesuch&&typeof v.Hausbesuch==='object'){
    if(v.Hausbesuch.PositionsnummerHausbesuchPauschaleId)return true;
    if(v.Hausbesuch.EntfernungInKilometern>0)return true;
  }
  if(v.Details){
    if(v.Details.IstHausbesuch===true||v.Details.Hausbesuch===true||v.Details.AlsHausbesuch===true)return true;
    if(v.Details.Behandlungsort&&/hausbesuch/i.test(v.Details.Behandlungsort))return true;
  }
  // Heilmittel checken
  if(v.VerordneteHeilmittel&&Array.isArray(v.VerordneteHeilmittel)){
    for(const hm of v.VerordneteHeilmittel){
      if(hm.Bezeichnung&&/hausbesuch/i.test(hm.Bezeichnung))return true;
      if(hm.Kurzbezeichnung&&/hausbesuch|^hb$/i.test(hm.Kurzbezeichnung))return true;
      if(hm.AlsHausbesuch===true)return true;
    }
  }
  // Hausbesuch hängt bei KIMOJO am einzelnen Termin → alle Termine der Verordnung prüfen
  if(Array.isArray(v.Termine)){
    for(const t of v.Termine){if(hbTermin(t))return true;}
  }
  return false;
}

function getErgoPatients(){
  if(!ergoDetailData||!Array.isArray(ergoDetailData))return[];
  const pts={};
  ergoDetailData.forEach(e=>{
    const p=e.Verordnung?.Patient;const d=e.Verordnung?.Details;if(!p?.Id)return;
    if(!pts[p.Id])pts[p.Id]={name:p.Nachname+', '+p.Vorname,nachname:p.Nachname,vorname:p.Vorname,ort:p.Ort||'',geb:p.Geburtsdatum||'',dg:new Set(),heilmittel:new Set(),blanko:false,active:0,hausbesuch:false,praxis:false};
    if(d?.Diagnosegruppe)pts[p.Id].dg.add(d.Diagnosegruppe);
    if(!e.Verordnung.IsReadOnly)pts[p.Id].active++;
    if(d?.IsBlankoformular)pts[p.Id].blanko=true;
    (e.VerordneteHeilmittel||[]).forEach(hm=>{if(hm.Kurzbezeichnung)pts[p.Id].heilmittel.add(hm.Kurzbezeichnung);});
    // Hausbesuch-Erkennung: prüft Verordnung + Heilmittel
    const hbCheck={...e.Verordnung,VerordneteHeilmittel:e.VerordneteHeilmittel,Details:d};
    if(isHB(hbCheck))pts[p.Id].hausbesuch=true;
    else pts[p.Id].praxis=true;
  });
  return Object.values(pts).sort((a,b)=>a.nachname.localeCompare(b.nachname));
}

// Parst Medifox' Verplanungs-Status aus der Verordnungs-Beschreibung
// "... (X von Y verplant)" -> {status:'offen',verplant:X,gesamt:Y,rest:Y-X}
// "... (vollständig verplant)" -> {status:'voll'} | "... (abgerechnet)" -> {status:'abgerechnet'}
function parseBlankoVerplant(beschr){
  const s=String(beschr||'');const m=s.match(/\(([^()]*)\)\s*$/);if(!m)return{status:'unbekannt'};
  const inner=m[1].toLowerCase();
  if(inner.includes('abgerechnet'))return{status:'abgerechnet'};
  const mv=inner.match(/(\d+)\s*von\s*(\d+)\s*verplant/);
  if(mv){const x=+mv[1],y=+mv[2];return{status:x>=y?'voll':'offen',verplant:x,gesamt:y,rest:Math.max(0,y-x)};}
  if(inner.includes('vollst'))return{status:'voll'};
  return{status:'unbekannt'};
}
// Entfernt den abschließenden Status-Klammerausdruck für die saubere Anzeige der Heilmittel
function cleanBlankoBeschr(beschr){return String(beschr||'').replace(/\s*\([^()]*\)\s*$/,'').trim();}

// Blanko offenes Potenzial: Medifox' "X von Y verplant" + BVB/LVB = kein Limit
function showBlankoPot(){
  const c=RC;const all=(c&&c.blankopot)||[];
  const rd=document.getElementById('rd');if(!rd)return;
  if(!all.length){rd.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted)">Keine laufenden Blanko-Verordnungen</div>';return;}

  // thevea-Variante: dort gibt es kein „X von Y verplant". Blanko trägt in thevea
  // überhaupt keine Mengen — die bestimmt der Therapeut. Was hier steht, sind
  // deshalb keine Restmengen, sondern Patienten, deren Diagnose eine Blanko
  // zuließe, die aber noch auf einem normalen Muster 13 laufen. Das ist der
  // Gesprächsanlass mit dem verordnenden Arzt.
  if(all.some(x=>x.tv)){
    const kand=all.filter(x=>x.tv).sort((a,b)=>(b.offen||0)-(a.offen||0));
    let hk=`<div class="d-t">💎 Blanko-Potenzial (${kand.length})<span class="d-c" onclick="document.getElementById('rd').innerHTML=''">✕</span></div>`;
    hk+=`<div style="font-size:10px;color:var(--muted);margin-bottom:8px">Diagnose ließe eine Blankoverordnung zu (Schulter/Extremitäten), läuft aber auf Muster 13. Blanko = 16 Wochen, Menge und Frequenz bestimmt die Praxis. <b style="color:var(--fire)">${kand.reduce((s,x)=>s+(x.offen||0),0)}</b> offene Einheiten in dieser Gruppe.</div>`;
    kand.forEach(it=>{
      hk+=`<div class="pr"><div class="pr-i" style="flex:1;min-width:0">`;
      hk+=`<div class="pr-n">${esc(it.name)} <span style="font-size:9px;color:var(--muted);font-weight:600">${esc(it.icd||'')}</span>`;
      hk+=it.bvbTyp?`<span class="pr-b c-green" style="margin-left:4px">🏥 ${it.bvbTyp}</span>`:'';
      hk+=`</div>`;
      hk+=`<div class="pr-d"><b style="color:var(--purple)">Blanko möglich</b> — aktuell ${it.offen} Einheiten offen${it.dgMax?` · Muster 13 begrenzt auf ${it.dgMax} je VO`:''}</div>`;
      if(it.bvbName)hk+=`<div style="font-size:9px;color:var(--muted);margin-top:1px">${esc(it.bvbName)}</div>`;
      if(it.verordnet)hk+=`<div style="font-size:9px;color:var(--muted);margin-top:1px">${esc(it.verordnet)}</div>`;
      hk+=`<div style="font-size:9px;color:var(--muted);margin-top:3px">🗣 Arzt ansprechen: Umstellung auf Blankoverordnung</div>`;
      hk+=`</div><span class="pr-b c-purple" style="align-self:flex-start">Blanko</span></div>`;
    });
    rd.innerHTML=hk;return;
  }
  // BVB/LVB-Diagnosen haben KEIN Mengen-Limit → eigene Gruppe, immer durchplanbar
  const bvbList=all.filter(x=>x.bvbTyp);
  const norm=all.filter(x=>!x.bvbTyp);
  const offen=norm.filter(x=>x.rest>0);          // noch einzuplanende verordnete Behandlungen
  const voll=norm.filter(x=>x.rest<=0);
  offen.sort((a,b)=> b.rest-a.rest || ((a.tageUebrig==null?9999:a.tageUebrig)-(b.tageUebrig==null?9999:b.tageUebrig)));
  voll.sort((a,b)=> (a.tageUebrig==null?9999:a.tageUebrig)-(b.tageUebrig==null?9999:b.tageUebrig));
  bvbList.sort((a,b)=> b.rest-a.rest || ((a.tageUebrig==null?9999:a.tageUebrig)-(b.tageUebrig==null?9999:b.tageUebrig)));
  const totRest=offen.reduce((s,x)=>s+x.rest,0);
  let h=`<div class="d-t">💎 Blanko – offenes Potenzial (${offen.length+bvbList.length})<span class="d-c" onclick="document.getElementById('rd').innerHTML=''">✕</span></div>`;
  h+=`<div style="font-size:10px;color:var(--muted);margin-bottom:8px"><b style="color:var(--fire)">${totRest}</b> noch einzuplanende Behandlungen (bereits verordnet) · Zahlen direkt aus Medifox („X von Y verplant") · BVB/LVB = kein Limit · Gültigkeit = VO-Datum + 16 Wo</div>`;
  const gbInfo=(it)=>{
    if(!it.gueltigBis)return{t:'Gültigkeit unbekannt',c:'var(--muted)'};
    const d=new Date(it.gueltigBis),tg=it.tageUebrig;
    const c=(tg!=null&&tg<=21)?'var(--red)':(tg!=null&&tg<=42)?'var(--amber)':'var(--muted)';
    return{t:`gültig bis ${d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}`+(tg!=null?` · ${tg<0?'abgelaufen':tg+' Tage'}`:''),c};
  };
  const bvbBadge=(it)=>it.bvbTyp?`<span class="pr-b ${it.bvbTyp==='LVB'?'c-green':'c-amber'}" style="margin-left:4px">🏥 ${it.bvbTyp}</span>`:'';
  // Normale (limitierte) Zeile: X von Y verplant
  const row=(it,dim)=>{

function epApplyFilter(){
  const{status,dgs,hms,orts}=window._epState;
  const dgArr=[...dgs],hmArr=[...hms],ortArr=[...orts];
  let visible=0,total=0;
  document.querySelectorAll('.ep-r').forEach(r=>{
    total++;
    const d=r.dataset.ep||'',dgd=r.dataset.dg||'',hmd=r.dataset.hm||'',ortd=r.dataset.ort||'';
    // Status-Filter
    let ok=true;
    if(status==='active')ok=d.includes('active');
    else if(status==='blanko')ok=d.includes('blanko');
    else if(status==='inactive')ok=d.includes('inactive');
    // DG-Filter (UND: jede ausgewählte DG muss im Patienten vorhanden sein)
    if(ok&&dgArr.length)ok=dgArr.every(dg=>dgd.includes('|'+dg+'|'));
    // HM-Filter (UND: jedes ausgewählte HM muss im Patienten vorhanden sein)
    if(ok&&hmArr.length)ok=hmArr.every(hm=>hmd.includes('|'+hm+'|'));
    // Ort-Filter (ODER bei mehreren: z.B. Praxis ODER Hausbesuch — sinnvoller als UND)
    if(ok&&ortArr.length)ok=ortArr.some(o=>ortd.includes('|'+o+'|'));
    r.style.display=ok?'':'none';
    if(ok)visible++;
  });
  const c=document.getElementById('epCount');if(c)c.textContent=visible;
}

function parseAuslastung(data){
  const kwRow=data[2]||[],monthRow=data[1]||[],physioSum=data[19]||[];
  let ergoSum=null;
  for(let i=21;i<Math.min(data.length,35);i++){if(data[i]&&data[i][0]&&String(data[i][0]).includes('Summe')){ergoSum=data[i];break;}}
  const kws=[];let col=5,lastP=null;
  while(col<kwRow.length){
    const kw=kwRow[col];
    if(kw&&typeof kw==='number'&&kw>0&&kw<53){
      const ac=col+2,pv=physioSum[ac],ev=ergoSum?ergoSum[ac]:null,mo=monthRow[col]||'';
      if(pv&&typeof pv==='number'&&pv>0&&pv<=1.5){
        const pp=Math.round(pv*1000)/10;
        const isReal=lastP===null||Math.abs(pp-lastP)>0.01;
        if(!isReal)break;
        lastP=pp;
        kws.push({kw:Math.round(kw),physio:pp,ergo:(ev&&typeof ev==='number'&&ev>0&&ev<=1.5)?Math.round(ev*1000)/10:null,month:String(mo)});
      }
      col+=4;
    }else col++;
  }
  return kws;
}

  const kPhysioYTD=kYTD.length?Math.round(kYTD.reduce((s,d)=>s+d.physio,0)/kYTD.length*10)/10:null;
  const kErgoYTD=kYTD.filter(d=>d.ergo!==null).length?Math.round(kYTD.filter(d=>d.ergo!==null).reduce((s,d)=>s+d.ergo,0)/kYTD.filter(d=>d.ergo!==null).length*10)/10:null;
  const pPhysioYTD=pYTD.length?Math.round(pYTD.reduce((s,d)=>s+d.physio,0)/pYTD.length*10)/10:null;

  let h=`<div class="ausl-card"><h4>KW ${selectedKW} · Aktuell</h4>`;

function analyzePatients(rows){
  const P={};
  for(const r of rows){if(!r.patient||!r.datum)continue;const k=r.patient+'||'+r.standort;if(!P[k])P[k]={patient:r.patient,therapeut:r.therapeut,standort:r.standort,lastDate:null,treatments:[],openAmount:0,openCount:0,totalCount:0};const p=P[k];p.treatments.push(r);p.totalCount++;if(!r.abgerechnet){p.openCount++;p.openAmount+=r.preis;}if(!p.lastDate||r.datum>p.lastDate){p.lastDate=r.datum;p.therapeut=r.therapeut;}}
  overduePatients=Object.values(P).filter(p=>p.openCount>0);
  overduePatients.forEach(p=>p.treatments.sort((a,b)=>b.datum-a.datum));
}

function renderOffeneRezepte(){

function renderTable(){
  const now=new Date(),cutoff=new Date(now.getTime()-minWeeks*7*24*60*60*1000);
  const searchEl=document.getElementById('searchInput');const search=searchEl?searchEl.value.toLowerCase():'';
  let F=overduePatients.filter(p=>{if(!p.lastDate||p.lastDate>=cutoff)return false;if(search&&!p.patient.toLowerCase().includes(search)&&!p.therapeut.toLowerCase().includes(search))return false;if(standortFilter!=='all'&&p.standort!==standortFilter)return false;return true;});
  F.forEach(p=>{p.daysAgo=Math.floor((now-p.lastDate)/(24*60*60*1000));});
  const{col,asc}=currentSort;
  F.sort((a,b)=>{let va=a[col],vb=b[col];if(col==='patient'||col==='therapeut'||col==='standort'){va=(va||'').toLowerCase();vb=(vb||'').toLowerCase();}if(col==='lastDate'){va=va?va.getTime():0;vb=vb?vb.getTime():0;}if(va<vb)return asc?-1:1;if(va>vb)return asc?1:-1;return 0;});
  const tO=F.reduce((s,p)=>s+p.openAmount,0),tB=F.reduce((s,p)=>s+p.openCount,0),urg=F.filter(p=>p.daysAgo>=42).length;
  const sEl=document.getElementById('statsDiv');if(sEl)sEl.innerHTML=`<div class="hk"><div class="hk-l">Offene Patienten</div><div class="hk-v" style="color:var(--red)">${F.length}</div><div class="hk-sub">mit offenen Rezepten</div></div><div class="hk"><div class="hk-l">Offene Behandlungen</div><div class="hk-v">${tB}</div><div class="hk-sub">nicht abgerechnet</div></div><div class="hk"><div class="hk-l">Offener Betrag</div><div class="hk-v" style="color:var(--red)">${fm(tO)}</div><div class="hk-sub">noch abzurechnen</div></div><div class="hk"><div class="hk-l">Dringend</div><div class="hk-v" style="color:${urg>0?'var(--red)':'var(--teal)'}">${urg}</div><div class="hk-sub">6+ Wochen überfällig</div></div>`;
  document.querySelectorAll('.tcx thead th').forEach(th=>{const s=th.dataset.sort,ar=th.querySelector('.arrow');if(!ar)return;if(s===col){th.classList.add('sorted');ar.textContent=asc?'▲':'▼';}else{th.classList.remove('sorted');ar.textContent='';}});
  const cEl=document.getElementById('resultCount');if(cEl)cEl.textContent=F.length+' Patienten';
  const tb=document.getElementById('tbody');if(!tb)return;tb.innerHTML='';
  F.forEach((p,i)=>{const bg=p.daysAgo>=42?'b-red':p.daysAgo>=28?'b-amber':'b-teal',bt=p.daysAgo>=42?'Dringend':p.daysAgo>=28?'Überfällig':'Prüfen',st=statusMap[p.patient]||'',fd=p.lastDate?`${p.lastDate.getDate()}.${p.lastDate.getMonth()+1}.${p.lastDate.getFullYear()}`:'–',sCls=sC(p.standort);
    const tr=document.createElement('tr');tr.className=p.daysAgo>=42?'urgent':'';
    tr.innerHTML=`<td><button class="expand-btn" onclick="toggleDetail(${i},this)">▶</button></td><td><div class="pn">${esc(p.patient)}</div></td><td><div>${esc(pName(p.therapeut))}</div></td><td><span class="standort ${sCls}">${esc(p.standort)}</span></td><td class="r">${fd}</td><td class="r"><span class="days">${p.daysAgo}</span> <span class="badge ${bg}">${bt}</span></td><td class="r"><strong>${p.openCount}</strong><span style="color:var(--muted);font-size:10px"> / ${p.totalCount}</span></td><td class="r"><strong>${fm(p.openAmount)}</strong></td><td><button class="act ${st==='kontaktiert'?'done':''}" onclick="setStatus('${escA(p.patient)}','kontaktiert')">📞</button><button class="act ${st==='erledigt'?'done':''}" onclick="setStatus('${escA(p.patient)}','erledigt')">✅</button></td>`;
    tb.appendChild(tr);
    const dr=document.createElement('tr');dr.className='detail-row';dr.id='detail-'+i;let dh='<td colspan="9"><div class="detail-content"><strong>Offene Behandlungen:</strong><table class="dtable"><thead><tr><th>Datum</th><th>Uhrzeit</th><th>Leistung</th><th style="text-align:right">Betrag</th></tr></thead><tbody>';
    p.treatments.filter(t=>!t.abgerechnet).forEach(t=>{const d=t.datum?`${t.datum.getDate()}.${t.datum.getMonth()+1}.${t.datum.getFullYear()}`:'–';dh+=`<tr><td>${d}</td><td>${esc(t.uhrzeit)}</td><td>${esc(t.leistung)}</td><td style="text-align:right">${fm(t.preis)}</td></tr>`;});
    dh+='</tbody></table></div></td>';dr.innerHTML=dh;tb.appendChild(dr);

// ── thevea-Variante ────────────────────────────────────────
function offenRows(){
  const searchEl=document.getElementById('searchInput');
  const s=searchEl?searchEl.value.toLowerCase():'';
  return offenTV.filter(r=>{
    if(offenKatFilter==='aktiv'&&r.kat==='zuzahlungLaufend')return false;   // Standard: laufende Zuzahlungen raus
    if(offenKatFilter!=='aktiv'&&offenKatFilter!=='all'&&r.kat!==offenKatFilter)return false;
    if(offenWeeks&&(r.daysAgo==null||r.daysAgo<offenWeeks*7))return false;
    if(standortFilter!=='all'&&r.standort!==standortFilter)return false;
    if(s&&!r.patient.toLowerCase().includes(s)&&!String(r.heilmittel).toLowerCase().includes(s))return false;
    return true;
  });
}

// Zählt für die Filterknöpfe — jeder Knopf zeigt, was bei aktuellem Zeitfilter
// und Standort tatsächlich dahintersteckt. Ein Knopf, der "(0)" zeigt, erspart
// einen Klick ins Leere.
function offenCount(kat){
  return offenTV.filter(r=>{
    if(kat==='aktiv'?r.kat==='zuzahlungLaufend':(kat!=='all'&&r.kat!==kat))return false;
    if(offenWeeks&&(r.daysAgo==null||r.daysAgo<offenWeeks*7))return false;
    if(standortFilter!=='all'&&r.standort!==standortFilter)return false;
    return true;
  }).length;
}

    +kb('zuzahlung','Zuzahlung')
    +kb('zuzahlungLaufend','Zuzahlung laufend')
