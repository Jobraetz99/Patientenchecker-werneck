function catZielRoh(c){const e=aufZuw['kat:'+c];return String((e?e.ziel:lsGet('kimojo_catassign_'+c,''))||'');}
function catEigen(c){return catZielRoh(c)!=='';}   // an der Kategorie gesetzt?
function catErbt(c){return aufListe(catZielRoh(c)).indexOf(AUF_ERBT)>=0;}
function catEigene(c){return aufListe(catZielRoh(c)).filter(x=>x!==AUF_NIEMAND&&x!==AUF_ERBT);}
// Was von oben kommt: die stehende Besetzung des Bereichs, in dem die
// Kategorie hängt. Eine Kategorie mit eigener Festlegung ohne „+" bekommt
// nichts.
function catGeerbt(c){return(!catEigen(c)||catErbt(c))?getAreaAssign(getCatArea(c)):[];}
function getCatAssign(c){return aufUniq(catGeerbt(c).concat(catEigene(c)));}
function setCatAssign(c,arr,erbt){
  const s=aufZielStr(arr,erbt);
  lsSet('kimojo_catassign_'+c,s);aufMerken({a:'zuw',id:'kat:'+c,cat:c,ziel:s});rerenderTasks();
}
// Zurück auf „erbt vom Bereich". Das ist NICHT „niemand" — deshalb ein leeres
// Ziel und nicht der Niemand-Platzhalter.
function catErbtWieder(c){setCatAssign(c,[],true);}
// Dazunehmen ergänzt und lässt die Erbschaft stehen.
function catPersonDazu(c,oid){
  if(oid)setCatAssign(c,catEigene(c).concat(oid),!catEigen(c)||catErbt(c));
}
// Eine eigene Person herausnehmen ändert an der Erbschaft nichts. Eine
// GEERBTE herauszunehmen heißt dagegen: Diese Kategorie entscheidet selbst —
// sonst stünde die Person beim nächsten Blick wieder da.
function catPersonRaus(c,oid){
  if(catEigene(c).indexOf(oid)>=0)return setCatAssign(c,catEigene(c).filter(x=>x!==oid),catErbt(c));
  setCatAssign(c,getCatAssign(c).filter(x=>x!==oid),false);
}

function taskZielRoh(id){const e=aufZuw[id];return String((e?e.ziel:lsGet('kimojo_assign_'+id,''))||'');}
function taskEigen(id){return taskZielRoh(id)!=='';}   // am Einzelfall gesetzt?
function taskErbt(id){return aufListe(taskZielRoh(id)).indexOf(AUF_ERBT)>=0;}
function taskEigene(id){return aufListe(taskZielRoh(id)).filter(x=>x!==AUF_NIEMAND&&x!==AUF_ERBT);}
// Was die Aufgabe von oben bekommt: die Kategorie, wenn die etwas sagt, sonst
// der Bereich. Gefragt wird nach effectiveArea und nicht nach getCatArea —
// eine einzelne Aufgabe darf in einem anderen Bereich hängen als ihre
// Kategorie, und dann gilt die Besetzung dieses Bereichs.
function taskGeerbt(id,cat){
  if(taskEigen(id)&&!taskErbt(id))return[];
  const c=cat===undefined?aufKatVon(id):cat;
  return catEigen(c)?getCatAssign(c):getAreaAssign(effectiveArea(id,c));
}
function getTaskAssign(id,cat){return aufUniq(taskGeerbt(id,cat).concat(taskEigene(id)));}
function setTaskAssign(id,arr,erbt){
  const s=aufZielStr(arr,erbt);
  lsSet('kimojo_assign_'+id,s);aufMerken({a:'zuw',id:String(id),cat:aufKatVon(id),ziel:s});rerenderTasks();
}
function taskErbtWieder(id){setTaskAssign(id,[],true);}
function taskPersonDazu(id,oid){
  if(oid)setTaskAssign(id,taskEigene(id).concat(oid),!taskEigen(id)||taskErbt(id));
}
function taskPersonRaus(id,oid){
  if(taskEigene(id).indexOf(oid)>=0)return setTaskAssign(id,taskEigene(id).filter(x=>x!==oid),taskErbt(id));
  setTaskAssign(id,getTaskAssign(id).filter(x=>x!==oid),false);
}

// Wer sitzt überhaupt in dem Bereich? Eine stehende Besetzung, kein Tagesplan:
// Wer im Backoffice arbeitet, arbeitet dort auch morgen. Sie greift als letzte
// Stufe und spart es, jede einzelne Aufgabe anzufassen.
function getAreaAssign(a){const e=aufZuw['area:'+a];return e?aufListe(e.ziel):aufListe(lsGet('kimojo_areaassign_'+a,''));}
function setAreaAssign(a,arr){
  const s=aufListeStr(arr);
  lsSet('kimojo_areaassign_'+a,s);aufMerken({a:'zuw',id:'area:'+a,ziel:s});rerenderTasks();
}
function areaPersonDazu(a,oid){if(oid)setAreaAssign(a,getAreaAssign(a).concat(oid));}
function areaPersonRaus(a,oid){setAreaAssign(a,getAreaAssign(a).filter(x=>x!==oid));}

// Drei Stufen — Bereich, Kategorie, Aufgabe —, und sie ADDIEREN sich, solange
// jede Stufe weitererbt. Eine Stufe, die ohne „+" eine eigene Liste führt,
// schneidet darüber ab: Nur so bleibt eine geerbte Person abwählbar, ohne dass
// sie beim nächsten Blick wieder dasteht. getTaskAssign läuft die Kette selbst
// hinauf, deshalb steht die Reihenfolge hier nicht noch ein zweites Mal.
function effectiveAssignee(id,cat){return getTaskAssign(id,cat);}
// „nur meine" heißt jetzt „ich bin einer von mehreren". Eine Aufgabe, die zwei
// Leuten gehört, steht bei beiden in der Filterung.
function istMeine(id,cat,me){return!!me&&effectiveAssignee(id,cat).indexOf(me)>=0;}
// Woher kommt DIESE Person? Je Chip gefragt, nicht je Aufgabe — seit die
// Stufen sich addieren, können an einer Aufgabe zwei Leute aus zwei
// verschiedenen Stufen stehen. Nur für den Tooltip, damit man nicht rätselt,
// warum dort jemand steht, den an der Aufgabe niemand eingetragen hat.
function assignHerkunft(id,cat,oid){
  if(taskEigene(id).indexOf(oid)>=0)return'';
  const c=cat===undefined?aufKatVon(id):cat;
  return catEigene(c).indexOf(oid)>=0?' (über die Kategorie)':' (über den Bereich)';
}

// ── Bereich je Aufgabe ─────────────────────────────────────────────────────
// Die Kategorie gibt den Bereich vor, der Einzelfall darf abweichen: Eine
// Abrechnung, die der Patient heute bar begleichen soll, gehört an den Empfang,
// obwohl Abrechnung sonst Backoffice ist. Leer heißt „wie die Kategorie".
function getTaskArea(id){
  const e=aufBer[id];const v=String(e?e.ziel:lsGet('kimojo_taskarea_'+id,''));
  return(v==='tg'||v==='bo')?v:'';
}
function setTaskArea(id,v){
  const s=(v==='tg'||v==='bo')?v:'';
  lsSet('kimojo_taskarea_'+id,s);aufMerken({a:'ber',id:String(id),cat:aufKatVon(id),ziel:s});rerenderTasks();
}
function cycleTaskArea(id,cat){
  const o=['','tg','bo'],i=o.indexOf(getTaskArea(id));
  setTaskArea(id,o[(i<0?1:i+1)%3]);
}
function effectiveArea(id,cat){return getTaskArea(id)||getCatArea(cat);}

// ── Fälligkeitsdatum ───────────────────────────────────────────────────────
// Freiwillig und bewusst ohne Vorbelegung. Die meisten Aufgaben sind heute
// fällig, sonst stünden sie nicht in der Tagesliste — eine Frist ist für das
// Gegenteil da: „Rezept erst nach dem Arzttermin am 14.".
function getFrist(id){
  const e=aufFrist[id];const v=String(e?e.ziel:lsGet('kimojo_frist_'+id,''));
  return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
}
function setFrist(id,v){
  const s=/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
  lsSet('kimojo_frist_'+id,s);aufMerken({a:'frist',id:String(id),cat:aufKatVon(id),ziel:s});rerenderTasks();
}
// überfällig / heute / später — für die Farbe. Ohne Frist gibt es keinen Zustand.
function fristLage(ds){
  if(!ds)return'';
  const h=isoDay(0);
  return ds<h?'ueber':ds===h?'heut':'spaet';
}

// ── Anzeige: Chips, Hinzufügen-Auswahl, Bereich, Frist ─────────────────────
// Hinzugefügt wird über ein natives <select>. Ein eigenes Popup wäre hübscher
// und am Empfang schlechter: Das Systemmenü ist mit dem Daumen bedienbar, kennt
// Tastaturbedienung und kostet keine Zeile Code für Öffnen, Schließen und
// Klick-daneben. Jeder Klick braucht stopPropagation — die ganze Zeile liegt
// unter einem toggleTask, ein Klick auf einen Chip würde sonst abhaken.
function asgChip(oid,klick,titel,klass){
  return'<span class="asg-chip'+(klass?' '+klass:'')+'" style="background:'+teamColor(oid)+'"'
    +(klick?' onclick="event.stopPropagation();'+klick+'"':'')
    +' title="'+escA(titel)+'">'+esc(teamInitials(oid))+'</span>';
}
function asgAdd(drin,ruf,titel){
  const frei=getTeam().filter(m=>drin.indexOf(m.oid)<0);
  if(!frei.length)return'';
  let h='<select class="asg-add" onclick="event.stopPropagation()" onchange="'+ruf+'" title="'+escA(titel)+'">'
    +'<option value="">+</option>';
  frei.forEach(m=>{h+='<option value="'+escA(m.oid)+'">'+esc(m.n)+'</option>';});
  return h+'</select>';
}
// Zurücknehmen einer eigenen Festlegung. Der Knopf erscheint nur, wenn eine
// Stufe die Erbschaft abgeschnitten hat — sonst bliebe sie für immer von der
// stehenden Besetzung abgehängt, ohne dass irgendwo steht, woran es liegt.
function asgErbtKnopf(ruf,was){
  return'<span class="asg-reset" onclick="event.stopPropagation();'+ruf+'" title="'
    +escA('Eigene Zuständige dieser '+was+' aufheben — danach gilt wieder, wer oben im Bereich steht')
    +'">↺</span>';
}
// Geerbte Chips sind blass, eigene kräftig. Entfernen einer blassen Person
// schreibt die restliche Liste als eigene Festlegung fest — das steht im
// Tooltip, weil es die Verbindung nach oben kappt.
function assigneeChips(id,cat){
  if(!getTeam().length)return'';
  const eff=effectiveAssignee(id,cat),eig=taskEigene(id);
  let h='<span class="asg-row">';
  eff.forEach(o=>{const mein=eig.indexOf(o)>=0;
    h+=asgChip(o,'taskPersonRaus(\''+jsq(id)+'\',\''+jsq(o)+'\')',
      personName(o)+assignHerkunft(id,cat,o)
      +(mein?' — klicken nimmt heraus':' — klicken nimmt heraus und legt die Aufgabe damit fest'),
      mein?'':'asg-inh');});
  if(!eff.length)h+='<span class="asg-chip asg-none" title="niemand zuständig">–</span>';
  h+=asgAdd(eff,'taskPersonDazu(\''+jsq(id)+'\',this.value)','Person zu dieser Aufgabe');
  if(taskEigen(id)&&!taskErbt(id))h+=asgErbtKnopf('taskErbtWieder(\''+jsq(id)+'\')','Aufgabe');
  return h+'</span>';
}
function catAssignChips(cat){
  const drin=getCatAssign(cat),eig=catEigene(cat);
  let h='<span class="asg-row">';
  drin.forEach(o=>{const mein=eig.indexOf(o)>=0;
    h+=asgChip(o,'catPersonRaus(\''+jsq(cat)+'\',\''+jsq(o)+'\')',
      personName(o)+(mein?'':' (über den Bereich)')
      +(mein?' — klicken nimmt heraus':' — klicken nimmt heraus und legt die Kategorie damit fest'),
      mein?'':'asg-inh');});
  if(!drin.length)h+='<span class="asg-leer">niemand</span>';
  h+=asgAdd(drin,'catPersonDazu(\''+jsq(cat)+'\',this.value)','Person für die ganze Kategorie');
  if(catEigen(cat)&&!catErbt(cat))h+=asgErbtKnopf('catErbtWieder(\''+jsq(cat)+'\')','Kategorie');
  return h+'</span>';
}
function areaAssignChips(a){
  const drin=getAreaAssign(a);
  let h='<span class="asg-row">';
  drin.forEach(o=>{h+=asgChip(o,'areaPersonRaus(\''+jsq(a)+'\',\''+jsq(o)+'\')',
    personName(o)+' — klicken nimmt heraus');});
  if(!drin.length)h+='<span class="asg-leer">niemand</span>';
  h+=asgAdd(drin,'areaPersonDazu(\''+jsq(a)+'\',this.value)','Person für diesen Bereich');
  return h+'</span>';
}
// Bereichs-Chip an der Aufgabe. Blass heißt „geerbt von der Kategorie", kräftig
// heißt „hier ausdrücklich so gesetzt" — sonst sieht man nicht, ob eine Aufgabe
// absichtlich im anderen Bereich hängt oder nur mitläuft. „—" heißt: noch
// keinem Bereich zugeordnet, steht also nur unter „Allgemein".
function taskAreaChip(id,cat){
  const e=effectiveArea(id,cat),eigen=getTaskArea(id);
  const kurz=e==='bo'?'BO':e==='tg'?'TG':'—';
  return'<span class="area-chip'+(eigen?' area-eigen':'')+'" onclick="event.stopPropagation();cycleTaskArea(\''+jsq(id)+'\',\''+jsq(cat)+'\')"'
    +' title="'+escA((TZ_AREAS[e]||'Keinem Bereich zugeordnet')+(eigen?' — für diese Aufgabe festgelegt':' — von der Kategorie')+'. Klicken wechselt: Kategorie → Tagesgeschäft → Backoffice.')+'">'+kurz+'</span>';
}
// Ein Datumsfeld statt eines Knopfes mit Kalender-Popup: <input type="date">
// bringt auf jedem Gerät den gewohnten Datumswähler mit, auch auf dem iPad am
// Empfang. Ohne Frist bleibt es blass und drängelt nicht.
function fristFeld(id){
  const f=getFrist(id),lage=fristLage(f);
  return'<input type="date" class="frist-in'+(f?' frist-'+lage:' frist-leer')+'" value="'+escA(f)+'"'
    +' onclick="event.stopPropagation()" onchange="event.stopPropagation();setFrist(\''+jsq(id)+'\',this.value)"'
    +' title="'+escA(f?('fällig am '+tzKurzTag(f)+(lage==='ueber'?' — überfällig':lage==='heut'?' — heute':'')):'Fälligkeitsdatum (freiwillig)')+'">';
}
// Statuswähler. Ein natives <select> wie beim Hinzufügen von Personen: Es
// zeigt den Zustand im geschlossenen Zustand mit an und braucht kein eigenes
// Popup. „Abgelehnt" geht über denselben Weg, fragt aber nach einem Grund.
function statusSel(id,titel){
  const s=taskStatus(id);
  let h='<select class="st-sel '+AUF_STATUS[s].k+'" onclick="event.stopPropagation()"'
    +' onchange="event.stopPropagation();statusWaehlen(\''+jsq(id)+'\',this.value,\''+jsq(titel||'')+'\')"'
    +' title="'+escA('Status: '+AUF_STATUS[s].l+(taskDoneVon(id)?'\nzuletzt: '+taskDoneVon(id):''))+'">';
  AUF_STATUS_REIHE.forEach(k=>{
    h+='<option value="'+k+'"'+(k===s?' selected':'')+'>'+AUF_STATUS[k].ico+' '+AUF_STATUS[k].l+'</option>';});
  return h+'</select>';
}
// Notizknopf: still, solange nichts dasteht, deutlich sobald etwas drinsteht.
// Der Text selbst steht in der Zeile (notizZeile), hier liegt nur das Stift-
// Symbol — sonst wäre die Zeile bei langen Notizen nicht mehr zu überblicken.
function notizKnopf(id,titel){
  const n=getNotiz(id),w=notizVon(id);
  return'<span class="nz-btn'+(n?' nz-da':'')+'" onclick="event.stopPropagation();notizFragen(\''+jsq(id)+'\',\''+jsq(titel||'')+'\')"'
    +' title="'+escA(n?(n+(w?'\n— '+personName(w):'')):'Notiz hinzufügen')+'">'+(n?'📝':'✚')+'</span>';
}
function notizZeile(id){
  const n=getNotiz(id);if(!n)return'';
  const w=notizVon(id);
  return'<div class="nz-txt">📝 '+esc(n)+(w?'<span class="nz-wer"> — '+esc(personName(w))+'</span>':'')+'</div>';
}
// Alles, was rechts an einer Aufgabenzeile hängt — einmal definiert, damit
// Tagesziel, Tagesplan und die Fachreiter nicht auseinanderlaufen. `titel` ist
// nur die Beschriftung für die Abfragen; fehlt sie, fragt es eben ohne Namen.
function taskMeta(id,cat,titel){
  return'<div class="task-meta">'+statusSel(id,titel)+assigneeChips(id,cat)
    +taskAreaChip(id,cat)+fristFeld(id)+notizKnopf(id,titel)+'</div>';
}
// "Ich" ist keine Einstellung mehr, sondern das angemeldete Konto.
function getMe(){const k=meKonto();return k?k.oid:'';}
function toggleOnlyMine(v){tzOnlyMine=!!v;rerenderTasks();}

function renderTeamBar(){
  const team=getTeam(),k=meKonto();
  let h='<div class="tm-bar"><span class="tm-label">👥 Praxismanager</span>';
  if(!team.length)h+='<span class="tm-empty">noch niemand — rechts nach Kollegen suchen und hinzufügen</span>';
  else team.forEach(m=>{
    const ich=k&&m.oid===k.oid;
    h+='<span class="tm-chip"'+(ich?' style="font-weight:700"':'')+' title="'+escA(m.mail||'')+'">'
      +'<i class="tm-dot" style="background:'+teamColor(m.oid)+'"></i>'+esc(m.n)
      +(ich?' <span style="font-size:10px;color:var(--muted)">(Sie)</span>':'')
      +'<b class="tm-x" title="aus den Praxismanagern nehmen" onclick="aufManagerRaus(\''+jsq(m.oid)+'\')">×</b></span>';});
  h+='<input type="text" class="tm-input" id="tmSuche" value="'+escA(aufSucheQ)+'" autocomplete="off"'
    +' placeholder="Kollegen suchen…" title="Nach Namen oder E-Mail im Microsoft-Verzeichnis suchen"'
    +' oninput="aufSucheInput(this.value)">';
  h+='<span class="tm-me">';
  if(team.length&&k){
    h+='<label class="tm-mine"><input type="checkbox"'+(tzOnlyMine?' checked':'')+' onchange="toggleOnlyMine(this.checked)"> nur meine</label>';
  }
  h+='</span>';
  h+='<div class="tm-treffer" id="tmTreffer">'+aufSucheMarkup()+'</div>';
  return h+'</div>';
}

// Der Zustand des Protokolls. Steht eigenständig, nicht in der Teamleiste: Ein
// Haken, der nur lokal liegt, sieht sonst aus wie einer, den alle sehen — und
// eine Fehlermeldung darf nicht hinter einem zugeklappten Knopf verschwinden.
function aufZustandZeile(){
  const hinweise=[];
  if(!meKonto())hinweise.push('Nicht angemeldet — Haken bleiben auf diesem Gerät.');
  else if(!aufBereit)hinweise.push('Protokoll wird geladen…');
  if(aufSchreibt)hinweise.push('speichert…');
  if(aufFehler)hinweise.push(aufFehler);
  if(aufTeamFehler)hinweise.push(aufTeamFehler);
  if(!hinweise.length)return'';
  return'<div class="auf-zustand'+(aufFehler||aufTeamFehler?' auf-zustand-fehler':'')+'">'
    +esc(hinweise.join(' · '))+'</div>';
}

// ── Telefonnummern ─────────────────────────────────────────────────────────
// plData wird bei jedem Laden neu geholt; der Index hängt sich deshalb an die
// Objektidentität und baut sich von selbst neu auf, wenn die Liste wechselt.
// _plSrc startet bewusst auf undefined, nicht auf null: plData ist null, solange
// die Patientenliste nicht exportiert ist, und null!==null waere false — der
// Index bliebe dann leer und der Zugriff wuerde werfen.
let _plMap=null,_plSrc;
function phoneFor(pid){
  if(_plSrc!==plData||!_plMap){_plSrc=plData;_plMap={};(Array.isArray(plData)?plData:[]).forEach(p=>{if(p&&p.Id!=null)_plMap[String(p.Id)]=p;});}
  if(pid==null)return'';
  const r=_plMap[String(pid)];return r?extractPhone(r):'';
}

// ── Dauerpatienten ─────────────────────────────────────────────────────────
// Ein Dauerpatient kommt ohnehin. Die Folge-VO laeuft bei ihm im Routinelauf
// mit, ein Dauerplatz ist laengst vergeben — beide Reiter fragen bei ihm also
// nach etwas, das schon erledigt ist. Er wird deshalb standardmaessig
// ausgeblendet und ist ueber einen Schalter wieder da.
//
// Erkannt wird er an zwei Stellen, und beide zaehlen gleich:
//
//   1. Am Namenszusatz. Werneck haengt " DAU" an den Nachnamen (Kaiser DAU,
//      Reck *1962 DAU). Das steht in JEDEM Export — auch in der
//      Verordnungsuebersicht — und reicht damit ueber alle Patienten, nicht
//      nur ueber die des 14-Tage-Fensters. Stand 14.08.: 12 Patienten.
//   2. Am Bemerkungsfeld des Patienten, sobald der Flow es liefert
//      (PatientBemerkung im Terminplan). Dort steht bei Kilians Testpatient
//      "Dauerpatient".
//
// Bewusst NICHT ausgewertet wird die Bemerkung am Termin selbst: die gehoert
// zum Einzeltermin ("kommt spaeter", "Rezept mitbringen") und wuerde einen
// Patienten dauerhaft ausblenden, weil einmal das falsche Wort darin stand.
const DAU_NAME=/(^|[\s,.\-])DAU([\s,.\-]|$)/;      // Namenszusatz, bewusst case-sensitiv
const DAU_TEXT=/dauerpat|dauerplan|dauerrezept/i;  // Freitext im Bemerkungsfeld
function _dauHit(nach,vor,bem){
  return DAU_NAME.test(String(nach||''))||DAU_NAME.test(String(vor||''))
       ||DAU_TEXT.test(String(bem||''));
}
let _dauSet=null;
function dauerIndex(){
  if(_dauSet)return _dauSet;
  const s=new Set();
  const merk=(pid,nach,vor,bem)=>{if(pid!=null&&_dauHit(nach,vor,bem))s.add(String(pid));};
  try{
    Object.keys(VOD||{}).forEach(k=>{
      const D=VOD[k];if(!D||!D.vo)return;
      (voNodes(D.vo)||[]).forEach(v=>{if(v)merk(v.verknuepfterPatientId,v.nachname,v.vorname,v.bemerkung);});
    });
  }catch(e){}
  try{
    Object.keys(DATA||{}).forEach(suf=>{
      const dd=DATA[suf];if(!dd)return;
      Object.keys(dd).forEach(k=>{
        const tp=dd[k]&&dd[k].tp;if(!tp)return;
        (Array.isArray(tp)?tp.flat():[]).forEach(t=>{
          if(t)merk(t.PatientId,t.PatientNachname,t.PatientVorname,t.PatientBemerkung);});
      });
    });
  }catch(e){}
  try{
    (Array.isArray(plData)?plData:[]).forEach(p=>{if(p)merk(p.Id,p.Nachname,p.Vorname,p.Bemerkung);});
  }catch(e){}
  _dauSet=s;return s;
}
// Der Name wird zusaetzlich direkt geprueft, damit die Erkennung auch dann
// greift, wenn eine Zeile gar keine Patienten-ID traegt (Privatformulare).
function istDauer(pid,name){
  if(name&&DAU_NAME.test(String(name)))return true;
  if(pid==null)return false;
  return dauerIndex().has(String(pid));
}

// ═══════════════════════════════════════════════════════════════════════════
// FOLGE-VO — welche Serie ist durch, ohne dass ein Anschlussrezept vorliegt?
// ---------------------------------------------------------------------------
// Werneck hatte das bisher auf "Rezept-Ende" verteilt, und dieser Reiter läuft
// bei thevea leer: er rechnet auf behandlungen_werneck.json im Medifox-Format,
// das es hier nicht gibt. Die Frage lässt sich aber direkt aus der
// Verordnungsübersicht beantworten:
//
//   1. Entwürfe fliegen raus — die sind noch keine Leistung. "Abgeschlossen"
//      bleibt ausdrücklich drin, das ist der klassische Kandidat.
//   2. Die Menge ist durch. Maßgeblich ist wie im Reiter "Offene Rezepte" die
//      Terminlage (eine Terminzeile = eine Behandlungseinheit); die
//      Dokumentation zählt, wenn sie höher liegt.
//   3. Kein Anschluss: kein weiteres Rezept desselben Patienten, das noch
//      offene Einheiten oder einen Termin hat oder später ausgestellt wurde.
//
// Steht auf dem fertigen Rezept selbst noch ein Termin und es gibt kein
// Folgerezept, ist das der dringendste Fall überhaupt: der Patient kommt, das
// Rezept trägt ihn nicht mehr. Diese Zeilen stehen deshalb oben.
//
// Einen Arzt liefert thevea an dieser Stelle nicht — weder die Übersicht noch
// die Verordnungsdetails führen ein Arztfeld. Deshalb steht in der Zeile die
// Diagnose (die man für das Gespräch ohnehin braucht) und ein Namensfeld, das
// die Praxis selbst pflegen kann.
// ═══════════════════════════════════════════════════════════════════════════
function getArztNotiz(pid){return lsGet('kimojo_arzt_'+pid,'');}
function setArztNotiz(pid,v){lsSet('kimojo_arzt_'+pid,String(v||'').trim());}

// ── Heilmittelkatalog: orientierende Behandlungsmenge je Verordnungsfall ────
// Die Regel stammt aus dem Physio-CKI und lautet dort:
//
//   „Ausschöpfung = verplante Termine (erbrachte + bereits gebuchte
//    zukünftige) gemessen an der orientierenden Behandlungsmenge des Katalogs.
//    Ein Verordnungsfall = Patient + ICD-3-Steller + Diagnosegruppe; die Kette
//    beginnt beim ersten Rezept und startet nach 6 Monaten ohne Rezept neu."
//
// Die Höchstmenge je Verordnung liefert thevea selbst mit
// (hoechstverordnungsmengeJeVerordnung, siehe detMap) — die ist damit belegt
// und muss nicht geraten werden. Die orientierende Behandlungsmenge dagegen
// führt die API nicht: der Typ KbvHeilmittelRichtlinie102020Diagnosegruppe
// kennt das Feld nicht (siehe THEVEA-API-BEFUNDE, Abschnitt 9). Sie steht
// deshalb hier als Tabelle. Quelle ist der Heilmittelkatalog des G-BA, also der
// Zweite Teil der Heilmittel-Richtlinie nach § 92 Abs. 6 Satz 1 Nr. 2 SGB V,
// Fassung vom 16.05.2024, Seite fuer Seite ausgelesen — keine geschaetzten Werte.
// Geschluesselt wird auf die volle Diagnosegruppe, weil sich die Mengen innerhalb
// eines Buchstabenpaars unterscheiden: SB1 hat 20, SB2 und SB3 haben 30; EN1 und
// EN2 haben 40, EN3 hat 20. Ein Mapping auf die ersten beiden Buchstaben waere
// hier schlicht falsch gewesen.
const KAT_ORIENT={
  // I. Physiotherapie
  WS:18,EX:18,CS:18,ZN:30,PN:30,AT:18,GE:18,LY:30,
  SO:18,SO1:18,SO2:18,SO3:18,SO4:18,SO5:18,
  // IV. Ergotherapie
  SB1:20,SB2:30,SB3:30,EN1:40,EN2:40,EN3:20,PS1:40,PS2:40,PS3:40,PS4:40,
  // III. Stimm-, Sprech-, Sprach- und Schlucktherapie
  ST1:20,ST2:20,ST3:10,ST4:20,SP1:60,SP2:20,SP3:30,SP4:50,SP5:60,SP6:60,
  RE1:50,RE2:20,SF:20,SC:60};
// Hoechstmenge je Verordnung aus demselben Katalog. thevea liefert sie pro Rezept
// mit; diese Tabelle greift nur, wenn im Export keine steht.
const KAT_HOECHST={
  WS:6,EX:6,CS:6,ZN:10,PN:10,AT:6,GE:6,LY:6,
  SO:6,SO1:6,SO2:6,SO3:6,SO4:6,SO5:6,
  SB1:10,SB2:10,SB3:10,EN1:10,EN2:10,EN3:10,PS1:10,PS2:20,PS3:20,PS4:10,
  ST1:10,ST2:10,ST3:10,ST4:10,SP1:10,SP2:10,SP3:10,SP4:20,SP5:20,SP6:20,
  RE1:10,RE2:10,SF:10,SC:10};
// Der Katalog kennt hoehere orientierende Mengen fuer Kinder und Jugendliche bis
// zur Vollendung des 18. Lebensjahres (EX und ZN je 50, EN1 60) sowie 50 bei
// Mukoviszidose unter AT. Das Alter steht im Export nicht verlaesslich, deshalb
// rechnet das Dashboard mit dem Grundwert und weist die Ausnahme im Reiter aus.
const KAT_NAME={
  WS:'Wirbelsäulenerkrankungen',EX:'Extremitäten und Becken',
  CS:'chronifiziertes Schmerzsyndrom',ZN:'ZNS einschl. Rückenmark',
  PN:'periphere Nerven und Muskeln',AT:'Atemwege und Lunge',
  GE:'arterielle Gefäßerkrankungen',LY:'Lymphabflussstörungen',
  SO:'sonstige Erkrankungen',SO1:'Störung der Dickdarmfunktion',
  SO2:'Störungen der Ausscheidung',SO3:'Schwindel',
  SO4:'periphere trophische Störungen',SO5:'chronische Beckenerkrankungen',
  SB1:'Wirbelsäule/Gelenke, motorisch-funktionell',
  SB2:'Wirbelsäule/Gelenke, sensomotorisch-perzeptiv',
  SB3:'System- und Autoimmunerkrankungen',
  EN1:'ZNS (Gehirn)',EN2:'ZNS (Rückenmark)/neuromuskulär',
  EN3:'periphere Nervenläsionen/Muskeln',
  PS1:'Entwicklungs- und Verhaltensstörungen',
  PS2:'neurotische und Belastungsstörungen',
  PS3:'wahnhafte und affektive Störungen',PS4:'dementielle Syndrome',
  ST1:'Stimmstörungen',ST2:'Stimmstörungen',ST3:'Stimmstörungen',ST4:'Stimmstörungen',
  SP1:'Sprachentwicklungsstörung',SP2:'Sprachstörung',SP3:'Sprachstörung',
  SP4:'Sprach-/Sprechstörung',SP5:'Sprach-/Sprechstörung',SP6:'Sprach-/Sprechstörung',
  RE1:'Störung des Redeflusses',RE2:'Störung des Redeflusses',
  SF:'Stimm- und Sprechfunktion',SC:'Störung des Schluckaktes'};
// thevea schreibt die Gruppe mal als SO3, mal als 'SB 1'. Erst der volle Code,
// dann drei, dann zwei Zeichen — was der Katalog kennt, gewinnt.
function katGruppe(k){
  const c=String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!c)return '';
  if(KAT_ORIENT[c]!=null)return c;
  const d3=c.slice(0,3);if(KAT_ORIENT[d3]!=null)return d3;
  const d2=c.slice(0,2);if(KAT_ORIENT[d2]!=null)return d2;
  return d2;
}
// Ein Verordnungsfall bindet an den ICD-3-Steller, nicht an den vollen Code:
// M54.4 und M54.5 sind derselbe Fall.
function icd3(c){return String(c||'').replace(/[^A-Za-z0-9].*/,'').slice(0,3).toUpperCase();}
// ISO-Datum in die Schreibweise, die auf dem Rezept steht.
function dmy(ds){return ds?String(ds).slice(0,10).split('-').reverse().join('.'):'';}
// Sechs Monate ohne neues Rezept beenden den Fall und starten die Kette neu.
const FALL_MS=183*864e5;

// Baut aus Verordnungsübersicht + Details + Termin-Historie die Verordnungsfälle
// eines Standorts. Rückgabe: {faelle:[…], proVo:{voId:fall}}.
//
// Gezählt wird bewusst an echten Kalenderterminen, nicht an der Verordnungs-
// menge — das ist der Kern der CKI-Regel. Anders als im THEORG-Export ist
// thevease Mengenfeld zwar sauber (keine Sentinelwerte, höchster Wert 40), es
// beantwortet aber eine andere Frage: es sagt, was auf DIESEM Rezept noch
// offen ist, nicht was im Fall insgesamt noch möglich wäre. Für „lohnt sich
// eine Folge-VO" zählt der Fall, nicht das Blatt.
function buildVOFaelle(locId){
  const D=VOD[locId];
  if(!D||!D.vo)return{faelle:[],proVo:{}};
  const nodes=voNodes(D.vo)||[];
  const DET=D.det||{};
  const H=(D.hist&&D.hist.vo)?D.hist.vo:null;
  const SER=(D.hist&&D.hist.serien)?D.hist.serien:{};
  const heuteDs=D.heuteDs||isoDay(0);
  const heuteT=new Date(heuteDs+'T12:00:00').getTime();

  // 1) je Rezept: erbrachte und geplante Termine
  const rez=[];
  nodes.forEach(v=>{
    if(!v||v.status==='Entwurf'||v.verknuepfterPatientId==null)return;
    const d=DET[String(v.id)]||null;
    const hv=H?H[String(v.id)]:null;
    // Zwei Zeugen für die erbrachten Behandlungen: die Dokumentation in thevea
    // und die gezählten Termine der Historie. Die Historie reicht nur 180 Tage
    // zurück, die Dokumentation kann hinterherhinken — der höhere Wert ist der
    // ehrlichere.
    const erbracht=Math.max(voErb(v),hv?hv.n:0);
    const geplant=hv?hv.nZ:0;
    rez.push({
      id:v.id,pid:String(v.verknuepfterPatientId),
      name:((v.vorname||'')+' '+(v.nachname||'')).trim()||('Patient '+v.verknuepfterPatientId),
      ausst:(d&&d.ausst)||String(v.ausstellungsdatum||'').slice(0,10),
      icd:d?(d.icd||''):'',icdT:d?(d.icdT||''):'',
      dg:d?(d.dg||''):'',dgMax:d?(d.dgMax||0):0,blanko:d?!!d.bl:false,
      heilmittel:v.heilmittel||'',formular:v.formular||'',status:v.status||'',
      hatDet:!!d,
      erbracht,geplant,kann:voKann(v),
      letzter:hv?hv.letzter:null,naechster:hv?hv.naechster:null
    });
  });

  // 2) Rezepte zu Fällen bündeln: Patient + ICD-3-Steller + Katalog-Gruppe
  const proKey={};
  rez.forEach(r=>{
    const k=r.pid+'|'+icd3(r.icd)+'|'+katGruppe(r.dg);
    (proKey[k]=proKey[k]||[]).push(r);
  });

  const faelle=[],proVo={};
  Object.keys(proKey).forEach(key=>{
    const list=proKey[key].slice().sort((a,b)=>String(a.ausst||'').localeCompare(String(b.ausst||'')));
    // Aktuellste Kette bilden: mehr als sechs Monate Abstand zwischen zwei
    // Ausstellungen sind zwei verschiedene Fälle.
    let kette=[];
    for(let i=0;i<list.length;i++){
      const vor=kette[kette.length-1];
      if(kette.length&&list[i].ausst&&vor&&vor.ausst
         &&(new Date(list[i].ausst)-new Date(vor.ausst))>FALL_MS)kette=[];
      kette.push(list[i]);
    }
    const daten=kette.map(r=>r.ausst).filter(Boolean);
    const letztesRez=daten.length?daten[daten.length-1]:null;
    const erstesRez=daten.length?daten[0]:null;
    const datumFehlt=kette.some(r=>!r.ausst);
    // Fälle, deren letztes Rezept über sechs Monate alt ist, sind zu. Ohne
    // jedes Datum bleibt der Fall drin — sonst verschwänden Privatrezepte,
    // die gar kein Ausstellungsdatum tragen.
    const zu=!!(letztesRez&&(heuteT-new Date(letztesRez).getTime())>FALL_MS);

    const erbracht=kette.reduce((s,r)=>s+r.erbracht,0);
    const geplant=kette.reduce((s,r)=>s+r.geplant,0);
    const genutzt=erbracht+geplant;
    const gruppe=katGruppe((kette.find(r=>r.dg)||{}).dg||'');
    const icd=(kette.find(r=>r.icd)||{}).icd||'';
    const anyBlanko=kette.some(r=>r.blanko);
    // Höchstmenge: der belegte Wert aus dem Export schlägt jede Tabelle.
    let hoechst=0;kette.forEach(r=>{if(r.dgMax>hoechst)hoechst=r.dgMax;});
    let orient=null,quelle='';
    if(KAT_ORIENT[gruppe]){orient=KAT_ORIENT[gruppe];quelle='katalog';}
    else if(anyBlanko){orient=BLANKO_MAX.wtVor;hoechst=hoechst||BLANKO_MAX.wtVor;quelle='blanko';}
    if(!hoechst)hoechst=KAT_HOECHST[gruppe]||6;
    const restBeh=orient!=null?Math.max(0,orient-genutzt):null;
    const nochRez=orient!=null?Math.ceil(restBeh/hoechst):null;
    const ausschoepf=orient?Math.min(100,Math.round(genutzt/orient*100)):null;
    let naechster=null;kette.forEach(r=>{if(r.naechster&&(!naechster||r.naechster<naechster))naechster=r.naechster;});
    let letzter=null;kette.forEach(r=>{if(r.letzter&&(!letzter||r.letzter>letzter))letzter=r.letzter;});
    const b=icd?fBVB(icd):null;

    const fall={key,pid:kette[0].pid,name:kette[0].name,icd,
      icdT:(kette.find(r=>r.icdT)||{}).icdT||'',
      dg:(kette.find(r=>r.dg)||{}).dg||'',gruppe,gruppeName:KAT_NAME[gruppe]||'',
      anzRez:kette.length,
      erbracht,geplant,genutzt,orient,hoechst,restBeh,nochRez,ausschoepf,quelle,
      hatKatalog:orient!=null,blanko:anyBlanko,
      bvb:b?b.t:'',bvbName:b?b.n:'',
      erstesRez,letztesRez,datumFehlt,zu,naechster,letzter,
      // Zwei sehr verschiedene Gruende, warum eine Diagnosegruppe fehlt, und nur
      // einer davon ist normal: Privat-, BG- und Zahnarztformulare tragen keine
      // Diagnose (in Ordnung). Fehlt dagegen der ganze Detailsatz, hat der Flow
      // die Verordnung nicht abgeholt — das ist eine Luecke im Export.
      detFehlt:kette.some(r=>!r.hatDet),
      formular:(kette.find(r=>r.formular)||{}).formular||'',
      serie:!!SER[kette[0].pid],voIds:kette.map(r=>r.id)};
    faelle.push(fall);
    kette.forEach(r=>{proVo[String(r.id)]=fall;});
  });
  return {faelle,proVo};
}

// Zwischenspeicher, damit die Fälle nicht bei jedem Filterklick neu entstehen.
// Wird in loadAll() geleert, sonst zeigt „↻ Neu laden" die alten Zahlen.
const _fallCache={};
function voFaelle(locId){
  if(!(locId in _fallCache))_fallCache[locId]=buildVOFaelle(locId);
  return _fallCache[locId];
}

function buildFolgeVO(locId){
  const D=VOD[locId];if(!D||!D.vo)return[];
  const nodes=voNodes(D.vo)||[];
  const H=(D.hist&&D.hist.vo)?D.hist.vo:null;
  const heuteDs=D.heuteDs||isoDay(0);
  const gelVon=v=>{
    const erb=voErb(v);
    const hv=H?H[String(v.id)]:null;
    const tv=hv?hv.n:null;
    return{erb,tv,tz:hv?hv.nZ:0,naechster:hv?hv.naechster:null,letzter:hv?hv.letzter:null,
           gel:tv!=null?Math.max(erb,tv):erb};
  };
  const proPat={};
  nodes.forEach(v=>{
    if(!v||v.verknuepfterPatientId==null||v.status==='Entwurf')return;
    const k=String(v.verknuepfterPatientId);(proPat[k]=proPat[k]||[]).push(v);
  });
  const out=[];
  nodes.forEach(v=>{
    if(!v||v.status==='Entwurf')return;
    const kann=voKann(v);if(kann<=0)return;
    const m=gelVon(v);
    if(m.gel<kann)return;                                   // Serie läuft noch
    const pid=v.verknuepfterPatientId!=null?String(v.verknuepfterPatientId):null;
    const ausst=String(v.ausstellungsdatum||'').slice(0,10);
    const anschluss=((pid&&proPat[pid])||[]).some(o=>{
      if(!o||o.id===v.id)return false;
      const om=gelVon(o);
      if(om.naechster)return true;                          // dort steht ein Termin
      const oKann=voKann(o);
      if(oKann>0&&om.gel<oKann&&o.status==='InBehandlung')return true; // dort ist Menge offen
      const oa=String(o.ausstellungsdatum||'').slice(0,10);
      if(ausst&&oa&&oa>ausst)return true;                   // später ausgestellt
      return false;
    });
    if(anschluss)return;
    const d=D.det?D.det[String(v.id)]:null;
    const stichtag=m.letzter||ausst||null;
    const tage=stichtag?Math.round((new Date(heuteDs+'T12:00:00')-new Date(stichtag+'T12:00:00'))/864e5):null;
    const name=((v.nachname||'')+(v.vorname?', '+v.vorname:'')).trim()||'(ohne Namen)';
    out.push({id:'fvo|'+v.id,voId:v.id,pid,name,
      heilmittel:v.heilmittel||'',formular:v.formular||'',status:v.status||'',
      icd:d?(d.icd||''):'',icdT:d?(d.icdT||''):'',dg:d?(d.dg||''):'',dgMax:d?(d.dgMax||0):0,
      erb:m.erb,gel:m.gel,kann,tz:m.tz||0,letzter:m.letzter||null,ausst,tage,
      dringend:(m.tz||0)>0,
      sub:(v.heilmittel||v.formular||'')+' · '+m.gel+'/'+kann+' erbracht'
         +(tage!=null?' · letzter Termin vor '+tage+' Tagen':'')
         +((m.tz||0)>0?' · ⚠ '+m.tz+' Termin(e) ohne Rezept':'')});
  });
  // ── Verordnungsfall anhaengen ────────────────────────────────────────────
  // Bis hierher steht fest, WELCHES Rezept ausgelaufen ist. Die zweite Frage
  // ist, ob sich ein Anschluss ueberhaupt lohnt — und die beantwortet nicht das
  // Rezept, sondern der Verordnungsfall: wie viele der laut Katalog moeglichen
  // Behandlungen sind schon verplant? Ein Fall mit 6 von 18 verplanten
  // Behandlungen ist ein Anruf, einer mit 18 von 18 ist erledigt.
  const FA=voFaelle(locId).proVo;
  out.forEach(r=>{
    const f=FA[String(r.voId)]||null;
    r.dauer=istDauer(r.pid,r.name);
    r.fall=f;
    r.orient=f?f.orient:null;r.genutzt=f?f.genutzt:null;r.geplant=f?f.geplant:0;
    r.restBeh=f?f.restBeh:null;r.nochRez=f?f.nochRez:null;r.ausschoepf=f?f.ausschoepf:null;
    r.hoechst=f?f.hoechst:null;
    r.anzRez=f?f.anzRez:1;r.erstesRez=f?f.erstesRez:null;r.gruppe=f?f.gruppe:'';
    r.gruppeName=f?f.gruppeName:'';
    r.bvb=f?f.bvb:'';r.bvbName=f?f.bvbName:'';r.quelle=f?f.quelle:'';
    r.hatKatalog=f?f.hatKatalog:false;r.fallKey=f?f.key:null;
    r.detFehlt=f?f.detFehlt:false;
    // Drei Handlungswege. „potential" ist der eigentliche Folge-VO-Fall,
    // „ausgeschoepft" heisst nichts zu tun, „budgetfrei" ist BVB/LVB: das
    // laeuft ausserhalb des Budgets und kennt keine orientierende Menge.
    r.weg=r.bvb?'budgetfrei':(!r.hatKatalog?'ohne':(r.restBeh>0?'potential':'ausgeschoepft'));
  });

  // Eine Serie kann auf zwei Verordnungssaetze verteilt sein: gleiches Heilmittel,
  // gleicher Patient, gleiches Ausstellungsdatum — auf dem einen steht die
  // Dokumentation, auf dem anderen haengen die Termine (z.B. Sauer, Walburga).
  // Fuer die Praxis ist das ein Anruf, nicht zwei, also werden solche Zeilen
  // zusammengelegt. Zwei verschiedene Heilmittel am selben Tag (KG + MLD) bleiben
  // bewusst getrennt — das sind zwei Serien.
  const zusammen={},uniq=[];
  out.forEach(r=>{
    const k=(r.pid||r.name)+'|'+r.heilmittel+'|'+r.ausst;
    const v=zusammen[k];
    if(!v){zusammen[k]=r;r.mehrfach=1;uniq.push(r);return;}
    v.mehrfach++;
    v.dringend=v.dringend||r.dringend;
    if(r.tage!=null&&(v.tage==null||r.tage>v.tage))v.tage=r.tage;
  });
  uniq.forEach(r=>{
    if(r.mehrfach>1)r.sub+=' · '+r.mehrfach+' Verordnungssaetze';
    // Der Satz unter dem Namen sagt jetzt zuerst, was der Fall hergibt.
    if(r.hatKatalog&&r.orient!=null){
      r.sub+=' · Fall: '+r.genutzt+'/'+r.orient+' verplant'
        +(r.geplant>0?' (davon '+r.geplant+' zukünftig)':'')
        +(r.anzRez>1?' · '+r.anzRez+' VO im Fall':'');
    }
  });
  // Sortiert wird nach dem, was der Anruf bringt, nicht nach dem, was am
  // laengsten liegt. Vorher standen die aeltesten Faelle oben — das waren
  // gerade die, bei denen ohnehin nichts mehr kommt. Reihenfolge jetzt:
  // Termin ohne Rezept zuerst, dann das groesste offene Potential, und erst
  // bei Gleichstand das Alter.
  const rang={potential:0,budgetfrei:1,ohne:2,ausgeschoepft:3};
  uniq.sort((a,b)=>(b.dringend-a.dringend)
    ||((rang[a.weg]||0)-(rang[b.weg]||0))
    ||((b.restBeh==null?-1:b.restBeh)-(a.restBeh==null?-1:a.restBeh))
    ||((b.tage==null?-1:b.tage)-(a.tage==null?-1:a.tage)));
  return uniq;
}

const TZ_REIHE=['luecke','lueckeM','rezende','verplan','vplOhne','fvo','abr','ft','dauer','blankopot'];

// Dauerplan-Kandidaten für einen bestimmten Tag: wer an diesem Tag ohnehin
// kommt, geeignet ist und noch keinen festen Takt hat. buildDauerplan läuft über
// alle Verordnungen des Standorts, deshalb wird das Ergebnis je Standort einmal
// gemerkt — der Tagesnavigator ruft es sonst vierzehnmal hintereinander auf.
const _dauerCache={};
// ohneSchnitt=true liefert auch die Dauerpatienten mit — buildTasks braucht das,
// um sagen zu koennen, wie viele Aufgaben der Schalter gerade wegnimmt.
function dauerFuerTag(locId,ds,ohneSchnitt){
  if(!ds)return[];
  if(!(locId in _dauerCache)){
    try{_dauerCache[locId]=buildDauerplan(locId);}catch(e){_dauerCache[locId]=[];}
  }
  return _dauerCache[locId].filter(p=>!p.serie&&p.naechster===ds
    &&(ohneSchnitt||zeigeDauer||!p.dauer));
}

// ── Nicht zu Ende verplante Rezepte ────────────────────────────────────────
// Eine Sechser-Verordnung, auf der vier Termine stehen, ist kein fertiges
// Rezept — sie ist ein Rezept mit zwei Einheiten, die niemand gelegt hat. Bis
// jetzt fiel das nirgends auf: „Folgetermin vereinbaren" rechnet
// verordnet − erbracht und zaehlt gebuchte Zukunftstermine faelschlich als
// offen mit; es meldet sich ausserdem erst ab zwei Resteinheiten. Ein Rezept
// mit 21 verordneten, 6 erbrachten und einem gebuchten Termin taucht dort
// ueberhaupt nicht auf, obwohl vierzehn Einheiten frei in der Luft haengen.
//
// Gerechnet wird deshalb dreigliedrig: verordnet − erbracht − gebucht.
//   erbracht  = Dokumentation und vergangene Termine, der hoehere Wert
//   gebucht   = zukuenftige Termine aus der Historie (nZ), abgesagte zaehlen
//               nicht mit — ein abgesagter Termin gibt seine Einheit zurueck
// Die Historie reicht rund drei Monate voraus (Stand 14.08.: bis 12.11.), der
// gebuchte Anteil ist also belastbar und nicht vom 14-Tage-Fenster begrenzt.
//
// Blanko bleibt draussen: dort fuehrt thevea gar keine Menge (beide Felder
// stehen auf 0), die Grenze ist die Frist und die steht im Rezepte-Reiter.
// Drei Zustaende, weil sie am Empfang drei verschiedene Saetze sind:
//   neu   — nichts erbracht, nichts gebucht. Das Rezept liegt unangetastet da.
//   steck — angefangen, aber nach vorne steht nichts mehr. Das ist der Fall,
//           den der Reiter „Offene Rezepte" heute schon „Steckengeblieben"
//           nennt; die Restmenge verfaellt, wenn niemand anruft.
//   teil  — es laeuft, aber die verordnete Menge ist mit dem Gebuchten noch
//           nicht ausgeschoepft. Kein Verfallrisiko, aber der Rest muss
//           irgendwann gelegt werden — am besten, solange der Patient da ist.
const VP_ZUST={
  neu  :{l:'Noch nicht verplant',       kurz:'unverplant', b:'b-red',  rang:0},
  steck:{l:'Steckengeblieben',          kurz:'steckt',     b:'b-amber',rang:1},
  teil :{l:'Nicht zu Ende verplant',    kurz:'unvollständig',b:'b-teal',rang:2}
};
function vpZustand(erbracht,gebucht){
  if(gebucht>0)return'teil';
  return erbracht>0?'steck':'neu';
}
const _verplanCache={};
function buildVerplanung(locId){
  if(locId in _verplanCache)return _verplanCache[locId];
  const D=VOD[locId];if(!D||!D.vo)return(_verplanCache[locId]=[]);
  const nodes=voNodes(D.vo)||[];
  const H=(D.hist&&D.hist.vo)?D.hist.vo:null;
  const P={};
  nodes.forEach(v=>{
    if(!v||v.status!=='InBehandlung'||v.verknuepfterPatientId==null)return;
    const kann=voKann(v);
    if(kann<=0)return;
    const hv=H?H[String(v.id)]:null;
    const erbracht=Math.max(voErb(v),hv?hv.n:0);
    const gebucht=hv?hv.nZ:0;
    const rest=kann-erbracht-gebucht;
    if(rest<=0)return;
    const zust=vpZustand(erbracht,gebucht);
    const pid=String(v.verknuepfterPatientId);
    const e=P[pid]||(P[pid]={pid,
      name:((v.nachname||'')+(v.vorname?', '+v.vorname:'')).trim()||'(ohne Namen)',
      rest:0,kann:0,erbracht:0,gebucht:0,vos:[],naechster:null,letzter:null,zust:'teil',hbAlle:true});
    e.rest+=rest;e.kann+=kann;e.erbracht+=erbracht;e.gebucht+=gebucht;
    // Hausbesuch: zu verplanen ist hier nur, was in der Praxis stattfindet.
    // Gewertet werden die Rezepte mit Restmenge — genau die, um die es geht.
    if(!voHausbesuch(v,D.det))e.hbAlle=false;
    e.vos.push({id:v.id,hm:String(v.heilmittel||''),kann,erbracht,gebucht,rest,zust,
      ausst:String(v.ausstellungsdatum||'').slice(0,10)||null,
      letzter:hv&&hv.letzter?hv.letzter:null,
      naechster:hv&&hv.naechster?hv.naechster:null});
    // Der dringlichste Zustand gewinnt fuer den Patienten: wer ein
    // steckengebliebenes und ein laufendes Rezept hat, ist ein Rueckstand.
    if(VP_ZUST[zust].rang<VP_ZUST[e.zust].rang)e.zust=zust;
    if(hv&&hv.naechster&&(!e.naechster||hv.naechster<e.naechster))e.naechster=hv.naechster;
    if(hv&&hv.letzter&&(!e.letzter||hv.letzter>e.letzter))e.letzter=hv.letzter;
  });
  const out=Object.values(P);
  out.forEach(e=>{e.vos.sort((a,b)=>VP_ZUST[a.zust].rang-VP_ZUST[b.zust].rang||b.rest-a.rest);
    e.dauer=istDauer(e.pid,e.name);e.hb=!!e.hbAlle;});
  out.sort((a,b)=>VP_ZUST[a.zust].rang-VP_ZUST[b.zust].rang||b.rest-a.rest
    ||a.name.localeCompare(b.name));
  return(_verplanCache[locId]=out);
}

// Eine Zeile Klartext fuer die Aufgabenliste. Bei einem einzelnen Rezept die
// vollen Zahlen, bei mehreren die Summe — sonst liest sich „verordnet 18" wie
// eine Verordnung ueber achtzehn Einheiten, die es so nie gab.
function vpSub(e){
  if(e.vos.length===1){
    const v=e.vos[0];
    return (v.hm?v.hm.slice(0,26)+' · ':'')
      +'verordnet '+v.kann+' · erbracht '+v.erbracht+' · gebucht '+v.gebucht
      +' → '+v.rest+' offen';
  }
  return e.vos.length+' Rezepte · '+e.rest+' Einheiten nicht terminiert · '
    +(e.erbracht+e.gebucht)+' von '+e.kann+' verplant';
}

// Patienten-IDs mit Termin an einem bestimmten Tag. Quelle ist der Terminplan
// dieses Tages, nicht die Historie — der Terminplan ist der Stand, den der
// Empfang vor sich hat.
function tzPidsAmTag(locId,ds){
  const s=new Set();if(!ds)return s;
  const t=tzTage(locId).find(x=>x.ds===ds);
  if(t)(t.tp||[]).forEach(x=>{if(x&&x.PatientId!=null)s.add(String(x.PatientId));});
  return s;
}

// Lücken als Aufgaben. Arbeitszeiten liefert thevea nur für heute und morgen,
// deshalb kann es diese Kategorie auch nur an diesen beiden Tagen geben — für
// alle weiteren Tage im Navigator gibt es schlicht keine Datengrundlage.
// Gesucht wird der Tagesbestand über das Datum im Terminplan, nicht über den
// Dateinamen, sonst hängen bei verschobenem Flow die falschen Lücken am Tag.
// Der Tag nach ds, so wie ihn der Terminplan kennt. Kein Kalendersprung:
// gibt es fuer den Folgetag keinen Export, kommt null zurueck und die
// Kategorie sagt das offen, statt den uebernaechsten Tag unterzuschieben.
function tzFolgetag(locId,ds){
  if(!ds)return null;
  const tage=tzTage(locId);
  const i=tage.findIndex(t=>t.ds===ds);
  if(i<0||i+1>=tage.length)return null;
  return tage[i+1].ds;
}

// Kurzform fuer die Ueberschrift: "Do. 13.08."
function tzKurzTag(ds){
  const d=new Date(ds+'T12:00:00');if(isNaN(d))return ds;
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}).replace(',','');
}

// Die Aufgaben-ID einer Lücke. Sie wird an zwei Stellen gebraucht — im Tagesziel
// und im Reiter „Lücken" — und muss dort Zeichen für Zeichen dieselbe sein,
// sonst bekommt dieselbe Lücke zwei getrennte Zuständige und zwei Status.
// Deswegen gibt es nur diese eine Stelle, die sie baut.
function lueckeId(locId,ds,thName,von,kgg){
  return'luecke|'+locId+'|'+ds+(kgg?'|kgg':'')+'|'+thName+'|'+von;
}

function tzLueckenTasks(locId,ds){
  const loc=LOCS.find(l=>l.id===locId);if(!loc||!ds)return[];
  const dd=DATA[loc.suf];if(!dd)return[];
  let bucket=null;
  ['heute','morgen'].forEach(k=>{
    const d=dd[k];if(bucket||!d||!d.tp||!d.az||!d.az.length)return;
    const flat=Array.isArray(d.tp)?d.tp.flat():[];
    if(flat.length&&String(flat[0].Beginn||'').slice(0,10)===ds)bucket=d;
  });
  if(!bucket)return[];
  const f=filterTP(bucket.tp,bucket.az,loc.filter);
  const I=analyzeDay(f.tp,f.az);
  const out=[];
  (I.act||[]).forEach(t=>{
    (t.gaps||[]).forEach(g=>{
      const von=fmt(g.start),bis=fmt(g.end);
      if(g.kgg){
        out.push({id:lueckeId(locId,ds,t.name,von,true),cat:'luecke',ico:'💪',
          txt:'KGG auffüllen · '+von+'–'+bis,
          sub:g.frei+(g.frei===1?' Platz':' Plätze')+' frei · '+g.belegt+'/'+KGG_CAP+' belegt',
          name:t.name});
      }else{
        const slots=Math.floor(g.min/20);
        out.push({id:lueckeId(locId,ds,t.name,von,false),cat:'luecke',ico:'⚡',
          txt:'Lücke '+von+'–'+bis+' besetzen',
          sub:Math.round(g.min)+' min · '+slots+(slots===1?' Termin':' Termine')+' möglich',
          name:t.name});
      }
    });
  });
  return out;
}

function buildTasks(locId,subKey,ds){
  const loc=LOCS.find(l=>l.id===locId);
  const b=(RCS[locId]&&(RCS[locId][subKey]||RCS[locId].heute))||{};
  const byPid={},alle=[];
  // Zaehlt mit, was der Dauerpatienten-Schalter gerade wegnimmt. Ohne diese
  // Zahl waere das Tagesziel stillschweigend kuerzer — und niemand wuesste,
  // warum ein Name fehlt.
  let dauerAus=0;
  // Dasselbe fuer die Hausbesuche: eine eigene Zahl, weil es ein eigener
  // Schalter ist. Beide duerfen gleichzeitig greifen.
  let hbAus=0;
  const push=(pid,t)=>{
    t.pid=pid==null?null:String(pid);t.loc=t.loc||locId;alle.push(t);
    if(pid==null)return;(byPid[String(pid)]=byPid[String(pid)]||[]).push(t);
  };

  // 0) Lücken im Terminplan. Der gewählte Tag und der Tag danach stehen als
  //    zwei getrennte Kategorien im Tagesziel: was morgen frei ist, muss heute
  //    telefoniert werden, sonst ist es morgen zu spät.
  tzLueckenTasks(locId,ds).forEach(t=>push(null,t));
  const folgeDs=tzFolgetag(locId,ds);
  if(folgeDs)tzLueckenTasks(locId,folgeDs).forEach(t=>push(null,
    Object.assign({},t,{cat:'lueckeM',ico:'📅',ds:folgeDs})));

  // 1) Abrechnen — aus dem Reiter "Offene Rezepte", dieselben Zeilen, dieselbe
  //    Definition. Was dort rot ist, ist hier eine Handlung.
  //    Aber erst ab ABR_REIFE Tagen: ein Rezept, das vorgestern fertig wurde,
  //    laeuft ohnehin durch die naechste Abrechnung. Als Aufgabe taugt nur, was
  //    liegengeblieben ist. Der Reiter "Offene Rezepte" zeigt weiter alles.
  (offenTV||[]).filter(o=>loc&&o.standort===loc.label&&(o.kat==='fertig'||o.kat==='rgOffen')
      &&o.daysAgo!=null&&o.daysAgo>=ABR_REIFE)
    .forEach(o=>push(o.pid,{id:aufIdRezept(o),cat:'abr',ico:'💰',
      txt:o.kat==='rgOffen'?'Rechnung nachfassen':'Rezept abrechnen',
      sub:(o.heilmittel||o.formular||'')+' · '+o.gel+'/'+o.kann
         +(o.daysAgo!=null?' · seit '+o.daysAgo+' Tagen':''),
      name:o.patient}));

  // 2) Folge-VO anfordern.
  //    Aufgabe wird nur, wo der Verordnungsfall laut Katalog noch etwas
  //    hergibt — oder wo ein Termin steht, obwohl das Rezept durch ist. Ein
  //    ausgeschoepfter Fall ist keine Aufgabe, sondern ein Abschluss; er steht
  //    weiter im Reiter, aber nicht in der Tagesliste. Ohne Diagnosegruppe
  //    (Privat-/BG-Formulare) laesst sich nichts rechnen, die bleiben drin.
  //    Dauerpatienten stehen hier nicht: ihr Anschlussrezept laeuft ohnehin mit.
  //    Der Schalter im Reiter „Folge-VO" holt sie zurueck, auch hier.
  const fvAlle=buildFolgeVO(locId).filter(f=>f.dringend||f.weg!=='ausgeschoepft');
  if(!zeigeDauer)dauerAus+=fvAlle.filter(f=>f.dauer).length;
  fvAlle.filter(f=>zeigeDauer||!f.dauer)
    .forEach(f=>push(f.pid,{id:f.id,cat:'fvo',ico:'📄',
      txt:'Folge-VO anfordern',sub:f.sub,name:f.name}));

  // 2b) Rezept-Ende ansprechen — der Patient hat an DIESEM Tag seinen letzten
  //     oder vorletzten Rezept-Termin, und danach steht noch nichts. Die
  //     Rechnung braucht den Terminplan des Tages; den gibt es nur für die
  //     Tage, deren Datum wirklich im heute-/morgen-Export steht — für t2..t13
  //     bleibt die Kategorie leer, statt falsche Tage unterzuschieben.
  if(ds&&loc){
    const dd=DATA[loc.suf]||{};
    let reKey=null;
    ['heute','morgen'].forEach(k=>{
      const d=dd[k];if(reKey||!d||!Array.isArray(d.tp)||!d.tp.length)return;
      if(String(d.tp[0].Beginn||'').slice(0,10)===ds)reKey=k;
    });
    if(reKey){
      getRezEndePatients(locId,reKey).filter(r=>!r.folge).forEach(r=>push(r.pid,{
        // Rezept-Id gehoert in die Aufgaben-Id: zwei gleichzeitig endende
        // Rezepte desselben Patienten (KG + MLD) sind zwei Haken, nicht einer.
        id:'rezende|'+locId+'|'+ds+'|'+r.pid+'|'+(r.vid!=null?r.vid:''),cat:'rezende',ico:'🎯',
        txt:(r.position==='letzter'?'Letzter':'Vorletzter')+' Rezept-Termin — Folgetermin klären',
        sub:r.timeStr+' Uhr · '+(r.heilmittel||'')+' · '+r.positionNum+'/'+r.totalY
           +(r.therapeut&&r.therapeut!=='—'?' · '+r.therapeut:''),
        name:r.name}));
    }
  }

  // 3) Rezept fertig verplanen — die Verordnung erlaubt mehr Einheiten, als
  //    erbracht und gebucht zusammen ergeben. Gezeigt nur an dem Tag, an dem der
  //    Patient ohnehin im Terminplan steht: dann kostet das Terminieren nichts
  //    ausser einem Satz am Empfang. Wer nicht da ist, waere ein Telefonat und
  //    steht deshalb nicht in der Tagesliste.
  const daPids=tzPidsAmTag(locId,ds);
  const vpRoh=buildVerplanung(locId);
  const vpAlle=vpRoh.filter(r=>daPids.has(String(r.pid)));
  if(!zeigeDauer)dauerAus+=vpAlle.filter(r=>r.dauer).length;
  if(!zeigeHb)hbAus+=vpAlle.filter(r=>r.hb&&(zeigeDauer||!r.dauer)).length;
  vpAlle.filter(r=>(zeigeDauer||!r.dauer)&&(zeigeHb||!r.hb))
    .forEach(r=>push(r.pid,{id:'vpl|'+r.pid,cat:'verplan',ico:'🗓️',
      txt:VP_ZUST[r.zust].l==='Steckengeblieben'?'Rezept steckt — Rest verplanen'
         :'Rezept fertig verplanen',
      sub:vpSub(r),name:r.name}));

  // 3b) Dieselbe Rechnung für alle ANDEREN — die, die heute nicht in der
  //     Praxis stehen. Bis hierher stand die Verplanung nur für den Bruchteil
  //     in der Tagesliste, der an genau diesem Tag ohnehin kam: heute 10 von
  //     106 Patienten. Die übrigen 96 standen allein im Reiter „Verplanung" und
  //     damit in keiner Aufgabenliste, in keinem Pensum und in keiner
  //     Zuständigkeit.
  //
  //     Alle drei Zustände kommen mit, auch „nicht zu Ende verplant". Deren
  //     Zukunftstermin liegt oft Wochen entfernt, und bis dahin verfällt nichts
  //     — aber die Restmenge muss trotzdem irgendwann gelegt werden, und am
  //     Telefon geht es heute. Doppelt gezählt wird nichts: Wer heute da ist,
  //     steht unter 3) und hier nicht; die beiden Mengen schließen sich aus.
  //     Welcher Zustand es ist, steht an jeder Zeile.
  //
  //     Nur am Tag des Exports. Es ist ein stehender Rückstand und keine
  //     Tagesarbeit; auf jedem durchgeklickten Tag erneut gezählt wäre es
  //     dieselbe Liste mit immer neuem Pensum.
  const heuteDs=(VOD[locId]&&VOD[locId].heuteDs)||isoDay(0);
  if(ds===heuteDs){
    const vpOhne=vpRoh.filter(r=>!daPids.has(String(r.pid)));
    if(!zeigeDauer)dauerAus+=vpOhne.filter(r=>r.dauer).length;
    if(!zeigeHb)hbAus+=vpOhne.filter(r=>r.hb&&(zeigeDauer||!r.dauer)).length;
    vpOhne.filter(r=>(zeigeDauer||!r.dauer)&&(zeigeHb||!r.hb))
      .forEach(r=>push(r.pid,{id:'vplo|'+r.pid,cat:'vplOhne',ico:'☎️',
        txt:r.zust==='steck'?'Rezept steckt — anrufen und Rest legen'
           :r.zust==='neu'?'Rezept ohne Termin — anrufen und verplanen'
           :'Restmenge noch nicht gelegt — anrufen',
        sub:VP_ZUST[r.zust].kurz+' · '+vpSub(r),name:r.name}));
  }

  // 4) Folgetermin — Rezept läuft noch, es sind aber nur noch wenige Einheiten
  //    offen. Ist gar nichts mehr offen, ist es kein Termin- sondern ein
  //    Rezeptthema und steht schon unter Folge-VO.
  (b.folge||[]).filter(r=>(r.gep||0)>0).forEach(r=>push(r.pid,{id:'ft|'+(r.pid||r.name),cat:'ft',ico:'📞',
    txt:'Folgetermin vereinbaren',
    sub:'Noch '+r.gep+' Einheiten'+(r.icd?' · '+r.icd:''),name:r.name}));

  // 4) Dauerplan anbieten — der Patient kommt an diesem Tag, seine
  //    Behandlungsart trägt einen festen Platz (LHB, BVB, Blanko, Privat,
  //    MLD 45/60, KG-ZNS, Hausbesuch), und er läuft noch in keinem Rhythmus.
  //    Genau dann ist das Gespräch am billigsten: er steht ohnehin vor einem.
  //    Wer schon Dauerpatient ist, hat den festen Platz bereits — er faellt raus.
  const dpAlle=dauerFuerTag(locId,ds,true);
  if(!zeigeDauer)dauerAus+=dpAlle.filter(r=>r.dauer).length;
  dpAlle.filter(r=>zeigeDauer||!r.dauer).forEach(r=>push(r.pid,{id:'dplan|'+r.pid,cat:'dauer',ico:'📌',
    txt:'Dauerplan anbieten',
    sub:r.gr.map(g=>g.k).join(' · ')+' · noch kein fester Takt',name:r.name}));

  // 5) Blanko-Potenzial — eine Frage des Formulars: die Diagnose ließe eine
  //    Blankoverordnung zu, das Rezept ist aber ein normales Muster 13.
  (b.blankopot||[]).forEach(r=>push(r.pid,{id:'blanko|'+r.pid,cat:'blankopot',ico:'💎',
    txt:'Blanko-Potenzial ansprechen',
    sub:(r.icd||'')+' · läuft auf Standard-Formular',name:r.name}));

  return{byPid,alle,dauerAus,hbAus};
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB: TAGESZIEL

// Tagesliste für die Navigation. thevea liefert einen festen Satz Tagesdateien
// (heute, morgen, t2..t13); zusammengeworfen und nach Datum gruppiert ergibt
// das den blätterbaren Vorausblick. Gruppiert wird nach dem Datum im Termin
// selbst, nicht nach dem Dateinamen — dann stimmt es auch, wenn der Flow einen
// Tag verschiebt oder eine Datei zwei Tage enthält.
// „Alle" führt Physio und Ergo zusammen. Das Backoffice ist für beide zuständig
// und soll auf einen Blick sehen, was offen ist, statt zwischen zwei Reitern hin
// und her zu wechseln und dabei die Hälfte zu vergessen.
const TZ_ALLE='alle';
function tzLocIds(){return tzLoc===TZ_ALLE?LOCS.map(l=>l.id):[tzLoc];}
function tzLocLabel(){
  if(tzLoc!==TZ_ALLE)return(LOCS.find(l=>l.id===tzLoc)||LOCS[0]).label;
  return'Alle Standorte';
}
// Kurzform für die Zeile: in der zusammengeführten Ansicht stünden sonst zwei
// gleich aussehende Aufgaben nebeneinander, ohne dass man sieht, wohin sie gehören.
function tzLocKurz(id){
  const l=LOCS.find(x=>x.id===id);if(!l)return id;
  return l.label.replace(/^Werneck\s+/,'');
}

function tzTage(locId){
  // Zusammengeführt: derselbe Kalendertag kann an den Standorten verschiedene
  // Tagesdateien haben (heute/morgen). Deshalb merkt sich der Tag pro Standort,
  // aus welcher er stammt — sonst holt buildTasks den falschen Bestand.
  if(locId===TZ_ALLE){
    const proTag={};
    LOCS.forEach(l=>tzTage(l.id).forEach(t=>{
      const e=proTag[t.ds]||(proTag[t.ds]={ds:t.ds,tp:[],sub:t.sub,subs:{}});
      e.tp=e.tp.concat(t.tp);e.subs[l.id]=t.sub;
      if(t.sub==='heute')e.sub='heute';
    }));
    return Object.keys(proTag).sort().map(ds=>proTag[ds]);
  }
  const loc=LOCS.find(l=>l.id===locId);if(!loc)return[];
  const dd=DATA[loc.suf];if(!dd)return[];
  const proTag={};
  const add=tp=>{(Array.isArray(tp)?tp.flat():[]).forEach(t=>{
    if(!t||!t.Beginn)return;const ds=String(t.Beginn).slice(0,10);if(!ds)return;
    (proTag[ds]=proTag[ds]||[]).push(t);});};
  add(dd.heute&&dd.heute.tp);add(dd.morgen&&dd.morgen.tp);
  (dd.extraDays||[]).forEach(add);
  const heuteDs=(VOD[locId]&&VOD[locId].heuteDs)||isoDay(0);
  return Object.keys(proTag).sort().map(ds=>{const sub=ds===heuteDs?'heute':'morgen';
    return{ds,tp:proTag[ds],sub,subs:{[locId]:sub}};});
}

// Der Tagesbestand für die gewählten Standorte. Bei einem Standort ist das
// unverändert buildTasks; bei „Alle" werden die Listen aneinandergehängt und
// jede Aufgabe trägt ihren Standort mit.
// Die Kurzschlüssel ALLER Aufgaben des Tages — ohne die Anzeige-Schalter.
// Genau so baut kennAufgaben das Pensum; nur wenn beide Seiten dieselbe Liste
// meinen, ist die Differenz eine Aussage.
function aufAlleKurz(tag){
  const d=zeigeDauer,h=zeigeHb;
  try{zeigeDauer=true;zeigeHb=true;return tzBuildTasks(tag).alle.map(t=>aufKurz(t.id));}
  catch(e){return[];}
  finally{zeigeDauer=d;zeigeHb=h;}
}
function tzBuildTasks(tag){
  const ids=tzLocIds();
  if(ids.length===1)return buildTasks(ids[0],tag?tag.sub:'heute',tag?tag.ds:null);
  const byPid={},alle=[];let dauerAus=0,hbAus=0;
  ids.forEach(id=>{
    const sub=(tag&&tag.subs&&tag.subs[id])||'heute';
    const T=buildTasks(id,sub,tag?tag.ds:null);
    dauerAus+=T.dauerAus;hbAus+=T.hbAus;
    const kurz=tzLocKurz(id);
    T.alle.forEach(t=>{t.loc=id;t.locL=kurz;alle.push(t);
      if(t.pid)(byPid[t.pid]=byPid[t.pid]||[]).push(t);});
  });
  return{byPid,alle,dauerAus,hbAus};
}
function tzLabel(ds){
  const d=new Date(ds+'T12:00:00');if(isNaN(d))return ds;
  const heute=new Date();heute.setHours(12,0,0,0);
  const diff=Math.round((d-heute)/864e5);
  const wt=d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit'});
  return(diff===0?'Heute · ':diff===1?'Morgen · ':'')+wt;
}
function tzNav(d){const tage=tzTage(tzLoc);tzDay=Math.max(0,Math.min(Math.max(0,tage.length-1),tzDay+d));renderAufgaben();}
function tzSetLoc(id){
  tzLoc=(id===TZ_ALLE||LOCS.some(l=>l.id===id))?id:LOCS[0].id;
  lsSet('kimojo_tzloc',tzLoc);tzDay=null;renderAufgaben();
}
function setTzMode(m){tzMode=(m==='kalender'?'kalender':'liste');lsSet('kimojo_tzmode',tzMode);renderAufgaben();}
function tzModeToggle(){
  return'<div class="tz-modebar">'
    +'<button class="tz-mode'+(tzMode==='liste'?' a':'')+'" onclick="setTzMode(\'liste\')">📋 Aufgabenliste</button>'
    +'<button class="tz-mode'+(tzMode==='kalender'?' a':'')+'" onclick="setTzMode(\'kalender\')">📅 Tagesplan</button></div>';
}
function renderTzLocTabs(){
  const el=document.getElementById('tzLocTabs');if(!el)return;
  let h='<button class="tab'+(tzLoc===TZ_ALLE?' a':'')+'" onclick="tzSetLoc(\''+TZ_ALLE+'\')"'
    +' title="Physio und Ergo in einer Liste — für alle, die beide betreuen">Alle</button>';
  LOCS.forEach(l=>{h+='<button class="tab'+(tzLoc===l.id?' a':'')+'" onclick="tzSetLoc(\''+l.id+'\')">'+esc(l.label)+'</button>';});
  el.innerHTML=h;
}

// Ein- und Ausklappen der Kategorieblöcke. Standard ist zugeklappt: die Leiste
// aus Kategorieköpfen ist die eigentliche Tagesübersicht, die Einzelzeilen holt
// man sich bei Bedarf dazu.
function secOpen(key){return lsGet('kimojo_secopen_'+key,false);}
function toggleSec(key){lsSet('kimojo_secopen_'+key,!secOpen(key));renderAufgaben();}

// Datumsnavigator im Kopf des Reiters: gilt für Aufgabenliste UND Tagesplan,
// weil beide Ansichten denselben Tagesbestand zeigen.
// Die Auswahl führt entweder auf einen Terminplantag (Index) oder in den
// Rückblick („r:2026-10-07"). Zwei Ziele in einem Menü, weil es für den Empfang
// ein Gedanke ist: „welcher Tag?"
function tzSetDay(i){
  const v=String(i||'');
  if(v.slice(0,2)==='r:')return tzSetRueck(v.slice(2));
  const tage=tzTage(tzLoc);
  tzDay=Math.max(0,Math.min(Math.max(0,tage.length-1),parseInt(v,10)||0));
  renderAufgaben();
}
// Freie Minuten und Luecken je Tag. Dieselbe Rechnung wie im Luecken-Reiter
// (analyzeDay), nur zusammengefasst — damit das Tagesziel dieselben Zahlen
// nennt und nicht eine zweite Wahrheit aufmacht. Gerechnet wird nur fuer die
// ein bis zwei Tage, fuer die es einen Terminplan-Export gibt.
const _tzLueckeCache={};
function tzLueckeInfo(locId,ds){
  const k=locId+'|'+ds;
  if(k in _tzLueckeCache)return _tzLueckeCache[k];
  let r=null;
  try{
    const loc=LOCS.find(l=>l.id===locId),dd=loc?DATA[loc.suf]:null;
    if(loc&&dd){
      let bucket=null;
      ['heute','morgen'].forEach(n=>{
        const d=dd[n];if(bucket||!d||!d.tp||!d.az||!d.az.length)return;
        const flat=Array.isArray(d.tp)?d.tp.flat():[];
        if(flat.length&&String(flat[0].Beginn||'').slice(0,10)===ds)bucket=d;
      });
      if(bucket){
        const f=filterTP(bucket.tp,bucket.az,loc.filter);
        const I=analyzeDay(f.tp,f.az);
        r={min:Math.round(I.tgm||0),slots:I.ps||0,th:I.twg||0,ausl:I.aA||0,
           n:(I.act||[]).reduce((a,t)=>a+((t.gaps||[]).length),0)};
      }
    }
  }catch(e){r=null;}
  _tzLueckeCache[k]=r;return r;
}

function tzDateNav(tage,idx){
  if(!tage.length)return'';
  // Jeder Tag traegt seine freien Minuten mit. Sonst muesste man jeden Tag
  // einzeln anklicken, um zu sehen, wo ueberhaupt eine Luecke ist.
  // Bei „Alle" werden die freien Minuten der Standorte addiert — es ist eine
  // Liste, also auch eine Zahl.
  const mm=t=>{
    const info=tzLocIds().map(id=>tzLueckeInfo(id,t.ds)).filter(Boolean);
    if(!info.length)return'';
    const min=info.reduce((s,I)=>s+I.min,0);
    return min>0?' · '+min+' min frei':' · voll';
  };
  // Vergangene Tage stehen mit in der Auswahl, als eigene Gruppe. Sie führen
  // in den Rückblick: Eine Aufgabenliste gibt es dort nicht mehr, die Zahlen
  // des Tages schon.
  const frueher=kennTageMitAufgaben().filter(d=>d<tage[0].ds);
  let opts='';
  if(frueher.length){
    opts+='<optgroup label="Rückblick">';
    frueher.forEach(d=>{opts+='<option value="r:'+esc(d)+'">'+esc(tzLabel(d))+'</option>';});
    opts+='</optgroup><optgroup label="Terminplan">';
  }
  tage.forEach((t,i)=>{opts+='<option value="'+i+'"'+(i===idx?' selected':'')+'>'+esc(tzLabel(t.ds)+mm(t))+'</option>';});
  if(frueher.length)opts+='</optgroup>';
  // Am ersten Tag führt „‹" nicht ins Leere, sondern in den Rückblick.
  const zurueck=idx<=0&&frueher.length?'tzSetRueck(\''+jsq(frueher[0])+'\')':'tzNav(-1)';
  return'<div class="datenav">'
    +'<button class="dn-btn" onclick="'+zurueck+'"'+(idx<=0&&!frueher.length?' disabled':'')
    +' title="'+escA(idx<=0&&frueher.length?'Zurück zu '+tzLabel(frueher[0]):'Ein Tag zurück')+'">‹</button>'
    +'<div class="dn-center"><div class="dn-lbl">'+esc(tzLabel(tage[idx].ds)+mm(tage[idx]))+'</div>'
    +'<select class="dn-sel" onchange="tzSetDay(this.value)">'+opts+'</select></div>'
    +'<button class="dn-btn" onclick="tzNav(1)"'+(idx>=tage.length-1?' disabled':'')+'>›</button>'
    +'<div class="dn-count">Tag '+(idx+1)+' / '+tage.length+'</div></div>';
}

// ── Rückblick auf einen vergangenen Tag ────────────────────────────────────
// Der Terminplan schaut nur nach vorn, eine Aufgabenliste von gestern gibt es
// deshalb nicht mehr. Die ZAHLEN des Tages liegen aber in der Kennzahlendatei,
// und zwar vollständig: Pensum, Abgehaktes, Entfallenes je Kategorie und je
// Person. Das ist der Rückblick — keine Liste, sondern was an dem Tag war.
//
// Einzelne Patientennamen stehen nicht darin. Die Schlüsselliste des Pensums
// wird für vergangene Tage bewusst gelöscht; sie allein ist zwanzig Kilobyte
// am Tag, der Rest zusammen acht.
let tzRueck=null;
function tzSetRueck(ds){tzRueck=ds||null;renderAufgaben();}
function renderRueckblick(ds){
  const t=kennTagAus(ds),a=(t&&t.auf)||null,st=(a&&a.stand)||null;
  let h='<div class="summary"><h2>🗓️ Rückblick · '+esc(tzLabel(ds))+'</h2>'
    +'<div class="tz-lead">Dieselbe Ansicht wie heute, nur für einen vergangenen Tag. '
    +'Die Aufgaben kommen aus der Tagesdatei, Status und Notizen aus dem Protokoll — '
    +'du siehst also auch, was jemand damals entschieden und dazugeschrieben hat.</div></div>';
  h+=tzRueckNav(ds);
  if(!t){
    h+='<div class="empty" style="line-height:1.7">Für diesen Tag liegen keine Zahlen vor.<br>'
      +'<span style="font-size:12px">Die Reihe beginnt an dem Tag, an dem das Tagespensum in '
      +'Betrieb ging. Sie wächst nur vorwärts — rückwirkend lässt sie sich nicht füllen.</span></div>';
    h+='<div class="ft">KIMOJO · <b>Rückblick</b> Werneck</div>';
    document.getElementById('mc').innerHTML=h;return;
  }
  if(!st){
    h+='<div class="empty" style="line-height:1.7">An diesem Tag wurden nur Telefoniezahlen erfasst.<br>'
      +'<span style="font-size:12px">Aufgabenzahlen entstehen nur, während der Patientenchecker offen ist.</span></div>';
  }else{
    const abg=(st.fertig||0)+(st.abgelehnt||0),ent=st.entfallen||0;
    h+='<div class="sg" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">'
      +'<div class="si"><div class="si-l">📋 Tagespensum</div><div class="si-v">'+(st.pensum||0)+'</div>'
        +'<div class="si-s">lag an diesem Tag an</div></div>'
      +'<div class="si"><div class="si-l">✅ Abgehakt</div><div class="si-v">'+abg+'</div>'
        +'<div class="si-s">jemand hat entschieden</div></div>'
      +'<div class="si"><div class="si-l">🏁 Ohne Haken</div><div class="si-v">'+ent+'</div>'
        +'<div class="si-s">durch Erledigen der Ursache</div></div>'
      +'<div class="si"><div class="si-l">📭 Blieb liegen</div><div class="si-v">'+(st.rest||0)+'</div>'
        +'<div class="si-s">am Abend noch offen</div></div>'
      +'</div>';
    if(st.unsicher)h+='<div class="auf-zustand auf-zustand-fehler" style="margin-bottom:14px">'
      +'An diesem Tag fehlten Standortdaten. „Ohne Haken" steht deshalb zu niedrig, nicht zu hoch.</div>';
  }
  // ── Die Liste selbst ────────────────────────────────────────────────────
  // Dieselbe Ansicht wie heute, nicht eine Zahlentabelle daneben. Die Aufgaben
  // kommen aus der Tagesdatei, Status und Notizen aus dem Protokoll — das ist
  // dieselbe Quelle, aus der auch das Tagesziel liest.
  const roh=tzlCache[ds];
  if(roh===undefined){
    h+='<div class="empty">Aufgabenliste wird geladen…</div>';
  }else if(roh===false){
    h+='<div class="empty" style="line-height:1.7">Für diesen Tag wurde die Liste noch nicht mitgeschrieben.<br>'
      +'<span style="font-size:12px">Die Zahlen oben stehen trotzdem. Ab dem 09.10.2026 wird jeden Tag '
      +'auch die Liste gespeichert.</span></div>';
  }else{
    // Gefiltert wie heute: Bereich, Standort und die beiden Schalter gelten
    // auch rückwärts. Sonst sähe derselbe Tag in zwei Reitern verschieden aus.
    let liste=roh.filter(t=>tzArea==='alle'||effectiveArea(t.id,t.cat)===tzArea);
    if(tzLoc!==TZ_ALLE)liste=liste.filter(t=>!t.loc||t.loc===tzLoc);
    const me=getMe();
    if(tzOnlyMine&&me)liste=liste.filter(t=>istMeine(t.id,t.cat,me));
    h+='<div class="st" style="cursor:default">📋 Die Liste dieses Tages · '+liste.length+'</div>';
    h+=tzListe(liste,ds);
  }
  // Auslastung und Telefonie des Tages stehen ohnehin in der Datei.
  const locs=t.loc||{};
  const lk=Object.keys(locs);
  if(lk.length){
    h+='<div class="st" style="cursor:default">🏥 Standorte an diesem Tag</div>';
    h+='<div class="vl-card"><table class="data-t"><thead><tr><th>Standort</th>'
      +'<th class="r">Auslastung</th><th class="r">bereinigt</th><th class="r">Lücken</th>'
      +'<th class="r">freie Zeit</th></tr></thead><tbody>';
    lk.forEach(k=>{const L=locs[k],d=(L&&L.heute)||{};
      h+='<tr><td>'+esc((L&&L.label)||k)+'</td>'
        +'<td class="r">'+(d.ausl!=null?d.ausl+' %':'–')+'</td>'
        +'<td class="r">'+(d.auslB!=null?d.auslB+' %':'–')+'</td>'
        +'<td class="r">'+(d.luecken!=null?d.luecken:'–')+'</td>'
        +'<td class="r">'+(d.freiMin!=null?Math.round(d.freiMin/6)/10+' h':'–')+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  if(t.tel&&t.tel.anrufe){
    h+='<div class="st" style="cursor:default">📞 Telefonie an diesem Tag</div>';

      +'<div class="si"><div class="si-l">Anrufe</div><div class="si-v">'+t.tel.anrufe+'</div></div>'
      +'<div class="si"><div class="si-l">Annahmequote</div><div class="si-v">'
        +(t.tel.quote!=null?t.tel.quote+' %':'–')+'</div></div>'
      +'<div class="si"><div class="si-l">Verloren</div><div class="si-v">'+(t.tel.verloren||0)+'</div></div>'
      +'</div>';
  }

}
