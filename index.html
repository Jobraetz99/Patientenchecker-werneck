<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxismanagement · KIMOJO Werneck</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root{
  /* ─────────────────────────────────────────────────────────────────
     Farbsystem Werneck — eine zusammenhängende, warme Palette.
     Alle Signalfarben liegen bewusst im selben Helligkeits- und
     Sättigungsbereich wie das KIMOJO-Rot, damit nebeneinander nichts
     herausschreit. Jede Farbe hat einen Volltonwert (Text/Linien) und
     einen sehr hellen Flächenwert (-bg) als deckendes Hex, nicht als
     Transparenz — das bleibt auf jedem Untergrund gleich ruhig.
     ───────────────────────────────────────────────────────────────── */
  --primary:#BE3A30;--primary-bg:#FCF2F1;--primary-hover:#9E2C24;
  --accent:#A4522F;--accent-bg:#FBF3EF;--accent-hover:#8A4326;
  --amber:#8A5F13;--amber-bg:#FAF4E8;
  --green:#3D7A5D;--green-bg:#EFF6F2;
  --teal:#2E767C;--teal-bg:#EDF4F5;
  --blue:#3C5A80;--blue-bg:#EFF2F7;
  --purple:#5D5289;--purple-bg:#F2F1F8;
  --fire:#BE3A30;--fire-bg:#FCF2F1;
  --red:#BE3A30;--red-bg:#FCF2F1;--red-hover:#9E2C24;
  --ergo:#A4522F;--ergo-bg:#FBF3EF;

  /* Neutrale Skala — trägt die Fläche, Farbe bleibt Signal */
  --dark:#111114;--muted:#5A5A63;--faint:#70707A;
  --bg:#F7F7F8;--card:#FFFFFF;--border:#E7E7EA;--hairline:#F1F1F3;--sunken:#FAFAFB;

  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(17,17,20,.04);
  --shadow-lg:0 6px 20px rgba(17,17,20,.07)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:'cv05','ss01'}

/* Main Dashboard */
#db{display:none;padding:28px 24px 40px}
.mx{max-width:1180px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.hdr h1{font-family:'Inter',sans-serif;font-size:19px;font-weight:650;letter-spacing:-.021em;color:var(--dark)}
.hdr h1 span{color:var(--primary)}
.hdr h1 .acc{color:var(--accent)}
.hdr-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hdr-btn{padding:6px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .13s}
.hdr-btn:hover{border-color:var(--faint);color:var(--dark);background:var(--sunken)}
.demo-badge{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:100px;font-family:'Inter',sans-serif;font-size:11px;font-weight:550;letter-spacing:.01em}

/* Hauptnavigation — Segment-Leiste statt bunter Pillen */
.main-tabs{display:flex;gap:2px;margin-bottom:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px}
.m-tab{padding:7px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:550;cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:6px;letter-spacing:-.005em}
.m-tab:hover{background:var(--sunken);color:var(--dark)}
.m-tab.a{background:var(--primary-bg);color:var(--primary);font-weight:600}

/* Unterreiter (Standorte, Tage) */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.tab{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .13s;white-space:nowrap}
.tab:hover{border-color:var(--faint);color:var(--dark)}
.tab.a{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:600}

/* Seitenkopf — ruhige Typografie auf der Seitenfläche, keine Farbfläche.
   Dadurch ist der Fließtext immer dunkel auf hell und bleibt lesbar. */
.summary{margin-bottom:20px}
.summary h2{font-family:'Inter',sans-serif;font-size:21px;font-weight:650;letter-spacing:-.022em;text-transform:none;color:var(--dark);margin-bottom:5px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.si{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 15px}
.si-l{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.01em}
.si-v{font-family:'Inter',sans-serif;font-size:25px;font-weight:650;line-height:1.1;color:var(--dark);letter-spacing:-.028em;font-feature-settings:'tnum'}
.si-s{font-size:11px;color:var(--faint);margin-top:3px}

/* Abschnittsüberschrift */
.st{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--dark);margin:26px 0 12px;letter-spacing:-.012em;display:flex;align-items:center;gap:7px}
.st .sub{font-size:12px;color:var(--muted);font-weight:450;margin-left:6px}

/* Lücken-Karten */
.ac{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--card);border-radius:10px;border:1px solid var(--border);border-left:3px solid var(--primary);margin-bottom:6px;cursor:pointer;transition:all .13s}
.ac:hover{border-color:var(--faint);border-left-color:var(--primary);background:var(--sunken)}
.ac-b{flex:1;min-width:0}
/* Eine Lücke ist eine Aufgabe: Status und Zuständigkeit stehen hier genauso wie
   im Tagesziel. Die Zeile wird dadurch hoch, deshalb oben ausgerichtet. */
.ac .task-meta{justify-content:flex-start;margin-top:7px}
.ac.st-arbeit{border-left-color:var(--amber)}
.ac.st-fertig{border-left-color:var(--green)}
.ac.st-abgelehnt{border-left-color:var(--faint)}
.ac.ac-done{background:var(--sunken)}
.ac.ac-done .ac-t{text-decoration:line-through;color:var(--muted)}
.ac-t{font-family:'Inter',sans-serif;font-size:13px;font-weight:550;color:var(--dark)}
.ac-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.ac-p{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-bg);color:var(--accent);flex-shrink:0}

/* Therapeut-Karten */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.tc-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:all .13s}
.tc-card:hover{border-color:var(--faint)}
.tc-card.hg{border-left:3px solid var(--accent)}
.tc-card.fu{border-left:3px solid var(--green)}
.tt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:8px}
.tn{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;letter-spacing:-.012em}
.tb{padding:2px 8px;border-radius:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:550}
.bf{background:var(--green-bg);color:var(--green)}
.bg{background:var(--accent-bg);color:var(--accent)}
.tm{display:flex;gap:12px;padding:0 16px 6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.tm b{color:var(--dark);font-family:'Inter',sans-serif;font-weight:600}
.tw{padding:0 16px 8px}
.tb2{height:22px;background:var(--hairline);border-radius:6px;display:flex;overflow:hidden}
.ts{height:100%;min-width:1px}
.ts.sp{background:var(--green)}
.ts.sg2{background:var(--accent);opacity:.35}
.ts.sother{background:repeating-linear-gradient(45deg,#DCDCE0 0,#DCDCE0 4px,#EDEDF0 4px,#EDEDF0 8px)}
.ts.so{background:var(--hairline)}
.tll{display:flex;justify-content:space-between;margin-top:3px;font-size:10.5px;color:var(--faint);font-family:'Inter',sans-serif;font-weight:500}
.gl{padding:0 16px 10px}
.gr{display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--sunken);border:1px solid var(--hairline);border-radius:6px;margin-bottom:4px;font-size:12px}
.gt{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--accent);min-width:92px;font-feature-settings:'tnum'}
.gp{font-family:'Inter',sans-serif;font-weight:550;font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--accent-bg);color:var(--accent)}
.gn{font-size:11px;color:var(--muted)}
.aw{padding:0 16px 12px}
.ab{height:5px;background:var(--hairline);border-radius:100px;overflow:hidden}
.af{height:100%;border-radius:100px;transition:width .5s ease}
.ai{display:flex;justify-content:space-between;margin-top:3px;font-size:10.5px;color:var(--faint);font-family:'Inter',sans-serif;font-weight:500}

/* Suche & Umschalter */
.search-wrap{margin-bottom:14px;position:relative}
.search-wrap input{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;outline:none;background:var(--card);color:var(--dark);transition:border .13s}
.search-wrap input:focus{border-color:var(--faint);box-shadow:0 0 0 3px var(--hairline)}
.dauer-toggle{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:'Inter',sans-serif;font-weight:550;font-size:12.5px;color:var(--muted);user-select:none;transition:all .13s}
.dauer-toggle:hover{border-color:var(--faint);color:var(--dark)}
.dauer-toggle.show{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.dauer-toggle .dt-ico{font-size:13px}
.dauer-toggle .dt-cnt{background:var(--hairline);color:var(--muted);border-radius:5px;padding:0 7px;font-size:11.5px;font-weight:600}
.dauer-toggle.show .dt-cnt{background:var(--primary);color:#fff}
.cat-chip{display:inline-block;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:550;font-family:'Inter',sans-serif;margin-right:4px;margin-bottom:2px;background:var(--sunken);color:var(--muted)}
.lf-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.focus-banner{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;font-size:13px;line-height:1.55;color:var(--dark)}
.focus-banner .fb-dauer{color:var(--muted);font-size:12.5px}

/* Wochenreport-Tabelle */
.wr-scroll{overflow-x:auto;margin-bottom:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.wr-tab{border-collapse:collapse;width:100%;font-size:12.5px}
.wr-tab th,.wr-tab td{padding:9px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--hairline)}
.wr-tab thead th{background:var(--sunken);font-family:'Inter',sans-serif;font-weight:550;font-size:11px;color:var(--muted);position:sticky;top:0;letter-spacing:.01em}
.wr-tab .wr-name{text-align:left;font-weight:550;color:var(--dark);position:sticky;left:0;background:var(--card);z-index:1}
.wr-tab thead .wr-name{background:var(--sunken)}
.wr-cell.wr-empty{color:var(--faint)}

/* 90-Tage Ampel */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:20px}
.fc-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.fc-kw{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--dark)}
.fc-amp{font-size:19px;line-height:1;margin:5px 0}
.fc-rate{font-family:'Inter',sans-serif;font-weight:650;font-size:18px;letter-spacing:-.02em;font-feature-settings:'tnum'}
.fc-det{font-size:11px;color:var(--muted);margin-top:2px}
.lf-head{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--dark);margin-bottom:8px}
.lf-ta{width:100%;min-height:56px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--dark);background:var(--card);outline:none;resize:vertical;box-sizing:border-box}
.lf-ta:focus{border-color:var(--faint);box-shadow:0 0 0 3px var(--hairline)}
.lf-hint{font-size:11px;color:var(--faint);margin-top:6px}

/* Rezept-KPIs */
.rkpis{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
.rkpi{background:var(--card);border-radius:10px;padding:12px 13px;border:1px solid var(--border);cursor:pointer;transition:all .13s}
.rkpi:hover{border-color:var(--faint);background:var(--sunken)}
.rkpi.active{border-color:var(--primary);background:var(--primary-bg)}
.rkpi-l{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkpi-v{font-family:'Inter',sans-serif;font-size:21px;font-weight:650;line-height:1.1;letter-spacing:-.025em;font-feature-settings:'tnum'}
.rkpi-s{font-size:10.5px;color:var(--faint);margin-top:1px}

/* Filterknöpfe */
.nr-filters{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.nr-filter{padding:4px 11px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .13s}
.nr-filter:hover{border-color:var(--faint);color:var(--dark)}
.nr-filter.a{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}

/* Patientenzeilen */
.pr{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:11px 13px;margin-bottom:5px;display:flex;align-items:center;gap:11px;transition:all .13s}
.pr:hover{border-color:var(--faint);background:var(--sunken)}
.pr-i{flex:1;min-width:0}
.pr-n{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--dark);letter-spacing:-.01em}
.pr-d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.pr-d b{font-weight:550;color:var(--dark)}
.pr-bs{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:140px;flex-shrink:0}
.pr-b{display:inline-block;padding:1px 7px;border-radius:5px;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:550}
.c-purple{background:var(--purple-bg);color:var(--purple)}
.c-green{background:var(--green-bg);color:var(--green)}
.c-red{background:var(--red-bg);color:var(--red)}
.c-amber{background:var(--amber-bg);color:var(--amber)}
.c-blue{background:var(--blue-bg);color:var(--blue)}
.c-fire{background:var(--fire-bg);color:var(--fire)}
.c-accent{background:var(--accent-bg);color:var(--accent)}
.c-teal{background:var(--teal-bg);color:var(--teal)}
.pr-tel{font-size:12px;color:var(--muted);font-weight:500;text-decoration:none;padding:5px 9px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);flex-shrink:0;white-space:nowrap;transition:all .13s}
.pr-tel:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.sc{font-family:'Inter',sans-serif;font-size:15px;font-weight:650;color:var(--fire);flex-shrink:0;width:28px;text-align:center;font-feature-settings:'tnum'}
.pr-t{text-align:right;flex-shrink:0;min-width:64px}
.pr-dt{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;font-feature-settings:'tnum'}
.pr-tm{font-size:11px;color:var(--muted)}
.pr-th{font-size:10.5px;color:var(--faint)}

.d-t{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;letter-spacing:-.012em}
.d-c{font-size:14px;cursor:pointer;margin-left:auto;color:var(--faint);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.d-c:hover{background:var(--sunken);color:var(--dark)}

.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px;background:var(--card);border-radius:var(--radius);border:1px dashed var(--border)}

/* Nachrücker zur Lücke */
.gap-detail{margin:8px 0 14px;padding:14px;background:var(--sunken);border-radius:var(--radius);border:1px solid var(--border)}
.gap-detail-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gap-detail-t{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--accent)}
.nr-mini{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:5px;border:1px solid var(--border)}
.nr-mini-rank{font-family:'Inter',sans-serif;font-size:13px;font-weight:650;color:var(--faint);width:20px;text-align:center;font-feature-settings:'tnum'}
.nr-mini-body{flex:1;min-width:0}
.nr-mini-n{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600}
.nr-mini-d{font-size:11px;color:var(--muted);margin-top:1px}
.nr-mini-hint{font-size:11px;color:var(--green);margin-top:1px;font-weight:500}
.nr-mini-bs{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:110px;flex-shrink:0}
.nr-mini-score{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--accent);padding:2px 8px;background:var(--accent-bg);border-radius:5px;flex-shrink:0}
.nr-mini-tel{font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 9px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);flex-shrink:0;font-weight:500}

/* Gruppen innerhalb einer Liste */
.subgroup{margin-bottom:22px}
.subgroup-h{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:7px;letter-spacing:.02em}
.subgroup-h .cnt{font-size:11.5px;font-weight:450;color:var(--muted);letter-spacing:0}
.crit{color:var(--fire)}
.warn{color:var(--amber)}
.norm{color:var(--green)}
.miss{color:var(--accent)}
.progress-mini{height:4px;background:var(--hairline);border-radius:100px;margin-top:6px;overflow:hidden}
.progress-mini-f{height:100%;border-radius:100px}

/* Auslastung */
.ausl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:18px}
.ausl-card{background:var(--card);border-radius:var(--radius);padding:20px 22px;border:1px solid var(--border)}
.ausl-card h4{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--dark);margin-bottom:16px}

/* Aufgaben-Cockpit */
.aufg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.aufg-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .13s;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.aufg-card:hover{border-color:var(--faint);border-left-color:var(--primary);box-shadow:var(--shadow-lg)}
.aufg-card .aufg-ico{font-size:18px;line-height:1;opacity:.9}
.aufg-card .aufg-num{font-family:'Inter',sans-serif;font-size:32px;font-weight:650;line-height:1.05;letter-spacing:-.035em;font-feature-settings:'tnum'}
.aufg-card .aufg-ttl{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--dark);letter-spacing:-.01em}
.aufg-card .aufg-sub{font-size:11.5px;color:var(--muted);line-height:1.45}
.aufg-card .aufg-go{margin-top:8px;font-size:12px;font-weight:550;color:var(--primary);font-family:'Inter',sans-serif}
.aufg-card.done{border-left-color:var(--green)}
.aufg-card.done .aufg-num,.aufg-card.done .aufg-go{color:var(--green)}

.tz-wrap{background:var(--card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border);margin-bottom:18px}
/* „Heute weggearbeitet": eine Zeile je Kategorie. Die Zahl zuerst, weil sie
   die Antwort ist; darunter steht, wie sie zustande kam. */
.tz-geschafft{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tz-gz{background:var(--sunken);border-radius:12px;padding:10px 12px}
.tz-gz-n{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:22px;line-height:1.1}
.tz-gz-l{display:block;font-size:12.5px;font-weight:600;color:var(--dark);margin-top:2px}
.tz-gz-s{display:block;font-size:11px;color:var(--muted);margin-top:2px;min-height:13px}
/* „von 27" — der Nenner steht kleiner als die Zahl, die die Antwort ist. */
.tz-gz-v{font-size:13px;font-weight:500;color:var(--muted)}
/* Kopfzeile: Bereichsschalter links, Filter rechts. Bricht auf dem iPad am
   Empfang in zwei Zeilen um, statt die Knöpfe zu quetschen. */
.tz-kopfzeile{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tz-kopfzeile>.tz-modebar{margin-bottom:0}
.fsw-row{display:flex;gap:6px;flex-wrap:wrap}
.fsw{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:100px;
  padding:6px 12px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:550;cursor:pointer;
  white-space:nowrap;transition:border-color .12s,color .12s}
.fsw:hover{border-color:var(--primary);color:var(--primary)}
.fsw b{font-weight:650;color:var(--faint);margin-left:2px}
.fsw.a{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.fsw.a b{color:var(--primary)}
/* Protokollzustand. Eigene Zeile, damit eine Fehlermeldung nicht hinter dem
   zugeklappten Teamknopf verschwindet. */
.auf-zustand{font-size:11.5px;color:var(--muted);margin:-8px 0 14px}
.auf-zustand-fehler{color:var(--fire);font-weight:550}
/* Die Aufgabenleiste in der Rezepttabelle. Sie darf die Tabelle nicht
   auseinanderziehen: feste Mindestbreite, Umbruch erlaubt, Notiz darunter. */
.rz-meta{min-width:230px}
.rz-meta .task-meta{justify-content:flex-start;flex-wrap:wrap;gap:5px}
.rz-meta .nz-txt{margin-top:5px;max-width:260px}
/* Wem die automatisch erledigten zugeordnet werden. Still gehalten: Es ist
   eine Zuordnung über die Zuständigkeit, keine gemessene Leistung. */
.tz-gperson{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--hairline)}
.tz-gp-ttl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tz-gp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tz-gp b{color:var(--dark);font-weight:650}
.tz-gp-ohne{color:var(--faint);font-style:italic}
.tz-lead{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.6;max-width:860px}

/* Kennzahlkacheln — weiß mit feiner Linie, Zahl trägt die Farbe */
.tz-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.tz-kpi{background:var(--card);border:1px solid var(--border);color:var(--dark);border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden}
.tz-kpi-ico{font-size:15px;line-height:1;margin-bottom:8px;opacity:.75}
.tz-kpi-v{font-family:'Inter',sans-serif;font-size:30px;font-weight:650;line-height:1;letter-spacing:-.035em;color:var(--dark);font-feature-settings:'tnum'}
.tz-kpi-l{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;margin-top:6px;color:var(--dark);letter-spacing:-.01em}
.tz-kpi-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

.tz-abschluss{background:#17171B;color:#E4E4E7;border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.tz-ab-ttl{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;margin-bottom:4px}
.tz-ab-body{font-size:13px;line-height:1.55;color:#A1A1AA}
.tz-ab-body b{color:#FAFAFA;font-weight:600}

/* Aufgaben-Checkliste */
.task-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.task-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;background:var(--card);flex-wrap:wrap;cursor:pointer;user-select:none;transition:background .12s}
.task-sec-head:hover{background:var(--sunken)}
.task-caret{display:inline-block;color:var(--faint);font-size:10px;transition:transform .18s;margin-right:2px}
.task-sec-head.open .task-caret{transform:rotate(90deg)}
.task-sec-ttl{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--dark);padding-left:8px;letter-spacing:-.012em}
.task-sec-cnt{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;font-feature-settings:'tnum'}
.task-open{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-sm);padding:4px 11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .13s}
.task-open:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.task-list{background:var(--card)}
.task{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--hairline);cursor:pointer;transition:background .12s}
.task:hover{background:var(--sunken)}
.task-cb{width:19px;height:19px;flex-shrink:0;border:1.5px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--faint);font-size:12px;transition:all .13s}
/* Direkte Kinder, damit dieselben drei Regeln fuer .task (Tagesziel) und .pr
   (Folge-VO, Verplanung, Potential-Dauer) gelten — ein Status, ein Aussehen. */
.st-arbeit>.task-cb{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.st-fertig>.task-cb{background:var(--green);border-color:var(--green);color:#fff}
.st-abgelehnt>.task-cb{background:var(--sunken);border-color:var(--faint);color:var(--faint)}
.task-body{min-width:0;flex:1}
.task-main{font-family:'Inter',sans-serif;font-weight:550;font-size:13px;color:var(--dark);letter-spacing:-.01em}
.task-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.task.done .task-main{text-decoration:line-through;color:var(--faint)}
.task.done{opacity:.7}

/* Team & Verantwortliche */
.tm-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.tm-label{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--dark)}
.tm-chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunken);border:1px solid var(--border);border-radius:100px;padding:3px 9px;font-size:12.5px;font-weight:500;color:var(--dark)}
.tm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tm-x{cursor:pointer;color:var(--faint);font-weight:500;font-size:14px;line-height:1;padding:0 2px;border-radius:4px}
.tm-x:hover{color:var(--fire);background:var(--fire-bg)}
.tm-empty{font-size:12.5px;color:var(--faint)}
.tm-input{border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 9px;font-size:12.5px;width:170px;font-family:'Inter',sans-serif;outline:none;color:var(--dark)}
/* Trefferzeile der Nutzersuche: eigene Zeile unter der Leiste statt Dropdown.
   Ein überlagerndes Menü bräuchte Positionierung und Klick-daneben-Erkennung —
   die Zeile kostet nichts und kann nichts verdecken. Leer nimmt sie keinen Platz. */
.tm-treffer{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tm-treffer:empty{display:none}
.tm-input:focus{border-color:var(--faint);box-shadow:0 0 0 3px var(--hairline)}
.tm-addbtn{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:var(--radius-sm);padding:5px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .13s}
.tm-addbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.tm-me{margin-left:auto}
.tm-mine{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.asg-sel{border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--dark);background:var(--card);cursor:pointer;outline:none}
.asg-sel.asg-sel-leer{border-style:dashed;color:var(--faint)}
.asg-chip{flex-shrink:0;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:600;font-size:10.5px;color:#fff;cursor:pointer;user-select:none;transition:transform .12s}
.asg-chip:hover{transform:scale(1.1)}
.asg-chip.asg-inh{opacity:.5;outline:1px dashed var(--faint);outline-offset:-1px}
.asg-chip.asg-none{background:var(--sunken);color:var(--faint);border:1px dashed var(--border);font-size:14px}
.cat-asg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:450}
/* Mehrere Zuständige: Chips plus ein schmales „+"-Menü. Das Menü ist nur so
   breit wie das Plus — die Namen stehen erst im geöffneten Systemmenü, sonst
   würde jede Aufgabenzeile von der längsten Namenslänge auseinandergezogen. */
.asg-row{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.asg-add{width:26px;height:26px;flex-shrink:0;border:1px dashed var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;text-align:center;text-align-last:center;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;padding:0}
.asg-add:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.asg-leer{font-size:11.5px;color:var(--faint);font-style:italic}
/* „Erbt wieder": Nur da, wo eine Stufe die Erbschaft abgeschnitten hat. Still
   wie das Plus-Menü daneben, damit es nicht nach einem Fehler aussieht. */
.asg-reset{flex-shrink:0;width:26px;height:26px;border:1px dashed var(--border);border-radius:50%;background:var(--sunken);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;user-select:none}
.asg-reset:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
/* Bereichskürzel an der Aufgabe. Klein und still, solange es nur die Kategorie
   wiederholt; umrandet, sobald es eine bewusste Abweichung ist. */
.area-chip{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 5px;border-radius:5px;background:var(--sunken);color:var(--faint);font-family:'Inter',sans-serif;font-size:10px;font-weight:650;letter-spacing:.3px;cursor:pointer;user-select:none}
.area-chip:hover{color:var(--primary);background:var(--primary-bg)}
.area-chip.area-eigen{background:var(--primary-bg);color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
/* Frist. Leer: blass und schmal, damit sie nicht wie eine Pflichtangabe
   aussieht. Gesetzt: in der Farbe der Lage, überfällig sticht heraus. */
.frist-in{flex-shrink:0;width:124px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;background:var(--card);color:var(--dark);cursor:pointer;outline:none}
.frist-in.frist-leer{border-style:dashed;color:var(--faint);background:transparent;opacity:.55}
.frist-in.frist-leer:hover{opacity:1}
.frist-in.frist-ueber{color:var(--fire);border-color:var(--fire);font-weight:650}
.frist-in.frist-heut{color:var(--amber);border-color:var(--amber);font-weight:600}
.frist-in.frist-spaet{color:var(--muted)}
/* Status. Die Farbe trägt die Aussage, nicht die Schrift — vier Zustände soll
   man an der Zeile erkennen, ohne sie zu lesen. */
.st-sel{flex-shrink:0;border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;background:var(--card);cursor:pointer;outline:none}
.st-sel.st-offen{color:var(--muted)}
.st-sel.st-arbeit{color:var(--amber);border-color:var(--amber);background:var(--amber-bg)}
.st-sel.st-fertig{color:var(--green);border-color:var(--green);background:var(--green-bg)}
.st-sel.st-abgelehnt{color:var(--faint);border-color:var(--border);background:var(--sunken);text-decoration:line-through}
/* Notiz. Der Knopf ist leer und blass, solange nichts dasteht. */
.nz-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--sunken);color:var(--faint);font-size:11px;cursor:pointer;user-select:none;border:1px dashed var(--border)}
.nz-btn:hover{color:var(--primary);background:var(--primary-bg);border-color:var(--primary)}
.nz-btn.nz-da{border-style:solid;border-color:var(--amber);background:var(--amber-bg);font-size:12px}
.nz-txt{font-size:11.5px;color:var(--dark);background:var(--amber-bg);border-radius:6px;padding:4px 8px;margin-top:5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.nz-wer{color:var(--muted);font-size:10.5px}
/* Rechter Rand einer Aufgabenzeile. Umbricht auf dem Handy unter den Text,
   statt die Zeile zu stauchen. */
.task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.tz-persons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tz-person{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:100px;padding:4px 13px 4px 4px;font-size:12.5px;font-weight:500;color:var(--dark)}
.tz-person .asg-chip{cursor:default;width:22px;height:22px;font-size:10px}
.tz-person-n{font-size:11.5px;color:var(--muted);font-weight:450;font-feature-settings:'tnum'}
/* Stehende Besetzung der Bereiche: eigene Karte, große Chips. Wer hier niemanden
   einträgt, bekommt im ganzen Reiter „niemand zuständig" — das ist die
   wichtigste Einstellung der Seite und darf nicht wie eine Fußnote aussehen. */
.crew-card{background:var(--card);border-radius:var(--radius);padding:14px 18px 16px;margin-bottom:16px;box-shadow:inset 0 0 0 1.5px var(--primary-bg)}
.crew-ttl{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--dark);letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.crew-hint{font-size:11.5px;font-weight:450;color:var(--muted);letter-spacing:0}
.crew-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.crew-area{background:var(--sunken);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crew-area-ttl{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--dark);letter-spacing:-.01em}
.crew-area .asg-chip,.crew-area .asg-add{width:32px;height:32px;font-size:12px}
.crew-area .asg-add{font-size:15px}
.crew-area .asg-leer{font-size:12.5px}

/* Umschalter Liste ↔ Tagesplan */
.tz-modebar{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
.tz-mode{border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-weight:550;font-size:12.5px;padding:6px 14px;border-radius:7px;cursor:pointer;transition:all .13s}
.tz-mode:hover{color:var(--dark);background:var(--sunken)}
.tz-mode.a{background:var(--primary-bg);color:var(--primary);font-weight:600}

/* Tagesplan */
.tp-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tp-nav-c{flex:1;text-align:center}
.tp-nav-day{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:var(--dark);letter-spacing:-.015em}
.tp-nav-sub{font-size:12px;color:var(--muted);font-weight:450;margin-top:2px}
.tp-hint{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:11px 14px;font-size:12.5px;color:var(--dark);line-height:1.55}
.tp-card{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px}
.tp-time{flex-shrink:0;min-width:52px;font-family:'Inter',sans-serif;font-weight:650;font-size:15px;color:var(--dark);line-height:1.2;letter-spacing:-.02em;font-feature-settings:'tnum'}
.tp-main{flex:1;min-width:200px}
.tp-pat{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--dark);letter-spacing:-.012em}
.tp-th{font-weight:450;font-size:12.5px;color:var(--muted)}
.tp-leist{font-size:12px;color:var(--faint);margin-top:2px}
.tp-tasks{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.tp-task{display:flex;align-items:center;gap:9px;background:var(--sunken);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:6px 9px}
.tp-task.done{opacity:.6}
.tp-task-cb{flex-shrink:0;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);background:var(--card);color:var(--faint);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tp-task.st-arbeit>.tp-task-cb{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.tp-task.st-fertig>.tp-task-cb{background:var(--green);border-color:var(--green);color:#fff}
.tp-task.st-abgelehnt>.tp-task-cb{background:var(--card);border-color:var(--faint);color:var(--faint)}
.tp-task-body{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.tp-task-txt{font-size:12.5px;font-weight:500;color:var(--dark)}
.tp-task.done .tp-task-txt{text-decoration:line-through}
.tp-task-sub{font-size:11px;color:var(--muted)}
.tp-tel{flex-basis:100%;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;margin-left:66px}
.tp-tel:hover{color:var(--primary)}
.tp-card.tp-erledigt{border-left-color:var(--green);opacity:.72}

/* Datums-Navigator */
.datenav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.task-sec-hint{font-size:11px;color:var(--muted);line-height:1.45;padding:8px 12px 10px;border-bottom:1px solid var(--hairline)}
/* Die Rechenregel des Folge-VO-Reiters. Steht bewusst als Block ueber der
   Liste: wer die Zahlen liest, soll daneben sehen, woraus sie entstehen. */
.fvo-regel{background:var(--sunken);border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;
  margin-bottom:12px;font-size:11px;line-height:1.6;color:var(--text)}
.fvo-regel b{font-weight:700}
.fvo-warn{color:var(--amber);display:block;margin-top:6px}
.dn-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:16px;font-weight:500;cursor:pointer;line-height:1;transition:all .13s}
.dn-btn:hover:not(:disabled){border-color:var(--faint);color:var(--dark);background:var(--sunken)}
.dn-btn:disabled{opacity:.35;cursor:not-allowed}
.dn-center{display:flex;flex-direction:column;align-items:center;gap:3px}
.dn-lbl{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--dark);letter-spacing:-.012em}
.dn-sel{border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:450;color:var(--muted);background:var(--card);cursor:pointer;outline:none}
.dn-count{font-size:12px;color:var(--faint);font-weight:450;margin-left:auto;font-feature-settings:'tnum'}

/* Therapeuten-Dropdown */
.th-dd{position:relative;display:inline-block;margin-bottom:14px}
.th-dd-btn{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-sm);padding:7px 14px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--dark);cursor:pointer;display:flex;align-items:center;gap:8px}
.th-dd-btn:hover{border-color:var(--faint);background:var(--sunken)}
.th-caret{color:var(--faint);font-size:10px}
.th-dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 32px rgba(17,17,20,.12);padding:6px;min-width:250px;max-height:320px;overflow-y:auto}
.th-dd-menu.open{display:block}
.th-opt{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;font-size:12.5px;font-weight:450;color:var(--dark);cursor:pointer;font-family:'Inter',sans-serif}
.th-opt:hover{background:var(--sunken)}
.th-opt input{width:15px;height:15px;cursor:pointer;accent-color:var(--primary)}
.th-opt.th-all{border-bottom:1px solid var(--hairline);margin-bottom:4px;padding-bottom:9px;border-radius:6px 6px 0 0;font-weight:550}

.ausl-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ausl-label{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;width:140px;flex-shrink:0}
.ausl-bar{flex:1;height:24px;background:var(--hairline);border-radius:6px;overflow:hidden;position:relative}
.ausl-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;color:#fff;transition:width .5s ease;min-width:44px;font-feature-settings:'tnum'}
.ausl-val{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;width:70px;text-align:right;flex-shrink:0;font-feature-settings:'tnum'}
.ausl-target{position:absolute;top:0;bottom:0;width:2px;background:var(--dark);opacity:.18}

.ft{text-align:center;padding:36px 20px 16px;font-size:11.5px;color:var(--faint);font-family:'Inter',sans-serif;font-weight:450}
.ft b{color:var(--muted);font-weight:550}

/* ===================================================================
   Werneck-eigene Bausteine: Login, Ladeschirm, Unterreiter, Tabellen,
   Warteliste, Verlauf. Dieselben Tokens, dieselbe Formensprache.
   =================================================================== */
#lo{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.lb{text-align:center;width:380px;max-width:92vw}
.lb h1{font-family:'Inter',sans-serif;font-size:clamp(28px,7vw,34px);font-weight:650;color:var(--dark);margin-bottom:6px;letter-spacing:-.03em}
.lb p{color:var(--muted);font-size:13.5px;margin-bottom:28px}
.l-btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:550;cursor:pointer;transition:background .16s;display:flex;align-items:center;justify-content:center;gap:8px}
.l-btn:hover{background:var(--primary-hover)}
.l-err{color:var(--fire);font-size:12.5px;margin-top:12px;font-weight:500;display:none}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998}
.loading.h{display:none}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
.loading p{color:var(--muted);font-size:13.5px}

.sub-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stab{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:5px}
.stab:hover{border-color:var(--faint);color:var(--dark)}
.stab.a{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600}
.stab-badge{font-size:10.5px;padding:0 6px;border-radius:5px;background:var(--faint);color:#fff;font-weight:550}

.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.hk{background:var(--card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border)}
.hk-l{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-bottom:8px}
.hk-v{font-family:'Inter',sans-serif;font-size:26px;font-weight:650;font-feature-settings:'tnum';letter-spacing:-.032em;line-height:1.05}
.hk-sub{font-size:11.5px;color:var(--faint);margin-top:5px}
.tc-card.of{border-left:3px solid var(--border);opacity:.5}
.ba{background:var(--amber-bg);color:var(--amber)}
.ts.sps{background:repeating-linear-gradient(45deg,#EAE7E3,#EAE7E3 3px,#DFDBD6 3px,#DFDBD6 6px)}

.kw-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.kw-nav h3{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.015em}
.kw-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .13s;color:var(--muted)}
.kw-btn:hover{border-color:var(--faint);color:var(--dark);background:var(--sunken)}
.kw-info{font-size:12.5px;color:var(--muted);font-weight:450}

.wl-card{background:var(--card);border-radius:var(--radius);padding:20px 22px;border:1px solid var(--border);margin-bottom:16px}
.wl-form{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.wl-input{flex:1;min-width:120px;padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13px;font-family:'Inter',sans-serif;background:var(--card);color:var(--dark)}
.wl-input:focus{outline:none;border-color:var(--faint);box-shadow:0 0 0 3px var(--hairline)}
.wl-select{padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13px;font-family:'Inter',sans-serif;background:var(--card);cursor:pointer;min-width:120px;color:var(--dark)}
.wl-select:focus{outline:none;border-color:var(--faint)}
.wl-add{padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--primary);color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:550;cursor:pointer;transition:background .16s;white-space:nowrap}
.wl-add:hover{background:var(--primary-hover)}
.wl-empty{text-align:center;padding:28px;color:var(--faint);font-size:13px}

.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.fl{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:550;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-right:4px}
.fb{padding:5px 13px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:450;cursor:pointer;transition:all .13s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px}
.fb:hover{border-color:var(--faint);color:var(--dark)}
.fb.a{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:600}
/* Dauerpatienten-Schalter. Sitzt in einer .flt-Leiste und soll wie ein Filter
   aussehen, aber nicht wie einer der Grundfilter — deshalb lila statt neutral,
   und im eingeschalteten Zustand deutlich gefuellt. */
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  font-family:'Inter',sans-serif;font-size:12.5px;font-weight:450;cursor:pointer;transition:all .13s}
/* Verplanung: je Verordnung eine Zeile mit den drei Zahlen, aus denen sich der
   Rest ergibt. Bewusst als eigene Zeile und nicht als Fliesstext — verordnet,
   erbracht und gebucht sollen untereinander stehend vergleichbar bleiben. */
.vp-vos{margin:7px 0 2px}
.vp-vo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 9px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);margin-bottom:5px;
  font-size:11px;color:var(--muted)}
.vp-badge{padding:1px 7px;border-radius:100px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em}
.vp-hm{font-weight:600;color:var(--dark);min-width:120px}
.vp-z b{color:var(--dark);font-weight:700;font-variant-numeric:tabular-nums}
.vp-rest b{color:var(--primary)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.sep{width:1px;height:20px;background:var(--border);margin:0 8px}
.search{padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:12.5px;font-family:'Inter',sans-serif;width:220px;background:var(--card);color:var(--dark)}
.search:focus{outline:none;border-color:var(--faint);box-shadow:0 0 0 3px var(--hairline)}
.search-wrap .sw-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}

.tcx{background:var(--card);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.thd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.thd h3,.thd h4{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;margin:0;letter-spacing:-.014em}
.thd .cnt{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:550;background:var(--sunken);border:1px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:100px}

table.data-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.data-t thead th{text-align:left;padding:8px 12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:550;text-transform:none;letter-spacing:.01em;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border)}
table.data-t thead th:hover{color:var(--dark)}
table.data-t thead th.r{text-align:right}
table.data-t thead th.sorted{color:var(--dark);font-weight:600}
table.data-t thead th .arrow{font-size:9px;margin-left:3px;color:var(--faint)}
table.data-t tbody tr{background:var(--card);transition:background .12s;border-bottom:1px solid var(--hairline)}
table.data-t tbody tr:hover{background:var(--sunken)}
table.data-t tbody tr.urgent{background:var(--primary-bg)}
table.data-t td{padding:10px 12px}
table.data-t td:first-child{border-radius:0}
table.data-t td:last-child{border-radius:0}
table.data-t td.r{text-align:right;font-feature-settings:'tnum'}
.pn{font-family:'Inter',sans-serif;font-weight:550;font-size:12.5px;color:var(--dark)}
.th-sub{font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-family:'Inter',sans-serif;font-size:11px;font-weight:550}
.b-red{background:var(--primary-bg);color:var(--primary)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
.days{font-family:'Inter',sans-serif;font-size:14px;font-weight:650;font-feature-settings:'tnum';letter-spacing:-.02em}
.standort{font-family:'Inter',sans-serif;font-size:11px;font-weight:550;padding:1px 8px;border-radius:5px;letter-spacing:0}
.s-kimojo{background:var(--primary-bg);color:var(--primary)}
.s-phfip{background:var(--teal-bg);color:var(--teal)}
.s-ergo{background:var(--ergo-bg);color:var(--ergo)}
.expand-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--faint);transition:all .13s;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.expand-btn:hover{background:var(--sunken);color:var(--dark)}
.expand-btn.open{transform:rotate(90deg);color:var(--dark)}
.detail-row{display:none}
.detail-row.open{display:table-row}
.detail-content{padding:8px 16px 14px 40px}
.dtable{width:100%;font-size:11.5px;border-collapse:collapse;margin-top:8px}
.dtable th{text-align:left;padding:6px 8px;font-family:'Inter',sans-serif;font-weight:550;color:var(--muted);font-size:11px;text-transform:none;border-bottom:1px solid var(--border)}
.dtable td{padding:6px 8px;border-bottom:1px solid var(--hairline)}
.act{padding:4px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);font-size:11.5px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .13s;margin:2px;color:var(--muted)}
.act:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.act.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}

.cat-chip.c-teal{background:var(--teal-bg);color:var(--teal)}
.cat-chip.c-amber{background:var(--amber-bg);color:var(--amber)}
.cat-chip.c-purple{background:var(--purple-bg);color:var(--purple)}
.cat-chip.c-blue{background:var(--blue-bg);color:var(--blue)}
.cat-chip.c-green{background:var(--green-bg);color:var(--green)}
.cat-chip.c-fire{background:var(--fire-bg);color:var(--fire)}

.vl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;overflow-x:auto}
.vl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.vl-leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:450;color:var(--muted)}
.vl-leg i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* ===== Animationen ===== */
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Responsiv ===== */
@media(max-width:1024px){.rkpis{grid-template-columns:repeat(4,1fr)}.ausl-grid{grid-template-columns:1fr}}
@media(max-width:768px){.hero,.sg{grid-template-columns:1fr 1fr}.tg{grid-template-columns:1fr}.rkpis{grid-template-columns:repeat(3,1fr)}.ausl-grid{grid-template-columns:1fr}}

  #db{padding:20px 14px 32px}
  .hero,.sg,.rkpis{grid-template-columns:repeat(2,1fr)}
  .search{width:100%}
  .summary h2{font-size:18px}
  .tp-card{gap:8px;padding:11px 12px}
  .tp-time{min-width:44px;font-size:13px}
  .tp-main{min-width:100%}
  .tp-tel{margin-left:0}
  .tp-nav-day{font-size:13px}
  .tm-bar{padding:8px 10px}
  .tz-modebar{width:100%}
  .tz-mode{flex:1;text-align:center}
  .cat-chip{font-size:10px}
  .vl-card{padding:12px 10px}
  .main-tabs{gap:2px}
  .m-tab{padding:6px 11px;font-size:12.5px}
}
@media(max-width:480px){.sg{grid-template-columns:1fr}.rkpis{grid-template-columns:repeat(2,1fr)}}

/* ═══════════════════════════════════════════════════════════════════════
   APPLE-SCHICHT — macOS/iOS-Systemoberfläche
   ───────────────────────────────────────────────────────────────────────
   Wird hinter das bestehende Stylesheet gehängt. Gleiche Selektoren,
   spätere Position, also gewinnt diese Schicht — ohne dass eine einzige
   bestehende Regel gelöscht werden muss. Dadurch bleibt die CSS-Deckung
   automatisch vollständig: Klassen, die hier nicht auftauchen, behalten
   ihr bisheriges Aussehen.

   Leitgedanken der Apple-Systemoberfläche:
   1. Flächen statt Rahmen. Weiße Karten auf grauem Grund (#F2F2F7),
      kein Rahmen, kein Schatten — die Farbdifferenz trägt die Trennung.
   2. Gruppierte Listen. Zusammengehörige Zeilen sitzen in EINER Karte,
      getrennt durch eine haarfeine Linie, die links auf Texthöhe einrückt.
   3. Große, ruhige Titel und kleine graue Abschnittsköpfe darüber.
   4. Farbe ist Zustand, nicht Dekoration.

   Bewusst NICHT übernommen: Apples Systemfarben als Text (systemBlue &
   Co. liegen auf Weiß bei ca. 3:1 und fallen damit durch WCAG AA). Die
   geprüften Signalfarben bleiben, das KIMOJO-Rot bleibt Markenfarbe.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* Flächen: systemGroupedBackground und weiße Karten darauf */
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --sunken:#F2F2F7;
  /* Trennlinien: systemGray5 als Zeilentrenner, Rahmen praktisch abgeschafft */
  --border:#E5E5EA;
  --hairline:#E5E5EA;
  /* Graustufen kühl-neutral wie SF, aber dunkel genug für AA */
  --dark:#1C1C1E;
  --muted:#56565C;
  --faint:#6E6E76;
  /* Apple rundet großzügiger */
  --radius:14px;
  --radius-sm:10px;
  /* Karten tragen keinen Schatten; nur schwebende Elemente bekommen einen */
  --shadow:none;
  --shadow-lg:0 8px 28px rgba(0,0,0,.10);
  /* Füllfarbe für Steuerelemente (Apples systemFill, deckend gerechnet) */
  --fill:#E4E4E9;
  --fill-hover:#DADAE0;
}

/* ── Schrift ──────────────────────────────────────────────────────────
   SF Pro über die Systemschriftkennung. Auf dem Mac ist das die echte
   Systemschrift, sonst fällt es auf Inter zurück. */
body,
body input,body select,body textarea,body button{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
}
body{
  background:var(--bg);
  letter-spacing:-.006em;
  font-feature-settings:normal;
  -webkit-font-smoothing:antialiased;
}
/* Alle Stellen, die im Basis-Stylesheet Inter fest verdrahtet haben */
.hdr h1,.demo-badge,.m-tab,.tab,.summary h2,.si-l,.si-v,.st,.ac-t,.ac-p,.tn,.tb,.tm b,
.gt,.gp,.tll,.ai,.search-wrap input,.dauer-toggle,.cat-chip,.wr-tab thead th,.fc-kw,
.fc-rate,.lf-head,.lf-ta,.rkpi-l,.rkpi-v,.nr-filter,.pr-n,.pr-b,.sc,.pr-dt,.d-t,
.gap-detail-t,.nr-mini-rank,.nr-mini-n,.nr-mini-score,.subgroup-h,.ausl-card h4,
.aufg-card .aufg-num,.aufg-card .aufg-ttl,.aufg-card .aufg-go,.tz-kpi-v,.tz-kpi-l,
.tz-ab-ttl,.task-sec-ttl,.task-open,.task-main,.tm-label,
.tm-input,.tm-addbtn,.asg-sel,.asg-chip,.tz-modebar,.tz-mode,.tp-nav-day,.tp-time,
.tp-pat,.dn-lbl,.dn-sel,.th-dd-btn,.th-opt,.ausl-label,.ausl-fill,.ausl-val,.ft,
.lb h1,.l-btn,.stab,.hk-l,.hk-v,.kw-nav h3,.wl-input,.wl-select,.wl-add,.fl,.fb,
.search,.thd h3,.thd h4,.thd .cnt,.pn,.badge,.days,.standort,.dtable th,.act,.vl-leg,
.nr-mini-tel,.tp-task-txt,.wr-tab .wr-name,.tz-person,.tz-person-n{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,sans-serif;
}

/* ── Kopfleiste: durchscheinendes Material wie eine macOS-Toolbar ───── */
.hdr{
  position:sticky;top:0;z-index:60;
  margin-bottom:22px;padding:14px 24px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.07);
}
.hdr h1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.demo-badge{background:var(--fill);border:none;color:var(--muted);font-weight:500}

/* ── Seitentitel: Apples „Large Title" ────────────────────────────── */
.summary{margin-bottom:22px}
.summary h2{font-size:28px;font-weight:700;letter-spacing:-.026em;line-height:1.15;margin-bottom:6px}
.tz-lead{font-size:14px;color:var(--muted);letter-spacing:-.004em}

/* Abschnittskopf über einer Gruppe — klein, grau, gesperrt (iOS-Listenkopf) */
.subgroup-h{
  font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);padding-left:2px;margin-bottom:8px
}
.subgroup-h .cnt{letter-spacing:.02em;text-transform:none;font-size:11.5px}
.st{font-size:15px;font-weight:600;letter-spacing:-.018em;margin:28px 0 10px}

/* ── Segmentierte Steuerung (Hauptnavigation) ───────────────────────
   Grauer Trog, weiße Pille mit weichem Schatten — das Apple-Bauteil. */
.main-tabs{background:var(--fill);border:none;border-radius:10px;padding:2px;gap:0}
.m-tab{
  padding:6px 15px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--dark);letter-spacing:-.01em;transition:none
}
.m-tab:hover{background:transparent;color:var(--dark);opacity:.6}
.m-tab.a{
  background:#fff;color:var(--dark);font-weight:600;opacity:1;
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04)
}
.tz-modebar{background:var(--fill);border:none;border-radius:9px;padding:2px;gap:0}
.tz-mode{border-radius:7px;font-weight:500;color:var(--dark)}
.tz-mode:hover{background:transparent;opacity:.6}
.tz-mode.a{background:#fff;color:var(--dark);font-weight:600;opacity:1;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}

/* ── Filterpillen: gefüllt statt umrandet ──────────────────────────── */
.tab,.fb,.nr-filter,.stab{
  border:none;background:var(--fill);color:var(--dark);border-radius:100px;font-weight:500
}
.tab:hover,.fb:hover,.nr-filter:hover,.stab:hover{background:var(--fill-hover);color:var(--dark)}
.tab.a,.fb.a{background:var(--primary);color:#fff;font-weight:600}
.nr-filter.a{background:var(--accent);color:#fff;font-weight:600}
.stab.a{background:var(--blue);color:#fff;font-weight:600}
.stab-badge{background:rgba(255,255,255,.28);color:#fff}
.stab:not(.a) .stab-badge{background:var(--faint);color:#fff}
.fl{text-transform:uppercase;letter-spacing:.05em;font-size:11px;font-weight:600;color:var(--muted)}
.sep{background:rgba(0,0,0,.1)}

/* ── Karten: weiße Flächen ohne Rahmen und ohne Schatten ───────────── */
.tcx,.wl-card,.vl-card,.ausl-card,.lf-box,.tz-wrap,.task-sec,.tc-card,
.si,.rkpi,.hk,.fc-card,.wr-scroll,.gap-detail,.tm-bar,.tz-kpi,.aufg-card,.tp-card,
.tp-hint,.focus-banner,.empty,.nr-mini,.tp-task{
  border:none;box-shadow:none;background:var(--card)
}
.tcx,.wl-card,.vl-card,.ausl-card,.lf-box,.tz-wrap,.task-sec,.tc-card,

// die eine noch nicht erteilte Berechtigung mitverlangt, schlägt komplett fehl.

// ═══════════════════════════════════════════════════════════

const KGG_CAP=3;

const KGG_SOLL=2;

const INAKTIVE_MA=new Set([]);

// Im thevea-Mandanten liegen neben dem Werneck-Team auch Therapeuten einer ANDEREN Praxis,
// die die Software nur für Videotherapie nutzt. Ein Kennzeichen dafür gibt es im Schema nicht:
// MandantMitarbeiter kennt nur person / sichtbar / farbe / rolle — kein "aktiv", kein "Austritt".
// "sichtbar" taugt nicht als Filter (22 von 27 sind sichtbar, zwei eigene Kollegen sind sogar
// versteckt). Verlässlich trennt nur die Terminmenge im 14-Tage-Fenster:
//   eigenes Team 22–191 Patiententermine  |  Fremdpraxis 0–1.
// Deshalb wird der Schwellwert über das GANZE Fenster gezählt und NICHT pro Tag. Ein Limit
// "mehr als 1 Termin am Tag" würde einen echten Therapeuten an einem ruhigen Tag ausblenden
// (halber Freitag, Urlaubsrückkehr, ein einzelner Nachmittagstermin) — und genau an so einem
// Tag ist die Lückenanzeige am wertvollsten. Neue Mitarbeiter erscheinen automatisch, sobald
// sie den Schwellwert reißen; nichts muss gepflegt werden.
const MIN_TERMINE_14TAGE=5;
let TEAM_IDS=new Set();
// ── ARBEITSZEITEN AUS THEVEA-WOCHENVORLAGEN ─────────────────────────────────
// Medifox lieferte fertige Tagesarbeitszeiten. thevea liefert stattdessen Wochen-Vorlagen
// (je Mitarbeiter ein Satz Zeitspannen mit Wochentag-Enum, gültig ab validFrom) und die
// Abwesenheiten getrennt als Datumsbereiche. Beides auf einen konkreten Tag umzurechnen
// wäre in Power Automate eine verschachtelte Schleife mit Typproblemen — im Browser sind
// es zwanzig Zeilen. Der Flow legt deshalb nur die Rohdaten ab, gerechnet wird hier.
const WOTAG=['SONNTAG','MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG'];
function isoDay(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function buildAZ(azRoh,abwRoh,ds){
  if(!Array.isArray(azRoh))return null;
  const wd=WOTAG[new Date(ds+'T12:00:00').getDay()];
  // Pro Person können mehrere Vorlagen vorliegen (alte und neue nebeneinander). Gültig ist
  // die mit dem spätesten validFrom, das nicht in der Zukunft liegt und dessen validUntil
  // noch nicht überschritten ist. Ohne diese Auswahl würden alte Zeiten mitgezählt.
  const best={};
  azRoh.forEach(v=>{
    if(v.validFrom&&v.validFrom>ds)return;
    if(v.validUntil&&v.validUntil<ds)return;
    const cur=best[v.personId];
    if(!cur||String(v.validFrom||'')>String(cur.validFrom||''))best[v.personId]=v;
  });
  const abw=Array.isArray(abwRoh)?abwRoh:[];
  return Object.keys(best).map(pid=>{
    const v=best[pid];
    const zs=(v.zeitspannen||[]).filter(z=>z.wochentag===wd)
      .map(z=>({Start:z.from,Ende:z.until}))
      .sort((a,b)=>a.Start<b.Start?-1:1);

    // lassen sich direkt vergleichen, deshalb keine Date-Objekte und keine Zeitzonenfallen.
    const a=abw.find(x=>String(x.personId)===String(pid)&&String(x.from)<=ds&&String(x.until)>=ds);

      IstAbwesend:!!a,Abwesenheitsbezeichnung:a?(a.abwesenheitGrund||'Abwesend'):null,
      Arbeitszeiten:zs};
  });

let HB_VO=new Set(),HB_PAT=new Set();
let driveId=null,drives={},curLoc='wp',curSub='heute',curView='luecken',curLocIntern='wp',internKW=0;
let overduePatients=[],currentSort={col:'daysAgo',asc:false},minWeeks=2,standortFilter='all';
// thevea-Variante des Reiters "Offene Rezepte": je Rezept eine Zeile mit Abrechnungsstand.

let auslastungData={werneck:[]},selectedKW=0;

// beide Praxen, deshalb absoluter Pfad statt BASE. Bleibt null, solange der
// Webex-Flow noch nicht läuft; der Reiter zeigt dann eine Anleitung statt einer

// Der Reiter kennt drei Modi, und der Modus bestimmt das Zeitfenster:
//   heute     — nur der laufende Tag, mit Stundenverlauf

let telData=null,telLoc='alle',telEbene='tag',telSel=null;

let telTrendKorn='woche',telTrendSpanne=26,telTrendTaste='alle';
const statusMap=JSON.parse(localStorage.getItem('rezeptStatus')||'{}');
let wlData=[],wlView='all',wlStatusFilter='all';
// Rezept-Ende-Tab (Therapiemanagement): Patienten mit letztem/vorletztem Rezept-Termin heute/morgen
let reLoc='wp',reSub='heute',reTherapeut='all';
// ── PORTIERUNG CKI ──────────────────────────────────────────────────────────

// cache:'no-store' ist hier NICHT optional. Graph leitet /content auf eine
// vorsignierte Download-URL um, und die trägt Cache-Header, die der Browser
// beim Wort nimmt. Ohne diese Anweisung bekommt man beim Neuladen die Datei
// von vor Stunden — sichtbar daran, dass das Dashboard "heute keine Anrufe"
// meldet, während der Flow längst geschrieben hat. Ein Reload half nicht,
// weil der Browser gar nicht erst fragte.
async function loadJSON(p){const f=BASE+p;const e=f.split('/').filter(s=>s).map(s=>encodeURIComponent(s)).join('/');const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+e+':/content',{cache:'no-store',headers:{Authorization:'Bearer '+window._token,'Cache-Control':'no-cache'}});if(!r.ok)return null;return JSON.parse((await r.text()).replace(/^\uFEFF/,''));}

// Schreibt ein JS-Objekt als JSON-Datei zurück nach SharePoint (PUT .../content).
async function saveJSON(p,obj){const f=BASE+p;const e=f.split('/').filter(s=>s).map(s=>encodeURIComponent(s)).join('/');const url='https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+e+':/content';const r=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+window._token,'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok){const t=await r.text().catch(()=>'');console.error('saveJSON FEHLER',r.status,t,'\nURL:',url);window._lastSaveErr='HTTP '+r.status+(t?' – '+t.slice(0,300):'');}return r.ok;}
// Wie saveJSON, nur ohne BASE davor — für Dateien, die sich beide Dashboards
// teilen. Legt den Ordner bei Bedarf an: Graph gibt bei einem PUT in einen
// nicht existierenden Ordner ein 404 zurück und erzeugt ihn NICHT von selbst.
// Deshalb einmal nachlegen und genau einmal erneut versuchen — nicht in einer
// Schleife, sonst dreht sich das bei einem echten Rechteproblem endlos.
async function saveJSONAbs(f,obj){
  const e=f.split('/').filter(s=>s).map(s=>encodeURIComponent(s)).join('/');
  const url='https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+e+':/content';
  const put=()=>fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+window._token,'Content-Type':'application/json'},body:JSON.stringify(obj)});
  let r=await put();
  if(r.status===404){
    const teile=f.split('/').filter(s=>s);teile.pop();
    const ordner=teile.pop();
    const eltern=teile.map(s=>encodeURIComponent(s)).join('/');
    try{
      await fetch('https://graph.microsoft.com/v1.0/drives/'+driveId+'/root:/'+eltern+':/children',
        {method:'POST',headers:{Authorization:'Bearer '+window._token,'Content-Type':'application/json'},
         body:JSON.stringify({name:ordner,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});
    }catch(_){}
    r=await put();
  }
  if(!r.ok){const t=await r.text().catch(()=>'');console.error('saveJSONAbs FEHLER',r.status,t,'\nURL:',url);window._lastSaveErr='HTTP '+r.status+(t?' – '+t.slice(0,300):'');}
  return r.ok;
}

function parseDate(v){if(!v)return null;const s=String(v).trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){const y=m[3].length===2?2000+parseInt(m[3]):parseInt(m[3]);return new Date(y,parseInt(m[2])-1,parseInt(m[1]));}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));if(typeof v==='number'&&v>40000){const d=new Date((v-25569)*86400000);if(!isNaN(d))return d;}return null;}
function pName(r){if(!r)return'';return r.replace(/\s*\(.*?\)\s*/g,'').replace(/\s*,\s*/,' ').trim();}

// Extrahiert Telefonnummer aus Patienten-Objekt — probiert diverse Feldnamen
function extractPhone(pRec){
  if(!pRec)return'';
  const fields=['TelefonMobil','Mobiltelefon','Handy','MobilTelefon','Mobile','TelefonPrivat','TelefonGeschaeftlich','Telefon','Telefon1','Telefon2','PhoneMobile','Phone'];
  for(const f of fields){if(pRec[f]&&String(pRec[f]).trim())return String(pRec[f]).trim();}
  if(pRec.Kontakt){for(const f of fields){if(pRec.Kontakt[f]&&String(pRec.Kontakt[f]).trim())return String(pRec.Kontakt[f]).trim();}}
  return'';
}

// Normalisiert Telefonnummer ins E.164-Format (+49...)
function normPhone(raw){
  if(!raw)return'';
  let s=String(raw).replace(/[^\d+]/g,'');
  if(!s)return'';
  if(s.startsWith('00'))s='+'+s.slice(2);
  else if(s.startsWith('0'))s='+49'+s.slice(1);
  else if(!s.startsWith('+'))s='+49'+s;
  return s;
}
// Liefert das korrekte Label für "morgen" — berücksichtigt Wochenende
// Fr → "Montag", Sa → "Montag", So → "Montag", sonst → "Morgen"
function getMorgenLabel(){
  // Beschriftung aus dem tatsächlich geladenen Tag ableiten. loadAll() rückt den
  // "Morgen"-Reiter auf den nächsten Tag mit Terminen vor, also auch über Feiertage
  // und Brückentage hinweg — eine feste Wochentagslogik würde dann falsch beschriften.
  try{
    const loc=LOCS.find(l=>l.id===curLoc)||LOCS[0];
    const dd=DATA[loc.suf];
    const tp=dd&&dd.morgen&&dd.morgen.tp;
    if(tp&&tp.length){
      const b=String(tp[0].Beginn||'').slice(0,10);
      const d=new Date(b+'T12:00:00');
      if(!isNaN(d)){
        const heute=new Date();heute.setHours(12,0,0,0);
        const diff=Math.round((d-heute)/864e5);
        return diff===1?'Morgen':d.toLocaleDateString('de-DE',{weekday:'long'});
      }
    }
  }catch(e){}
  const dow=new Date().getDay(); // 0=So, 5=Fr, 6=Sa
  if(dow===5||dow===6||dow===0)return'Montag';
  return'Morgen';
}

      try{DATA[suf].woche.tp=await loadJSON('terminplan_woche'+suf+'.json');}catch(e){DATA[suf].woche.tp=null;} // optional: Wochenübersicht (1 Datei)
      // Tagesdateien Tag +2..+13. thevea liefert 14 Tage in einem Rutsch (ein getTermine-Call,

    const PAT_IDS={};

    analyzePatients(allRows);

    // Load Auslastung
    for(const[key,kpi] of Object.entries(KPI_FILES)){try{lt.textContent=`Lade Auslastung ${key}...`;const did=drives[kpi.site];if(!did)continue;const data=await getSheet(did,kpi.id,'Auslastung');if(data)auslastungData[key]=parseAuslastung(data);}catch(e){console.warn(`Ausl ${key}:`,e);}}
    const curKW=getCurrentKW();
    const allKWs=Object.values(auslastungData).flat().map(d=>d.kw);
    selectedKW=Math.min(curKW-1,allKWs.length?Math.max(...allKWs):curKW-1);

    // Load Auslastungs-Historie — Werneck: aus dem thevea-Export (Flow schreibt die Datei).
    // Solange die Datei fehlt, bleibt der Historie-Block einfach leer.
    try{
      lt.textContent='Lade Auslastungs-Historie...';
      histRaw=await loadJSON('auslastung_historie_werneck.json');
      if(histRaw)histKWs=hProKW(histRaw,{},()=>'physio');
    }catch(e){console.warn('Historie:',e);}

    // Telefonie — Webex-CDR als rohe Call Legs, eine Datei je Monat. Alle
    // optional: fehlen sie, erklärt der Reiter selbst, was noch fehlt. Die
    // Monate werden parallel geladen; eine fehlende Datei ist kein Fehler,
    // sondern der Normalfall am Monatsanfang und vor dem ersten Flow-Lauf.
    try{
      lt.textContent='Lade Telefonie...';
      // Nur die jüngsten Monate beim Start. Blättert jemand weiter zurück, holt
      // telSicherstellen() den Rest nach — sonst lädt jeder Seitenaufruf Jahre.
      await telLadeMonate(telLetzteMonate(TEL_MONATE));
      if(telData)console.log('Telefonie:',telLegs.length,'Call Legs →',telData.tage.length,'Tagespunkte');
    }catch(e){console.warn('Telefonie:',e);}

    // Load Warteliste — nur wenn eine Excel-Datei hinterlegt ist
    if(WL_FILE.id){
      lt.textContent='Lade Warteliste...';await loadWL();
      lt.textContent='Prüfe Patienten...';await autoDetectWLPatients(allRows);
    }

    document.getElementById('db').style.display='block';
    document.getElementById('lastUp').textContent='⏱ '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    // Die Kennzahlendatei wird NACH dem Aufgabenprotokoll geschrieben — sonst
    // stünde jede Aufgabe als offen darin, deren Haken noch in einer
    // ungelesenen Monatsdatei liegt. aufStart() fängt seine Fehler selbst ab,
    // die Kette reißt also nicht.
    // Nach dem ersten Schreiben laufen beide Takte an: der schnelle für das
    // Protokoll der Kollegen, der langsame für die Kennzahlendatei.
    aufStart().then(kennStart).then(()=>{aufTaktStart();kennTaktStart();});
    recordKpiSnapshot();
    renderMainTabs();switchView('tagesziel');
  }catch(e){console.error(e);document.getElementById('lo').style.display='flex';document.getElementById('er').textContent=e.message;document.getElementById('er').style.display='block';}
  finally{ld.classList.add('h');}
}

let feedbackKW=0; // Aktuell ausgewählte KW für Feedback-Liste
let feedbackStandort='all'; // Filter: alle / PHYSIO / ERGO

// KW-Berechnung (ISO-8601, wie getCurrentKW, aber für beliebiges Datum)
function isoWeek(d){
  const date=new Date(d);date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date.getTime()-w1.getTime())/864e5-3+(w1.getDay()+6)%7)/7);
}

// Sammelt alle Patienten, deren Rezept in gegebener KW abgeschlossen wurde
// und die aktuell keine zukünftigen Termine haben
function getFeedbackPatients(targetKW,targetYear){
  if(!behData||!Array.isArray(behData))return[];
  const plMap={};
  if(plData&&Array.isArray(plData))plData.forEach(p=>{if(p?.Id)plMap[p.Id]=p;});
  const today=new Date();today.setHours(0,0,0,0);
  const result=[];
  behData.forEach(p=>{
    const pid=p.patientId;if(!pid)return;
    const vos=(p.data?.Verordnungen||[]);
    // Prüfe alle Verordnungen: Welche wurden in target-KW komplett abgeschlossen?
    let lastFinishedVo=null,lastTerminDate=null,lastTherapeut='';
    let hasFutureTermin=false;
    vos.forEach(v=>{
      const te=v.Termine||[];if(!te.length)return;
      const open=te.filter(t=>t.Status===1).length;
      const done=te.filter(t=>t.Status===4).length;
      // Zukünftige geplante Termine (Status 1 mit Datum > heute)
      te.forEach(t=>{
        if(t.Status===1&&t.Datum){
          const d=new Date(t.Datum);
          if(d>=today)hasFutureTermin=true;
        }
      });
      // Rezept gilt als abgeschlossen: alle erbracht, keine offenen
      if(done>0&&open===0){
        // Letzter erbrachter Termin = Abschlussdatum
        const doneTe=te.filter(t=>t.Status===4&&t.Datum).map(t=>({d:new Date(t.Datum),n:t.MitarbeiterName||''}));
        if(!doneTe.length)return;
        doneTe.sort((a,b)=>b.d-a.d);
        const last=doneTe[0];
        const kw=isoWeek(last.d);const yr=last.d.getFullYear();
        if(kw===targetKW&&yr===targetYear){
          if(!lastTerminDate||last.d>lastTerminDate){
            lastTerminDate=last.d;lastFinishedVo=v;lastTherapeut=last.n;
          }
        }
      }
    });
    if(!lastFinishedVo||hasFutureTermin)return;
    // Patient hat abgeschlossenes Rezept in target-KW und keinen Folgetermin
    const pl=plMap[pid];
    const name=pl?((pl.Nachname||'')+', '+(pl.Vorname||'')):'Unbekannt';
    const vorname=pl?.Vorname||'';
    const nachname=pl?.Nachname||'';
    const phone=normPhone(extractPhone(pl||{}));
    const beschr=lastFinishedVo.Beschreibung||'';
    const ort=pl?.Ort||'';
    result.push({pid,name,vorname,nachname,phone,therapeut:lastTherapeut,lastDate:lastTerminDate,beschr,ort});
  });
  // Sortierung: nach Datum absteigend (neueste zuerst)
  result.sort((a,b)=>b.lastDate-a.lastDate);
  return result;
}
