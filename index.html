// ═══════════════════════════════════════════════════════════
// VIEW: REZEPT-ENDE (Therapiemanagement)
// Patienten, deren letzter ODER vorletzter Rezept-Termin heute/morgen liegt.
// Die Therapiemanagerin soll diese ansprechen (Folgerezept / Folgetermin).
// ═══════════════════════════════════════════════════════════

// Tagesschlüssel YYYY-MM-DD aus einem Date — robust gegen ISO- oder DE-Format
function reDayKey(d){if(!d||isNaN(d.getTime()))return'';const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
// Sauberer Therapeutenname aus einem Mitarbeiter-Objekt der Tagesplan-JSONs
function reThName(maArr){if(!maArr||!maArr.length)return'—';const m=maArr[0];return((m.Vorname||'')+' '+(m.Nachname||'')).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim()||'—';}

// Sammelt für einen Standort + Tag alle Patienten, deren Termin an dem Tag der
// letzte oder vorletzte Behandlungstag eines Rezepts ist.
//
// thevea-Fassung: die frühere Rechnung lief auf dem Medifox-Format
// (behandlungen_werneck.json) — die Datei gibt es bei Werneck nicht, die
// Ansicht blieb deshalb leer. Jetzt kommen die Zahlen aus dem, was der Flow
// wirklich liefert:
//   Terminplan (DATA)      — wer heute/morgen da ist, mit VerordnungId je Termin
//   Termin-Historie (VOD)  — die volle Terminreihe je Rezept (Rückblick +
//                            Vorausblick, abgesagte Termine zählen nicht)
//   Verordnungsübersicht   — Heilmittel/Name als Rückfallebene
// Gezählt werden Behandlungstage: zwei Einheiten am selben Tag (KG + MT) sind
// EIN Besuch, nicht zwei Termine.
function getRezEndePatients(locId,day){
  const loc=LOCS.find(l=>l.id===locId);if(!loc)return[];
  const dd=DATA[loc.suf];if(!dd||!dd[day])return[];
  const tp=filterTP(dd[day].tp,null,loc.filter).tp||[];
  if(!tp.length)return[];
  const D=VOD[locId];const H=D&&D.hist;
  if(!H||!H.vo)return[]; // ohne Termin-Historie keine Terminreihe je Rezept
  // Verordnungsübersicht nach Rezept-Id — für Heilmittel und Namen
  const voMap={};
  (voNodes(D.vo)||[]).forEach(v=>{if(v&&v.id!=null)voMap[String(v.id)]=v;});
  // Zusätzliche Zukunftstermine je Patient aus dem 14-Tage-Terminplan — als
  // zweite Quelle neben der Historie für die Frage "Folgetermin ausgemacht?".
  // (Die Historie blickt weiter voraus, aber doppelt hält besser: ein frisch
  // gelegter Termin steht im Tagesexport früher als im Historienlauf.)
  const patMax={};
  {
    const buckets=[];
    if(Array.isArray(dd.heute&&dd.heute.tp))buckets.push(dd.heute.tp);
    if(Array.isArray(dd.morgen&&dd.morgen.tp))buckets.push(dd.morgen.tp);
    (dd.extraDays||[]).forEach(a=>{if(Array.isArray(a))buckets.push(a.flat());});
    buckets.forEach(arr=>arr.forEach(x=>{
      if(!x||x.PatientId==null||!x.Beginn)return;
      const ds=String(x.Beginn).slice(0,10);const k=String(x.PatientId);
      if(!patMax[k]||ds>patMax[k])patMax[k]=ds;
    }));
  }
  const rows=[];const seen=new Set(); // Dedupe: pid + Rezept-Id
  tp.forEach(t=>{
    const pid=t.PatientId;if(pid==null)return;            // nur echte Patiententermine
    const vid=t.VerordnungId!=null?t.VerordnungId:t.OtrVerordnungId;
    if(vid==null)return;                                  // Termin ohne Rezept — eigener Reiter
    // Hausbesuche bleiben draussen: der Patient steht nicht am Empfang, das
    // Folgetermin-Gespraech laeuft dort ueber den Therapeuten bzw. das Telefon.
    // Geprueft wird der Termin selbst UND das Rezept (HB_VO sammelt beim Laden
    // alle Verordnungen mit mindestens einem Hausbesuchs-Termin im 14-Tage-Fenster).
    if(t.IsHausbesuch===true)return;
    if(typeof HB_VO!=='undefined'&&HB_VO.has(vid))return;
    const apptDate=new Date(t.Beginn);const apptKey=reDayKey(apptDate);if(!apptKey)return;
    const hv=H.vo[String(vid)];if(!hv||!hv.tage||!hv.tage.size)return;
    // Letzter/vorletzter wird auf BESUCHS-Ebene entschieden: bei Patienten mit
    // zwei Einheiten pro Besuch waere sonst der vorletzte Besuch nie erkennbar
    // (die vorletzte EINHEIT liegt dann am selben Tag wie die letzte).
    const tage=[...hv.tage].sort();                       // Besuchstage des Rezepts, sortiert
    const lastIdx=tage.length-1,vorIdx=tage.length-2;
    const isLetzter=tage[lastIdx]===apptKey;
    const isVorletzter=vorIdx>=0&&tage[vorIdx]===apptKey;
    if(!isLetzter&&!isVorletzter)return;
    const dedupeKey=pid+'|'+vid;
    if(seen.has(dedupeKey))return;seen.add(dedupeKey);
    // Fortschritt dagegen in EINHEITEN, so wie thevea und der Kalender zaehlen:
    // bis einschliesslich dieses Tages erreichte Einheiten / alle Einheiten.
    // Edgar Fuchs mit 2 Einheiten je Besuch steht am letzten Tag also auf 6/6,
    // am vorletzten auf 4/6 — nicht auf "3/3 Besuchen".
    const einheiten=(hv.alle||tage).slice().sort();
    const totalY=einheiten.length;
    let positionNum=0;for(const ds of einheiten){if(ds<=apptKey)positionNum++;}
    // Besuchs-Zaehlung zusaetzlich ausweisen: "Besuch 2/3" ist die Sprache des
    // Empfangs (wann kommt er noch?), "5/6 Einheiten" die Sprache von thevea.
    const besuchNum=isLetzter?tage.length:tage.length-1;
    const lastDs=tage[lastIdx];
    // Folgetermin gilt als ausgemacht, wenn der Patient NACH dem letzten Tag
    // dieses Rezepts schon irgendeinen Termin hat. Zwei Quellen:
    //   1) Termin-Historie auf Patientenebene (voller Vorausblick, alle Rezepte,
    //      auch Termine, die noch an keinem Rezept hängen)
    //   2) der 14-Tage-Terminplan (patMax) als frische Zweitquelle
    let folge=false;
    const hp=H.pat&&H.pat[String(pid)];
    if(hp&&hp.tage)for(const ds of hp.tage){if(ds>lastDs){folge=true;break;}}
    if(!folge&&patMax[String(pid)]&&patMax[String(pid)]>lastDs)folge=true;
    const vo=voMap[String(vid)];
    let name=((t.PatientNachname||'')+', '+(t.PatientVorname||'')).trim();
    if(name===','&&vo)name=((vo.nachname||'')+', '+(vo.vorname||'')).trim();
    const therapeut=reThName(t.Mitarbeiter);
    rows.push({
      pid,vid,name:name===','||!name?'Unbekannt':name,therapeut,
      time:apptDate,timeStr:fmt(apptDate),
      heilmittel:t.Bezeichnung||t.Heilmittel||(vo?String(vo.heilmittel||''):''),
      positionNum,totalY,besuchNum,besuche:tage.length,
      position:isLetzter?'letzter':'vorletzter',folge
    });
  });
  rows.sort((a,b)=>a.time-b.time); // zeitlich aufsteigend
  return rows;
}

function renderRezEnde(){
  let h='';
  h+='<div class="st">🎯 Rezept-Ende · Therapiemanagement</div>';
  h+='<div style="font-size:11px;color:var(--muted);margin:-6px 0 14px">Patienten, deren <b>letzter</b> oder <b>vorletzter</b> Rezept-Termin heute/morgen liegt — ideal zum Ansprechen wegen Folgerezept &amp; Folgetermin. Der Fortschritt zählt Einheiten wie in thevea (z.B. 6/6); letzter/vorletzter richtet sich nach dem Besuchstag. Hausbesuche werden ausgeblendet.</div>';
  h+='<div class="tabs" id="reLocTabs"></div>';
  h+='<div class="sub-tabs" id="reSubTabs"></div>';

// ── Wochenübersicht interne Termine ──
const INTERN_TYP=[
  {k:'kgg',l:'KGG',re:/kgg/i,co:'var(--teal)'},
  {k:'blanko',l:'Blanko',re:/blanko/i,co:'var(--purple)'},
  {k:'praev',l:'Prävention',re:/pr[äae]vention|präv/i,co:'var(--blue)'},
  {k:'hb',l:'Hausbesuch',re:/hausbesuch|\bhb\b|altenheim/i,co:'var(--amber)'}
];
function classifyIntern(bez){for(const t of INTERN_TYP){if(t.re.test(bez||''))return t;}return null;}
function gatherInternTP(suf){
  const d=DATA[suf]||{};const src=[];
  if(d.woche&&Array.isArray(d.woche.tp))src.push(...d.woche.tp.flat());
  (d.extraDays||[]).forEach(a=>{if(Array.isArray(a))src.push(...a.flat());});
  if(d.heute&&Array.isArray(d.heute.tp))src.push(...d.heute.tp);
  if(d.morgen&&Array.isArray(d.morgen.tp))src.push(...d.morgen.tp);
  const seen=new Set(),out=[];
  src.forEach(t=>{
    if(t.PatientId||t.Art===1||t.Art===4)return; // nur interne Termine
    const typ=classifyIntern(t.Bezeichnung);if(!typ)return;
    const key=(t.Beginn||'')+'|'+(t.Bezeichnung||'')+'|'+((t.Mitarbeiter||[]).map(m=>m.Id).join(','));
    if(seen.has(key))return;seen.add(key);
    const beg=new Date(t.Beginn),end=new Date(t.Ende);if(isNaN(beg))return;
    out.push({typ,bez:t.Bezeichnung||'',beg,end,ma:(t.Mitarbeiter||[]).map(m=>((m.Vorname||'')+' '+(m.Nachname||'').replace(/\s*\(.*?\)\s*/g,'')).trim()).filter(Boolean).join(', ')});
  });
  return out;
}

    h+=`<div style="flex:1;min-width:150px;background:var(--card);border:1px solid ${isToday?'var(--teal)':'var(--border)'};border-radius:12px;padding:8px">`;

      h+=`</div>`;
    });
    h+=`</div>`;});
  h+=`</div>`;
  if(!inWeek.length)h+=`<div style="font-size:10px;color:var(--muted);margin-top:6px">Keine internen Termine in dieser KW – es sind nur die exportierten Tage verfügbar (rund um diese Woche).</div>`;
  el.innerHTML=h;
}

// AUSLASTUNG HISTORIE (Werneck) — dynamisch aus thevea
// Quelle: auslastung_historie_werneck.json (verfügbare BE)
// ═══════════════════════════════════════════════════════════
const histTAKT={physio:20,ergo:30};
const HIST_IGNORE=['christine franz'];
// Feste, wiederkehrende Blocker (z.B. Inno Time, Meetings). Werden als Lücke abgezogen.
// wochentag: 0=So,1=Mo,2=Di,3=Mi,4=Do,5=Fr,6=Sa · minProTherapeut = Minuten je anwesendem Therapeuten
const HIST_BLOCKER=[
  {name:'Inno Time', wochentag:1, minProTherapeut:60}
];
const hRound1=x=>Math.round(x*10)/10;
const hNorm=s=>String(s||'').toLowerCase().replace(/\s*\(.*?\)\s*/g,'').replace(/\s+/g,' ').trim();
const hToMin=t=>{const p=String(t).split(':');return (+p[0])*60+(+p[1])+(p[2]?(+p[2])/60:0);};
const hAzMin=b=>(b||[]).reduce((s,x)=>s+(hToMin(x.Ende)-hToMin(x.Start)),0);
const HWTAG=['So','Mo','Di','Mi','Do','Fr','Sa'];
function hVerfuegbarTag(spalten,bereich){
  let verf=0,verlust=0,abw=0,aktiv=0,arbeitend=0;const takt=histTAKT[bereich]||20;
  for(const a of (spalten||[])){
    if(a.IsActive===false)continue;
    if(HIST_IGNORE.includes(hNorm((a.Vorname||'')+' '+(a.Nachname||''))))continue;
    aktiv++;const be=hAzMin(a.Arbeitszeiten)/takt;
    if(a.IstAbwesend===true||a.Feiertag){verlust+=be;abw++;}else{verf+=be;if(be>0)arbeitend++;}
  }
  return {verfuegbarBE:hRound1(verf),verlustBE:hRound1(verlust),anzahlTherapeuten:aktiv,anzahlAbwesend:abw,arbeitend:arbeitend};
}
function hTagKPI(spalten,unbesetzt,bereich,blockerBE){
  const v=hVerfuegbarTag(spalten,bereich);const u=Math.max(0,+unbesetzt||0);const bl=Math.max(0,+blockerBE||0);
  const belegt=Math.max(0,hRound1(v.verfuegbarBE-u-bl));
  const ausl=v.verfuegbarBE>0?Math.round(belegt/v.verfuegbarBE*1000)/10:null;
  const maxA=v.verfuegbarBE>0?Math.round((v.verfuegbarBE-bl)/v.verfuegbarBE*1000)/10:null;
  return {...v,unbesetztBE:hRound1(u),blockerBE:hRound1(bl),belegtBE:belegt,auslastung:ausl,maxAusl:maxA};
}
function hIsoKW(d){const t=new Date(d+'T00:00:00');const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day+3);const f=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-f)/864e5-3+((f.getDay()+6)%7))/7);}
function hWtag(d){return HWTAG[new Date(d+'T12:00:00').getDay()];}
function hWocheKPI(tage){
  const sum=k=>hRound1(tage.reduce((s,t)=>s+(t[k]||0),0));
  const v=sum('verfuegbarBE'),b=sum('belegtBE');
  const withA=tage.filter(t=>t.verfuegbarBE>0&&t.auslastung!=null);
  const best=withA.length?withA.reduce((a,c)=>c.auslastung>a.auslastung?c:a):null;
  const worst=withA.length?withA.reduce((a,c)=>c.auslastung<a.auslastung?c:a):null;
  return {tage,verfuegbarBE:v,belegtBE:b,unbesetztBE:sum('unbesetztBE'),blockerBE:sum('blockerBE'),verlustBE:sum('verlustBE'),
    auslastungWoche:v>0?Math.round(b/v*1000)/10:null,
    auslastungMax:v>0?Math.round((v-sum('blockerBE'))/v*1000)/10:null,
    besterTag:best?{wtag:hWtag(best.datum),datum:best.datum,auslastung:best.auslastung}:null,
    schlechtesterTag:worst?{wtag:hWtag(worst.datum),datum:worst.datum,auslastung:worst.auslastung}:null};
}
function hProKW(historie,gapsByDate,bereichVon){
  gapsByDate=gapsByDate||{};
  const tage=(historie||[]).map(e=>{
    const b=bereichVon?bereichVon(e):'physio';
    const takt=histTAKT[b]||20;
    const v0=hVerfuegbarTag(e.spalten||[],b);
    const wd=new Date(e.onDay+'T12:00:00').getDay();
    let blockerBE=0;
    for(const bl of HIST_BLOCKER){if(bl.wochentag===wd)blockerBE+=v0.arbeitend*(bl.minProTherapeut/takt);}
    const t=hTagKPI(e.spalten||[],gapsByDate[e.onDay]||0,b,blockerBE);
    return {...t,datum:e.onDay,wtag:hWtag(e.onDay),kw:hIsoKW(e.onDay)};
  }).filter(t=>t.verfuegbarBE>0||t.verlustBE>0);
  const byKW={};for(const t of tage){(byKW[t.kw]=byKW[t.kw]||[]).push(t);}
  return Object.keys(byKW).map(Number).sort((a,b)=>a-b).map(kw=>({kw,...hWocheKPI(byKW[kw])}));
}
function hBuildGaps(values){
  const gaps={};if(!values||!values.length)return gaps;
  const head=values[0].map(c=>String(c||'').toLowerCase());
  const cDat=head.findIndex(h=>h.includes('datum'));
  const cNb=head.findIndex(h=>h.includes('nicht besetzt'));
  if(cDat<0||cNb<0)return gaps;
  for(let r=1;r<values.length;r++){
    const row=values[r];if(!row)continue;
    const d=parseDate(row[cDat]);if(!d)continue;
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const raw=String(row[cNb]==null?'':row[cNb]).replace(',','.').trim();
    if(raw!==''&&!isNaN(+raw))gaps[iso]=+raw;
  }
  return gaps;
}
function hCard(label,sub,val,col){return `<div class="hk"><div class="hk-l">${label}</div><div class="hk-v" style="color:${col}">${val}</div><div class="hk-sub">${esc(sub)}</div></div>`;}
function hBar(label,v,onclick,sel,ceil){
  const w=Math.min(100,Math.max(5,v));

  const cval=ceil!=null?`<br><span style="font-size:8px;color:var(--muted);font-weight:600">max ${ceil}%</span>`:'';
  return `<div class="ausl-row" style="${onclick?'cursor:pointer;':''}border-radius:8px;${sel?'box-shadow:0 0 0 2px var(--red)':''}" ${onclick?`onclick="${onclick}"`:''}>`+
    `<span class="ausl-label" style="width:60px">${label}</span>`+
    `<div class="ausl-bar"><div class="ausl-fill" style="width:${w}%;background:${auslBg(v)}">${v}%</div><div class="ausl-target" style="left:90%"></div>${cmark}</div>`+
    `<span class="ausl-val" style="color:${auslColor(v)}">${v}%${cval}</span></div>`;
}
function renderHistorie(){
  const el=document.getElementById('histDiv');if(!el)return;
  if(!histKWs||!histKWs.length){el.innerHTML='<div style="color:var(--muted);font-size:12px;padding:12px">Keine Historie-Daten geladen (auslastung_historie_werneck.json prüfen).</div>';return;}
  const kws=histKWs;if(histSelKW==null)histSelKW=kws[kws.length-1].kw;
  const cur=kws[kws.length-1];
  const withA=kws.filter(w=>w.auslastungWoche!=null);
  const avg=withA.length?Math.round(withA.reduce((s,w)=>s+w.auslastungWoche,0)/withA.length*10)/10:0;
  const best=withA.reduce((a,c)=>c.auslastungWoche>a.auslastungWoche?c:a,withA[0]);
  const worst=withA.reduce((a,c)=>c.auslastungWoche<a.auslastungWoche?c:a,withA[0]);
  let h='<div class="hero" style="grid-template-columns:repeat(4,1fr)">';
  h+=hCard('Letzte KW','KW '+cur.kw+' · max '+(cur.auslastungMax!=null?cur.auslastungMax:'–')+'%',(cur.auslastungWoche||0)+'%',auslColor(cur.auslastungWoche||0));
  h+=hCard('Schnitt Jahr',withA.length+' Wochen',avg+'%',auslColor(avg));
  h+=hCard('Beste KW','KW '+best.kw,best.auslastungWoche+'%','var(--teal)');
  h+=hCard('Schlechteste KW','KW '+worst.kw,worst.auslastungWoche+'%','var(--red)');

function hTherapeutenTag(spalten,bereich){
  const takt=histTAKT[bereich]||20;const out=[];
  for(const a of (spalten||[])){
    if(a.IsActive===false)continue;
    const name=((a.Vorname||'')+' '+(a.Nachname||'')).trim();
    if(HIST_IGNORE.includes(hNorm(name)))continue;
    const min=hAzMin(a.Arbeitszeiten);
    const abwesend=(a.IstAbwesend===true||!!a.Feiertag);
    const status=a.Feiertag?a.Feiertag:(a.IstAbwesend?(a.Abwesenheitsbezeichnung||'Abwesend'):'arbeitet');
    out.push({name,sollMin:Math.round(min),be:hRound1(min/takt),status,abwesend});
  }
  out.sort((x,y)=>(y.abwesend===x.abwesend)?(y.be-x.be):(x.abwesend?1:-1));
  return out;
}

const arztNamesManual=JSON.parse(localStorage.getItem('arztNames')||'{}');
function saveArztName(key,name){

  if(t)arztNamesManual[key]={name:t,updated:Date.now()};
  else delete arztNamesManual[key];
  localStorage.setItem('arztNames',JSON.stringify(arztNamesManual));
}
// Inline-Edit: User trägt Name ein → wird sofort gespeichert + Tabelle re-rendert

// Sammelt alle Verordnungen pro Arzt aus einer Datenquelle.
// Aktuell nur ergoDetailData. Strukturiert so, dass weitere Quellen leicht ergänzbar sind.
function getZuweiserData(source){
  const arzte={};
  const today=new Date();today.setHours(0,0,0,0);

  // Helper: VO + Arzt-Info hinzufügen
  function addVerordnung(arztKey,arztName,arztDetails,vo){
    if(!arzte[arztKey]){
      arzte[arztKey]={
        key:arztKey,
        name:arztName||'Unbekannt',
        lanr:arztDetails.lanr||'',
        bsnr:arztDetails.bsnr||'',
        arztId:arztDetails.arztId||'',
        verordnungen:[],
        patientIds:new Set(),
        diagnosegruppen:new Set(),
        bereiche:new Set(),
        blankoCount:0,
        firstDate:null,
        lastDate:null
      };
    }
    const a=arzte[arztKey];
    a.verordnungen.push(vo);
    if(vo.patientId)a.patientIds.add(vo.patientId);
    if(vo.diagnosegruppe)a.diagnosegruppen.add(vo.diagnosegruppe);
    if(vo.bereich)a.bereiche.add(vo.bereich);
    if(vo.isBlanko)a.blankoCount++;
    if(vo.datum){
      const d=new Date(vo.datum);
      if(!a.firstDate||d<a.firstDate)a.firstDate=d;
      if(!a.lastDate||d>a.lastDate)a.lastDate=d;
    }
  }

  // ── ERGO-Datenquelle ──
  if((source==='ergo'||source==='all')&&ergoDetailData&&Array.isArray(ergoDetailData)){
    ergoDetailData.forEach(e=>{
      const vo=e.Verordnung;if(!vo)return;
      const det=vo.Details||{};
      const lanr=det.LebenslangeArztnummer||'';
      const arztId=det.ArztId||'';
      const arztNameRaw=e.ReadOnlyInformation?.Arzt||'';
      // Key bevorzugt LANR (eindeutig), fallback ArztId, fallback Name
      const key=lanr||arztId||arztNameRaw||'unknown';
      if(key==='unknown'&&!arztNameRaw)return; // keine Arzt-Info → skip
      // Manuell gepflegter Name hat Vorrang
      const arztName=arztNamesManual[key]?.name||arztNameRaw;
      const pat=vo.Patient;
      const heilmittel=(e.VerordneteHeilmittel||[]).map(hm=>hm.Bezeichnung||hm.Kurzbezeichnung).filter(Boolean);
      const voEntry={
        id:vo.Id,
        bereich:'Ergo',
        datum:det.Datum||null,
        diagnosegruppe:det.Diagnosegruppe||'',
        icd10:det.Icd10Code||det.BehandlungsrelevanteDiagnose||'',
        beschreibung:heilmittel.join(', ')||'—',
        heilmittel,
        isBlanko:!!det.IsBlankoformular,
        isReadOnly:!!vo.IsReadOnly,
        patientId:pat?.Id||'',
        patientName:pat?((pat.Nachname||'')+', '+(pat.Vorname||'')).trim():'',
        patientGeb:pat?.Geburtsdatum||'',
        patientOrt:pat?.Ort||''
      };
      addVerordnung(key,arztName,{lanr,bsnr:det.Betriebsstaettennummer||'',arztId},voEntry);
    });
  }

  return Object.values(arzte);
}

function setZuweiserSort(s,el){zuweiserSort=s;document.querySelectorAll('#zuweiserContainer .flt .fb').forEach(b=>{if(['count','patients','blanko','name'].includes(b.getAttribute('onclick')?.match(/'(\w+)'/)?.[1]))b.classList.remove('a');});el.classList.add('a');renderZuweiserTable();}
function switchZuweiser(s){zuweiserSource=s;renderZuweiser();}

function renderZuweiserTable(){
  const el=document.getElementById('zuweiserTable');if(!el)return;
  const allArzte=getZuweiserData(zuweiserSource);
  // Zeitraum-Filter: filtere Verordnungen pro Arzt nach Datum
  const now=new Date();const thisMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const last3=new Date(now.getFullYear(),now.getMonth()-3,1);
  const filtered=allArzte.map(a=>{
    let vos=a.verordnungen;
    if(zuweiserPeriod!=='all'){
      vos=vos.filter(v=>{
        if(!v.datum)return false;
        const d=new Date(v.datum);
        if(zuweiserPeriod==='thisMonth')return d>=thisMonth;
        if(zuweiserPeriod==='lastMonth')return d>=lastMonth&&d<thisMonth;
        if(zuweiserPeriod==='last3')return d>=last3;
        return true;
      });
    }
    // Recompute KPIs für gefilterten Zeitraum
    const patientIds=new Set();const dgs=new Set();let blankoCnt=0;
    vos.forEach(v=>{if(v.patientId)patientIds.add(v.patientId);if(v.diagnosegruppe)dgs.add(v.diagnosegruppe);if(v.isBlanko)blankoCnt++;});
    return{...a,verordnungenFiltered:vos,countFiltered:vos.length,patientCountFiltered:patientIds.size,dgsFiltered:[...dgs],blankoFiltered:blankoCnt};
  }).filter(a=>a.countFiltered>0);
  // Sortieren
  filtered.sort((a,b)=>{
    if(zuweiserSort==='name')return a.name.localeCompare(b.name);
    if(zuweiserSort==='patients')return b.patientCountFiltered-a.patientCountFiltered;
    if(zuweiserSort==='blanko')return(b.blankoFiltered/b.countFiltered)-(a.blankoFiltered/a.countFiltered);
    return b.countFiltered-a.countFiltered;
  });
  // Trend-Berechnung: Vergleich Verordnungen aktueller Monat vs Vormonat
  filtered.forEach(a=>{
    const cur=a.verordnungen.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);return d>=thisMonth;}).length;
    const prev=a.verordnungen.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);return d>=lastMonth&&d<thisMonth;}).length;
    a.trendCur=cur;a.trendPrev=prev;
    a.trendDelta=prev>0?Math.round((cur-prev)/prev*100):(cur>0?100:0);
  });
  // KPIs gesamt
  const totalArzte=filtered.length;
  const totalRezepte=filtered.reduce((s,a)=>s+a.countFiltered,0);
  const totalPatienten=new Set();filtered.forEach(a=>a.verordnungenFiltered.forEach(v=>{if(v.patientId)totalPatienten.add(v.patientId);}));
  const blankoTotal=filtered.reduce((s,a)=>s+a.blankoFiltered,0);
  const blankoQuote=totalRezepte>0?Math.round(blankoTotal/totalRezepte*100):0;
  let h='';
  h+='<div class="hero">';
  h+='<div class="hk"><div class="hk-l">Aktive Zuweiser</div><div class="hk-v" style="color:var(--red)">'+totalArzte+'</div><div class="hk-sub">Ärzte mit Rezepten</div></div>';
  h+='<div class="hk"><div class="hk-l">Rezepte gesamt</div><div class="hk-v">'+totalRezepte+'</div><div class="hk-sub">im Zeitraum</div></div>';
  h+='<div class="hk"><div class="hk-l">Patienten gesamt</div><div class="hk-v" style="color:var(--teal)">'+totalPatienten.size+'</div><div class="hk-sub">unique</div></div>';
  h+='<div class="hk"><div class="hk-l">Blanko-Quote</div><div class="hk-v" style="color:var(--purple)">'+blankoQuote+'%</div><div class="hk-sub">'+blankoTotal+' Blanko-VOs</div></div>';
  h+='</div>';
  // Top-3-Highlight (nur bei Sortierung nach count und mind. 3 Ärzten)
  if(zuweiserSort==='count'&&filtered.length>=3){
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px">';
    const podium=['🥇','🥈','🥉'];
    filtered.slice(0,3).forEach((a,i)=>{
      const trendIcon=a.trendDelta>0?'📈':a.trendDelta<0?'📉':'➡️';
      const trendCol=a.trendDelta>0?'var(--teal)':a.trendDelta<0?'var(--red)':'var(--muted)';
      h+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer" onclick="showZuweiserDetail('${escA(a.key)}')">`;
      h+=`<div style="font-size:24px;margin-bottom:4px">${podium[i]}</div>`;
      h+=`<div style="font-family:Inter;font-size:14px;font-weight:600;line-height:1.2">${esc(a.name)}</div>`;
      if(a.lanr)h+=`<div style="font-size:9px;color:var(--muted);margin-top:2px">LANR: ${esc(a.lanr)}</div>`;
      h+=`<div style="display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">REZEPTE</div><div style="font-family:Inter;font-size:18px;font-weight:650">${a.countFiltered}</div></div>`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">PATIENTEN</div><div style="font-family:Inter;font-size:18px;font-weight:650">${a.patientCountFiltered}</div></div>`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">TREND</div><div style="font-family:Inter;font-size:13px;font-weight:600;color:${trendCol}">${trendIcon} ${a.trendDelta>0?'+':''}${a.trendDelta}%</div></div>`;
      h+=`</div></div>`;
    });
    h+='</div>';
  }
  if(!filtered.length){
    h+='<div class="tcx"><div class="wl-empty">Keine Daten im Zeitraum</div></div>';
    el.innerHTML=h;return;
  }
  // Hauptliste
  h+='<div class="tcx"><div class="thd"><h3>Alle Zuweiser</h3><span class="cnt">'+filtered.length+' Ärzte</span></div>';
  h+='<table class="data-t"><thead><tr><th>#</th><th>Arzt</th><th>LANR</th><th class="r">Rezepte</th><th class="r">Patienten</th><th class="r">Blanko %</th><th class="r">Trend</th><th>Diagnosegruppen</th><th></th></tr></thead><tbody>';
  filtered.forEach((a,i)=>{
    const blPercent=a.countFiltered>0?Math.round(a.blankoFiltered/a.countFiltered*100):0;
    const trendIcon=a.trendDelta>0?'📈':a.trendDelta<0?'📉':'➡️';
    const trendCol=a.trendDelta>0?'var(--teal)':a.trendDelta<0?'var(--red)':'var(--muted)';
    const dgBadges=a.dgsFiltered.slice(0,4).map(dg=>`<span class="pr-b c-blue">${esc(dg)}</span>`).join('');
    const moreD=a.dgsFiltered.length>4?` <span style="font-size:9px;color:var(--muted)">+${a.dgsFiltered.length-4}</span>`:'';
    // Unbekannte Ärzte: Inline-Edit-Feld + Google-Such-Button
    const isUnknown=(a.name==='Unbekannt'||!a.name);
    let arztCell;
    if(isUnknown){
      const googleQuery=encodeURIComponent('LANR '+a.lanr+(a.bsnr?' BSNR '+a.bsnr:'')+' Arzt');
      arztCell=`<div onclick="event.stopPropagation()" style="display:flex;flex-direction:column;gap:3px">`;
      arztCell+=`<input type="text" placeholder="Name eintragen..." onblur="editArztName('${escA(a.key)}',this)" onkeydown="if(event.key==='Enter')this.blur()" style="padding:4px 8px;border:1.5px solid var(--amber);border-radius:6px;font-size:11px;font-family:Inter;outline:none;width:160px;background:var(--amber-bg)">`;
      arztCell+=`<a href="https://www.google.com/search?q=${googleQuery}" target="_blank" rel="noopener" style="font-size:9px;color:var(--blue);text-decoration:none;font-family:Inter;font-weight:700">🔎 LANR googeln</a>`;
      arztCell+=`</div>`;
    }else{
      // Bekannter Arzt: zeige Name, ggf. mit "manuell"-Badge wenn aus localStorage
      const isManual=!!arztNamesManual[a.key];
      arztCell=`<div class="pn">${esc(a.name)}${isManual?' <span style="font-size:8px;color:var(--teal);font-weight:600">●</span>':''}</div>`;
    }
    h+=`<tr style="cursor:pointer" onclick="showZuweiserDetail('${escA(a.key)}')">`;
    h+=`<td><strong>${i+1}</strong></td>`;
    h+=`<td>${arztCell}</td>`;
    h+=`<td><span style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:var(--muted)">${esc(a.lanr||'—')}</span></td>`;
    h+=`<td class="r"><strong>${a.countFiltered}</strong></td>`;
    h+=`<td class="r">${a.patientCountFiltered}</td>`;
    h+=`<td class="r"><span class="badge ${blPercent>=50?'b-amber':'b-teal'}" style="font-weight:600">${blPercent}%</span></td>`;
    h+=`<td class="r" style="color:${trendCol};font-family:Inter;font-weight:700">${trendIcon} ${a.trendDelta>0?'+':''}${a.trendDelta}%</td>`;
    h+=`<td><div class="pr-bs" style="max-width:200px;justify-content:flex-start">${dgBadges}${moreD}</div></td>`;
    h+=`<td><button class="act">Details ▶</button></td>`;
    h+=`</tr>`;
  });
  h+='</tbody></table></div>';
  // Detail-Bereich (initial leer)
  h+='<div id="zuweiserDetail"></div>';
  el.innerHTML=h;
}

function showZuweiserDetail(arztKey){
  const allArzte=getZuweiserData(zuweiserSource);
  const arzt=allArzte.find(a=>a.key===arztKey);
  const el=document.getElementById('zuweiserDetail');if(!el||!arzt)return;
  // Zeitraum-Filter auch hier anwenden
  const now=new Date();const thisMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const last3=new Date(now.getFullYear(),now.getMonth()-3,1);
  let vos=arzt.verordnungen;
  if(zuweiserPeriod!=='all'){
    vos=vos.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);
      if(zuweiserPeriod==='thisMonth')return d>=thisMonth;
      if(zuweiserPeriod==='lastMonth')return d>=lastMonth&&d<thisMonth;
      if(zuweiserPeriod==='last3')return d>=last3;
      return true;
    });
  }
  // Sortiere VOs nach Datum desc
  vos.sort((a,b)=>{const da=a.datum?new Date(a.datum):0;const db=b.datum?new Date(b.datum):0;return db-da;});
  // Patienten-Aggregation
  const byPatient={};
  vos.forEach(v=>{
    const pid=v.patientId||v.patientName;if(!pid)return;
    if(!byPatient[pid])byPatient[pid]={name:v.patientName,geb:v.patientGeb,ort:v.patientOrt,verordnungen:[]};
    byPatient[pid].verordnungen.push(v);
  });
  const patList=Object.values(byPatient).sort((a,b)=>b.verordnungen.length-a.verordnungen.length||a.name.localeCompare(b.name));
  let h='';
  h+='<div class="tcx" style="margin-top:18px;border-left:4px solid var(--red)">';
  // Header: bei "Unbekannt" Inline-Edit anbieten
  const isUnknown=(arzt.name==='Unbekannt'||!arzt.name);
  if(isUnknown){
    const googleQuery=encodeURIComponent('LANR '+arzt.lanr+(arzt.bsnr?' BSNR '+arzt.bsnr:'')+' Arzt');
    h+='<div class="thd"><div style="display:flex;flex-direction:column;gap:4px">';
    h+='<h3>🏥 Unbekannt — Name eintragen:</h3>';
    h+=`<input type="text" placeholder="Arzt-Name..." onblur="editArztName('${escA(arzt.key)}',this);showZuweiserDetail('${escA(arzt.key)}')" onkeydown="if(event.key==='Enter')this.blur()" style="padding:8px 14px;border:2px solid var(--amber);border-radius:8px;font-size:14px;font-family:Inter;outline:none;background:var(--amber-bg);max-width:340px">`;
    h+=`<a href="https://www.google.com/search?q=${googleQuery}" target="_blank" rel="noopener" style="font-size:11px;color:var(--blue);text-decoration:none;font-family:Inter;font-weight:700">🔎 LANR + BSNR googeln</a>`;
    h+='</div>';
    h+='<button class="hdr-btn" onclick="document.getElementById(\'zuweiserDetail\').innerHTML=\'\'">✕ schließen</button></div>';
  }else{
    h+='<div class="thd"><h3>🏥 '+esc(arzt.name)+'</h3>';
    h+='<button class="hdr-btn" onclick="document.getElementById(\'zuweiserDetail\').innerHTML=\'\'">✕ schließen</button></div>';
  }
  // Arzt-Stammdaten
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;padding:14px;background:var(--bg);border-radius:12px">';
  h+='<div><div style="font-size:9px;color:var(--muted);font-family:Inter;font-weight:600;letter-spacing:1px">LANR</div><div style="font-family:\'SF Mono\',Menlo,monospace;font-size:13px;font-weight:600">'+esc(arzt.lanr||'—')+'</div></div>';
  h+='<div><div style="font-size:9px;color:var(--muted);font-family:Inter;font-weight:600;letter-spacing:1px">BSNR</div><div style="font-family:\'SF Mono\',Menlo,monospace;font-size:13px;font-weight:600">'+esc(arzt.bsnr||'—')+'</div></div>';
  h+='<div><div style="font-size:9px;color:var(--muted);font-family:Inter;font-weight:600;letter-spacing:1px">Patienten</div><div style="font-family:Inter;font-size:18px;font-weight:650">'+patList.length+'</div></div>';
  h+='<div><div style="font-size:9px;color:var(--muted);font-family:Inter;font-weight:600;letter-spacing:1px">Rezepte</div><div style="font-family:Inter;font-size:18px;font-weight:650">'+vos.length+'</div></div>';
  h+='</div>';
  // Patient-Liste
  h+='<h4 style="font-family:Inter;font-size:13px;font-weight:600;margin-bottom:8px">👥 Patienten und ihre Rezepte</h4>';
  h+='<table class="data-t"><thead><tr><th>Patient</th><th class="r">Rezepte</th><th>Diagnosegruppen</th><th>Heilmittel</th><th>Letztes Rezept</th></tr></thead><tbody>';
  patList.forEach(p=>{
    const dgs=new Set();const hms=new Set();
    p.verordnungen.forEach(v=>{if(v.diagnosegruppe)dgs.add(v.diagnosegruppe);v.heilmittel.forEach(hm=>hms.add(hm));});
    const lastVo=p.verordnungen[0];
    const fd=lastVo.datum?new Date(lastVo.datum).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
    h+='<tr><td><div class="pn">'+esc(p.name)+'</div>';
    if(p.geb){const geb=new Date(p.geb).toLocaleDateString('de-DE');h+='<div class="th-sub">geb. '+geb+(p.ort?' · '+esc(p.ort):'')+'</div>';}
    h+='</td>';
    h+='<td class="r"><strong>'+p.verordnungen.length+'</strong></td>';
    h+='<td><div class="pr-bs" style="justify-content:flex-start;max-width:160px">'+[...dgs].map(d=>`<span class="pr-b c-blue">${esc(d)}</span>`).join('')+'</div></td>';
    h+='<td style="font-size:10px;max-width:200px">'+esc([...hms].slice(0,3).join(', '))+(hms.size>3?` +${hms.size-3}`:'')+'</td>';
    h+='<td style="font-size:10px">'+fd+(lastVo.isBlanko?' <span class="pr-b c-purple">Blanko</span>':'')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  h+='</div>';
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

    const ev=[];t.azB.forEach(b=>{ev.push({s:b[0],e:b[1],t:'w'});});for(let i=0;i<t.azB.length-1;i++)ev.push({s:t.azB[i][1],e:t.azB[i+1][0],t:'p'});
    if(t.azB.length&&t.ds<t.azB[0][0])ev.push({s:t.ds,e:t.azB[0][0],t:'o'});if(t.azB.length&&t.de>t.azB[t.azB.length-1][1])ev.push({s:t.azB[t.azB.length-1][1],e:t.de,t:'o'});
    ev.sort((a,b)=>a.s-b.s);ev.forEach(v=>{const d=(v.e-v.s)/6e4,w=(d/tSpan*100).toFixed(2);

    });h+=`</div><div class="tll"><span>${st2}</span><span>${en}</span></div></div>`;
    if(t.gaps.length){h+=`<div class="gl">`;t.gaps.forEach(g=>{if(g.kgg){h+=`<div class="gr"><span class="gt">${fmt(g.start)}–${fmt(g.end)}</span><span class="gp" style="color:var(--teal)">💪 KGG</span><span class="gn">${g.frei}×</span></div>`;}else{h+=`<div class="gr"><span class="gt">${fmt(g.start)}–${fmt(g.end)}</span><span class="gp">${Math.round(g.min)}min</span><span class="gn">${Math.floor(g.min/20)}×</span></div>`;}});h+=`</div>`;}
    h+=`<div class="aw"><div class="ab"><div class="af" style="width:${t.au}%;background:${auC}"></div></div><div class="ai"><span>${Math.round(t.wm)}min AZ</span><span style="color:${auC};font-weight:600">${t.au}%</span></div></div></div>`;

  absent.forEach(a=>{h+=`<div class="tc-card of"><div class="tt"><span class="tn">${a.name}</span><span class="tb ba">🏖 ${a.reason}</span></div></div>`;});

function renderLocTabs(){
  let h='';LOCS.forEach(l=>{h+=`<button class="tab${curLoc===l.id?' a':''}" onclick="switchLoc('${l.id}')">${l.label}</button>`;});
  h+=`<button class="tab${curLoc==='checker'?' a':''}" onclick="switchLoc('checker')">🔍 Checker</button>`;
  document.getElementById('locTabs').innerHTML=h;
}

function switchLoc(loc){
  curLoc=loc;curSub='heute';renderLocTabs();
  if(loc==='checker'){document.getElementById('subTabs').innerHTML='';renderChecker();return;}
  renderSubTabs();renderDayView();
}

function renderSubTabs(){
  if(curLoc==='checker'){document.getElementById('subTabs').innerHTML='';return;}
  const loc=LOCS.find(l=>l.id===curLoc);if(!loc)return;
  const dd=DATA[loc.suf];let h='';
  ['heute','morgen'].forEach(d=>{
    let badge='—',bg='var(--muted)';
    if(dd&&dd[d].tp&&dd[d].tp.length){
      const filtered=filterTP(dd[d].tp,dd[d].az,loc.filter);
      const info=analyzeDay(filtered.tp,filtered.az);
      badge=info.tgm>0?Math.round(info.tgm)+'min':'✓ Voll';bg=info.tgm>30?'var(--red)':'var(--teal)';
    }
    h+=`<button class="stab${curSub===d?' a':''}" onclick="curSub='${d}';renderSubTabs();renderDayView()">📅 ${d==='heute'?'Heute':getMorgenLabel()} <span class="stab-badge" style="background:${bg}">${badge}</span></button>`;
  });
  document.getElementById('subTabs').innerHTML=h;
}

function filterTP(tp,az,filter){
  if(!filter)return{tp:tp||[],az:az||[]};
  const isErgo=filter==='ergo';
  const filteredTP=(tp||[]).filter(t=>(t.Mitarbeiter||[]).some(m=>{const nn=(m.Nachname||'').toLowerCase();return isErgo?nn.includes('ergo'):nn.includes('physio');}));
  const filteredAZ=(az||[]).filter(a=>{const nn=(a.Nachname||'').toLowerCase();return isErgo?nn.includes('ergo'):nn.includes('physio');});
  return{tp:filteredTP,az:filteredAZ};
}

function renderDayView(){
  if(curLoc==='checker'){renderChecker();return;}
  const loc=LOCS.find(l=>l.id===curLoc);if(!loc)return;
  const dd=DATA[loc.suf];if(!dd){document.getElementById('dayBriefing').innerHTML='';return;}
  const dayData=dd[curSub];
  const filtered=filterTP(dayData.tp,dayData.az,loc.filter);
  const rcs=RCS[curLoc];RC=rcs?(rcs[curSub]||rcs.heute):null;
  renderDay(filtered,curSub,loc.label);
}

function renderDay(dd,day,locLabel){
  const el=document.getElementById('dayBriefing');if(!el)return;
  if(!dd.tp||!dd.tp.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Keine Daten für '+locLabel+'</div>';return;}
  const I=analyzeDay(dd.tp,dd.az);const{act,tgm,tp2,aG,aB,twg,ps,ds}=I;
  const dl=day==='heute'?'Heute':getMorgenLabel();
  const std=m=>(m/60).toFixed(1).replace('.',',')+' h';
  // Zwei Auslastungen nebeneinander, und das ist Absicht. Brutto misst gegen
  // die ganze Arbeitszeit — die Zahl, mit der sich Kosten verrechnen lassen.
  // Bereinigt misst gegen die Zeit, die überhaupt verplanbar war; nur sie ist
  // ein Urteil über die Terminvergabe. Stünde nur die erste da, sähe jeder mit
  // viel Blocker- und FL-Zeit dauerhaft nach Leerlauf aus.
  let h=`<div class="summary"><h2>${locLabel} · ${dl} · ${ds}</h2><div class="sg">`
    +`<div class="si"><div class="si-l">Echte Lücken</div><div class="si-v">${Math.round(tgm)} min</div><div class="si-s">${ps} Termine möglich${I.sKggFrei?` · ${I.sKggFrei} KGG-Plätze fehlen`:''}</div></div>`
    +`<div class="si"><div class="si-l">Auslastung</div><div class="si-v">${aG}%</div><div class="si-s">${std(I.sPg)} am Patienten von ${std(I.sWm)}</div></div>`
    +`<div class="si"><div class="si-l">Auslastung bereinigt</div><div class="si-v">${aB}%</div><div class="si-s">ohne ${std(I.sBlk)} geblockt${I.sRsv?` und ${std(I.sRsv)} reserviert`:''}</div></div>`
    +`<div class="si"><div class="si-l">Handlungsbedarf</div><div class="si-v">${twg}</div><div class="si-s">von ${act.length} mit Lücken ≥${MG}min</div></div>`
    +`</div></div>`;
  // Jeder Therapeut mit seiner Zahl — die Frage „wie viel meiner acht Stunden
  // war ich am Patienten" soll man sich hier beantworten können, ohne in ein
  // anderes Dashboard zu wechseln.
  if(act.length){
    h+='<div class="st">👤 Auslastung je Therapeut</div><div class="vl-card"><table class="data-t">'
      +'<thead><tr><th>Therapeut</th><th class="r">Arbeitszeit</th><th class="r">verplanbar</th>'
      +'<th class="r">am Patienten</th><th class="r">außer Haus</th><th class="r">geblockt</th>'
      +'<th class="r">reserviert</th><th class="r">sonstiges</th><th class="r">KGG fehlt</th>'
      +'<th class="r">Termine</th><th class="r">brutto</th><th class="r">bereinigt</th>'
      +'</tr></thead><tbody>';
    const q=v=>'<b style="color:'+(v>=90?'var(--teal)':v>=75?'var(--amber)':'var(--fire)')+'">'+v+'%</b>';
    const g=m=>m?std(m):'<span style="color:var(--faint)">–</span>';
    act.slice().sort((a,b)=>a.auB-b.auB).forEach(t=>{
      h+='<tr><td>'+esc(t.name)+'</td><td class="r">'+std(t.wm)+'</td><td class="r">'+std(t.vm)+'</td>'
        +'<td class="r">'+std(t.pm)+'</td><td class="r">'+g(t.pmAus)+'</td><td class="r">'+g(t.blk)+'</td>'
        +'<td class="r">'+g(t.rsv)+'</td><td class="r">'+g(t.son)+'</td>'
        +'<td class="r">'+(t.kggFrei?t.kggFrei+' <span style="color:var(--faint)">('+Math.round(t.kggMin)+' min)</span>':'<span style="color:var(--faint)">–</span>')+'</td>'
        +'<td class="r">'+t.pc+'</td>'
        +'<td class="r">'+q(t.au)+'</td><td class="r">'+q(t.auB)+'</td></tr>';
    });
    h+='</tbody></table>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.7">'
      +'<b>verplanbar</b> ist die Arbeitszeit ohne alles, was nicht zu vergeben war: '
      +'<b>geblockt</b> (FL-Zeit, Inno-Time, interne Fortbildung, Einarbeitung, ganztägige Blocker) '
      +'und <b>reserviert</b> (kurze Blocker — für einen Dauerpatienten freigehaltene Plätze). '
      +'<b>sonstiges</b> bleibt dagegen drin: Besprechungen, Planung und Einweisungen sind das, was '
      +'jemand in einer Lücke erledigt hat, weil kein Patient da war — die Zeit war zu vergeben, sie '
      +'wurde nur anders genutzt. <b>außer Haus</b> sind Hausbesuche und Heime: Patientenzeit, nur '
      +'nicht in der Praxis. <b>KGG fehlt</b> zählt, wie weit eine Gruppenstunde unter dem Soll von '
      +KGG_SOLL+' Personen lag — je fehlender Person eine volle Stunde. '+KGG_SOLL+' von '+KGG_CAP
      +' gelten als voll; der dritte Platz ist Zugabe und wird in der Nachrücker-Liste trotzdem '
      +'angeboten. Steht jemand im Block, zählt die ganze Stunde als Patientenzeit: Der Therapeut '
      +'ist gebunden, nicht nur die zwanzig Minuten des Einzeltermins.</div></div>';
  }
  // Jede Lücke ist dieselbe Aufgabe wie im Tagesziel — gleiche ID, gleicher
  // Zuständiger, gleicher Status, gleiche Notiz. Wer hier arbeitet, soll nicht
  // in den anderen Reiter wechseln müssen, um zu sehen, wer dran ist.
  if(tgm>0||act.some(t=>t.hasKGG)){h+=`<div class="st">⚡ Lücken</div>`;act.filter(t=>t.gt>0||t.hasKGG).forEach(t=>{t.gaps.forEach(g=>{const gs=g.start.toISOString();const tn=t.name.replace(/'/g,"\\'");
    const lid=lueckeId(curLoc,ds,t.name,fmt(g.start),!!g.kgg),st=taskStatus(lid),fertig=taskDone(lid);
    const meta=taskMeta(lid,'luecke',t.name)+notizZeile(lid);
    if(g.kgg){const sl=g.frei;h+=`<div class="ac ${AUF_STATUS[st].k}${fertig?' ac-done':''}"><span style="font-size:16px">💪</span><div class="ac-b"><div class="ac-t">${t.name} — KGG: ${sl} ${sl===1?"Platz":"Plätze"} frei</div><div class="ac-s">${fmt(g.start)} – ${fmt(g.end)} · ${g.belegt}/${KGG_CAP} belegt</div>${meta}</div><span class="ac-p" style="cursor:pointer;background:var(--teal-bg);color:var(--teal)" onclick="showGapNR(${Math.round(g.min)},this,'${tn}','${gs}',true)" title="KGG-Nachrücker anzeigen">💪 ${sl}×</span></div>`;}
    else{const sl=Math.floor(g.min/20),ic=g.min>=60?'🔴':g.min>=40?'🟡':'🟢';h+=`<div class="ac ${AUF_STATUS[st].k}${fertig?' ac-done':''}"><span style="font-size:16px">${ic}</span><div class="ac-b"><div class="ac-t">${t.name} — ${Math.round(g.min)} min</div><div class="ac-s">${fmt(g.start)} – ${fmt(g.end)} · ${sl} Slot${sl>1?'s':''}</div>${meta}</div><span class="ac-p" style="cursor:pointer" onclick="showGapNR(${Math.round(g.min)},this,'${tn}','${gs}')" title="Nachrücker anzeigen">🔥 ${sl}×</span></div>`;}
  });});h+=`<div id="gapNR"></div>`;}
  else h+=`<div style="background:var(--teal-bg);border-radius:16px;padding:18px;text-align:center;margin-bottom:16px"><span style="font-size:20px">✅</span><div style="font-family:Inter;font-size:14px;font-weight:600;color:var(--teal);margin-top:4px">Voll ausgelastet!</div></div>`;
  // Das Rezept-Cockpit stand hier früher ein zweites Mal. Es lebt jetzt im
  // eigenen Reiter „💊 Rezepte"; hier geht es nur um den Tag und seine Lücken.
  // Ein Verweis genügt, damit niemand danach sucht.
  if(RC){
    const off=rzRueckstand(RC);
    h+=`<div class="tp-hint" style="margin-top:14px">💊 Offener Rezept-Rückstand an diesem Standort: <b>${off}</b> Patienten — `
      +`<a href="#" onclick="switchView('rezepte');return false">im Reiter „Rezepte" bearbeiten</a></div>`;
  }
  el.innerHTML=h;
}

function mergeR(ranges){if(!ranges.length)return[];ranges.sort((a,b)=>a[0]-b[0]);const m=[[ranges[0][0],ranges[0][1]]];for(let i=1;i<ranges.length;i++){const l=m[m.length-1];if(ranges[i][0]<=l[1]){if(ranges[i][1]>l[1])l[1]=ranges[i][1];}else m.push([ranges[i][0],ranges[i][1]]);}return m;}
function rSum(m){return m.reduce((s,r)=>(r[1]-r[0])/6e4+s,0);}
// Eine zusammengelegte Menge von einer anderen abziehen.
//
// Gebraucht, damit sich die Zeittöpfe nicht überlappen. Im Ergo-Kalender liegen
// die Einzeltermine eines Heimbesuchs INNERHALB des Heim-Blocks. Wurden beide
// Töpfe getrennt gemessen und addiert, kamen für einen Achtstundentag zwölf
// Stunden Patientenzeit heraus — und eine Auslastung von 109 %. Beide Mengen
// müssen sortiert und zusammengelegt sein (mergeR).
function rMinus(a,b){
  if(!b.length)return a;
  const out=[];
  a.forEach(([s,e])=>{
    let c=s;
    b.forEach(([x,y])=>{
      if(y<=c||x>=e)return;
      if(x>c)out.push([c,new Date(Math.min(x,e))]);
      if(y>c)c=new Date(y);
    });
    if(c<e)out.push([c,e]);
  });
  return out.filter(([s,e])=>e>s);
}
function pTime(ds,ts){const d=new Date(ds+'T'+ts);if(isNaN(d)){const p=ts.split(':');return new Date(new Date(ds).setHours(+p[0],+p[1],p[2]?+p[2]:0));}return d;}

// ── Wie ein Termin in die Auslastung eingeht ───────────────────────────────
//
// thevea kennt für interne Einträge nur Art 0 und eine frei getippte
// Bezeichnung — ein Feld „das ist ein Blocker" gibt es nicht. Entschieden wird
// deshalb am Text, und zwar tolerant: Die Schreibweisen sind im Haus gewachsen
// (Blocker/blocker/Geblockt/Geblock, FL-Zeit/FL Zeit, Interne FoBi/Interne
// Fobi, sechs Varianten für Altenheim). Eine Prüfung auf Gleichheit würde die
// Hälfte übersehen.
//
// Die Reihenfolge entscheidet und ist Absicht:
//   1. geblockt   — ein Blocker ist nie etwas anderes
//   2. außer Haus — auch wenn der Termin ein Patiententermin ist: Ein
//      Hausbesuch IST Patientenzeit, soll aber getrennt sichtbar sein. Am
//      Feld IsHausbesuch lässt sich das nicht festmachen — an den 35
//      Heim-Einträgen im 14-Tage-Fenster ist es kein einziges Mal gesetzt.
//   3. Kurs       — Gruppenangebote zählen wie Patientenzeit
//   4. Patient    — Art 1/4 oder eine PatientId
//   5. sonstiges  — alles übrige Interne (Besprechungen, Planung, Patienten-
//      namen ohne Verordnung). Bleibt im Nenner: Es ist Arbeitszeit, nur keine
//      am Patienten. Wie groß dieser Topf ist, weist das Dashboard aus — wächst
//      er, gehört eine Zeile hier oben ergänzt.
// Zwei Arten von Blockzeit, und sie bedeuten das Gegenteil voneinander.
//
// Benannte Blöcke (Inno-Time, FL-Zeit, interne Fortbildung, Einarbeitung) sind
// echte Blockzeit: Diese Stunden stehen nicht zum Verplanen zur Verfügung.
//
// Ein generischer „Blocker" ist meistens etwas anderes — ein für einen
// Dauerpatienten freigehaltener Behandlungsplatz, damit der Termin nicht
// anderweitig vergeben wird. Kommt das Rezept, wird der Termin darübergelegt.
// So ein Platz ist NICHT geblockt, er ist reserviert: Er ist für Patienten
// gedacht und bringt nur so lange nichts, wie das Rezept fehlt.
//
// Unterschieden wird an der Dauer, weil thevea nichts anderes hergibt — an den
// Blocker-Einträgen sind Titel, Bemerkung, Heilmittel und VerordnungId leer.
// Die Daten trennen sich dabei von selbst: Im 14-Tage-Fenster liegen 123 von
// 129 Blockern bei 10 bis 40 Minuten (Behandlungsslots), die übrigen 6 bei 300
// bis 600 Minuten (halbe und ganze Tage). Dazwischen liegt nichts. Die Schwelle
// von 90 Minuten hat auf beiden Seiten Luft: Ein Doppeltermin von 60 Minuten
// gilt noch als Platz, ein Fünf-Stunden-Block nicht mehr.
const TA_RES_MAX=90;
const TA_BLK_NAME=/inno-?\s*time|\bfl[\s.-]*zeit|interne\s*fobi|einarbeitung/i;
const TA_BLK_GEN=/blocker|geblock/i;
const TA_AUS=/hausbesuch|altenheim|pflegeheim/i;
const TA_KURS=/\bash\b|kimojo\s*club|r(?:ü|ue)ckenfit/i;
// Der KGG-Gruppenblock. Er trägt in thevea Art 0 — ALLE 28 im 14-Tage-Fenster,
// kein einziger Art 3. Die alte Erkennung prüfte auf Art 3 und lief deshalb nie.
const TA_KGG=/\bkgg\b/i;

// also Fahrt und Rüstzeit inbegriffen, denn genau das ist die Frage: Trägt die
// Tour, wenn man die Wege mitrechnet?
//
// Die Preise stehen hier an einer Stelle. Ändert sich die Vergütung, ist es
// eine Zeile; verteilt im Code wäre es eine Suche.
const HB_ZIEL=80;          // Euro je Stunde, Zielwert aus dem Rechner
// Die Pauschalen, je Patient. Physio und Ergo rechnen VERSCHIEDENE Positionen
// ab — ein Ergo-Hausbesuch bringt knapp sechs Euro mehr als ein Physio-Besuch.
// Alle vier amtlich bestätigt:
//   GKV-Liste Physiotherapie ab 01.01.2026: X9950 22,78 € · X9951 13,09 €
//   GKV-Liste Ergotherapie  ab 01.07.2026: X9952 28,69 € · X9953 18,71 €
// (Die Ergo-Blankoliste führt unter 59973/59974 dieselben Beträge.)
const HB_P_WEG=22.78;      // X9950 Physio, Hausbesuch
const HB_P_HEIM=13.09;     // X9951 Physio, soziale Einrichtung
const HB_E_WEG=28.69;      // X9952 Ergo,   Hausbesuch
const HB_E_HEIM=18.71;     // X9953 Ergo,   soziale Einrichtung
// Ab welcher Blocklänge ein Eintrag als Tour gilt. Darunter ist der Block in
// aller Regel die Behandlung selbst und keine Fahrt mit mehreren Stationen.
const HB_MIN_TOUR=60;
const HB_HEIM_RE=/altenheim|pflegeheim/i;
// Die Preisliste. Jede Zeile nennt ihre Quelle:
//
//   [G] amtliche GKV-Preisliste mit Positionsnummer — die verbindliche
//       Quelle. Physiotherapie ab 01.01.2026, Ergotherapie ab 01.07.2026.
//       Seit dem Nachziehen der Ergo-Liste steht hier kein geschätzter Satz
//       mehr: Jede Position ist amtlich belegt.
//   [S] Standardsatz: Was keine Regel trifft, wird mit dem Satz für allgemeine
//       Krankengymnastik gerechnet. Das ist die häufigste Leistung bei weitem,
//       und eine Behandlung ganz wegzulassen verzerrt stärker als sie etwas zu
//       niedrig anzusetzen. Wie oft die Annahme greift, wird mitgezählt und
//       ausgewiesen — eine Zahl, die zur Hälfte auf Annahmen beruht, soll das
//       auch sagen.
//
// Die Blanko-Listen führen dieselben Beträge wie die regulären GKV-Listen;
// eine Blankoverordnung ist kein eigener Preis, sondern dieselbe Leistung mit
// freier Wahl durch den Therapeuten. Der Eintrag „Blankoverordnung" sagt nicht,
// was erbracht wurde — er fällt deshalb auf den Standardsatz.
//
// REIHENFOLGE ENTSCHEIDET. Das allgemeine Krankengymnastik steht ganz unten,
// sonst schluckt es „Gerätegestützte Krankengymnastik" und „KG-ZNS" mit. MLD-60
// muss vor dem allgemeinen MLD stehen, sonst bekommt eine Sechzig-Minuten-
// Lymphdrainage den Dreißig-Minuten-Preis.
//
// Ein leerer oder unbekannter Eintrag bekommt den Standardsatz. Still passiert
// das nicht: hbGeraten() sagt, wann geraten wurde, und die Auswertung zeigt es
// an. Eine Zahl, die auf Annahmen beruht, muss das offenlegen.
//
// Die dritte Spalte sagt, ob die Leistung zur ERGO gehört. Daran hängt die
// Hausbesuchspauschale: „Hirnleistungstraining" gibt es in keiner Physio-Liste,
// die Leistung verrät also den Bereich, ohne dass er mitgegeben werden muss.
const HB_PREISE=[
  [/zns|bobath|vojta|pnf/i,                   47.06],  // [G] X0710/0711/0712
  [/(mld|lymphdrainage)[\s\S]*?\b60\b/i,      71.94],  // [G] X0202
  [/(mld|lymphdrainage)[\s\S]*?\b45\b/i,      53.94],  // [G] X0201
  [/mld|lymphdrainage/i,                      35.97],  // [G] X0205
  [/manuelle\s*therapie|\bmt\b/i,            35.59],  // [G] X1201
  [/bewegungsbad/i,                           33.87],  // [G] X0902
  [/\bgruppe\b/i,                              8.43],  // [G] X0401
  [/traktion/i,                                8.63],  // [G] X1104
  // Ergotherapie, GKV-Liste ab 01.07.2026. Die Beträge lagen vorher als
  // Durchschnitt aus der Abrechnung hier und waren um 8 bis 12 % zu niedrig.
  [/hirnleistung|neuropsycholog/i,            59.27,1],// [G] X4104
  [/psychisch[\s-]*funktionell/i,             98.79,1],// [G] X4105
  [/sensomotorisch/i,                         79.03,1],// [G] X4103
  [/motorisch[\s-]*funktionell/i,             59.27,1],// [G] X4102
  [/ger(ä|ae?)t|\bkgg\b/i,                    55.81],  // [G] X0507, bis 3 Pat.
  [/erstbefund|diagnostik/i,                  36.61],  // [G] 20522 PD (Blanko)
  [/warmpack/i,                               16.16],  // [G] X1501
  [/hei(ß|ss)e\s*rolle/i,                     13.47],  // [G] X1530
  [/wärme|heißluft/i,                          7.43],  // [G] X1517
  [/krankengymnastik|\bkg\b/i,                29.63]   // [G] X0501, zuletzt!
];
// Der Satz für allgemeine Krankengymnastik (X0501). Alles, was keine Regel
// trifft, wird damit gerechnet.
const HB_STANDARD=29.63;
function hbPreis(bz){
  const t=String(bz||'');
  for(const[re,p] of HB_PREISE)if(re.test(t))return p;
  return HB_STANDARD;
}
// Wurde der Standardsatz nur angenommen? Gebraucht, um auszuweisen, wie viel
// einer Umsatzzahl auf Annahme beruht.
function hbGeraten(bz){
  const t=String(bz||'');
  for(const[re] of HB_PREISE)if(re.test(t))return false;
  return true;
}
// Verrät die Leistung, dass es Ergotherapie ist? null heißt: sagt nichts —
// etwa bei „Blankoverordnung", die den Bereich offenlässt.
function hbIstErgo(bz){
  const t=String(bz||'');
  for(const[re,,e] of HB_PREISE)if(re.test(t))return!!e;
  return null;
}
// Die Pauschale je Patient. Welche gilt, entscheidet der Bereich; wo die
// Leistung ihn nicht verrät, gilt der PHYSIO-Satz — der niedrigere. Eine
// Tour zu gut aussehen zu lassen wäre der teurere Fehler.
function hbPauschale(txt,ergo){
  const heim=HB_HEIM_RE.test(String(txt||''));
  return ergo?(heim?HB_E_HEIM:HB_E_WEG):(heim?HB_P_HEIM:HB_P_WEG);
}
function terminMin(t){
  const a=new Date(t&&t.Beginn),b=new Date(t&&t.Ende);
  return(isNaN(a)||isNaN(b))?0:(b-a)/6e4;
}
// Wie ein Termin in die Auslastung eingeht.
//
// thevea kennt für interne Einträge nur Art 0 und eine frei getippte
// Bezeichnung — ein Feld „das ist ein Blocker" gibt es nicht. Entschieden wird
// deshalb am Text, und zwar tolerant: Die Schreibweisen sind im Haus gewachsen
// (Blocker/blocker/Geblockt/Geblock, FL-Zeit/FL Zeit, Interne FoBi/Interne
// Fobi, sechs Varianten für Altenheim). Eine Prüfung auf Gleichheit würde die
// Hälfte übersehen.
//
// Die Reihenfolge entscheidet und ist Absicht:
//   1. benannt geblockt — Entwicklungszeit ist nie etwas anderes
//   2. Blocker         — kurz heißt reservierter Platz, lang heißt geblockt
//   3. außer Haus      — auch wenn der Termin ein Patiententermin ist: Ein
//      Hausbesuch IST Patientenzeit, soll aber getrennt sichtbar sein. Am Feld
//      IsHausbesuch lässt sich das nicht festmachen — an den 35 Heim-Einträgen
//      im 14-Tage-Fenster ist es kein einziges Mal gesetzt.
//   4. Kurs            — Gruppenangebote zählen wie Patientenzeit
//   5. Patient         — Art 1/4 oder eine PatientId
//   6. sonstiges       — alles übrige Interne (Besprechungen, Planung,
//      Patientennamen ohne Verordnung). Bleibt im Nenner: Es ist Arbeitszeit,
//      nur keine am Patienten. Wie groß dieser Topf ist, weist das Dashboard
//      aus — wächst er, gehört eine Zeile hier oben ergänzt.
// Ein Eintrag, der die Vorbereitung einer Sache benennt, ist nicht die Sache.
// „Planung Rückenfit x Moni" ist zwanzig Minuten Schreibtisch, kein Kurs — ohne
// diese Zeile zählte es als Patientenzeit und hob Angelinas Auslastung um einen
// Punkt. Geprüft wird vor allem anderen, weil der Name der Sache sonst gewinnt.
const TA_ORGA=/\bplanung\b|vorbereit|\bmeeting\b|besprech/i;
function terminArt(t){
  const bz=String((t&&t.Bezeichnung)||'');
  if(TA_ORGA.test(bz))return'son';
  if(TA_BLK_NAME.test(bz))return'blk';
  if(TA_BLK_GEN.test(bz))return terminMin(t)<=TA_RES_MAX?'res':'blk';
  if(TA_AUS.test(bz))return'aus';
  if(TA_KURS.test(bz))return'kurs';
  if(t&&(t.PatientId||t.Art===1||t.Art===4))return'pat';
  // Erst nach dem Patientencheck: Ein Termin, der KGG heißt und einen Patienten
  // trägt, ist die Behandlung — der Block ohne Patienten ist die Gruppenstunde.
  if(TA_KGG.test(bz))return'kgg';
  return'son';
}

function analyzeDay(tp,az){
  if(!tp||!tp.length)return{act:[],absent:[],tgm:0,tp2:0,aA:0,twg:0,ps:0,ds:'Keine Daten'};
  const ds=tp[0].Beginn.slice(0,10);const dd=new Date(ds+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  // Schutz: wenn AZ-Datei ein anderes Datum hat (z.B. Samstag statt Montag am Freitag),
  // ist sie unbrauchbar → ignorieren und Arbeitszeiten aus TP ableiten
  let azValid=az;
  if(az&&az.length&&az[0].OnDay&&az[0].OnDay!==ds){
    console.warn(`AZ-Datum (${az[0].OnDay}) stimmt nicht mit TP-Datum (${ds}) überein — AZ wird ignoriert`);
    azValid=null;
  }
  const azById={};if(azValid)azValid.forEach(a=>{azById[a.Id]={az:a.Arbeitszeiten||[],absent:a.IstAbwesend,label:a.Abwesenheitsbezeichnung};});
  const IGNORE=['Christine Franz'];
  const T={};tp.forEach(t=>{(t.Mitarbeiter||[]).forEach(m=>{const id=m.Id,vn=(m.Vorname||'').trim(),nn=(m.Nachname||'').trim();if(!vn)return;if(INAKTIVE_MA.has(String(id)))return;if(TEAM_IDS.size&&!TEAM_IDS.has(String(id)))return;if(IGNORE.some(n=>n.toLowerCase()===(vn+' '+nn.replace(/\s*\(.*?\)\s*/g,'').trim()).toLowerCase()))return;if(!T[id])T[id]={vn,nn,dn:vn+' '+nn.replace(/\s*\(.*?\)\s*/g,'').trim(),ar:[],pz:[],pc:0};T[id].ar.push([new Date(t.Beginn),new Date(t.Ende)]);
    // Patientenzeit getrennt mitführen: Nur sie darf die Schicht verlängern.
    const ta=terminArt(t);
    if(ta==='pat'||ta==='kurs'||ta==='aus')T[id].pz.push([new Date(t.Beginn),new Date(t.Ende)]);
    if(t.PatientId||t.Art===1||t.Art===4)T[id].pc++;});});
  const res=[],absent=[];
  Object.entries(T).forEach(([id,th])=>{
    const ai=azById[id];if(ai&&ai.absent){absent.push({name:th.dn,reason:ai.label||'Abwesend'});return;}
    const azB=[];if(ai&&ai.az.length){ai.az.forEach(a=>{const s=pTime(ds,a.Start),e=pTime(ds,a.Ende);if(!isNaN(s)&&!isNaN(e))azB.push([s,e]);});azB.sort((a,b)=>a[0]-b[0]);}
    if(!azB.length&&!th.ar.length)return;
    const am=th.ar.length?mergeR(th.ar.map(r=>[new Date(r[0]),new Date(r[1])])):[];
    // SCHICHT = Arbeitszeit-Vorlage ∪ Patientenzeit.
    //
    // In thevea sind die Arbeitszeiten Wochen-Vorlagen (validFrom/validUntil je
    // Wochentag). Sie stimmen bei den meisten, sind aber vereinzelt
    // unvollständig — Mittwoch erst ab 13:00, obwohl ab 08:20 behandelt wird.
    // Ohne die Vereinigung bliebe der halbe Tag unbewertet und die Quote liefe
    // über 100 %.
    //
    // Vereinigt wird aber NUR mit der Patientenzeit, nicht mit allen Terminen.
    // Wer nach Feierabend eine Geräteeinweisung im Kalender stehen hat, hat
    // deshalb keine längere Schicht — sonst verlängerte jeder interne Eintrag
    // nach 17 Uhr den Nenner und senkte die eigene Auslastung. Im 14-Tage-
    // Fenster liegen 1.400 Minuten interner Einträge außerhalb der Vorlagen,
    // gegenüber 535 Minuten Patiententerminen; mit der alten Regel hätten die
    // internen die Schicht dominiert. Behandelt jemand außerhalb seiner
    // Vorlage, wächst die Schicht weiterhin — das ist der Fall, für den die
    // Vereinigung gedacht war.
    //
    // Die Vereinigung erzeugt getrennte Blöcke; echte Pausen dazwischen bleiben
    // Pause und werden nicht fälschlich als Lücke gezählt.
    const shiftB=azB.length?mergeR([...azB.map(r=>[new Date(r[0]),new Date(r[1])]),...th.pz.map(r=>[new Date(r[0]),new Date(r[1])])]):[];
    const gaps=[];let gt=0,twm=rSum(shiftB);
    // Die Schicht, in der gerechnet wird. Ohne Arbeitszeitvorlage wird sie aus
    // den Terminen abgeleitet — erster Beginn bis letztes Ende. Dass beide Wege
    // danach IN DENSELBEN Rechenkern laufen, ist der Punkt: Vorher bekam der
    // Fallback seine eigene Formel (pm = Summe aller Termine) und damit
    // zwangsläufig 100 %, egal was an dem Tag wirklich lief.
    let schicht=shiftB;
    if(!shiftB.length){
      // Ohne Vorlage ist die Patientenzeit das Einzige, was belegt, dass
      // überhaupt gearbeitet wurde — erste Behandlung bis letzte. Interne
      // Einträge spannen hier nichts auf: Sonst machte ein Meeting um acht und
      // eines um achtzehn Uhr aus einem halben Tag einen ganzen.
      const pzM=th.pz.length?mergeR(th.pz.map(r=>[new Date(r[0]),new Date(r[1])])):[];
      if(!pzM.length)return;
      schicht=[[pzM[0][0],pzM[pzM.length-1][1]]];
      twm=(schicht[0][1]-schicht[0][0])/6e4;
    }
    schicht.forEach(([s,e])=>{let c=s;am.forEach(([aS,aE])=>{if(aE<=s||aS>=e)return;const cs=new Date(Math.max(aS,s)),ce=new Date(Math.min(aE,e));if(cs>c){const g=(cs-c)/6e4;if(g>=MG){gaps.push({start:c,end:cs,min:g});gt+=g;}}c=new Date(Math.max(c,ce));});if(c<e){const g=(e-c)/6e4;if(g>=MG){gaps.push({start:c,end:e,min:g});gt+=g;}}});

    // String-Vergleich, nicht ===. `id` kommt aus Object.entries() und ist
    // deshalb IMMER Text; m.Id liefert thevea als Zahl. Mit === traf das nie
    // zu, die Patientenminuten blieben null, und jeder Therapeut mit
    // hinterlegter Arbeitszeit stand mit 0 % Auslastung da. Sichtbar war das
    // nicht, weil die wenigen ohne Vorlage über den Fallback auf 100 % kamen
    // und den Schnitt auf einen plausibel aussehenden einstelligen Wert hoben.
    const topf={pat:[],aus:[],kurs:[],blk:[],res:[],kgg:[],son:[]};
    // Zu den sonstigen Einträgen wird zusätzlich der Text mitgeführt. Die
    // Aufklappansicht braucht ihn: „7,6 h anderweitig genutzt" sagt nichts,
    // „2,5 h Therapieberichte" sagt alles.
    const sonTxt=[],ausTxt=[];
    tp.forEach(t=>{
      if(!(t.Mitarbeiter||[]).some(m=>String(m.Id)===id))return;
      const ta=terminArt(t),r=[new Date(t.Beginn),new Date(t.Ende)];
      topf[ta].push(r);
      if(ta==='son')sonTxt.push([r[0],r[1],
        String(t.Bezeichnung||'').trim().replace(/\s+/g,' ').slice(0,60)||'(ohne Bezeichnung)']);
      if(ta==='aus')ausTxt.push([r[0],r[1],
        String(t.Bezeichnung||'').trim().replace(/\s+/g,' ').slice(0,60)||'(ohne Bezeichnung)']);
    });
    // ── KGG: Gruppenkapazität, nicht Einzelzeit ──────────────────────────
    // Zwei Regeln, und beide folgen daraus, dass KGG eine volle Stunde für bis
    // zu KGG_CAP Personen ist:
    //
    //   1. Steht auch nur eine Person im Block, ist der Therapeut die ganze
    //      Stunde gebunden — nicht nur die zwanzig Minuten, die am
    //      Einzeltermin stehen. Der Block zählt deshalb als Patientenzeit,
    //      die Einzeltermine darin liegen ohnehin in ihm.
    //   2. Ein freier Platz ist eine ganze Stunde unverkaufter Kapazität, auch
    //      wenn der Therapeut beschäftigt ist. Das ist eine andere Größe als
    //      eine Zeitlücke und steht deshalb getrennt.
    //
    // Gezählt werden UNTERSCHIEDLICHE Patienten, nicht Termine: In den Blöcken
    // liegen überwiegend „Blankoverordnung" (43 von 67) und nur in 19 Fällen
    // „Gerätegestützte Krankengymnastik". Auf den Namen zu prüfen fände also
    // kaum jemanden; wer zur selben Zeit beim selben Therapeuten gebucht ist,
    // sitzt in der Gruppe.
    const kggVoll=[];let kggFrei=0,kggMin=0;
    topf.kgg.forEach(([bS,bE])=>{
      if(isNaN(bS)||isNaN(bE))return;
      const pats=new Set();
      tp.forEach(t=>{
        if(!(t.PatientId||t.Art===1||t.Art===4))return;
        if(!(t.Mitarbeiter||[]).some(m=>String(m.Id)===id))return;
        const a=new Date(t.Beginn),b=new Date(t.Ende);
        if(!(a<bE&&b>bS))return;
        pats.add(t.PatientId!=null?String(t.PatientId):'x'+t.Beginn);
      });
      const belegt=pats.size,dauer=(bE-bS)/6e4;
      // Zwei Zahlen, und sie beantworten Verschiedenes:
      //   frei  — wie viele Plätze sich noch buchen lassen (bis KGG_CAP). Das
      //           braucht die Nachrücker-Liste: Auch der dritte Platz bringt
      //           Geld, wenn jemand hineinpasst.
      //   unter — wie weit die Stunde unter dem Soll liegt (KGG_SOLL). Nur das
      //           ist die wirtschaftliche Lücke. Zwei von drei sind voll; dort
      //           noch eine Lücke auszuweisen hieße, einen guten Zustand als
      //           Mangel zu zeigen.
      const frei=Math.max(0,KGG_CAP-belegt);
      const unter=Math.max(0,KGG_SOLL-belegt);
      if(belegt>0)kggVoll.push([bS,bE]);
      // Ein leerer Block ist keine Patientenzeit. Er steht trotzdem im
      // Kalender, also ist er auch keine Zeitlücke — er landet unter
      // „sonstiges", und wie teuer er war, sagt die Platzzahl.
      else{topf.son.push([bS,bE]);sonTxt.push([bS,bE,'KGG-Stunde ohne Teilnehmer']);}
      if(unter>0){kggFrei+=unter;kggMin+=unter*dauer;}
      if(frei>0)gaps.push({start:bS,end:bE,min:dauer,kgg:true,frei,belegt,unter});
    });

    // Die Töpfe werden überschneidungsfrei gebildet, nach Rang. Jede Minute
    // der Schicht zählt genau einmal, und zwar für das Wichtigste, was in ihr
    // steht. Ohne diesen Schritt summierten sich ineinander liegende Einträge
    // auf mehr Zeit, als der Tag hat.
    const clip=liste=>{
      if(!liste.length)return[];
      const m=mergeR(liste),out=[];
      schicht.forEach(([a,b])=>m.forEach(([x,y])=>{
        const o=new Date(Math.max(a,x)),u=new Date(Math.min(b,y));
        if(u>o)out.push([o,u]);}));
      return out.length?mergeR(out):[];
    };
    // Rang 1: Patientenzeit. Einzelbehandlung, Kurs und Heimbesuch in EINER
    // Menge — ein Heimblock mit Einzelterminen darin ist eine Zeit, nicht zwei.
    const P=clip([...topf.pat,...topf.kurs,...topf.aus,...kggVoll]);
    const A=clip(topf.aus);                       // davon außer Haus
    const B=rMinus(clip(topf.blk),P);             // Rang 2: echt geblockt
    const RS=rMinus(rMinus(clip(topf.res),P),B);  // Rang 3: reservierter Platz
    const SO=rMinus(rMinus(rMinus(clip(topf.son),P),B),RS); // Rang 4: übriges
    const pg=rSum(P);                             // Patientenzeit gesamt
    const pmAus=rSum(A);                          // Heim und Hausbesuch
    const pm=Math.max(0,pg-pmAus);                // davon im Haus
    const blk=rSum(B),rsv=rSum(RS),son=rSum(SO);
    // Dieselbe Menge wie SO, nur nach Eintrag aufgeteilt. Der Reihe nach, mit
    // Buchführung über das schon Vergebene: Zwei sich überlappende interne
    // Einträge dürfen zusammen nicht mehr Minuten ergeben als die Zeit, die
    // sie belegen. Die Summe der Teile ist deshalb exakt `son`.
    const sonDetail={};
    let belegt=[];
    sonTxt.sort((x,y)=>x[0]-y[0]).forEach(([a,b,txt])=>{
      let rest=rMinus(rMinus(rMinus(clip([[a,b]]),P),B),RS);
      if(belegt.length)rest=rMinus(rest,belegt);
      const m=rSum(rest);
      if(m<=0)return;
      sonDetail[txt]=(sonDetail[txt]||0)+m;
      belegt=mergeR(belegt.concat(rest));
    });
    // Wie viel der Tourzeit ist durch eingetragene Behandlungen belegt? Der
    // Rest ist Fahrt und Rüstzeit — oder Behandlung, die niemand einzeln
    // eingetragen hat. Welches von beidem, sagen die Daten nicht; die Zahl
    // heißt deshalb nicht „Fahrtzeit", sondern „Tour ohne Behandlungseintrag".
    const ausFahrt=rSum(rMinus(A,clip([...topf.pat,...topf.kurs])));
    // Jede Tour einzeln bewerten. Eine Tour, in der kein einziger Termin steht
    // oder in der eine Leistung ohne Preis vorkommt, wird NICHT mit null Euro
    // gerechnet — sie gilt als nicht bewertbar und wird getrennt gezählt.
    // Sonst zöge eine Lücke in der Kalenderpflege die Wirtschaftlichkeit nach
    // unten und sähe aus wie ein Ergebnis.
    const touren=[];
    ausTxt.forEach(([bS,bE,txt])=>{
      const dauer=(bE-bS)/6e4;
      if(!(dauer>=HB_MIN_TOUR))return;
      let ums=0,n=0,geraten=0,ergo=null;
      // Die Pauschale gilt JE PATIENT, nicht je Termin. Wer in derselben Tour
      // zwei Leistungen bekommt — Krankengymnastik und Lymphdrainage —, löst
      // den Weg einmal aus, nicht zweimal. Deshalb werden die Heilmittel über
      // die Termine gezählt, die Pauschale aber über die Patienten.
      const pats=new Set();
      tp.forEach(t=>{
        if(!(t.PatientId||t.Art===1||t.Art===4))return;
        if(!(t.Mitarbeiter||[]).some(m=>String(m.Id)===id))return;
        const a=new Date(t.Beginn),b=new Date(t.Ende);
        if(!(a<bE&&b>bS))return;
        n++;
        // Ohne PatientId lässt sich nicht zusammenfassen; dann zählt der
        // Termin für sich. Lieber eine Pauschale zu viel als eine Behandlung
        // stillschweigend verschwinden zu lassen.
        pats.add(t.PatientId!=null?String(t.PatientId):'ohne|'+t.Beginn);
        ums+=hbPreis(t.Bezeichnung);
        if(hbGeraten(t.Bezeichnung))geraten++;
        // Eine Tour gehört einem Therapeuten, der zu einem Bereich gehört.
        // Verrät eine ihrer Leistungen den Bereich, gilt er für die ganze Tour.
        const e=hbIstErgo(t.Bezeichnung);if(e!=null&&ergo==null)ergo=e;
      });
      ums+=hbPauschale(txt,ergo===true)*pats.size;
      touren.push({txt,min:Math.round(dauer),n,geraten,ums:Math.round(ums),
        eurH:dauer?Math.round(60*ums/dauer):0,bewertbar:n>0});
    });
    // Verplanbare Zeit: Arbeitszeit ohne alles, was nicht zu vergeben war.
    //
    // Das ist zweierlei: fest geblockte Zeit (FL-Zeit, Inno-Time, interne
    // Fortbildung, ganztägige Blocker) UND reservierte Plätze. Beide kann die
    // Terminvergabe nicht anderweitig besetzen — der eine, weil er für
    // Entwicklung steht, der andere, weil er für einen Dauerpatienten
    // freigehalten wird. Sie als Leerlauf zu zeigen wäre ein Vorwurf an den
    // Falschen.
    //
    // Was dagegen DRIN bleibt: die übrige interne Zeit (Besprechungen, Planung,
    // Geräteeinweisungen). Das ist, was jemand in einer Lücke erledigt hat,
    // weil kein Patient da war — es war Zeit zu vergeben, sie ist nur anders
    // genutzt worden. Sie herauszurechnen würde eine Lücke dadurch zum
    // Verschwinden bringen, dass man sie mit Schreibtischarbeit füllt.
    //
    // Der Preis der Entscheidung: Ein reservierter Platz, auf den nie ein
    // Rezept kommt, verbessert die Quote. Sichtbar bleibt das trotzdem — die
    // reservierte Zeit steht als eigene Zahl da und meldet sich, wenn sie zu
    // groß wird.
    const vm=Math.max(0,twm-blk-rsv);
    const hasKGG=gaps.some(g=>g.kgg);
    // Brutto: Wie viel der Arbeitszeit war Zeit am Patienten?
    const au=twm>0?Math.min(100,Math.round(pg/twm*100)):0;
    // Bereinigt: Wie viel der VERPLANBAREN Zeit war Zeit am Patienten?
    const auB=vm>0?Math.min(100,Math.round(pg/vm*100)):0;
    const dS=shiftB.length?shiftB[0][0]:(am.length?am[0][0]:null),dE=shiftB.length?shiftB[shiftB.length-1][1]:(am.length?am[am.length-1][1]:null);
    if(!dS&&!hasKGG)return;
    res.push({name:th.dn,ds:dS,de:dE,wm:twm,vm,pm,pmAus,pg,blk,rsv,son,sonDetail,ausFahrt,touren,
              kggFrei,kggMin,pc:th.pc,au,auB,gaps,gt,azB:shiftB,am,hasKGG});
  });
  res.sort((a,b)=>b.gt-a.gt);
  const S=k=>res.reduce((s,t)=>s+(t[k]||0),0);
  const sWm=S('wm'),sVm=S('vm'),sPg=S('pg');
  // Zwei verschiedene Fragen, zwei verschiedene Zahlen:
  //   aA — der Schnitt über die Therapeuten. „Wie ausgelastet ist der
  //        durchschnittliche Therapeut?" Jeder zählt gleich viel, auch wer
  //        nur zwei Stunden da war.
  //   aG — Patientenzeit geteilt durch Arbeitszeit über alle. „Wie viel der
  //        bezahlten Stunden ging an Patienten?" Das ist die Praxiszahl, und
  //        sie ist die einzige, die man mit Umsatz und Kosten verrechnen kann.
  // Beide stehen da, weil beide gebraucht werden und ihre Verwechslung die
  // häufigste stille Fehlinterpretation einer Auslastung ist.
  return{act:res,absent,
    // tgm sind echte Zeitlücken. Freie KGG-Plätze stehen daneben: Sie sind
    // unverkaufte Kapazität bei beschäftigtem Therapeuten — eine andere Größe,
    // die sich nicht zu Minuten Leerlauf addieren lässt, ohne beides zu
    // verfälschen. Wer „freie Kapazität" zeigen will, addiert tgm + sKggMin
    // und sagt dazu, dass zwei Dinge darin stecken.
    tgm:S('gt'),tp2:S('pc'),sKggFrei:S('kggFrei'),sKggMin:S('kggMin'),
    aA:res.length?Math.round(res.reduce((s,t)=>s+t.au,0)/res.length):0,
    aG:sWm>0?Math.round(100*sPg/sWm):0,
    aB:sVm>0?Math.round(100*sPg/sVm):0,
    sWm,sVm,sPg,sPm:S('pm'),sAus:S('pmAus'),sBlk:S('blk'),sRsv:S('rsv'),
    sSon:S('son'),sAusFahrt:S('ausFahrt'),
    sSonDetail:res.reduce((o,t)=>{Object.keys(t.sonDetail||{}).forEach(k=>{
      o[k]=(o[k]||0)+t.sonDetail[k];});return o;},{}),
    sTouren:res.reduce((a,t)=>a.concat(t.touren||[]),[]),
    twg:res.filter(t=>t.gt>0).length,
    // Wie viele Termine ließen sich noch unterbringen: aus Zeitlücken je
    // zwanzig Minuten einer, plus je freiem KGG-Platz einer. Die KGG-Minuten
    // durch zwanzig zu teilen ergäbe drei Termine je freiem Platz — es passt
    // aber genau eine Person hinein.
    ps:Math.floor(S('gt')/20)+S('kggFrei'),ds:dd};
}

function fBVB(c){if(!c)return null;const s=String(c).toUpperCase().trim().replace(/\s+/g,'');const base=s.replace(/[.\-]+$/,'');const tries=[s,base];const m=base.match(/^([A-Z]\d\d)(?:\.(\d+))?$/);if(m){if(m[2]){for(let k=m[2].length;k>=1;k--)tries.push(m[1]+'.'+m[2].slice(0,k));}tries.push(m[1]);}for(const t of tries){const e=HMMAP[t];if(e)return{t:e.t==='L'?'LVB':'BVB',n:e.n,h:hmHinweis(e),vo:e.t==='L'?'dauerhaft':'12 Wochen',a0:e.a0||null,a1:e.a1||null,f:e.f||null,b:e.b||0};}return null;}

function aFreq(t){if(!t||t.length<3)return null;const d=t.map(x=>new Date(x.Datum)).sort((a,b)=>a-b);const iv=[];for(let i=1;i<d.length;i++){const df=Math.round((d[i]-d[i-1])/864e5);if(df>0)iv.push(df);}if(!iv.length)return null;const a=iv.reduce((s,v)=>s+v,0)/iv.length;return{avg:Math.round(a),pw:Math.round(7/a*10)/10};}
